<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>戦闘機シューティングゲーム - ホーム</title>
    <!-- アプリ起動時はホーム画面から始めるためのフラグ。
         他ページはこのフラグが無い場合にホームへリダイレクトする。 -->
    <script>try { sessionStorage.setItem('appLaunched', '1'); } catch (e) {}</script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #001122, #003366, #001122);
            font-family: 'Arial', sans-serif;
            color: white;
            overflow: hidden;
            height: 100vh;
            min-height: 600px;
        }
        
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 160px 30px, #ddd, transparent);
            background-repeat: repeat;
            background-size: 200px 100px;
            animation: twinkle 3s ease-in-out infinite alternate;
        }
        
        @keyframes twinkle {
            0% { opacity: 0.8; }
            100% { opacity: 1; }
        }
        
        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .title {
            font-size: clamp(2rem, 8vw, 4rem);
            font-weight: bold;
            margin-bottom: clamp(1rem, 3vw, 2rem);
            text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
            animation: glow 2s ease-in-out infinite alternate;
            line-height: 1.2;
        }
        
        @keyframes glow {
            0% { text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff; }
            100% { text-shadow: 0 0 30px #00ffff, 0 0 60px #00ffff, 0 0 80px #00ffff; }
        }
        
        .subtitle {
            font-size: clamp(1rem, 4vw, 1.5rem);
            margin-bottom: clamp(1.5rem, 4vw, 3rem);
            color: #cccccc;
            line-height: 1.3;
        }
        
        .start-button {
            background: linear-gradient(45deg, #ff4444, #ff6666);
            color: white;
            border: none;
            padding: clamp(12px, 3vw, 20px) clamp(24px, 6vw, 40px);
            font-size: clamp(1rem, 4vw, 1.5rem);
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: clamp(1rem, 3vw, 2rem);
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.5);
        }
        
        .start-button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(255, 68, 68, 0.8);
        }
        
        .tab-container {
            max-width: min(600px, 90vw);
            margin: 0 auto;
        }
        
        .tab-buttons {
            display: flex;
            gap: clamp(0.5rem, 2vw, 1rem);
            justify-content: center;
            margin-bottom: clamp(1rem, 3vw, 2rem);
        }
        
        .tab-button {
            background: linear-gradient(45deg, #4444ff, #6666ff);
            color: white;
            border: none;
            padding: clamp(12px, 3vw, 20px) clamp(24px, 6vw, 40px);
            font-size: clamp(1rem, 4vw, 1.5rem);
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(68, 68, 255, 0.5);
        }
        
        .tab-button.active {
            background: linear-gradient(45deg, #00ffff, #44ffff);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.8);
        }
        
        .tab-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(68, 68, 255, 0.7);
        }
        
        .tab-button.active:hover {
            box-shadow: 0 0 35px rgba(0, 255, 255, 0.9);
        }
        
        .tab-content {
            display: none;
            padding: clamp(1rem, 3vw, 2rem);
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        
        .tab-content.active {
            display: block;
        }

        /* 情報ボタン（遊び方 / 操作方法）— タブから単独ボタン＋ポップアップ化 */
        .info-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: clamp(0.6rem, 2vw, 1rem);
            max-width: min(600px, 90vw);
            margin: 0 auto;
        }
        .info-trigger {
            background: linear-gradient(45deg, #4444ff, #6666ff);
            color: white;
            border: none;
            padding: clamp(12px, 3vw, 20px) clamp(24px, 6vw, 40px);
            font-size: clamp(1rem, 4vw, 1.4rem);
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            box-shadow: 0 0 20px rgba(68, 68, 255, 0.5);
        }
        .info-trigger:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 0 30px rgba(68, 68, 255, 0.8);
        }
        .info-trigger:focus-visible {
            outline: 3px solid #00ffff;
            outline-offset: 3px;
        }

        /* ポップアップ */
        .popup-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            z-index: 1500;
        }
        .popup-overlay.open {
            display: flex;
            animation: popupFadeIn 0.18s ease;
        }
        @keyframes popupFadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        .popup-card {
            position: relative;
            background: linear-gradient(160deg, rgba(20, 20, 50, 0.95), rgba(10, 10, 30, 0.95));
            border: 2px solid rgba(0, 255, 255, 0.4);
            border-radius: 16px;
            padding: clamp(1.4rem, 4vw, 2.2rem) clamp(1.2rem, 3.5vw, 2rem);
            max-width: min(560px, 92vw);
            width: 100%;
            max-height: 88vh;
            overflow-y: auto;
            color: #fff;
            box-shadow: 0 20px 60px rgba(0, 255, 255, 0.2);
            animation: popupRise 0.22s ease;
        }
        @keyframes popupRise {
            from { transform: translateY(20px) scale(0.96); opacity: 0; }
            to   { transform: translateY(0) scale(1); opacity: 1; }
        }
        .popup-close {
            position: absolute;
            top: 10px;
            right: 14px;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 2rem;
            line-height: 1;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 50%;
            transition: background 0.18s ease, transform 0.18s ease;
        }
        .popup-close:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: rotate(90deg);
        }
        .popup-body h3 {
            margin-top: 0;
            margin-bottom: 1rem;
            color: #00ffff;
            font-size: clamp(1.2rem, 4vw, 1.5rem);
            text-align: center;
        }
        .popup-list {
            margin: 0;
            padding-left: 1.3rem;
            line-height: 1.7;
            font-size: clamp(0.92rem, 2.6vw, 1.02rem);
        }
        .popup-list li + li { margin-top: 0.4rem; }
        .popup-controls .control-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.6rem;
            padding: 0.55rem 0.2rem;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
            font-size: clamp(0.9rem, 2.5vw, 1rem);
        }
        .popup-controls .control-item:last-child { border-bottom: none; }
        /* ── ランキング降格通知ポップアップ ───────────────────────────── */
        .rank-popup .popup-card {
            background: linear-gradient(160deg, rgba(50, 10, 10, 0.96), rgba(80, 25, 25, 0.96));
            border: 2px solid rgba(255, 90, 90, 0.55);
            box-shadow: 0 0 80px rgba(255, 70, 70, 0.45), inset 0 0 60px rgba(255, 60, 60, 0.18);
            animation: popupRise 0.28s ease, rankShake 0.55s ease 0.28s;
        }
        @keyframes rankShake {
            0%   { transform: translateX(0) rotate(0); }
            18%  { transform: translateX(-8px) rotate(-1deg); }
            36%  { transform: translateX(7px) rotate(1deg); }
            54%  { transform: translateX(-4px) rotate(-0.6deg); }
            72%  { transform: translateX(3px) rotate(0.4deg); }
            100% { transform: translateX(0) rotate(0); }
        }
        .rank-popup .rank-headline {
            font-size: clamp(1.4rem, 4.5vw, 1.8rem);
            text-align: center;
            color: #ffd1d1;
            text-shadow: 0 0 12px rgba(255, 60, 60, 0.8);
            margin: 0 0 0.6rem;
            letter-spacing: 0.04em;
        }
        .rank-popup .rank-sub {
            text-align: center;
            color: rgba(255, 220, 220, 0.85);
            font-size: clamp(0.95rem, 2.8vw, 1.05rem);
            margin-bottom: 1.2rem;
        }
        .rank-popup .rank-arrow {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            margin: 1rem auto 1.2rem;
            font-size: clamp(1.1rem, 3.4vw, 1.4rem);
        }
        .rank-popup .rank-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 88px;
            height: 88px;
            border-radius: 50%;
            font-weight: 700;
            font-size: 1.3rem;
            border: 2px solid;
            box-shadow: inset 0 0 16px rgba(255, 255, 255, 0.1);
        }
        .rank-popup .rank-badge.old {
            background: linear-gradient(160deg, rgba(255, 215, 70, 0.25), rgba(255, 160, 30, 0.15));
            border-color: rgba(255, 215, 70, 0.7);
            color: #ffe79a;
            text-shadow: 0 0 10px rgba(255, 220, 80, 0.7);
        }
        .rank-popup .rank-badge.new {
            background: linear-gradient(160deg, rgba(200, 200, 200, 0.12), rgba(120, 120, 120, 0.18));
            border-color: rgba(180, 180, 180, 0.55);
            color: #d6d6d6;
            animation: rankNewPulse 1.2s ease infinite alternate;
        }
        .rank-popup .rank-badge.lost {
            background: rgba(40, 40, 40, 0.4);
            border-color: rgba(120, 120, 120, 0.4);
            color: rgba(220, 220, 220, 0.4);
            font-size: 0.95rem;
            text-decoration: line-through;
        }
        @keyframes rankNewPulse {
            from { box-shadow: 0 0 0 rgba(255, 90, 90, 0.0); }
            to   { box-shadow: 0 0 22px rgba(255, 120, 120, 0.55); }
        }
        .rank-popup .rank-arrow-icon {
            font-size: 1.6rem;
            color: rgba(255, 200, 200, 0.85);
            animation: rankArrowSlide 1s ease infinite alternate;
        }
        @keyframes rankArrowSlide {
            from { transform: translateX(-4px); opacity: 0.6; }
            to   { transform: translateX(4px);  opacity: 1; }
        }
        .rank-popup .rank-title-lost {
            text-align: center;
            font-size: 0.95rem;
            color: rgba(255, 200, 200, 0.85);
            margin: 0.4rem 0 0.9rem;
        }
        .rank-popup .rank-title-lost strong { color: #ffec99; }
        .rank-popup .rank-cta {
            display: block;
            margin: 1.2rem auto 0;
            padding: 0.8rem 1.6rem;
            background: linear-gradient(135deg, #ff6868, #b22020);
            color: #fff;
            border: none;
            border-radius: 28px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
            box-shadow: 0 6px 20px rgba(255, 60, 60, 0.4);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .rank-popup .rank-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 26px rgba(255, 60, 60, 0.55);
        }
        .popup-controls .key {
            display: inline-block;
            padding: 2px 8px;
            margin: 0 2px;
            background: rgba(0, 255, 255, 0.18);
            border: 1px solid rgba(0, 255, 255, 0.45);
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: #aaffff;
        }

        .instructions {
            background: transparent;
            padding: 0;
            border-radius: 0;
            max-width: none;
            margin: 0;
            backdrop-filter: none;
            max-height: none;
            overflow-y: visible;
        }
        
        .instructions h3 {
            color: #00ffff;
            margin-bottom: 0.8rem;
            font-size: clamp(1.2rem, 4vw, 1.5rem);
        }
        
        .instructions ul {
            text-align: left;
            line-height: 1.4;
            margin: 0;
            padding-left: 1.2rem;
        }
        
        .instructions li {
            margin-bottom: 0.3rem;
            font-size: clamp(0.85rem, 2.8vw, 0.95rem);
        }
        
        .controls {
            margin-top: clamp(0.8rem, 2.5vw, 1.5rem);
            padding: clamp(0.4rem, 1.5vw, 0.8rem);
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        
        /* 操作方法タブ専用のスタイル */
        #controls .instructions {
            padding: 0;
        }
        
        #controls .controls {
            margin-top: clamp(0.8rem, 2.5vw, 1.5rem);
            padding: clamp(0.4rem, 1.5vw, 0.8rem);
        }
        
        #controls .control-item {
            margin-bottom: 0.4rem;
            padding: 0.4rem;
            font-size: clamp(0.75rem, 2.2vw, 0.9rem);
        }
        
        .controls h4 {
            color: #ffff00;
            margin-bottom: 0.8rem;
            font-size: clamp(1rem, 3vw, 1.2rem);
        }
        
        .control-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.4rem;
            padding: 0.4rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            font-size: clamp(0.75rem, 2.2vw, 0.9rem);
        }
        
        .key {
            background: #333;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
            color: #fff;
            font-size: clamp(0.65rem, 1.8vw, 0.8rem);
        }
        
        .mypage-button {
            position: absolute;
            top: 20px;
            right: 20px;
            background: linear-gradient(45deg, #4444ff, #6666ff);
            color: white;
            border: none;
            padding: clamp(8px, 2vw, 12px) clamp(16px, 3vw, 20px);
            font-size: clamp(0.8rem, 2.5vw, 1rem);
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(68, 68, 255, 0.5);
            z-index: 100;
        }
        
        .mypage-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(68, 68, 255, 0.7);
        }
        
        /* ログインモーダル */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
        }
        
        .modal-content {
            background: linear-gradient(135deg, #001122, #003366);
            margin: 5% auto;
            padding: 2rem;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            position: absolute;
            right: 1rem;
            top: 0.5rem;
        }
        
        .close:hover {
            color: #fff;
        }
        
        .modal h2 {
            color: #00ffff;
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }
        
        .modal .form-group {
            margin-bottom: 1rem;
        }
        
        .modal .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #00ffff;
            font-weight: bold;
        }
        
        .modal .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
        }
        
        .modal .form-group input:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
        
        .modal .form-group input[type="password"] {
            font-family: monospace;
            letter-spacing: 2px;
        }
        
        .modal-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        
        .modal-button {
            flex: 1;
            padding: 0.8rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .login-btn {
            background: linear-gradient(45deg, #00aa00, #00cc00);
            color: white;
            box-shadow: 0 0 20px rgba(0, 170, 0, 0.5);
        }
        
        .login-btn:hover {
            box-shadow: 0 0 25px rgba(0, 170, 0, 0.7);
        }
        
        .register-btn {
            background: linear-gradient(45deg, #4444ff, #6666ff);
            color: white;
            box-shadow: 0 0 20px rgba(68, 68, 255, 0.5);
        }
        
        .register-btn:hover {
            box-shadow: 0 0 25px rgba(68, 68, 255, 0.7);
        }
        
        .forgot-btn {
            background: linear-gradient(45deg, #ff8800, #ffaa00);
            color: white;
            box-shadow: 0 0 20px rgba(255, 136, 0, 0.5);
        }
        
        .forgot-btn:hover {
            box-shadow: 0 0 25px rgba(255, 136, 0, 0.7);
        }
        
        .modal-tabs {
            display: flex;
            margin-bottom: 1.5rem;
            border-radius: 8px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .modal-tab {
            flex: 1;
            padding: 0.8rem;
            background: transparent;
            border: none;
            color: #cccccc;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .modal-tab.active {
            background: rgba(0, 255, 255, 0.2);
            color: #00ffff;
        }
        
        .modal-tab:hover {
            background: rgba(0, 255, 255, 0.1);
            color: #00ffff;
        }
        
        .game-preview {
            position: absolute;
            top: 20px;
            right: 20px;
            width: clamp(120px, 15vw, 200px);
            height: clamp(90px, 12vw, 150px);
            border: 2px solid #00ffff;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.7rem, 2vw, 0.9rem);
            color: #00ffff;
            text-align: center;
            line-height: 1.3;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .tab-container {
                margin: 0 10px;
            }
            
            .game-preview {
                display: none;
            }
            
            .mypage-button {
                top: 15px;
                right: 15px;
                padding: clamp(6px, 1.5vw, 10px) clamp(12px, 2.5vw, 16px);
                font-size: clamp(0.7rem, 2vw, 0.9rem);
            }
            
            .tab-button {
                font-size: clamp(0.8rem, 2.5vw, 1rem);
                padding: clamp(0.6rem, 2vw, 1rem);
            }
        }
        
        @media (max-height: 600px) {
            .title {
                font-size: clamp(1.5rem, 6vw, 2.5rem);
                margin-bottom: 0.5rem;
            }
            
            .subtitle {
                font-size: clamp(0.8rem, 3vw, 1.2rem);
                margin-bottom: 1rem;
            }
            
            .start-button {
                padding: 10px 20px;
                font-size: clamp(0.8rem, 3vw, 1.2rem);
                margin-bottom: 1rem;
            }
            
            .tab-container {
                max-height: 45vh;
            }
            
            .tab-content {
                padding: 0.8rem;
            }
            
            .instructions h3 {
                font-size: clamp(1rem, 3vw, 1.2rem);
                margin-bottom: 0.4rem;
            }
            
            .instructions li {
                font-size: clamp(0.75rem, 2.2vw, 0.85rem);
                margin-bottom: 0.2rem;
            }
            
            .controls {
                margin-top: 0.6rem;
                padding: 0.3rem;
            }
            
            .controls h4 {
                font-size: clamp(0.9rem, 2.5vw, 1.1rem);
                margin-bottom: 0.4rem;
            }
            
            .control-item {
                font-size: clamp(0.7rem, 2vw, 0.8rem);
                margin-bottom: 0.3rem;
                padding: 0.3rem;
            }
            
            .tab-button {
                font-size: clamp(0.7rem, 2.2vw, 0.9rem);
                padding: clamp(0.5rem, 1.5vw, 0.8rem);
            }
        }
        
        @media (max-width: 480px) {
            .container {
                justify-content: flex-start;
                padding-top: 20px;
            }
            
            .tab-container {
                max-height: 45vh;
            }
            
            .mypage-button {
                top: 10px;
                right: 10px;
                padding: clamp(5px, 1.2vw, 8px) clamp(10px, 2vw, 14px);
                font-size: clamp(0.6rem, 1.8vw, 0.8rem);
            }
            
            .control-item {
                flex-direction: column;
                align-items: center;
                gap: 0.5rem;
            }
            
            .tab-button {
                font-size: clamp(0.7rem, 2vw, 0.8rem);
                padding: clamp(0.4rem, 1.2vw, 0.6rem);
            }
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    
    <button class="mypage-button" id="authButton" onclick="handleAuthClick()">👤 ログイン</button>
    
    <!-- ログインモーダル -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>アカウント</h2>
            
            <div class="modal-tabs">
                <button class="modal-tab active" onclick="switchTab('login')">ログイン</button>
                <button class="modal-tab" onclick="switchTab('register')">新規登録</button>
                <button class="modal-tab" onclick="switchTab('forgot')">パスワードを忘れた方</button>
            </div>
            
            <!-- ログインフォーム -->
            <div id="loginForm" class="modal-form">
                <div class="form-group">
                    <label for="loginUsername">メールアドレス</label>
                    <input type="email" id="loginUsername" placeholder="メールアドレスを入力">
                </div>
                <div class="form-group">
                    <label for="loginPassword">パスワード</label>
                    <input type="password" id="loginPassword" placeholder="パスワードを入力">
                </div>
                <div class="modal-buttons">
                    <button class="modal-button login-btn" onclick="login()">ログイン</button>
                </div>
            </div>
            
            <!-- 新規登録フォーム -->
            <div id="registerForm" class="modal-form" style="display: none;">
                <div class="form-group">
                    <label for="registerUsername">ユーザーネーム</label>
                    <input type="text" id="registerUsername" placeholder="ユーザーネームを入力">

                <div class="form-group">
                    <label for="registerEmail">メールアドレス</label>

                    <label for="registerPassword">パスワード</label>

                <div class="form-group">
                    <label for="confirmPassword">パスワード（確認）</label>
                    <input type="password" id="confirmPassword" placeholder="パスワードを再入力">
                </div>
                <div class="modal-buttons">
                    <button class="modal-button register-btn" onclick="register()">新規登録</button>
                </div>
            </div>
            
            <!-- パスワードリセットフォーム -->
            <div id="forgotForm" class="modal-form" style="display: none;">
                <div class="form-group">
                    <label for="forgotUsername">ユーザーネーム</label>
                    <input type="text" id="forgotUsername" placeholder="ユーザーネームを入力">
                </div>
                <div class="form-group">
                    <label for="forgotEmail">メールアドレス</label>
                    <input type="email" id="forgotEmail" placeholder="登録済みのメールアドレスを入力">
                </div>
                <div class="modal-buttons">
                    <button class="modal-button forgot-btn" onclick="sendResetEmail()">リセットメール送信</button>
                    <button class="modal-button" onclick="goToGameFromForgot()" style="background: linear-gradient(45deg, #00aa00, #00cc00); color: white; box-shadow: 0 0 20px rgba(0, 170, 0, 0.5);">ゲームへ戻る</button>
                </div>
                <div style="margin-top: 1rem; padding: 1rem; background: rgba(255, 255, 255, 0.1); border-radius: 8px; font-size: 0.9rem; color: #cccccc;">
                    <strong>📧 パスワードリセットについて</strong><br>
                    登録済みのメールアドレスにパスワードリセット用のリンクを送信します。<br>
                    メールが届かない場合は、迷惑メールフォルダもご確認ください。<br>
                    リセット完了後の画面からホームへ戻れる案内が表示されます。
                </div>
            </div>
        </div>
    </div>
    
    <div class="container">
        <h1 class="title"> 戦闘機シューティングゲーム</h1>
        <p class="subtitle">宇宙を駆け巡る戦闘機で敵を倒そう！</p>
        
        <button class="start-button" onclick="startGame()">ゲーム開始</button>
        <button class="start-button pvp-button" onclick="startPvP()" style="background: linear-gradient(45deg, #ff8800, #ffaa00); margin-left: 10px;">PvP対戦</button>
        <button class="start-button event-button" onclick="startEvent()" style="background: linear-gradient(45deg, #6a00b8, #008abf); margin-left: 10px; position: relative;">
            🎪 期間限定イベント
            <span id="eventBadge" style="display:none; position:absolute; top:-8px; right:-8px; background:#ff3366; color:#fff; font-size:11px; padding:2px 8px; border-radius:10px; font-weight:bold; box-shadow:0 2px 6px rgba(0,0,0,0.4);">NEW</span>
        </button>
        <div id="eventInfo" style="margin-top: 8px; font-size: 13px; color: rgba(255,255,255,0.75); display:none;">

        <div class="info-buttons">

        </div>

        <template id="popupContent-instructions">
            <h3>🎮 ゲームの遊び方</h3>
            <ul class="popup-list">
                <li>敵を倒してスコアを稼ぐシンプルなシューティングです。</li>

                <li>ボスを倒すと新武器を解禁（通常弾→連射弾→散弾→レーザー → 各種特殊弾）。</li>

                    <span>武器切替</span>
                    <span><span class="key">1</span>〜<span class="key">4</span> / <span class="key">Tab</span>（<span class="key">Shift</span>+<span class="key">Tab</span> で逆順）</span>

        <div class="popup-overlay" id="popupOverlay" role="dialog" aria-modal="true" aria-hidden="true">

        <!-- ランキング降格・圏外通知用ポップアップ。
             起動時に refreshRankingTitleOnStartup() が変動を検出したときだけ表示。-->
        <div class="popup-overlay rank-popup" id="rankPopup" role="alertdialog" aria-modal="true" aria-hidden="true">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-analytics-compat.js"></script>
    <script src="firebase-config.js"></script>
    
    <script>
        function startGame() {
            try {
                console.log('ゲーム開始ボタンがクリックされました');
                // ゲーム画面に遷移
                window.location.href = 'shooting_game.html';
            } catch (error) {
                console.error('ゲーム開始エラー:', error);
                alert('ゲームの開始に失敗しました: ' + error.message);
            }
        }
        
        function startPvP() {
            try {
                console.log('PvP対戦ボタンがクリックされました');
                // マイページと同じ遷移に統一（pvp_game.html側でモード選択）
                window.location.href = 'pvp_game.html';
            } catch (error) {
                console.error('PvP対戦開始エラー:', error);
                alert('PvP対戦の開始に失敗しました: ' + error.message);
            }
        }

        // ─────── 期間限定イベント ───────
        // 既定のイベントメタ情報（Firestore に active イベントがあれば maybeOverrideEventMeta で上書き）
        let EVENT_META = {
            id: 'shadow-fleet-2026',
            title: '影艦隊襲来',
            endsAt: '2026-12-31T23:59:59+09:00',
            bossCount: 2,
            bosses: [
                {
                    id: 'cruiser',
                    skinKey: 'eventBossSkinShadowCruiser',
                    name: 'シャドウ・クルーザー',
                    image: 'assets/event/event-boss-1.png',
                    description: '軍事兵器の精密射撃 / 機雷・狙撃・追尾ミサイル',
                    color: 'linear-gradient(135deg, #2a3850, #4a6080)'
                },
                {
                    id: 'overlord',
                    skinKey: 'eventBossSkinShadowOverlord',
                    name: 'シャドウ・オーバーロード',
                    image: 'assets/event/event-boss-2.png',
                    description: '神秘の超能力 / 部下召喚・吸収・重力・追尾',
                    color: 'linear-gradient(135deg, #2a1850, #5030a0)'
                }
            ]
        };

        // Firestore に active イベントがあれば EVENT_META を上書きする。
        // 管理画面（admin.html）でイベントを更新したらここに反映される。
        async function maybeOverrideEventMeta() {
            try {
                if (typeof firebaseDataManager === 'undefined') return;
                const active = await firebaseDataManager.getActiveEvent();
                if (!active || !Array.isArray(active.bosses) || !active.bosses.length) return;
                EVENT_META = {
                    id: active.slug || active.id,
                    title: active.title || EVENT_META.title,
                    endsAt: active.endsAt || EVENT_META.endsAt,
                    bossCount: active.bosses.length,
                    bosses: active.bosses.map((b, i) => ({
                        id: b.id || `boss-${i + 1}`,
                        skinKey: b.skinKey || '',
                        name: b.name || `ボス ${i + 1}`,
                        image: b.image || '',
                        description: b.description || '',
                        color: 'linear-gradient(135deg, #2a3850, #4a6080)'
                    }))
                };
                renderEventInfo();
            } catch (e) {
                console.warn('event meta override failed:', e);
            }
        }

        function startEvent() {
            showEventBossSelectModal();
        }

        // ボス選択モーダルを表示
        function showEventBossSelectModal() {
            // 既にあれば閉じる
            const existing = document.getElementById('eventBossSelectModal');
            if (existing) existing.remove();

            let skins = {};
            try { skins = JSON.parse(localStorage.getItem('eventSkinsUnlocked') || '{}') || {}; } catch (e) {}

            const modal = document.createElement('div');
            modal.id = 'eventBossSelectModal';
            modal.style.cssText = `
                position: fixed; inset: 0;
                background: rgba(0, 0, 0, 0.82);
                display: flex; align-items: center; justify-content: center;
                z-index: 9999; padding: 20px;
                backdrop-filter: blur(6px);
            `;

            const bossCards = EVENT_META.bosses.map(b => {
                const unlocked = !!skins[b.skinKey];
                return `
                    <div class="event-boss-card" data-id="${b.id}" style="
                        flex: 1 1 280px; max-width: 320px;
                        background: ${b.color};
                        border: 2px solid ${unlocked ? 'rgba(0, 220, 255, 0.7)' : 'rgba(255, 255, 255, 0.15)'};
                        border-radius: 16px; padding: 18px;
                        cursor: pointer; text-align: center;
                        transition: transform 0.18s ease, box-shadow 0.18s ease;
                        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
                    ">
                        <div style="position:relative;">
                            <img src="${b.image}" alt="${b.name}" style="
                                width: 100%; max-width: 200px; aspect-ratio: 1/1;
                                object-fit: contain; image-rendering: pixelated;
                                background: rgba(0,0,0,0.35); border-radius: 12px; padding: 6px;
                            ">
                            ${unlocked ? '<span style="position:absolute; top:-6px; right:-6px; background:#00ddff; color:#001; font-weight:bold; padding:3px 9px; border-radius:14px; font-size:11px;">スキン取得済</span>' : ''}
                        </div>
                        <h3 style="margin: 12px 0 4px; color: #fff; font-size: 1.2rem;">${b.name}</h3>
                        <p style="margin: 0; color: rgba(255,255,255,0.78); font-size: 0.85rem; line-height: 1.4;">${b.description}</p>
                        <div style="margin-top: 14px; display:inline-block; padding: 8px 18px; background: rgba(0,0,0,0.35); border-radius: 8px; color: #fff; font-weight: bold; font-size: 0.95rem;">
                            このボスと戦う →
                        </div>
                    </div>
                `;
            }).join('');

            modal.innerHTML = `
                <div style="
                    background: linear-gradient(160deg, #0d1b2a, #14062a);
                    border: 1px solid rgba(255, 255, 255, 0.12);
                    border-radius: 20px; padding: 28px 26px;
                    max-width: 880px; width: 100%;
                    color: #fff; position: relative;
                    max-height: 92vh; overflow-y: auto;
                ">
                    <button id="closeEventModal" style="
                        position: absolute; top: 12px; right: 14px;
                        background: rgba(255, 255, 255, 0.08);
                        color: #fff; border: none;
                        width: 32px; height: 32px; border-radius: 50%;
                        cursor: pointer; font-size: 18px;
                    ">×</button>
                    <h2 style="text-align: center; margin: 0 0 6px; font-size: 1.6rem;">🎪 ${EVENT_META.title}</h2>
                    <p style="text-align: center; color: rgba(255,255,255,0.65); margin: 0 0 8px; font-size: 0.9rem;">
                        戦うボスを選んでください。時間制限なし・HP 大幅増・特殊弾あり。
                    </p>
                    <p style="text-align: center; color: rgba(255,255,255,0.45); margin: 0 0 22px; font-size: 0.78rem;">
                        撃破でスキンを獲得 / マイページのコレクションに追加
                    </p>
                    <div style="display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; align-items: stretch;">
                        ${bossCards}
                    </div>
                    <div style="text-align: center; margin-top: 22px;">
                        <button id="startEventAll" style="
                            background: linear-gradient(45deg, #6a00b8, #008abf);
                            color: #fff; border: none;
                            padding: 12px 28px; border-radius: 12px;
                            cursor: pointer; font-size: 1rem; font-weight: bold;
                            box-shadow: 0 6px 16px rgba(106, 0, 184, 0.4);
                        ">🎯 両方と戦う（フルチャレンジ・交互出現）</button>
                    </div>
                </div>
            `;

            document.body.appendChild(modal);

            // ホバー演出
            modal.querySelectorAll('.event-boss-card').forEach(card => {
                card.addEventListener('mouseenter', () => {
                    card.style.transform = 'translateY(-4px) scale(1.02)';
                    card.style.boxShadow = '0 14px 36px rgba(0, 220, 255, 0.35)';
                });
                card.addEventListener('mouseleave', () => {
                    card.style.transform = '';
                    card.style.boxShadow = '0 8px 24px rgba(0, 0, 0, 0.45)';
                });
                card.addEventListener('click', () => {
                    const id = card.dataset.id;
                    window.location.href = `shooting_game.html?mode=event&boss=${id}`;
                });
            });
            modal.querySelector('#startEventAll').addEventListener('click', () => {
                window.location.href = 'shooting_game.html?mode=event&boss=all';
            });
            modal.querySelector('#closeEventModal').addEventListener('click', () => modal.remove());
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
        }

        // イベント情報を画面に反映
        function renderEventInfo() {
            const info = document.getElementById('eventInfo');
            if (!info) return;
            const titleEl = document.getElementById('eventInfoTitle');
            const deadlineEl = document.getElementById('eventInfoDeadline');
            const progressEl = document.getElementById('eventInfoProgress');
            const badge = document.getElementById('eventBadge');
            if (titleEl) titleEl.textContent = EVENT_META.title;

            // 期間
            try {
                const end = new Date(EVENT_META.endsAt);
                const y = end.getFullYear();
                const m = String(end.getMonth() + 1).padStart(2, '0');
                const d = String(end.getDate()).padStart(2, '0');
                if (deadlineEl) deadlineEl.textContent = `${y}/${m}/${d} まで`;
                if (Date.now() > end.getTime() && deadlineEl) {
                    deadlineEl.textContent = '(期間終了)';
                }
            } catch (e) {}

            // 進捗
            let skins = {};
            try { skins = JSON.parse(localStorage.getItem('eventSkinsUnlocked') || '{}') || {}; } catch (e) {}
            const unlocked = Object.keys(skins).filter(k => k.startsWith('eventBossSkin') && skins[k]).length;
            if (progressEl) {
                if (unlocked === 0) {
                    progressEl.textContent = '';
                } else if (unlocked >= EVENT_META.bossCount) {
                    progressEl.textContent = '· ✓ コンプリート';
                    progressEl.style.color = '#00ffaa';
                } else {
                    progressEl.textContent = `· スキン ${unlocked}/${EVENT_META.bossCount}`;
                }
            }

            info.style.display = 'block';
            if (badge && unlocked < EVENT_META.bossCount) badge.style.display = 'inline-block';
            else if (badge) badge.style.display = 'none';
        }
        // ページロード後に呼ぶ（DOMContentLoaded で十分早い）
        document.addEventListener('DOMContentLoaded', () => {
            renderEventInfo();
            // 認証完了を待たずに公開イベントとして取得（events コレクションが公開読み取り可能な前提）
            maybeOverrideEventMeta();
        });

        // モード選択モーダルを表示
        function showModeSelectModal() {
            // モーダル要素を作成
            const modal = document.createElement('div');
            modal.id = 'modeSelectModal';
            modal.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: rgba(0,0,0,0.85);
                z-index: 9999;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            `;
            
            modal.innerHTML = `
                <h2 style="color: #fff; margin-bottom: 32px; font-size: 2rem;">対戦モードを選択</h2>
                <p style="color: #ff7f50; margin-bottom: 20px; font-size: 1.2rem;">推奨: AI対戦（安定動作）</p>
                <button id="aiModeBtn" style="font-size: 2rem; padding: 20px 60px; margin: 10px; background: #ff7f50; color: #fff; border: none; border-radius: 10px; cursor: pointer;">AI対戦</button>
                <button id="onlineModeBtn" style="font-size: 2rem; padding: 20px 60px; margin: 10px; background: #00c3ff; color: #fff; border: none; border-radius: 10px; cursor: pointer;">オンライン対戦</button>
                <button id="cancelModeBtn" style="font-size: 1.5rem; padding: 15px 40px; margin: 10px; background: #666; color: #fff; border: none; border-radius: 8px; cursor: pointer;">キャンセル</button>
            `;
            
            document.body.appendChild(modal);
            
            // イベントリスナーを追加
            document.getElementById('aiModeBtn').addEventListener('click', () => {
                window.location.href = 'pvp_game.html?mode=ai';
            });
            
            document.getElementById('onlineModeBtn').addEventListener('click', () => {
                window.location.href = 'pvp_game.html?mode=online';
            });
            
            document.getElementById('cancelModeBtn').addEventListener('click', () => {
                document.body.removeChild(modal);
            });
        }
        
        // 情報ポップアップ（遊び方 / 操作方法）
        (function setupInfoPopup() {
            const overlay = document.getElementById('popupOverlay');
            const body    = document.getElementById('popupBody');
            const closeBtn = document.getElementById('popupClose');
            if (!overlay || !body || !closeBtn) return;

            function openPopup(infoId) {
                const tpl = document.getElementById(`popupContent-${infoId}`);
                if (!tpl) return;
                body.innerHTML = '';
                body.appendChild(tpl.content.cloneNode(true));
                overlay.classList.add('open');
                overlay.setAttribute('aria-hidden', 'false');
                // フォーカスを閉じるボタンへ
                requestAnimationFrame(() => closeBtn.focus());
            }
            function closePopup() {
                overlay.classList.remove('open');
                overlay.setAttribute('aria-hidden', 'true');
                body.innerHTML = '';
            }

            document.querySelectorAll('.info-trigger').forEach(btn => {
                btn.addEventListener('click', () => openPopup(btn.dataset.info));
            });
            closeBtn.addEventListener('click', closePopup);
            overlay.addEventListener('click', e => { if (e.target === overlay) closePopup(); });
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape' && overlay.classList.contains('open')) closePopup();
            });
        })();

        // ─── ランキング降格・圏外通知ポップアップ ─────────────────────────────
        // refreshRankingTitleOnStartup() の戻り値を渡すと開く。
        //   change = { type: 'demoted' | 'lost', oldRank, newRank, lostTitle, newTitle }
        function showRankChangePopup(change) {
            if (!change) return;
            const overlay  = document.getElementById('rankPopup');
            const closeBtn = document.getElementById('rankPopupClose');
            const cta      = document.getElementById('rankCtaPlay');
            const headline = document.getElementById('rankHeadline');
            const sub      = document.getElementById('rankSub');
            const oldBadge = document.getElementById('rankBadgeOld');
            const newBadge = document.getElementById('rankBadgeNew');
            const titleInfo = document.getElementById('rankTitleInfo');
            if (!overlay) return;

            const isLost = change.type === 'lost';
            headline.textContent = isLost ? '⚠ ランキング圏外になりました' : '⚠ 順位が下がりました';
            sub.textContent = isLost
                ? 'TOP 5 の称号を失いました…'
                : '他のプレイヤーに追い抜かれました';

            oldBadge.textContent = `${change.oldRank}位`;
            oldBadge.className = 'rank-badge old';

            if (isLost) {
                newBadge.textContent = '圏外';
                newBadge.className = 'rank-badge lost';
            } else {
                newBadge.textContent = `${change.newRank}位`;
                newBadge.className = 'rank-badge new';
            }

            // 称号名の差分を補足表示
            const parts = [];
            if (change.lostTitle) parts.push(`「<strong>${escapeHtml(change.lostTitle)}</strong>」を喪失`);
            if (change.newTitle && !isLost) parts.push(`新たに「<strong>${escapeHtml(change.newTitle)}</strong>」を獲得`);
            titleInfo.innerHTML = parts.length ? parts.join('<br>') : '';

            overlay.classList.add('open');
            overlay.setAttribute('aria-hidden', 'false');
            requestAnimationFrame(() => closeBtn.focus());

            const close = () => {
                overlay.classList.remove('open');
                overlay.setAttribute('aria-hidden', 'true');
            };
            closeBtn.onclick = close;
            overlay.onclick = e => { if (e.target === overlay) close(); };
            cta.onclick = () => {
                close();
                window.location.href = 'shooting_game.html';
            };
            document.addEventListener('keydown', function onEsc(e) {
                if (e.key === 'Escape' && overlay.classList.contains('open')) {
                    close();
                    document.removeEventListener('keydown', onEsc);
                }
            });
        }
        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[ch]));
        }
        
        // ゲームプレビューが存在する場合のみイベントリスナーを追加
        const gamePreview = document.querySelector('.game-preview');
        if (gamePreview) {
            gamePreview.addEventListener('click', startGame);
        }
        
        // ログイン状態をチェックしてボタンを更新
        function updateAuthButton() {
            const authButton = document.getElementById('authButton');
            const playerName = localStorage.getItem('playerName');
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            const firebaseUid = localStorage.getItem('firebaseUid');
            const currentUser = firebase.auth().currentUser;
            
            console.log('認証ボタン更新:', {
                playerName,
                isLoggedIn,
                firebaseUid,
                currentUser: currentUser ? currentUser.uid : null
            });
            
            // Firebase 認証を「真実」とする。localStorage だけが残っている場合は未ログイン扱い。
            const isAuthenticated = !!currentUser;
            
            if (isAuthenticated) {
                const displayName = playerName || (currentUser.email ? currentUser.email.split('@')[0] : 'ユーザー');
                authButton.textContent = `👤 ${displayName}`;
                authButton.onclick = () => window.location.href = 'mypage.html';
            } else {
                authButton.textContent = '👤 ログイン';
                authButton.onclick = handleAuthClick;
            }
        }
        
        // 認証ボタンのクリック処理
        function handleAuthClick() {
            // Firebase 認証を「真実」とする。currentUser があるならマイページへ、なければログインモーダル。
            const currentUser = firebase.auth().currentUser;
            if (currentUser) {
                window.location.href = 'mypage.html';
            } else {
                showLoginModal();
            }
        }
        
        // ログインモーダルを表示
        function showLoginModal() {
            document.getElementById('loginModal').style.display = 'block';
        }
        
        // モーダルを閉じる
        function closeModal() {
            document.getElementById('loginModal').style.display = 'none';
            // フォームをクリア
            clearForms();
        }
        
        // フォームをクリア
        function clearForms() {
            document.getElementById('loginUsername').value = '';
            document.getElementById('loginPassword').value = '';
            document.getElementById('registerUsername').value = '';
            document.getElementById('registerEmail').value = '';
            document.getElementById('registerPassword').value = '';
            document.getElementById('confirmPassword').value = '';
            document.getElementById('forgotUsername').value = '';
            document.getElementById('forgotEmail').value = '';
        }
        
        // タブ切り替え
        function switchTab(tabName) {
            // すべてのタブとフォームを非アクティブにする
            document.querySelectorAll('.modal-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.modal-form').forEach(form => form.style.display = 'none');
            
            // 選択されたタブをアクティブにする
            event.target.classList.add('active');
            
            // 対応するフォームを表示
            switch(tabName) {
                case 'login':
                    document.getElementById('loginForm').style.display = 'block';
                    break;
                case 'register':
                    document.getElementById('registerForm').style.display = 'block';
                    break;
                case 'forgot':
                    document.getElementById('forgotForm').style.display = 'block';
                    break;
            }
        }
        
        // ログイン処理
        async function login() {
            const email = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            if (!email || !password) {
                alert('メールアドレスとパスワードを入力してください。');
                return;
            }
            
            try {
                // Firebase認証でログイン
                const user = await firebaseDataManager.loginUser(email, password);
                
                // ユーザーデータを取得
                let userData;
                try {
                    userData = await firebaseDataManager.getUserData();
                } catch (error) {
                    console.error('ユーザーデータ取得エラー:', error);
                    // ユーザーデータが取得できない場合は、メールアドレスをユーザーネームとして使用
                    userData = { username: email.split('@')[0] };
                }
                
                // ローカルストレージに保存（Firebase認証情報）
                localStorage.setItem('playerName', userData.username);
                localStorage.setItem('userEmail', user.email);
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('firebaseUid', user.uid);
                
                alert('ログインしました！\n\nマイページに移動します。');
                updateAuthButton();
                closeModal();
                
                // マイページに移動
                window.location.href = 'mypage.html';
            } catch (error) {
                console.error('ログインエラー:', error);
                let errorMessage = 'ログインに失敗しました。';
                
                switch (error.code) {
                    case 'auth/user-not-found':
                        errorMessage = 'ユーザーが見つかりません。新規登録してください。';
                        break;
                    case 'auth/wrong-password':
                        errorMessage = 'パスワードが正しくありません。';
                        break;
                    case 'auth/invalid-email':
                        errorMessage = 'メールアドレスの形式が正しくありません。';
                        break;
                }
                
                alert(errorMessage);
            }
        }
        
        // 新規登録処理
        async function register() {
            const username = document.getElementById('registerUsername').value.trim();
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (!username || !email || !password || !confirmPassword) {
                alert('すべての項目を入力してください。');
                return;
            }
            
            if (username.length < 3) {
                alert('ユーザーネームは3文字以上で入力してください。');
                return;
            }

            // メールアドレスの形式チェック
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert('正しいメールアドレスの形式で入力してください。');
                return;
            }
            
            if (password !== confirmPassword) {
                alert('パスワードが一致しません。');
                return;
            }
            
            if (password.length < 6) {
                alert('パスワードは6文字以上で入力してください。');
                return;
            }
            
            try {
                // Firebase認証でユーザー登録
                const user = await firebaseDataManager.registerUser(email, password, username);
                
                // ローカルストレージに保存（Firebase認証情報）
                localStorage.setItem('playerName', username);
                localStorage.setItem('userEmail', email);
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('firebaseUid', user.uid);
                
                alert('アカウントが作成されました！\n\nマイページに移動します。');
                updateAuthButton();
                closeModal();
                
                // マイページに移動
                window.location.href = 'mypage.html';
            } catch (error) {
                console.error('登録エラー:', error);
                console.error('エラーコード:', error.code);
                console.error('エラーメッセージ:', error.message);
                
                let errorMessage = 'アカウント作成に失敗しました。';
                
                switch (error.code) {
                    case 'auth/email-already-in-use':
                        errorMessage = 'このメールアドレスは既に使用されています。';
                        break;
                    case 'auth/invalid-email':
                        errorMessage = 'メールアドレスの形式が正しくありません。';
                        break;
                    case 'auth/weak-password':
                        errorMessage = 'パスワードが弱すぎます。6文字以上で入力してください。';
                        break;
                    case 'auth/network-request-failed':
                        errorMessage = 'ネットワークエラーが発生しました。インターネット接続を確認してください。';
                        break;
                    case 'auth/operation-not-allowed':
                        errorMessage = 'メール/パスワード認証が有効になっていません。管理者に連絡してください。';
                        break;
                    case 'auth/too-many-requests':
                        errorMessage = 'リクエストが多すぎます。しばらく待ってから再試行してください。';
                        break;
                    default:
                        errorMessage = `アカウント作成に失敗しました。\nエラー: ${error.message}`;
                        break;
                }
                
                alert(errorMessage);
            }
        }
        
        // パスワードリセットメール送信処理
        async function sendResetEmail() {
            const email = document.getElementById('forgotEmail').value.trim();
            
            if (!email) {
                alert('メールアドレスを入力してください。');
                return;
            }
            
            // メールアドレスの形式チェック
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert('正しいメールアドレスの形式で入力してください。');
                return;
            }

            try {
                await firebaseDataManager.sendPasswordResetEmail(email);
                alert(`パスワードリセット用のメールを ${email} に送信しました。\nメール内のリンクから新しいパスワードを設定してください。\n\nメールが見つからない場合は、迷惑メールフォルダもご確認ください。\nリセット完了画面では、ホームへ戻る案内（Continue）が表示されます。`);
                closeModal();
            } catch (error) {
                console.error('パスワードリセットエラー:', error);
                let errorMessage = 'パスワードリセットメールの送信に失敗しました。';

                switch (error.code) {
                    case 'auth/invalid-email':
                        errorMessage = 'メールアドレスの形式が正しくありません。';
                        break;
                    case 'auth/user-not-found':
                        errorMessage = 'このメールアドレスのユーザーが見つかりません。';
                        break;
                    case 'auth/too-many-requests':
                        errorMessage = 'リクエストが多すぎます。しばらく待ってから再試行してください。';
                        break;
                }

                alert(errorMessage);
            }
        }

        // パスワード再設定画面からゲームへ戻る
        function goToGameFromForgot() {
            closeModal();
            startGame();
        }
        
        // モーダル外クリックで閉じる
        window.addEventListener('click', (event) => {
            const modal = document.getElementById('loginModal');
            if (event.target === modal) {
                closeModal();
            }
        });
        
        // ページ読み込み完了時の初期化
        window.addEventListener('load', async () => {
            console.log('ページが読み込まれました');
            
            try {
                // Firebase認証の初期化を待つ
                await new Promise(resolve => {
                    const unsubscribe = firebase.auth().onAuthStateChanged((user) => {
                        unsubscribe();
                        resolve(user);
                    });
                });
                
                // 認証状態を確認
                const currentUser = firebase.auth().currentUser;
                const playerName = localStorage.getItem('playerName');
                const isLoggedIn = localStorage.getItem('isLoggedIn');
                const firebaseUid = localStorage.getItem('firebaseUid');
                
                console.log('認証状態確認:', {
                    currentUser: currentUser ? currentUser.uid : null,
                    playerName,
                    isLoggedIn,
                    firebaseUid
                });
                
                // 旧仕様の「playerName だけで isLoggedIn を真にする」後方互換は削除。
                // Firebase auth を「真実」とし、未ログインなら localStorage は信用しない。

                // Firebase認証状態とローカルストレージを同期
                if (currentUser) {
                    console.log('Firebase認証ユーザーが存在します');
                    
                    // ローカルストレージを更新
                    if (!playerName) {
                        // ユーザーデータを取得してローカルストレージを更新
                        try {
                            const userData = await firebaseDataManager.getUserData();
                            if (userData) {
                                localStorage.setItem('playerName', userData.username);
                                localStorage.setItem('userEmail', currentUser.email);
                                localStorage.setItem('isLoggedIn', 'true');
                                localStorage.setItem('firebaseUid', currentUser.uid);
                                console.log('ローカルストレージを更新しました');
                            }
                        } catch (error) {
                            console.error('ユーザーデータ取得エラー:', error);
                            // メールアドレスをユーザーネームとして使用
                            localStorage.setItem('playerName', currentUser.email.split('@')[0]);
                            localStorage.setItem('userEmail', currentUser.email);
                            localStorage.setItem('isLoggedIn', 'true');
                            localStorage.setItem('firebaseUid', currentUser.uid);
                        }
                    } else if (firebaseUid !== currentUser.uid) {
                        // UIDが不一致の場合は更新
                        localStorage.setItem('firebaseUid', currentUser.uid);
                        console.log('Firebase UIDを更新しました');
                    }
                } else {
                    console.log('Firebase認証ユーザーが存在しません');

                    // Firebase が未ログインなら localStorage の認証情報も常にクリアして表示と一致させる。
                    // これをしないと「ホームではログイン中表示・マイページでは弾かれる」というズレが発生する。
                    if (playerName || isLoggedIn || firebaseUid) {
                        console.log('Firebase 未ログインのため localStorage の認証情報をクリアします');
                    }
                    localStorage.removeItem('playerName');
                    localStorage.removeItem('userEmail');
                    localStorage.removeItem('isLoggedIn');
                    localStorage.removeItem('firebaseUid');
                }
                
                // 認証ボタンを更新
                updateAuthButton();

                // ランキング称号の最新化（ログイン済みかつスコアがある場合のみ）
                //   降格 or 圏外を検出したらポップアップで通知。同じ変動は DB 反映後の比較で
                //   自動的に再表示されない。
                if (currentUser) {
                    try {
                        const change = await firebaseDataManager.refreshRankingTitleOnStartup();
                        if (change) showRankChangePopup(change);
                    } catch (e) {
                        console.warn('ランキング再評価に失敗:', e);
                    }
                }

                // ゲームから戻ってきた場合のモーダル表示
                const showLoginModal = localStorage.getItem('showLoginModal');
                const showRegisterModal = localStorage.getItem('showRegisterModal');
                
                if (showLoginModal === 'true') {
                    showLoginModal();
                    switchTab('login');
                    localStorage.removeItem('showLoginModal');
                } else if (showRegisterModal === 'true') {
                    showLoginModal();
                    switchTab('register');
                    localStorage.removeItem('showRegisterModal');
                }
                
            } catch (error) {
                console.error('ページ初期化エラー:', error);
            }
        });
    </script>
