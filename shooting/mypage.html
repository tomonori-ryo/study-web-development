<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイページ - 戦闘機シューティングゲーム</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #001122, #003366, #001122);
            font-family: 'Arial', sans-serif;
            color: white;
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        .stars {
            position: fixed;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 160px 30px, #ddd, transparent);
            background-repeat: repeat;
            background-size: 200px 100px;
            animation: twinkle 3s ease-in-out infinite alternate;
            z-index: -1;
        }
        
        @keyframes twinkle {
            0% { opacity: 0.8; }
            100% { opacity: 1; }
        }
        
        .container {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .title {
            font-size: clamp(2rem, 6vw, 3rem);
            font-weight: bold;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
        }
        
        @keyframes glow {
            0% { text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff; }
            100% { text-shadow: 0 0 30px #00ffff, 0 0 60px #00ffff, 0 0 80px #00ffff; }
        }
        
        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        
        .nav-button {
            background: linear-gradient(45deg, #4444ff, #6666ff);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: clamp(0.9rem, 3vw, 1.2rem);
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(68, 68, 255, 0.4);
        }
        
        .nav-button.game-start {
            background: linear-gradient(45deg, #ff4444, #ff6666);
            box-shadow: 0 0 10px rgba(255, 68, 68, 0.4);
        }
        
        .nav-button:hover {
            transform: scale(1.03);
            box-shadow: 0 0 14px rgba(68, 68, 255, 0.55);
        }
        
        .nav-button.game-start:hover {
            box-shadow: 0 0 14px rgba(255, 68, 68, 0.6);
        }
        
        .content-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(280px, 1fr));
            gap: 1.2rem;
            margin-bottom: 2rem;
        }
        
        .card {
            background: rgba(0, 0, 0, 0.62);
            border-radius: 15px;
            padding: 1.4rem;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .account-form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.8rem;
        }

        .account-form-grid .form-group {
            margin-bottom: 0.8rem;
        }

        .password-panel {
            margin-top: 0.6rem;
            padding: 0.8rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.04);
        }

        .password-panel summary {
            cursor: pointer;
            color: #00ffff;
            font-weight: bold;
            margin-bottom: 0.6rem;
        }
        
        .card h2 {
            color: #00ffff;
            margin-bottom: 1.5rem;
            font-size: clamp(1.3rem, 4vw, 1.8rem);
            text-align: center;
        }
        
        .score-display {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        
        .score-value {
            font-size: clamp(2rem, 6vw, 3rem);
            font-weight: bold;
            color: #ffff00;
            text-shadow: 0 0 10px #ffff00;
        }
        
        .score-label {
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            color: #cccccc;
            margin-top: 0.5rem;
        }
        
        .ranking-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .ranking-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem;
            margin-bottom: 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        
        .ranking-item:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(5px);
        }
        
        .ranking-item.current {
            background: rgba(0, 255, 255, 0.2);
            border: 1px solid #00ffff;
        }
        
        .rank {
            font-weight: bold;
            color: #ffff00;
            min-width: 40px;
        }
        
        .player-name {
            flex: 1;
            margin: 0 1rem;
        }
        
        .player-score {
            font-weight: bold;
            color: #00ff00;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #00ffff;
            font-weight: bold;
        }
        
        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
        }
        
        .form-group input[type="password"] {
            font-family: monospace;
            letter-spacing: 2px;
        }
        
        .form-group input:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
        
        .save-button {
            background: linear-gradient(45deg, #00aa00, #00cc00);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 170, 0, 0.5);
            width: 100%;
        }
        
        .save-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 170, 0, 0.7);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .stat-item {
            text-align: center;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }
        
        .stat-value {
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: bold;
            color: #00ff00;
        }
        
        .stat-label {
            font-size: clamp(0.8rem, 2vw, 1rem);
            color: #cccccc;
            margin-top: 0.3rem;
        }

        .titles-card .title-note {
            color: #cccccc;
            font-size: 0.85rem;
            margin-top: -0.4rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .titles-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .title-badge {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            padding: 0.4rem 0.75rem;
            font-size: 0.88rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.09);
        }

        .title-badge .icon {
            margin-right: 0.35rem;
            font-size: 1rem;
        }

        .title-badge.legendary {
            border-color: rgba(255, 220, 120, 0.95);
            background: linear-gradient(45deg, rgba(255, 215, 0, 0.28), rgba(255, 140, 0, 0.22));
            color: #ffefb0;
        }

        .title-badge.rank {
            border-color: rgba(255, 215, 0, 0.7);
            background: rgba(255, 215, 0, 0.16);
            color: #ffe88a;
        }

        .title-badge.empty {
            color: #cccccc;
            border-style: dashed;
            background: rgba(255, 255, 255, 0.05);
        }

        .title-toast {
            position: fixed;
            right: 16px;
            bottom: 16px;
            max-width: min(90vw, 360px);
            padding: 12px 14px;
            border-radius: 10px;
            z-index: 3000;
            font-size: 0.9rem;
            line-height: 1.4;
            background: rgba(0, 0, 0, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.4);
            display: none;
        }

        .title-toast.show {
            display: block;
        }

        .title-toast.gain {
            border-color: rgba(0, 255, 170, 0.9);
        }

        .title-toast.lose {
            border-color: rgba(255, 90, 90, 0.9);
        }

        .title-badge.stage2-gain {
            animation: badgePop 500ms ease, badgeGlow 1200ms ease-in-out;
        }

        .title-badge.stage2-lose {
            animation: badgeShake 450ms ease;
        }

        .title-fx {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 2999;
            overflow: hidden;
        }

        .sparkle {
            position: absolute;
            font-size: 1.2rem;
            animation: sparkleBurst 900ms ease forwards;
            opacity: 0;
        }

        @keyframes badgePop {
            0% { transform: scale(1); }
            45% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }

        @keyframes badgeGlow {
            0% { box-shadow: 0 0 0 rgba(255, 230, 120, 0); }
            50% { box-shadow: 0 0 16px rgba(255, 230, 120, 0.65); }
            100% { box-shadow: 0 0 0 rgba(255, 230, 120, 0); }
        }

        @keyframes badgeShake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            50% { transform: translateX(4px); }
            75% { transform: translateX(-3px); }
            100% { transform: translateX(0); }
        }

        @keyframes sparkleBurst {
            0% { transform: translate(0, 0) scale(0.5); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(1); opacity: 0; }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .content-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            
            .account-form-grid {
                grid-template-columns: 1fr;
            }
            
            .nav-buttons {
                gap: 0.5rem;
            }
            
            .card {
                padding: 1.5rem;
            }
        }
        
        @media (max-width: 480px) {
            .nav-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .nav-button {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    
    <div class="container">
        <div class="header">
            <h1 class="title">マイページ</h1>
        </div>
        
        <div class="nav-buttons">
            <button class="nav-button game-start" onclick="window.location.href='shooting_game.html'">ゲーム開始</button>
            <button class="nav-button pvp-button" onclick="window.location.href='pvp_game.html'" style="background: linear-gradient(45deg, #ff8800, #ffaa00); box-shadow: 0 0 10px rgba(255, 136, 0, 0.4);">PvP対戦</button>
            <button class="nav-button" onclick="window.location.href='index.html'">ホーム</button>
            <button class="nav-button" onclick="logout()" style="background: linear-gradient(45deg, #ff4444, #ff6666); box-shadow: 0 0 10px rgba(255, 68, 68, 0.4);">ログアウト</button>
        </div>
        
        <div class="content-grid">
            <!-- 現在の設定カード -->
            <div class="card">
                <h2>⚙️ 現在の設定</h2>
                
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-value" id="currentDifficulty">通常</div>
                        <div class="stat-label">現在の難易度</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="speedMultiplier">100%</div>
                        <div class="stat-label">スピード倍率</div>
                    </div>
                </div>
                
                <form id="settingsForm">
                    <div class="form-group">
                        <label for="difficulty">🎮 難易度設定（ゲーム中は変更不可）</label>
                        <select id="difficulty" style="width: 100%; padding: 0.8rem; border: none; border-radius: 8px; background: rgba(255, 255, 255, 0.1); color: white; font-size: 1rem;">
                            <option value="easy">簡単（スピード30%遅く）</option>
                            <option value="normal">通常（基準スピード）</option>
                            <option value="hard">難しい（スピード40%早く）</option>
                        </select>
                        <small style="color: #cccccc; font-size: 0.8rem; margin-top: 0.5rem; display: block;">
                            ※ 難易度はゲーム開始時に固定され、ゲーム中は変更できません
                        </small>
                    </div>
                    
                    <div class="form-group" style="margin-top: 1.2rem;">
                        <label for="pvpAiDifficulty">🤖 PvP・AI対戦の強さ</label>
                        <select id="pvpAiDifficulty" style="width: 100%; padding: 0.8rem; border: none; border-radius: 8px; background: rgba(255, 255, 255, 0.1); color: white; font-size: 1rem;">
                            <option value="easy">やさしい</option>
                            <option value="medium">ふつう</option>
                            <option value="hard" selected>むずかしい</option>
                            <option value="expert">エキスパート</option>
                        </select>
                        <small style="color: #cccccc; font-size: 0.8rem; margin-top: 0.5rem; display: block;">
                            PvPの「AI対戦」で使われます。マイページと対戦画面のどちらかで選ぶと保存されます。
                        </small>
                    </div>

                    <div class="form-group" style="margin-top: 1.2rem;">
                        <label>🔫 通常ゲームの武器編成</label>
                        <small style="color: #cccccc; font-size: 0.8rem; margin: 0.2rem 0 0.7rem; display: block;">
                            1枠目は通常弾固定です。2〜4枠目は称号で解放された武器から選べます。
                        </small>
                        <div style="display: grid; gap: 0.7rem;">
                            <div style="padding: 0.7rem; border-radius: 8px; background: rgba(255, 255, 255, 0.08);">
                                <strong>1: 通常弾</strong>
                                <div style="font-size: 0.8rem; color: #cccccc;">固定武器 / 常に使用可能</div>
                            </div>
                            <select id="weaponSlot2" class="weapon-loadout-select" aria-label="武器スロット2" style="width: 100%; padding: 0.8rem; border: none; border-radius: 8px; background: rgba(255, 255, 255, 0.1); color: white; font-size: 1rem;"></select>
                            <select id="weaponSlot3" class="weapon-loadout-select" aria-label="武器スロット3" style="width: 100%; padding: 0.8rem; border: none; border-radius: 8px; background: rgba(255, 255, 255, 0.1); color: white; font-size: 1rem;"></select>
                            <select id="weaponSlot4" class="weapon-loadout-select" aria-label="武器スロット4" style="width: 100%; padding: 0.8rem; border: none; border-radius: 8px; background: rgba(255, 255, 255, 0.1); color: white; font-size: 1rem;"></select>
                        </div>
                    </div>
                    
                    <button type="submit" class="save-button">💾 設定を保存</button>
                </form>
            </div>
            
            <!-- スコア・ランキングカード -->
            <div class="card">
                <h2>🏆 スコア・ランキング</h2>
                
                <div class="score-display">
                    <div class="score-value" id="highScore">0</div>
                    <div class="score-label">最高スコア</div>
                </div>
                
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-value" id="totalGames">0</div>
                        <div class="stat-label">総プレイ回数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="avgScore">0</div>
                        <div class="stat-label">平均スコア</div>
                    </div>
                </div>
                
                <h3 style="color: #ffff00; margin-bottom: 1rem;">🏅 ランキング</h3>
                <ul class="ranking-list" id="rankingList">
                    <!-- ランキングがここに表示される -->
                </ul>
            </div>

            <!-- 称号カード -->
            <div class="card titles-card">
                <h2>🎖️ 称号</h2>
                <p class="title-note">実績称号は永続、ランキング称号は順位変動で変化します。</p>
                <ul class="titles-list" id="titlesList">
                    <li class="title-badge empty">まだ称号がありません</li>
                </ul>
            </div>
            
            <!-- アカウント設定カード -->
            <div class="card account-card">
                <h2>👤 アカウント設定</h2>
                
                <form id="accountForm">
                    <div class="account-form-grid">
                        <div class="form-group">
                            <label for="playerName">プレイヤー名</label>
                            <input type="text" id="playerName" placeholder="プレイヤー名を入力">
                        </div>
                        
                        <div class="form-group">
                            <label for="email">メールアドレス（オプション）</label>
                            <input type="email" id="email" placeholder="メールアドレスを入力">
                        </div>
                    </div>

                    <details class="password-panel">
                        <summary>パスワードを変更する（任意）</summary>
                        <div class="form-group">
                            <label for="currentPassword">現在のパスワード</label>
                            <input type="password" id="currentPassword" placeholder="現在のパスワードを入力">
                        </div>
                        
                        <div class="form-group">
                            <label for="newPassword">新しいパスワード</label>
                            <input type="password" id="newPassword" placeholder="新しいパスワードを入力">
                        </div>
                        
                        <div class="form-group">
                            <label for="confirmPassword">新しいパスワード（確認）</label>
                            <input type="password" id="confirmPassword" placeholder="新しいパスワードを再入力">
                        </div>
                    </details>
                    
                    <button type="submit" class="save-button">💾 設定を保存</button>
                </form>
            </div>
        </div>
    </div>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-analytics-compat.js"></script>
    <script src="firebase-config.js"></script>
    
    <script>
        const RANK_TITLES = {
            1: 'ランキング王者',
            2: 'ランキング準王',
            3: 'ランキング三傑'
        };
        const TITLE_META = {
            'ルーキー': { icon: '🌱', tier: 'common' },
            'スコア100突破': { icon: '🎯', tier: 'rare' },
            'ウェポンマスター': { icon: '⚔️', tier: 'legendary' },
            'ランキング王者': { icon: '🥇', tier: 'legendary', rank: true },
            'ランキング準王': { icon: '🥈', tier: 'epic', rank: true },
            'ランキング三傑': { icon: '🥉', tier: 'epic', rank: true }
        };
        let currentFixedTitles = [];
        let currentWeaponProgress = {};
        const DEFAULT_WEAPON_LOADOUT = ['normal', 'rapid', 'shotgun', 'laser'];
        const WEAPON_CATALOG = {
            normal:   { id: 'normal',   name: '通常弾',     unlockProgressKey: null,                unlockRequirement: '常時装備・使用可能',                                              description: '固定武器' },
            rapid:    { id: 'rapid',    name: '連射弾',     unlockProgressKey: 'rapidUnlocked',     unlockRequirement: '100点ボス撃破で解放',                                              description: '3点バースト / 中射程' },
            shotgun:  { id: 'shotgun',  name: '散弾',       unlockProgressKey: 'shotgunUnlocked',   unlockRequirement: '500点ボス撃破で解放',                                              description: '5発拡散 / 短射程高火力' },
            laser:    { id: 'laser',    name: 'レーザー',   unlockProgressKey: 'laserUnlocked',     unlockRequirement: '1000点ボス撃破で解放',                                             description: '貫通 / 長射程' },
            sniper:   { id: 'sniper',   name: '狙撃',       unlockProgressKey: 'sniperUnlocked',    unlockRequirement: '1000点ボス撃破で解放',                                             description: 'ボス特化の超火力一撃 / 弾数極小' },
            launcher: { id: 'launcher', name: 'ランチャー', unlockProgressKey: 'launcherUnlocked',  unlockRequirement: '1000点ボス撃破歴で装備可（ラン中: 補給1個取得も必要）',              description: '重弾頭 / 着弾範囲爆発' },
            slowtime: { id: 'slowtime', name: '時空弾',     unlockProgressKey: 'slowtimeUnlocked',  unlockRequirement: '1500点ボス撃破で解放',                                             description: '命中時に対象をスロー化' },
            homing:   { id: 'homing',   name: 'ホーミング', unlockProgressKey: 'homingUnlocked',    unlockRequirement: '1500点ボス撃破歴で装備可（ラン中: 雑魚30体撃破も必要）',           description: '敵を自動追尾 / 弾数少' },
            drone:    { id: 'drone',    name: '随伴機',     unlockProgressKey: 'droneUnlocked',     unlockRequirement: '1500点ボス撃破で解放',                                             description: '高速連射の手数武器（コンパニオン化は段階実装）' },

        function getUnlockedWeaponIds(progress) {
            const p = (progress && typeof progress === 'object') ? progress : {};
            return Object.values(WEAPON_CATALOG)
                .filter(weapon => weapon.id === 'normal' || !weapon.unlockProgressKey || p[weapon.unlockProgressKey])
                .map(weapon => weapon.id);
        }

        function sanitizeWeaponLoadout(loadout, unlockedWeaponIds) {
            const unlocked = new Set(unlockedWeaponIds);
            const source = Array.isArray(loadout) ? loadout : DEFAULT_WEAPON_LOADOUT;
            const result = ['normal'];
            const used = new Set(result);
            for (let i = 1; i < 4; i++) {
                const candidate = source[i];
                if (candidate && candidate !== 'normal' && WEAPON_CATALOG[candidate] && unlocked.has(candidate) && !used.has(candidate)) {
                    result.push(candidate);
                    used.add(candidate);
                    continue;
                }
                const fallback = DEFAULT_WEAPON_LOADOUT.find(id => id !== 'normal' && unlocked.has(id) && !used.has(id));
                result.push(fallback || '');
                if (fallback) used.add(fallback);
            }
            return result;
        }

        function getStoredWeaponLoadout() {
            try {
                return JSON.parse(localStorage.getItem('weaponLoadout') || 'null');
            } catch (e) {
                return null;
            }
        }

        function renderWeaponLoadoutSelects(loadout, progress) {
            const unlockedIds = getUnlockedWeaponIds(progress);
            const sanitized = sanitizeWeaponLoadout(loadout, unlockedIds);
            [2, 3, 4].forEach(slot => {
                const select = document.getElementById(`weaponSlot${slot}`);
                if (!select) return;
                const current = sanitized[slot - 1] || '';
                const usedByOthers = new Set(sanitized.filter((id, index) => index !== slot - 1 && id));
                select.innerHTML = '<option value="">未設定</option>' + Object.values(WEAPON_CATALOG)
                    .filter(weapon => weapon.id !== 'normal')
                    .map(weapon => {
                        const unlocked = unlockedIds.includes(weapon.id);
                        const duplicate = usedByOthers.has(weapon.id);
                        const disabled = !unlocked || (duplicate && weapon.id !== current);
                        const label = unlocked
                            ? `${weapon.name} - ${weapon.description}`
                            : `${weapon.name} - ${weapon.unlockRequirement || '未解放'}（未取得）`;
                        return `<option value="${weapon.id}" ${weapon.id === current ? 'selected' : ''} ${disabled ? 'disabled' : ''}>${label}</option>`;
                    }).join('');
                select.value = current;
            });
            localStorage.setItem('weaponLoadout', JSON.stringify(sanitized));
            return sanitized;
        }

        function getSelectedWeaponLoadout() {
            return ['normal', 2, 3, 4].map((slot, index) => {

                return document.getElementById(`weaponSlot${slot}`).value || '';

        }

            const icons = type === 'gain' ? ['✨', '🌟', '💫'] : ['💥', '⚠️', '🫥'];
            for (let i = 0; i < 9; i++) {
                const s = document.createElement('span');
                s.className = 'sparkle';
                s.textContent = icons[i % icons.length];
                s.style.left = `${55 + (Math.random() * 30 - 15)}%`;
                s.style.top = `${82 + (Math.random() * 8 - 4)}%`;
                s.style.setProperty('--dx', `${Math.random() * 140 - 70}px`);
                s.style.setProperty('--dy', `${-40 - Math.random() * 90}px`);
                fxRoot.appendChild(s);
                setTimeout(() => s.remove(), 1000);

            toast.className = `title-toast show ${type}`;

        function renderTitles(fixedTitles, rankTitle) {
            const titlesList = document.getElementById('titlesList');
            if (!titlesList) return;

            const allTitles = [...(fixedTitles || [])];
            if (rankTitle) {
                allTitles.unshift(`⭐ ${rankTitle}`);
            }

            if (allTitles.length === 0) {
                titlesList.innerHTML = '<li class="title-badge empty">まだ称号がありません</li>';
                return;
            }

            titlesList.innerHTML = allTitles.map((title) => {
                const isRank = title.startsWith('⭐ ');
                const plainTitle = isRank ? title.replace(/^⭐\s*/, '') : title;
                const meta = getTitleMeta(plainTitle);
                const extraClasses = [
                    isRank ? 'rank' : '',
                    meta.tier === 'legendary' ? 'legendary' : ''
                ].filter(Boolean).join(' ');
                return `<li class="title-badge ${extraClasses}" data-title="${plainTitle}"><span class="icon">${meta.icon}</span>${title}</li>`;

                if (userData) {
                    // 表示を更新
                    document.getElementById('highScore').textContent = userData.highScore || 0;

                    document.getElementById('avgScore').textContent = avgScore;
                    
                    // 設定を取得
                    const settings = await firebaseDataManager.getSettings();
                    const difficulty = settings.difficulty || 'normal';
                    document.getElementById('difficulty').value = difficulty;
                    const pvpAiRaw = settings.pvpAiDifficulty || localStorage.getItem('pvpAiDifficulty') || 'hard';
                    const pvpAi = ['easy', 'medium', 'hard', 'expert'].includes(pvpAiRaw) ? pvpAiRaw : 'hard';

                    const remoteProgress = (userData.progress && typeof userData.progress === 'object') ? userData.progress : {};

                    persistWeaponProgress(currentWeaponProgress);
                    const savedLoadout = settings.weaponLoadout || getStoredWeaponLoadout() || DEFAULT_WEAPON_LOADOUT;
                    renderWeaponLoadoutSelects(savedLoadout, currentWeaponProgress);
                    renderTitles(currentFixedTitles, '');

                document.getElementById('avgScore').textContent = avgScore;
                
                updateCurrentSettings(difficulty);
                currentFixedTitles = [];
