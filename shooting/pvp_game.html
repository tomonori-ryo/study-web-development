    <!-- 起動時はホーム画面から始める。 -->
    <script>
    (function homeGuard() {
        try {
            if (sessionStorage.getItem('appLaunched') === '1') return;
            const params = new URLSearchParams(location.search);
            if (params.has('previewEventId')) return;
            if (params.has('adminEventId')) return;
            if (params.has('adminEventActive')) return;
            if (params.has('oobCode')) return;
            location.replace('index.html');
        } catch (e) {}
    })();
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        #gameCanvas {
            display: block;

        }
        
        #ui {

        #timer {

            font-size: clamp(16px, 3vw, 20px);
            font-weight: bold;
            text-align: center;
            margin: 10px 0;
        }
        
        #gameStatus {
            position: absolute;
            top: 50%;
            left: 50%;

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const player1HpElement = document.getElementById('player1Hp');
        const player2HpElement = document.getElementById('player2Hp');
        const timerElement = document.getElementById('timer');
        const waitingRoomElement = document.getElementById('waitingRoom');
        const gameStatusElement = document.getElementById('gameStatus');
        const statusMessageElement = document.getElementById('statusMessage');
        const weaponSelectorToggle = document.getElementById('weaponSelectorToggle');
        const weaponSelector = document.getElementById('weaponSelector');
        const weaponElement = document.getElementById('weapon');

        // キャンバスサイズを画面サイズに設定
        //   モバイルのアドレスバー開閉での連続発火を rAF で 1 回に丸めて、
        //   同じサイズなら再代入もスキップしてカクつきを抑える。
        function applyCanvasSize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            if (canvas.width === w && canvas.height === h) return;
            canvas.width = w;
            canvas.height = h;
        }
        let resizeRafId = 0;
        function resizeCanvas() {
            if (resizeRafId) return;
            resizeRafId = requestAnimationFrame(() => {
                resizeRafId = 0;
                applyCanvasSize();
            });
        }

        // 初期キャンバスサイズ設定
        applyCanvasSize();
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', () => {
            resizeCanvas();
            setTimeout(resizeCanvas, 300);
        });

        // 武器選択UIの初期化
        function initWeaponSelector() {
            // スマホ判定
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            if (isMobile) {
                weaponSelectorToggle.style.display = 'block';
                weaponSelector.style.display = 'none';
            } else {
                weaponSelectorToggle.style.display = 'none';
                weaponSelector.style.display = 'block';
            }
            
            // 武器選択トグルボタンのイベント
            weaponSelectorToggle.addEventListener('click', () => {
                if (weaponSelector.style.display === 'none') {
                    weaponSelector.style.display = 'block';
                    weaponSelectorToggle.textContent = '✕';
                } else {
                    weaponSelector.style.display = 'none';
                    weaponSelectorToggle.textContent = '🔫';
                }
            });
            
            // 武器選択イベント
            const weaponDisplays = document.querySelectorAll('.weapon-display');
            weaponDisplays.forEach(display => {
                display.addEventListener('click', () => {
                    const weaponNum = parseInt(display.dataset.weapon);
                    if (unlockedWeapons.includes(weaponNum)) {
                        setWeapon(weaponNum);
                        
                        // スマホの場合は選択後にパネルを閉じる
                        if (isMobile) {
                            weaponSelector.style.display = 'none';
                            weaponSelectorToggle.textContent = '🔫';
                        }
                    }
                });
            });
        }
        
        // 武器選択UIの更新
        function updateWeaponSelector() {
            const weaponDisplays = document.querySelectorAll('.weapon-display');
            weaponDisplays.forEach(display => {
                const weaponNum = parseInt(display.dataset.weapon);
                if (unlockedWeapons.includes(weaponNum)) {
                    display.style.display = 'flex';
                    if (weaponNum === currentWeapon) {
                        display.classList.add('active');
                    } else {
                        display.classList.remove('active');
                    }
                } else {
                    display.style.display = 'none';
                }
            });
        }

        // ゲーム状態
        let gameRunning = false;
        let gameTime = 120; // 2分 = 120秒
        let gameStartTime = Date.now();
        let isPlayer1 = true; // プレイヤー1かどうか
        let waitingForOpponent = true;
        let gameId = null;
        let opponentId = null;
        let roomId = null; // ルームID
        let roomListener = null; // ルーム状態監視リスナー
        let bulletsListener = null; // 弾丸監視リスナー
        let lastGameState = null; // 前回のゲーム状態

        // --- 分散化: 通信優先度とバッチ処理 ---
        const CommunicationPriority = {
            CRITICAL: 'critical',    // ダメージ、HP変更
            IMPORTANT: 'important',  // 弾丸位置
            NORMAL: 'normal',        // プレイヤー移動
            LOW: 'low'               // 装飾効果
        };

        class BatchManager {
            constructor() {
                this.criticalQueue = [];
                this.importantQueue = [];
                this.normalQueue = [];
                this.lowQueue = [];
                this.intervals = {
                    critical: 0,      // 即座
                    important: 100,   // 100ms
                    normal: 500,      // 500ms
                    low: 1000         // 1秒
                };
                this.startBatching();
            }
            addUpdate(priority, data) {
                switch (priority) {
                    case CommunicationPriority.CRITICAL:
                        this.criticalQueue.push(data); break;
                    case CommunicationPriority.IMPORTANT:
                        this.importantQueue.push(data); break;
                    case CommunicationPriority.NORMAL:
                        this.normalQueue.push(data); break;
                    case CommunicationPriority.LOW:
                        this.lowQueue.push(data); break;
                }
            }
            startBatching() {
                setInterval(() => this.sendBatch('critical'), this.intervals.critical);
                setInterval(() => this.sendBatch('important'), this.intervals.important);
                setInterval(() => this.sendBatch('normal'), this.intervals.normal);
                setInterval(() => this.sendBatch('low'), this.intervals.low);
            }
            sendBatch(priority) {
                let queue;
                switch (priority) {
                    case 'critical': queue = this.criticalQueue; break;
                    case 'important': queue = this.importantQueue; break;
                    case 'normal': queue = this.normalQueue; break;
                    case 'low': queue = this.lowQueue; break;
                }
                if (queue.length > 0) {
                    // ここでP2PまたはFirebase送信
                    // 例: firebaseDataManager.batchUpdate(queue);
                    queue.length = 0;
                }
            }
        }
        const batchManager = new BatchManager();

        // --- P2P通信マネージャー ---
        class P2PManager {
            constructor() {
                this.peerConnection = null;
                this.dataChannel = null;
                this.isConnected = false;
            }
            async connect() {
                try {
                    this.peerConnection = new RTCPeerConnection({
                        iceServers: [
                            { urls: 'stun:stun.l.google.com:19302' }
                        ]
                    });
                    this.dataChannel = this.peerConnection.createDataChannel('gameData');
                    this.dataChannel.onopen = () => { this.isConnected = true; };
                    this.dataChannel.onclose = () => { this.isConnected = false; };

        // 障害物生成（偏りを抑えたバランス配置）
        function generateObstacles() {
            obstacles = [];
            const halfHeight = canvas.height / 2;
            const horizontalPadding = Math.max(40, Math.floor(canvas.width * 0.08));
            const obstacleGap = 18;
            const obstaclesPerSide = 8;

            function overlapsWithGap(a, b, gap = obstacleGap) {
                return (
                    a.x < b.x + b.width + gap &&
                    a.x + a.width + gap > b.x &&
                    a.y < b.y + b.height + gap &&
                    a.y + a.height + gap > b.y
                );
            }

            function placeBand(startY, endY, avoidRect) {
                const placed = [];
                let attempts = 0;
                const maxAttempts = 900;

                while (placed.length < obstaclesPerSide && attempts < maxAttempts) {
                    attempts++;
                    const width = 40 + Math.floor(Math.random() * 26);
                    const height = 40 + Math.floor(Math.random() * 26);
                    const laneWidth = Math.floor(canvas.width * 0.28);
                    const laneXStart = Math.floor((canvas.width - laneWidth) / 2);
                    const laneXEnd = laneXStart + laneWidth;

                    const leftZone = {
                        minX: horizontalPadding,
                        maxX: Math.max(horizontalPadding, laneXStart - width - horizontalPadding / 2)
                    };
                    const rightZone = {
                        minX: Math.min(canvas.width - horizontalPadding - width, laneXEnd + horizontalPadding / 2),
                        maxX: canvas.width - horizontalPadding - width
                    };

                    const zone = Math.random() < 0.5 ? leftZone : rightZone;
                    if (zone.maxX <= zone.minX) continue;

                    const x = zone.minX + Math.random() * (zone.maxX - zone.minX);
                    const y = startY + Math.random() * Math.max(1, (endY - startY - height));
                    const candidate = { x, y, width, height, color: '#8B0000', isFixed: true };

                    if (overlapsWithGap(candidate, avoidRect, 28)) continue;
                    if (placed.some(p => overlapsWithGap(candidate, p))) continue;

                    placed.push(candidate);
                }
                return placed;
            }

            const topAvoid = { x: canvas.width * 0.5 - 90, y: 56, width: 180, height: 90 };
            const bottomAvoid = { x: canvas.width * 0.5 - 90, y: canvas.height - 146, width: 180, height: 90 };

            const topObstacles = placeBand(70, halfHeight - 55, topAvoid);
            const bottomObstacles = placeBand(halfHeight + 35, canvas.height - 60, bottomAvoid);
            obstacles = [...topObstacles, ...bottomObstacles];

            console.log(`障害物を${obstacles.length}個配置しました（上下左右バランス配置）`);
        }

        // 衝突判定
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        /** 障害物と重なったら最小めり込み方向に押し出す（キー推測に依存しない） */
        function resolvePlayerObstacleOverlap(player) {
            for (let iter = 0; iter < 8; iter++) {
                let any = false;
                for (let oi = 0; oi < obstacles.length; oi++) {
                    const obstacle = obstacles[oi];
                    if (!checkCollision(player, obstacle)) continue;
                    any = true;
                    const overlapLeft = (player.x + player.width) - obstacle.x;
                    const overlapRight = (obstacle.x + obstacle.width) - player.x;
                    const overlapTop = (player.y + player.height) - obstacle.y;
                    const overlapBottom = (obstacle.y + obstacle.height) - player.y;
                    const m = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);
                    if (m === overlapLeft) player.x -= m;
                    else if (m === overlapRight) player.x += m;
                    else if (m === overlapTop) player.y -= m;
                    else player.y += m;
                }
                if (!any) break;
            }
        }

        /** 陣営どおりにプレイヤーを自陣ハーフ内へ収める */
        function clampPlayersToHalfCourt() {
            player1.x = Math.max(0, Math.min(canvas.width - player1.width, player1.x));
            player2.x = Math.max(0, Math.min(canvas.width - player2.width, player2.x));
            if (isPlayer1) {
                player1.y = Math.max(canvas.height / 2, Math.min(canvas.height - player1.height, player1.y));
                player2.y = Math.max(0, Math.min(canvas.height / 2 - player2.height, player2.y));
            } else {
                player1.y = Math.max(0, Math.min(canvas.height / 2 - player1.height, player1.y));
                player2.y = Math.max(canvas.height / 2, Math.min(canvas.height - player2.height, player2.y));
            }
        }

        // プレイヤー描画
        function drawPlayer(player, isPlayerUnit) {
            const x = player.x;
            const y = player.y;
            const w = player.width;
            const h = player.height;
            
            // プレイヤーの色
            const color = isPlayerUnit ? '#0066cc' : '#cc0000';
            
            // 向きは中央線の位置ではなく、陣営（自分側/相手側）で固定する
            // isPlayer1(グローバル): 自分がplayer1かどうか
            // isPlayerUnit(引数): 描画対象がplayer1かどうか
            const isBottomSidePlayer = (isPlayer1 && isPlayerUnit) || (!isPlayer1 && !isPlayerUnit);
            
            if (isBottomSidePlayer) {
                // 下側にいるプレイヤー（上向き）
                // 戦闘機の本体
                ctx.fillStyle = color;
                ctx.fillRect(x + w/4, y + h/3, w/2, h/2);
                
                // 戦闘機の機首（上向き）
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(x + w/3, y, w/3, h/3);
                
                // 戦闘機の翼
                ctx.fillStyle = color;
                ctx.fillRect(x, y + h/3, w/4, h/3);
                ctx.fillRect(x + 3*w/4, y + h/3, w/4, h/3);
                
                // 戦闘機の尾翼
                ctx.fillStyle = color;
                ctx.fillRect(x + w/3, y + 2*h/3, w/3, h/3);
                
                // エンジン部分
                ctx.fillStyle = '#ff6600';
                ctx.fillRect(x + w/4, y + h/2, w/2, h/6);
                
                // コックピット
                ctx.fillStyle = isPlayerUnit ? '#00ccff' : '#ff0000';
                ctx.fillRect(x + w/3, y + h/4, w/3, h/6);
            } else {
                // 上側にいるプレイヤー（下向き）
                // 戦闘機の本体
                ctx.fillStyle = color;
                ctx.fillRect(x + w/4, y + h/3, w/2, h/2);
                
                // 戦闘機の機首（下向き）
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(x + w/3, y + 2*h/3, w/3, h/3);
                
                // 戦闘機の翼
                ctx.fillStyle = color;
                ctx.fillRect(x, y + h/3, w/4, h/3);
                ctx.fillRect(x + 3*w/4, y + h/3, w/4, h/3);
                
                // 戦闘機の尾翼
                ctx.fillStyle = color;
                ctx.fillRect(x + w/3, y, w/3, h/3);
                
                // エンジン部分
                ctx.fillStyle = '#ff6600';
                ctx.fillRect(x + w/4, y + h/2, w/2, h/6);
                
                // コックピット
                ctx.fillStyle = isPlayerUnit ? '#00ccff' : '#ff0000';
                ctx.fillRect(x + w/3, y + h/4, w/3, h/6);
            }
        }

        // 弾丸描画
        function drawBullets(bullets) {
            bullets.forEach(bullet => {
                ctx.fillStyle = bullet.color;
                ctx.shadowColor = bullet.color;
                ctx.shadowBlur = 5;
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
                ctx.shadowBlur = 0;
            });
        }

        // 障害物描画
        function drawObstacles() {
            obstacles.forEach(obstacle => {
                const x = obstacle.x;
                const y = obstacle.y;
                const w = obstacle.width;
                const h = obstacle.height;
                
                // 岩の画像を描画
                if (rockImage && rockImage.complete) {
                    ctx.drawImage(rockImage, x, y, w, h);
                } else {
                    // 画像が読み込まれていない場合は従来の描画
                    ctx.shadowColor = '#000000';
                    ctx.shadowBlur = 8;
                    ctx.fillStyle = '#8B0000';
                    ctx.fillRect(x, y, w, h);
                    ctx.shadowBlur = 0;
                    
                    ctx.fillStyle = '#A0522D';
                    ctx.fillRect(x + 5, y + 5, w - 10, h - 10);
                    
                    ctx.strokeStyle = '#654321';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(x + w/4, y + h/3);
                    ctx.lineTo(x + 3*w/4, y + 2*h/3);
                    ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.moveTo(x + w/3, y + h/4);
                    ctx.lineTo(x + 2*w/3, y + 3*h/4);
                    ctx.stroke();
                    
                    ctx.fillStyle = '#696969';
                    ctx.fillRect(x + w/6, y + h/6, w/6, h/6);
                    ctx.fillRect(x + 2*w/3, y + h/3, w/6, h/6);
                    ctx.fillRect(x + w/3, y + 2*h/3, w/6, h/6);
                }
            });
        }

        // ゲーム更新
        function update() {
            if (!gameRunning) return;

            // 時間更新
            const elapsed = Math.floor((Date.now() - gameStartTime) / 1000);
            const remainingTime = Math.max(0, gameTime - elapsed);
            const minutes = Math.floor(remainingTime / 60);
            const seconds = remainingTime % 60;
            timerElement.textContent = `残り時間: ${minutes}:${seconds.toString().padStart(2, '0')}`;

            // 時間切れ
            if (remainingTime <= 0) {
                endGame('timeout');
                return;
            }

            // プレイヤー移動
            updatePlayerMovement();

            // AI対戦時はメインループ内で確実にAIを更新する
            if (gameMode === 'ai' && aiOpponent) {
                aiOpponent.execute();
            }

            // 障害物との重なり解消（ローカルキーは相手機体に使えないため幾何押し出しのみ）
            resolvePlayerObstacleOverlap(player1);
            resolvePlayerObstacleOverlap(player2);
            clampPlayersToHalfCourt();

            // 弾丸更新
            updateBullets(player1.bullets);
            updateBullets(player2.bullets);

            // AI対戦では弾薬が枯渇しすぎないよう自然回復を入れる
            if (gameMode === 'ai') {
                const now = Date.now();
                const regenInterval = 850; // 約0.85秒ごとに回復
                if (now - lastAiAmmoRegenAt >= regenInterval) {
                    const regenAmount = player2.ammo <= 6 ? 3 : 1;
                    player2.ammo = Math.min(player2.maxAmmo, player2.ammo + regenAmount);
                    lastAiAmmoRegenAt = now;
                }
            }

            // 補給ユニット更新
            supplyUnits = supplyUnits.filter(unit => {
                unit.y += 1; // ゆっくり落下
                if (unit.y > canvas.height) {
                    return false; // 画面外に出たら消去
                }
                // プレイヤーとの衝突判定
                const collectors = gameMode === 'ai'
                    ? [player1, player2]
                    : [isPlayer1 ? player1 : player2];
                for (const collector of collectors) {
                    if (checkCollision(unit, collector)) {
                        unit.isCollected = true;
                        collector.ammo = Math.min(collector.maxAmmo, collector.ammo + 20); // 20発補給
                        playSound(explosionSound); // 補給取得音
                        sendImportantGameState(); // 重要な状態変更を即座に送信
                        return false; // 取得されたら消去
                    }
                }
                return true;
            });
            
            // ライフ回復アイテム更新
            healthItems = healthItems.filter(item => {
                item.y += 1; // ゆっくり落下
                if (item.y > canvas.height) {
                    return false; // 画面外に出たら消去
                }
                // プレイヤーとの衝突判定
                const collectors = gameMode === 'ai'
                    ? [player1, player2]
                    : [isPlayer1 ? player1 : player2];
                for (const collector of collectors) {
                    if (checkCollision(item, collector)) {
                        item.isCollected = true;
                        if (collector.hp < collector.maxHp) { // 最大HPは100
                            collector.hp = Math.min(collector.maxHp, collector.hp + 20); // 20HP回復
                        }
                        playSound(explosionSound); // ライフ回復取得音
                        sendImportantGameState(); // 重要な状態変更を即座に送信
                        return false; // 取得されたら消去
                    }
                }
                return true;
            });

            // 補給ユニット生成
            spawnSupplyUnits();
            
            // ライフ回復アイテム生成
            spawnHealthItems();

            // HPバー更新
            const player1HpPercent = (player1.hp / player1.maxHp) * 100;
            const player2HpPercent = (player2.hp / player2.maxHp) * 100;
            player1HpElement.style.width = `${player1HpPercent}%`;
            player2HpElement.style.width = `${player2HpPercent}%`;
            console.log(`UI更新: プレイヤー1 HP ${player1.hp}/${player1.maxHp} (${player1HpPercent.toFixed(1)}%)`);
            console.log(`UI更新: プレイヤー2 HP ${player2.hp}/${player2.maxHp} (${player2HpPercent.toFixed(1)}%)`);

            // 弾薬表示更新
            document.getElementById('player1Ammo').textContent = `弾薬: ${player1.ammo}/${player1.maxAmmo}`;
            document.getElementById('player2Ammo').textContent = `弾薬: ${player2.ammo}/${player2.maxAmmo}`;

            // 勝利条件チェック
            if (player1.hp <= 0) {
                endGame('player2');
            } else if (player2.hp <= 0) {
                endGame('player1');
            }

            // 定期的にゲーム状態をFirebaseに送信（AI対戦では無効化、オンラインでは大幅削減）
            if (roomId && gameMode !== 'ai' && elapsed % 300 === 0) { // 5分ごとに変更
                // 前回の状態と比較して、重要な変更があった場合のみ送信
                const currentState = {
                    player1Hp: player1.hp,
                    player2Hp: player2.hp,
                    player1Ammo: player1.ammo,
                    player2Ammo: player2.ammo,
                    remainingTime: remainingTime
                };
                
                // クォータ制限チェック
                if (window.firebaseQuotaExceeded) {
                    console.log('Firebaseクォータ制限により定期通信をスキップします');
                    return;
                }
                
                // 前回の状態と比較（初回は送信）
                if (!lastGameState || 
                    lastGameState.player1Hp !== currentState.player1Hp ||
                    lastGameState.player2Hp !== currentState.player2Hp ||
                    lastGameState.player1Ammo !== currentState.player1Ammo ||
                    lastGameState.player2Ammo !== currentState.player2Ammo ||
                    Math.abs(lastGameState.remainingTime - currentState.remainingTime) > 30) {
                    
                    firebaseDataManager.updateGameState(roomId, currentState).catch(error => {
                        console.error('ゲーム状態更新エラー:', error);
                        // クォータエラーの場合は更新を停止
                        if (error.code === 'resource-exhausted') {
                            console.log('Firebaseクォータ制限に達しました。更新を停止します。');
                            window.firebaseQuotaExceeded = true;
                        }
                    });
                    
                    // 現在の状態を保存
                    lastGameState = { ...currentState };
                }
            }
        }

        // 重要なゲーム状態変更を即座に送信
        function sendImportantGameState() {
            // AI対戦モードではFirebase通信を無効化
            if (gameMode === 'ai') {
                return;
            }
            
            if (roomId && gameRunning) {
                const currentState = {
                    player1Hp: player1.hp,
                    player2Hp: player2.hp,
                    player1Ammo: player1.ammo,
                    player2Ammo: player2.ammo,
                    remainingTime: Math.max(0, gameTime - Math.floor((Date.now() - gameStartTime) / 1000))
                };
                
                // クォータ制限チェック
                if (window.firebaseQuotaExceeded) {
                    console.log('Firebaseクォータ制限により通信をスキップします');
                    return;
                }
                
                firebaseDataManager.updateGameState(roomId, currentState).catch(error => {
                    console.error('重要なゲーム状態更新エラー:', error);
                    // クォータエラーの場合は更新を停止
                    if (error.code === 'resource-exhausted') {
                        console.log('Firebaseクォータ制限に達しました。通信を停止します。');
                        window.firebaseQuotaExceeded = true;
                    }
                });
                
                lastGameState = { ...currentState };
            }
        }

        // 弾丸更新
        function updateBullets(bullets) {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                bullet.x += bullet.speedX;
                bullet.y += bullet.speedY;

                // 画面外に出た弾丸を削除
                if (bullet.y < -bullet.height || bullet.y > canvas.height) {
                    bullets.splice(i, 1);
                    continue;
                }

                // 障害物との衝突
                obstacles.forEach(obstacle => {
                    if (checkCollision(bullet, obstacle)) {
                        bullets.splice(i, 1);
                        return;
                    }
                });

                // プレイヤーとの衝突
                const targetPlayer = bullet.playerId === 1 ? player2 : player1;
                if (checkCollision(bullet, targetPlayer)) {
                    console.log(`ダメージ判定: プレイヤー${bullet.playerId === 1 ? '2' : '1'}にダメージ適用`);
                    console.log(`ダメージ前HP: ${targetPlayer.hp}`);
                    targetPlayer.hp -= 10;
                    console.log(`ダメージ後HP: ${targetPlayer.hp}`);
                    bullets.splice(i, 1);
                    playSound(explosionSound); // ヒット音
                    sendImportantGameState(); // 重要な状態変更を即座に送信
                    return;
                }

                // 弾丸同士の衝突（相殺）
                const otherBullets = bullet.playerId === 1 ? player2.bullets : player1.bullets;
                for (let j = otherBullets.length - 1; j >= 0; j--) {
                    const otherBullet = otherBullets[j];
                    if (checkCollision(bullet, otherBullet)) {
                        bullets.splice(i, 1);
                        otherBullets.splice(j, 1);
                        return;
                    }
                }
            }
        }

        // プレイヤー移動（自分は常に画面下ハーフ＝updatePlayerPositions と一致させる）
        function updatePlayerMovement() {
            const player = isPlayer1 ? player1 : player2;
            const minY = canvas.height / 2;
            const maxY = canvas.height - player.height;
            
            // 左右移動
            if ((keys['ArrowLeft'] || keys['a'] || keys['A']) && player.x > 0) {
                player.x -= player.speed;
            }
            if ((keys['ArrowRight'] || keys['d'] || keys['D']) && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }
            
            // 上下移動（下ハーフのみ）
            if ((keys['ArrowUp'] || keys['w'] || keys['W']) && player.y > minY) {
                player.y -= player.speed;
            }
            if ((keys['ArrowDown'] || keys['s'] || keys['S']) && player.y < maxY) {
                player.y += player.speed;
            }
        }

        // ゲーム描画
        function draw() {
            // 背景クリア
            ctx.fillStyle = '#001122';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 星の背景
            ctx.fillStyle = '#ffffff';
            for (let i = 0; i < 50; i++) {
                ctx.fillRect(
                    (i * 37) % canvas.width,
                    (i * 73) % canvas.height,
                    1, 1
                );
            }

            // 中央の境界線
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();
            ctx.setLineDash([]);

            // UIラベルを更新
            updateUILabels();

            drawObstacles();
            drawPlayer(player1, true);
            drawPlayer(player2, false);
            drawBullets(player1.bullets);
            drawBullets(player2.bullets);

            // 補給ユニットの描画（シューティングゲームと同じ）
            supplyUnits.forEach(unit => {
                const x = unit.x;
                const y = unit.y;
                const w = unit.width;
                const h = unit.height;

                ctx.fillStyle = unit.color;
                ctx.shadowColor = unit.color;
                ctx.shadowBlur = 5;
                ctx.fillRect(x, y, w, h);
                ctx.shadowBlur = 0;

                // 補給マーク
                ctx.fillStyle = '#ffffff';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('+', x + w/2, y + h/2 + 5);

                // 補給表示
                ctx.fillStyle = '#00ff00';
                ctx.font = '12px Arial';
                ctx.fillText('補給', x + w/2, y + h + 15);
            });

            // ライフ回復アイテムの描画（シューティングゲームと同じ）
            healthItems.forEach(item => {
                const x = item.x;
                const y = item.y;
                const w = item.width;
                const h = item.height;

                ctx.fillStyle = item.color;
                ctx.shadowColor = item.color;
                ctx.shadowBlur = 8;
                ctx.fillRect(x, y, w, h);
                ctx.shadowBlur = 0;

                // ハートマーク
                ctx.fillStyle = '#ffffff';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('♥', x + w/2, y + h/2 + 5);

                // ライフ回復表示
                ctx.fillStyle = '#ff69b4';
                ctx.font = '12px Arial';
                ctx.fillText('ライフ', x + w/2, y + h + 15);
            });
        }

        // ゲーム終了
        function endGame(reason) {
            gameRunning = false;
            
            // リスナーを解除
            if (roomListener) {
                roomListener();
                roomListener = null;
            }
            if (bulletsListener) {
                bulletsListener();
                bulletsListener = null;
            }
            
            let message = '';
            let winner = '';
            
            switch (reason) {
                case 'player1':
                    message = isPlayer1 ? 'あなたの勝利！' : '相手の勝利！';
                    winner = 'player1';
                    break;
                case 'player2':
                    message = isPlayer1 ? '相手の勝利！' : 'あなたの勝利！';
                    winner = 'player2';
                    break;
                case 'timeout':
                    if (player1.hp > player2.hp) {
                        message = isPlayer1 ? 'あなたの勝利！' : '相手の勝利！';
                        winner = 'player1';
                    } else if (player2.hp > player1.hp) {
                        message = isPlayer1 ? '相手の勝利！' : 'あなたの勝利！';
                        winner = 'player2';
                    } else {
                        message = '引き分け！';
                        winner = 'draw';
                    }
                    break;
            }
            
            // Firebaseにゲーム終了を通知（AI対戦では無効化）
            if (roomId && gameMode !== 'ai') {
                // クォータ制限チェック
                if (!window.firebaseQuotaExceeded) {
                    firebaseDataManager.updateGameState(roomId, {
                        status: 'finished',
                        winner: winner,
                        finalHp: {
                            player1: player1.hp,
                            player2: player2.hp
                        }
                    }).catch(error => {
                        console.error('ゲーム終了通知エラー:', error);
                        if (error.code === 'resource-exhausted') {
                            console.log('Firebaseクォータ制限によりゲーム終了通知をスキップします');
                            window.firebaseQuotaExceeded = true;
                        }
                    });
                } else {
                    console.log('Firebaseクォータ制限によりゲーム終了通知をスキップします');
                }
            }
            
            statusMessageElement.textContent = message;
            gameStatusElement.style.display = 'block';
        }

        // ゲーム開始
        function startGame() {
            console.log('startGame() が呼び出されました');
            
            // 最初にプレイヤー位置を調整（自分のユニットが下側に来るように）
            // gameRunningがfalseの時に位置調整を行う
            const wasGameRunning = gameRunning;
            gameRunning = false;
            updatePlayerPositions();
            gameRunning = wasGameRunning;
            
            gameRunning = true;
            gameStartTime = Date.now();
            waitingForOpponent = false;
            lastGameState = null; // 前回の状態をリセット
            waitingRoomElement.style.display = 'none';
            console.log('waitingRoomElement.style.display = none を設定');
            
            // 障害物がまだ生成されていない場合のみ生成
            if (obstacles.length === 0) {
                generateObstacles();
                console.log('障害物を生成しました');
            } else {
                console.log('障害物は既に生成済みです');
            }
            
            initWeaponSelector(); // ゲーム開始時に武器選択UIを初期化
            updateWeaponSelector(); // ゲーム開始時に武器選択UIを更新
            updateUILabels(); // ゲーム開始時にUIラベルを更新

            // オンライン対戦時のみ弾丸監視を開始
            if (gameMode !== 'ai' && roomId) {
                startBulletsListener();
            }
            console.log('ゲーム開始処理が完了しました');
        }

        // リスタート
        function restartGame() {
            // プレイヤー情報をリセット
            player1.hp = player1.maxHp;
            player2.hp = player2.maxHp;
            player1.bullets = [];
            player2.bullets = [];
            player1.ammo = player1.maxAmmo;
            player2.ammo = player2.maxAmmo;
            
            // プレイヤー位置をリセット
            if (isPlayer1) {
                player1.x = canvas.width / 4;
                player2.x = (canvas.width * 3) / 4;
            } else {
                player1.x = (canvas.width * 3) / 4;
                player2.x = canvas.width / 4;
            }
            
            // 補給ユニットとライフ回復アイテムをクリア
            supplyUnits = [];
            healthItems = [];
            
            // 障害物は固定なのでリセットしない
            
            gameStatusElement.style.display = 'none';
            startGame();
        }

        // ホームに戻る
        function goHome() {
            window.location.href = 'index.html';
        }

        // ゲームループ
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // 初期化（Firebase 認証を真実とする。復元完了まで一度待つ）
        async function init() {
            try {
                if (typeof firebase !== 'undefined' && firebase.auth) {
                    await new Promise((resolve) => {
                        const unsub = firebase.auth().onAuthStateChanged(() => {
                            try { unsub(); } catch (e2) { /* ignore */ }
                            resolve();
                        });
                    });
                }
            } catch (e) { /* ignore */ }

            if (typeof firebase === 'undefined' || !firebase.auth || !firebase.auth().currentUser) {
                alert('PvPをプレイするにはログインが必要です。');
                window.location.replace('index.html');
                return;
            }

            // サウンド初期化
            initSounds();
            initImages(); // 画像初期化を追加

            // ゲームループ開始
            gameLoop();

            if (gameMode === 'ai') {
                // AI対戦用の初期化
                console.log('AI対戦モードで開始します');
                startAIMatch();
            } else {
                // Firebaseマッチングを開始
                console.log('Firebaseマッチングを開始します');
                startMatching();
            }
        }

        // AI対戦用の初期化処理
        let aiOpponent = null;
        
        function startAIMatch() {
            isPlayer1 = true;
            waitingForOpponent = false;
            lastAiAmmoRegenAt = Date.now();
            // AI用のplayer2を初期化（既存のplayer2をそのまま使う）
            // ルームIDやFirebaseは使わない
            startGame();
            
            // AIオポーネント: URL ?ai= > localStorage pvpAiDifficulty > hard
            const aiParam = new URLSearchParams(window.location.search).get('ai');
            const stored = localStorage.getItem('pvpAiDifficulty');
            const aiLevel = ['easy', 'medium', 'hard', 'expert'].includes(aiParam)
                ? aiParam
                : (['easy', 'medium', 'hard', 'expert'].includes(stored) ? stored : 'hard');
            aiOpponent = new AIOpponent(player2, player1, canvas, obstacles, weapons, aiLevel);
        }

        // オフライン専用のマッチングを開始
        function startOfflineMatching() {
            console.log('オフライン専用PvPゲームを開始します');
            
            // ローカルストレージでルーム情報を管理
            const roomKey = 'pvp_local_room';
            const existingRoom = localStorage.getItem(roomKey);
            
            if (existingRoom) {
                // 既存のルームに参加
                const roomData = JSON.parse(existingRoom);
                console.log('既存のオフラインルームに参加:', roomData);
                
                isPlayer1 = false;
                roomId = `offline-${roomData.id}`;
                
                // ルームを削除（満員）
                localStorage.removeItem(roomKey);
                
                // ゲーム開始
                startGame();
            } else {
                // 新しいルームを作成
                const roomData = {
                    id: Date.now(),
                    creator: localStorage.getItem('playerName') || 'Unknown',
                    createdAt: new Date().toISOString()
                };
                
                localStorage.setItem(roomKey, JSON.stringify(roomData));
                console.log('新しいオフラインルームを作成:', roomData);
                
                isPlayer1 = true;
                roomId = `offline-${roomData.id}`;
                
                // 相手を待つ（2秒後に自動開始）
                waitingForOpponent = true;
                statusMessageElement.textContent = '対戦相手を待っています...（2秒後に自動開始）';
                
                setTimeout(() => {
                    if (waitingForOpponent) {
                        console.log('相手が見つからないため、デモモードで開始します');
                        localStorage.removeItem(roomKey);
                        startDemoMode();
                    }
                }, 2000);
            }
        }

        // デモモード開始
        function startDemoMode() {
            console.log('デモモードで開始します');
            
            isPlayer1 = true;
            roomId = 'demo-room';
            
            // 即座にゲーム開始
            startGame();
        }

        // --- PvPモード選択 ---
        let gameMode = null; // 'online' or 'ai'
        const modeSelect = document.getElementById('modeSelect');
        const onlineBtn = document.getElementById('onlineBtn');
        const aiBtn = document.getElementById('aiBtn');
        const aiDifficultySelect = document.getElementById('aiDifficultySelect');
        const PVP_AI_LEVELS = ['easy', 'medium', 'hard', 'expert'];

        function syncAiDifficultySelectFromStorage() {
            const v = localStorage.getItem('pvpAiDifficulty');
            aiDifficultySelect.value = PVP_AI_LEVELS.includes(v) ? v : 'hard';
        }
        syncAiDifficultySelectFromStorage();
        aiDifficultySelect.addEventListener('change', () => {
            localStorage.setItem('pvpAiDifficulty', aiDifficultySelect.value);
        });

        // URLパラメータからモードを取得
        function getModeFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('mode');
        }

        // 初期化時にモードを設定
        function initializeMode() {
            const urlMode = getModeFromURL();
            if (urlMode === 'ai' || urlMode === 'online') {
                gameMode = urlMode;
                modeSelect.style.display = 'none';
                console.log(`URLパラメータからモード設定: ${gameMode}`);
                init();
            } else {
                // URLパラメータがない場合はモード選択UIを表示
                console.log('モード選択UIを表示');
                modeSelect.style.display = 'flex';
            }
        }

        onlineBtn.addEventListener('click', () => {
            gameMode = 'online';
            modeSelect.style.display = 'none';
            // オンライン対戦の初期化を呼び出す
            init();
        });
        aiBtn.addEventListener('click', () => {
            gameMode = 'ai';
            modeSelect.style.display = 'none';
            // AI対戦の初期化を呼び出す
            init();
        });

        // ページ読み込み時にモードを初期化
        initializeMode();
    </script>
</body>
</html>
