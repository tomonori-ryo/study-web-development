<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PvP対戦モード - 戦闘機シューティングゲーム</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        #gameCanvas {
            display: block;
            background: linear-gradient(to bottom, #001122, #003366);
        }
        
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: clamp(14px, 2.5vw, 18px);
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        .player-info {
            margin-bottom: 10px;
            padding: 8px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .player1-info {
            border-left: 4px solid #00ff00;
        }
        
        .player2-info {
            border-left: 4px solid #ff0000;
        }
        
        .hp-bar {
            width: 200px;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            margin: 5px 0;
        }
        
        .hp-fill {
            height: 100%;
            transition: width 0.3s ease;
        }
        
        .player1-hp {
            background: linear-gradient(90deg, #00ff00, #00cc00);
        }
        
        .player2-hp {
            background: linear-gradient(90deg, #ff0000, #cc0000);
        }
        
        #timer {
            color: #ffff00;
            font-size: clamp(16px, 3vw, 20px);
            font-weight: bold;
            text-align: center;
            margin: 10px 0;
        }
        
        #gameStatus {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: clamp(24px, 6vw, 36px);
            text-align: center;
            display: none;
            z-index: 200;
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        
        #waitingRoom {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: clamp(20px, 5vw, 28px);
            text-align: center;
            z-index: 150;
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        
        .status-buttons {
            margin-top: 20px;
        }
        
        .status-btn {
            background: #4444ff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: clamp(14px, 3vw, 18px);
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s ease;
        }
        
        .status-btn:hover {
            background: #3333cc;
            transform: scale(1.05);
        }
        
        .status-btn.home {
            background: #ff4444;
        }
        
        .status-btn.home:hover {
            background: #cc3333;
        }
        
        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            font-size: clamp(10px, 2vw, 12px);
            background: rgba(0, 0, 0, 0.5);
            padding: 8px;
            border-radius: 5px;
            backdrop-filter: blur(5px);
            z-index: 50;
        }
        
        #controls h3 {
            margin: 0 0 5px 0;
            font-size: clamp(12px, 2.5vw, 14px);
            color: #00ffff;
        }
        
        #controls p {
            margin: 2px 0;
            font-size: clamp(8px, 1.8vw, 10px);
        }
        
        /* 武器選択UI */
        #weaponSelector {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            padding: 10px;
            backdrop-filter: blur(10px);
            z-index: 100;
            transition: all 0.3s ease;
        }
        
        .weapon-display {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .weapon-display:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }
        
        .weapon-display.active {
            background: rgba(0, 255, 255, 0.3);
            border: 2px solid #00ffff;
        }
        
        .weapon-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            color: white;
        }
        
        .weapon-info {
            flex: 1;
        }
        
        .weapon-name {
            font-size: clamp(12px, 2.5vw, 14px);
            font-weight: bold;
            color: white;
            margin-bottom: 2px;
        }
        
        .weapon-details {
            font-size: clamp(10px, 2vw, 12px);
            color: #cccccc;
        }
        
        .weapon-selector-toggle {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            z-index: 101;
            transition: all 0.3s ease;
            display: none;
        }
        
        .weapon-selector-toggle:hover {
            background: rgba(0, 0, 0, 0.9);
            transform: translateY(-50%) scale(1.1);
        }
        
        /* レスポンシブ対応 */
        @media (max-width: 768px) {
            #ui {
                font-size: clamp(12px, 2vw, 16px);
                padding: 10px;
            }
            
            .hp-bar {
                width: 150px;
                height: 15px;
            }
            
            #timer {
                font-size: clamp(14px, 2.5vw, 18px);
            }
            
            #gameStatus, #waitingRoom {
                font-size: clamp(18px, 4vw, 24px);
                padding: 20px;
            }
            
            .status-btn {
                padding: 10px 20px;
                font-size: clamp(12px, 2.5vw, 16px);
            }
            
            #weaponSelector {
                padding: 8px;
            }
            
            .weapon-display {
                padding: 6px;
                gap: 8px;
            }
            
            .weapon-icon {
                width: 25px;
                height: 25px;
                font-size: 14px;
            }
            
            .weapon-name {
                font-size: clamp(10px, 2vw, 12px);
            }
            
            .weapon-details {
                font-size: clamp(8px, 1.5vw, 10px);
            }
            
            .weapon-selector-toggle {
                padding: 12px;
                font-size: 18px;
            }
            
            #controls {
                font-size: clamp(8px, 1.5vw, 10px);
                padding: 6px;
            }
            
            #controls h3 {
                font-size: clamp(10px, 2vw, 12px);
            }
            
            #controls p {
                font-size: clamp(6px, 1.5vw, 8px);
                margin: 1px 0;
            }
        }
        
        @media (max-height: 600px) {
            #ui {
                font-size: clamp(10px, 1.8vw, 14px);
                padding: 8px;
            }
            
            .hp-bar {
                width: 120px;
                height: 12px;
            }
            
            #timer {
                font-size: clamp(12px, 2vw, 16px);
            }
            
            #gameStatus, #waitingRoom {
                font-size: clamp(16px, 3vw, 20px);
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui">
        <div class="player-info player1-info">
            <div id="player1Label">プレイヤー1 (自分)</div>
            <div class="hp-bar">
                <div class="hp-fill player1-hp" id="player1Hp" style="width: 100%;"></div>
            </div>
            <div id="player1Ammo" style="color: #ffff00; font-size: 0.9em;">弾薬: 50/50</div>
        </div>
        <div class="player-info player2-info">
            <div id="player2Label">プレイヤー2 (相手)</div>
            <div class="hp-bar">
                <div class="hp-fill player2-hp" id="player2Hp" style="width: 100%;"></div>
            </div>
            <div id="player2Ammo" style="color: #ffff00; font-size: 0.9em;">弾薬: 50/50</div>
        </div>
        <div id="timer">残り時間: 2:00</div>
    </div>
    
    <div id="waitingRoom">
        <div>対戦相手を待っています...</div>
        <div style="font-size: 0.8em; margin-top: 10px; color: #cccccc;">
            相手が参加すると自動的にゲームが開始されます
        </div>
        <div class="status-buttons">
            <button class="status-btn home" onclick="goHome()">ホームに戻る</button>
        </div>
    </div>
    
    <div id="gameStatus">
        <div id="statusMessage">ゲーム終了</div>
        <div class="status-buttons">
            <button class="status-btn" onclick="restartGame()">もう一度対戦</button>
            <button class="status-btn home" onclick="goHome()">ホームに戻る</button>
        </div>
    </div>
    
    <div id="controls">
        <h3>🎮 操作方法</h3>
        <p><strong>PC:</strong> 矢印キー/WASDで移動、スペースで攻撃</p>
        <p><strong>スマホ:</strong> タップで攻撃、ドラッグで移動</p>
        <p><strong>武器選択:</strong> 数字キー1-4</p>
    </div>
    
    <!-- 武器選択UI -->
    <button id="weaponSelectorToggle" class="weapon-selector-toggle">🔫</button>
    <div id="weaponSelector" style="display: none;">
        <div class="weapon-display active" data-weapon="1">
            <div class="weapon-icon" style="background: #ffff00;">1</div>
            <div class="weapon-info">
                <div class="weapon-name">通常弾</div>
                <div class="weapon-details">弾薬: 1発</div>
            </div>
        </div>
        <div class="weapon-display" data-weapon="2">
            <div class="weapon-icon" style="background: #ff8800;">2</div>
            <div class="weapon-info">
                <div class="weapon-name">連射弾</div>
                <div class="weapon-details">弾薬: 2発</div>
            </div>
        </div>
        <div class="weapon-display" data-weapon="3">
            <div class="weapon-icon" style="background: #ff0000;">3</div>
            <div class="weapon-info">
                <div class="weapon-name">散弾</div>
                <div class="weapon-details">弾薬: 3発</div>
            </div>
        </div>
        <div class="weapon-display" data-weapon="4">
            <div class="weapon-icon" style="background: #00ffff;">4</div>
            <div class="weapon-info">
                <div class="weapon-name">レーザー</div>
                <div class="weapon-details">弾薬: 5発</div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-analytics-compat.js"></script>
    <script src="firebase-config.js"></script>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const player1HpElement = document.getElementById('player1Hp');
        const player2HpElement = document.getElementById('player2Hp');
        const timerElement = document.getElementById('timer');
        const waitingRoomElement = document.getElementById('waitingRoom');
        const gameStatusElement = document.getElementById('gameStatus');
        const statusMessageElement = document.getElementById('statusMessage');
        const weaponSelectorToggle = document.getElementById('weaponSelectorToggle');
        const weaponSelector = document.getElementById('weaponSelector');

        // キャンバスサイズを画面サイズに設定
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        // 初期キャンバスサイズ設定
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // 武器選択UIの初期化
        function initWeaponSelector() {
            // スマホ判定
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            if (isMobile) {
                weaponSelectorToggle.style.display = 'block';
                weaponSelector.style.display = 'none';
            } else {
                weaponSelectorToggle.style.display = 'none';
                weaponSelector.style.display = 'block';
            }
            
            // 武器選択トグルボタンのイベント
            weaponSelectorToggle.addEventListener('click', () => {
                if (weaponSelector.style.display === 'none') {
                    weaponSelector.style.display = 'block';
                    weaponSelectorToggle.textContent = '✕';
                } else {
                    weaponSelector.style.display = 'none';
                    weaponSelectorToggle.textContent = '🔫';
                }
            });
            
            // 武器選択イベント
            const weaponDisplays = document.querySelectorAll('.weapon-display');
            weaponDisplays.forEach(display => {
                display.addEventListener('click', () => {
                    const weaponNum = parseInt(display.dataset.weapon);
                    if (unlockedWeapons.includes(weaponNum)) {
                        // アクティブクラスを更新
                        weaponDisplays.forEach(d => d.classList.remove('active'));
                        display.classList.add('active');
                        
                        // 武器を変更
                        currentWeapon = weaponNum;
                        
                        // スマホの場合は選択後にパネルを閉じる
                        if (isMobile) {
                            weaponSelector.style.display = 'none';
                            weaponSelectorToggle.textContent = '🔫';
                        }
                    }
                });
            });
        }
        
        // 武器選択UIの更新
        function updateWeaponSelector() {
            const weaponDisplays = document.querySelectorAll('.weapon-display');
            weaponDisplays.forEach(display => {
                const weaponNum = parseInt(display.dataset.weapon);
                if (unlockedWeapons.includes(weaponNum)) {
                    display.style.display = 'flex';
                    if (weaponNum === currentWeapon) {
                        display.classList.add('active');
                    } else {
                        display.classList.remove('active');
                    }
                } else {
                    display.style.display = 'none';
                }
            });
        }

        // ゲーム状態
        let gameRunning = false;
        let gameTime = 120; // 2分 = 120秒
        let gameStartTime = Date.now();
        let isPlayer1 = true; // プレイヤー1かどうか
        let waitingForOpponent = true;
        let gameId = null;
        let opponentId = null;
        let roomId = null; // ルームID
        let roomListener = null; // ルーム状態監視リスナー
        let bulletsListener = null; // 弾丸監視リスナー
        let lastGameState = null; // 前回のゲーム状態

        // マッチング機能
        async function startMatching() {
            try {
                console.log('マッチングを開始します...');
                statusMessageElement.textContent = 'マッチング中...';
                
                // 利用可能なルームを取得
                const availableRooms = await firebaseDataManager.getAvailableRooms();
                console.log('利用可能なルーム:', availableRooms);
                
                if (availableRooms.length > 0) {
                    // 既存のルームに参加
                    const roomToJoin = availableRooms[0];
                    console.log('既存のルームに参加します:', roomToJoin.id);
                    roomId = await firebaseDataManager.joinPvPRoom(roomToJoin.id);
                    isPlayer1 = false; // プレイヤー2として参加
                    console.log('既存のルームに参加しました:', roomId);
                    
                    // 既存のルームに参加した場合は、すぐにゲームを開始
                    console.log('既存のルームに参加したため、すぐにゲームを開始します');
                    waitingForOpponent = false;
                    startGame();
                } else {
                    // 新しいルームを作成
                    console.log('新しいルームを作成します');
                    roomId = await firebaseDataManager.createPvPRoom();
                    isPlayer1 = true; // プレイヤー1として作成
                    console.log('新しいルームを作成しました:', roomId);
                    
                    // 新しいルームを作成した場合は、ルーム状態監視を開始
                    console.log('新しいルームを作成したため、ルーム状態監視を開始します');
                    startRoomListener();
                }
                
                // ルーム状態を監視（既存ルーム参加の場合は不要）
                if (availableRooms.length === 0) {
                    console.log('ルーム状態監視を開始します');
                    startRoomListener();
                }
                
            } catch (error) {
                console.error('マッチングエラー:', error);
                
                // インデックスエラーの場合は一時的にデモモードで開始
                if (error.message.includes('index') || error.message.includes('requires an index')) {
                    console.log('Firebaseインデックスが作成中です。デモモードで開始します。');
                    alert('Firebaseインデックスが作成中です。デモモードで開始します。');
                    
                    // デモモードで開始
                    isPlayer1 = true;
                    roomId = 'demo-room';
                    setTimeout(() => {
                        console.log('デモモードでゲームを開始します');
                        startGame();
                    }, 2000);
                } else {
                    alert('マッチングに失敗しました: ' + error.message);
                }
            }
        }

        // ルーム状態監視
        function startRoomListener() {
            if (roomListener) {
                roomListener(); // 既存のリスナーを解除
            }
            
            console.log('ルーム状態監視を開始します。roomId:', roomId);
            
            roomListener = firebaseDataManager.onRoomStateChange(roomId, (roomData) => {
                console.log('ルーム状態更新:', roomData);
                console.log('waitingForOpponent:', waitingForOpponent);
                console.log('roomData.status:', roomData.status);
                console.log('roomData.player2:', roomData.player2);
                
                if (roomData.status === 'ready' && roomData.player2) {
                    // 対戦相手が参加した
                    console.log('対戦相手が参加しました。startGame()を呼び出します。');
                    waitingForOpponent = false;
                    opponentId = isPlayer1 ? roomData.player2.uid : roomData.player1.uid;
                    startGame();
                } else if (roomData.status === 'waiting') {
                    // まだ相手を待っている
                    console.log('まだ相手を待っています...');
                    waitingForOpponent = true;
                    statusMessageElement.textContent = '対戦相手を待っています...';
                } else if (roomData.status === 'finished') {
                    // ゲーム終了
                    console.log('ゲーム終了:', roomData.winner);
                    endGame(roomData.winner);
                }
            });
        }

        // 弾丸監視
        function startBulletsListener() {
            if (bulletsListener) {
                bulletsListener(); // 既存のリスナーを解除
            }
            
            bulletsListener = firebaseDataManager.onBulletsChange(roomId, (bullets) => {
                // 相手の弾丸を受信
                bullets.forEach(bulletData => {
                    if (bulletData.playerId !== (isPlayer1 ? 1 : 2)) {
                        // 自分の弾丸ではない場合、相手の弾丸として追加
                        const targetPlayer = isPlayer1 ? player2 : player1;
                        targetPlayer.bullets.push(bulletData.bullet);
                    }
                });
            });
        }

        // オーディオ要素
        let shootSound = null;
        let explosionSound = null;
        
        // 画像要素
        let rockImage = null;

        // サウンド初期化
        function initSounds() {
            // プレイヤーの銃撃音
            shootSound = new Audio('shoot.mp3');
            shootSound.volume = 0.3;
            
            // 敵の爆発音
            explosionSound = new Audio('explosion.mp3');
            explosionSound.volume = 0.3;
        }
        
        // 画像初期化
        function initImages() {
            rockImage = new Image();
            rockImage.src = 'iwa.png';
        }

        // サウンド再生関数
        function playSound(audio) {
            if (audio) {
                audio.currentTime = 0; // 音を最初から再生
                audio.play().catch(e => console.log('音声再生エラー:', e));
            }
        }

        // プレイヤー情報
        let player1 = {
            x: canvas.width / 4,
            y: canvas.height - 100,
            width: 40,
            height: 50,
            speed: 5,
            hp: 100,
            maxHp: 100,
            bullets: [],
            lastShootTime: 0,
            shootCooldown: 200,
            ammo: 50,
            maxAmmo: 50
        };

        let player2 = {
            x: (canvas.width * 3) / 4,
            y: 100,
            width: 40,
            height: 50,
            speed: 5,
            hp: 100,
            maxHp: 100,
            bullets: [],
            lastShootTime: 0,
            shootCooldown: 200,
            ammo: 50,
            maxAmmo: 50
        };

        // プレイヤーの位置を動的に調整する関数
        function updatePlayerPositions() {
            // デバッグログ追加
            console.log('updatePlayerPositions呼び出し');
            console.log('isPlayer1:', isPlayer1);
            console.log('player1.y:', player1.y, 'player2.y:', player2.y);
            
            // 移動中でない場合のみ位置を調整
            const isMoving = keys['ArrowUp'] || keys['ArrowDown'] || keys['w'] || keys['W'] || keys['s'] || keys['S'];
            
            // 初期位置設定のみ実行（移動中はスキップ）
            if (!isMoving && !gameRunning) {
                if (isPlayer1) {
                    // 自分がプレイヤー1の場合：自分が下、相手が上
                    player1.y = canvas.height - 100; // 自分（下）
                    player2.y = 100; // 相手（上）
                } else {
                    // 自分がプレイヤー2の場合：自分が下、相手が上
                    player2.y = canvas.height - 100; // 自分（下）
                    player1.y = 100; // 相手（上）
                }
                console.log('初期位置設定実行');
            } else if (isMoving) {
                console.log('移動中のため位置調整をスキップ');
            } else {
                console.log('ゲーム実行中のため位置調整をスキップ');
            }
            
            console.log('調整後 - player1.y:', player1.y, 'player2.y:', player2.y);
        }

        // UIラベルを動的に更新する関数
        function updateUILabels() {
            const player1Label = document.getElementById('player1Label');
            const player2Label = document.getElementById('player2Label');
            
            if (isPlayer1) {
                // 自分がプレイヤー1の場合
                player1Label.textContent = 'プレイヤー1 (自分)';
                player2Label.textContent = 'プレイヤー2 (相手)';
            } else {
                // 自分がプレイヤー2の場合
                player1Label.textContent = 'プレイヤー1 (相手)';
                player2Label.textContent = 'プレイヤー2 (自分)';
            }
        }
        
        // 障害物
        let obstacles = [];
        
        // 補給ユニット
        let supplyUnits = [];
        
        // ライフ回復アイテム
        let healthItems = [];
        
        // 武器の定義
        const weapons = {
            1: { name: '通常弾', ammoCost: 1, bulletCount: 1, spread: 0, speed: 8, color: '#ffff00' },
            2: { name: '連射弾', ammoCost: 2, bulletCount: 3, spread: 0.2, speed: 7, color: '#ff8800' },
            3: { name: '散弾', ammoCost: 3, bulletCount: 5, spread: 0.5, speed: 6, color: '#ff0000' },
            4: { name: 'レーザー', ammoCost: 5, bulletCount: 1, spread: 0, speed: 12, color: '#00ffff' }
        };

        let currentWeapon = 1;
        let unlockedWeapons = [1];

        // キー入力
        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            console.log('キー押下:', e.key); // デバッグログ追加
            
            if (e.key === ' ') {
                e.preventDefault();
                const now = Date.now();
                const player = isPlayer1 ? player1 : player2;
                if (now - player.lastShootTime > player.shootCooldown) {
                    shoot();
                    player.lastShootTime = now;
                }
            }
            
            // 武器選択（数字キー1-4）
            if (e.key >= '1' && e.key <= '4') {
                const weaponNum = parseInt(e.key);
                if (unlockedWeapons.includes(weaponNum) && currentWeapon !== weaponNum) {
                    currentWeapon = weaponNum;
                }
            }
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
            console.log('キー離上:', e.key); // デバッグログ追加
        });

        // タッチ操作の変数
        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;
        let lastTouchTime = 0;
        let touchMoved = false;
        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let playerStartX = 0;
        let playerStartY = 0;

        // タッチイベント
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            touchMoved = false;
            lastTouchTime = Date.now();
            
            // ドラッグ開始
            isDragging = false;
            dragStartX = touch.clientX;
            dragStartY = touch.clientY;
            const player = isPlayer1 ? player1 : player2;
            playerStartX = player.x;
            playerStartY = player.y;
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            touchEndX = touch.clientX;
            touchEndY = touch.clientY;
            touchMoved = true;
            
            // ドラッグ移動
            if (touchMoved) {
                const deltaX = touch.clientX - dragStartX;
                const deltaY = touch.clientY - dragStartY;
                const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
                
                if (distance > 10) { // 最小ドラッグ距離
                    isDragging = true;
                    
                    // プレイヤーの位置をリアルタイムで更新
                    const player = isPlayer1 ? player1 : player2;
                    const newX = playerStartX + deltaX;
                    const newY = playerStartY + deltaY;
                    
                    // 画面境界内に制限（常に自分が下半分）
                    player.x = Math.max(0, Math.min(canvas.width - player.width, newX));
                    player.y = Math.max(
                        canvas.height / 2, // 常に下半分から
                        Math.min(
                            canvas.height - player.height, 
                            newY
                        )
                    );
                }
            }
        });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            const touchDuration = Date.now() - lastTouchTime;
            
            if (!isDragging && touchDuration < 200) {
                // 短時間のタップで攻撃
                shoot();
            }
            
            // ドラッグ終了
            isDragging = false;
        });

        // 弾丸発射
        function shoot() {
            const player = isPlayer1 ? player1 : player2;
            const weapon = weapons[currentWeapon];
            
            if (player.ammo >= weapon.ammoCost) {
                for (let i = 0; i < weapon.bulletCount; i++) {
                    const spread = (i - (weapon.bulletCount - 1) / 2) * weapon.spread;
                    const bullet = {
                        x: player.x + player.width / 2,
                        y: isPlayer1 ? player.y : player.y + player.height,
                        width: 4,
                        height: 8,
                        speedX: spread,
                        speedY: isPlayer1 ? -weapon.speed : weapon.speed,
                        color: weapon.color,
                        playerId: isPlayer1 ? 1 : 2
                    };
                    
                    player.bullets.push(bullet);
                }
                
                // 弾丸をFirebaseに送信（クォータ制限を考慮）
                if (roomId) {
                    firebaseDataManager.sendBullet(roomId, isPlayer1 ? 1 : 2, bullet).catch(error => {
                        console.error('弾丸送信エラー:', error);
                        // クォータエラーの場合は送信を停止
                        if (error.code === 'resource-exhausted') {
                            console.log('Firebaseクォータ制限に達しました。弾丸送信を停止します。');
                        }
                    });
                }
                
                playSound(shootSound);
                player.ammo -= weapon.ammoCost; // 武器に応じた弾薬を消費
            }
        }

        // 障害物生成（固定位置）
        function generateObstacles() {
            obstacles = [];
            const obstacleCount = 5 + Math.floor(Math.random() * 5); // 5-10個
            
            // 戦闘機の初期位置を定義
            const player1InitialX = canvas.width / 4;
            const player1InitialY = canvas.height - 100;
            const player2InitialX = (canvas.width * 3) / 4;
            const player2InitialY = 100;
            const playerWidth = 40;
            const playerHeight = 50;
            
            // 安全な距離（障害物と戦闘機の間隔）
            const safeDistance = 80;
            
            for (let i = 0; i < obstacleCount; i++) {
                let validPosition = false;
                let x, y;
                
                // 有効な位置が見つかるまで繰り返し
                while (!validPosition) {
                    x = Math.random() * (canvas.width - 60);
                    y = Math.random() * (canvas.height - 60) + 100;
                    
                    // 戦闘機の初期位置との距離をチェック
                    const distanceToPlayer1 = Math.sqrt(
                        Math.pow(x - player1InitialX, 2) + 
                        Math.pow(y - player1InitialY, 2)
                    );
                    const distanceToPlayer2 = Math.sqrt(
                        Math.pow(x - player2InitialX, 2) + 
                        Math.pow(y - player2InitialY, 2)
                    );
                    
                    // 両方の戦闘機から安全な距離にある場合のみ有効
                    if (distanceToPlayer1 > safeDistance && distanceToPlayer2 > safeDistance) {
                        validPosition = true;
                    }
                }
                
                obstacles.push({
                    x: x,
                    y: y,
                    width: 40 + Math.random() * 40,
                    height: 40 + Math.random() * 40,
                    color: '#8B0000',
                    // 固定位置フラグを追加
                    isFixed: true
                });
            }
            
            console.log(`障害物を${obstacles.length}個生成しました`);
        }

        // 補給ユニット生成
        function spawnSupplyUnits() {
            // ランダムで補給ユニットを生成（シューティングゲームと同じ確率）
            const spawnRate = 0.003; // 0.3%の確率
            if (Math.random() < spawnRate) {
                supplyUnits.push({
                    x: Math.random() * (canvas.width - 28),
                    y: Math.random() * (canvas.height / 2 - 28) + canvas.height / 2, // 中央の線より下
                    width: 28,
                    height: 28,
                    color: '#00ff00',
                    isCollected: false
                });
            }
        }
        
        // ライフ回復アイテム生成
        function spawnHealthItems() {
            // 低確率でライフ回復アイテムを生成（シューティングゲームと同じ確率）
            const spawnRate = 0.0001; // 0.01%の確率
            if (Math.random() < spawnRate) {
                healthItems.push({
                    x: Math.random() * (canvas.width - 30),
                    y: Math.random() * (canvas.height / 2 - 30) + canvas.height / 2, // 中央の線より下
                    width: 30,
                    height: 30,
                    color: '#ff69b4', // ピンク色
                    isCollected: false
                });
            }
        }

        // 衝突判定
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        // プレイヤー描画
        function drawPlayer(player, isPlayer1) {
            const x = player.x;
            const y = player.y;
            const w = player.width;
            const h = player.height;
            
            // デバッグログ追加
            console.log(`プレイヤー${isPlayer1 ? '1' : '2'}描画: x=${x}, y=${y}, w=${w}, h=${h}`);
            
            // プレイヤーの色
            const color = isPlayer1 ? '#0066cc' : '#cc0000';
            
            // プレイヤーの位置に基づいて向きを決定
            const isAtBottom = y > canvas.height / 2;
            
            if (isAtBottom) {
                // 下側にいるプレイヤー（上向き）
                // 戦闘機の本体
                ctx.fillStyle = color;
                ctx.fillRect(x + w/4, y + h/3, w/2, h/2);
                
                // 戦闘機の機首（上向き）
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(x + w/3, y, w/3, h/3);
                
                // 戦闘機の翼
                ctx.fillStyle = color;
                ctx.fillRect(x, y + h/3, w/4, h/3);
                ctx.fillRect(x + 3*w/4, y + h/3, w/4, h/3);
                
                // 戦闘機の尾翼
                ctx.fillStyle = color;
                ctx.fillRect(x + w/3, y + 2*h/3, w/3, h/3);
                
                // エンジン部分
                ctx.fillStyle = '#ff6600';
                ctx.fillRect(x + w/4, y + h/2, w/2, h/6);
                
                // コックピット
                ctx.fillStyle = isPlayer1 ? '#00ccff' : '#ff0000';
                ctx.fillRect(x + w/3, y + h/4, w/3, h/6);
            } else {
                // 上側にいるプレイヤー（下向き）
                // 戦闘機の本体
                ctx.fillStyle = color;
                ctx.fillRect(x + w/4, y + h/3, w/2, h/2);
                
                // 戦闘機の機首（下向き）
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(x + w/3, y + 2*h/3, w/3, h/3);
                
                // 戦闘機の翼
                ctx.fillStyle = color;
                ctx.fillRect(x, y + h/3, w/4, h/3);
                ctx.fillRect(x + 3*w/4, y + h/3, w/4, h/3);
                
                // 戦闘機の尾翼
                ctx.fillStyle = color;
                ctx.fillRect(x + w/3, y, w/3, h/3);
                
                // エンジン部分
                ctx.fillStyle = '#ff6600';
                ctx.fillRect(x + w/4, y + h/2, w/2, h/6);
                
                // コックピット
                ctx.fillStyle = isPlayer1 ? '#00ccff' : '#ff0000';
                ctx.fillRect(x + w/3, y + h/4, w/3, h/6);
            }
        }

        // 弾丸描画
        function drawBullets(bullets) {
            bullets.forEach(bullet => {
                ctx.fillStyle = bullet.color;
                ctx.shadowColor = bullet.color;
                ctx.shadowBlur = 5;
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
                ctx.shadowBlur = 0;
            });
        }

        // 障害物描画
        function drawObstacles() {
            obstacles.forEach(obstacle => {
                const x = obstacle.x;
                const y = obstacle.y;
                const w = obstacle.width;
                const h = obstacle.height;
                
                // 岩の画像を描画
                if (rockImage && rockImage.complete) {
                    ctx.drawImage(rockImage, x, y, w, h);
                } else {
                    // 画像が読み込まれていない場合は従来の描画
                    ctx.shadowColor = '#000000';
                    ctx.shadowBlur = 8;
                    ctx.fillStyle = '#8B0000';
                    ctx.fillRect(x, y, w, h);
                    ctx.shadowBlur = 0;
                    
                    ctx.fillStyle = '#A0522D';
                    ctx.fillRect(x + 5, y + 5, w - 10, h - 10);
                    
                    ctx.strokeStyle = '#654321';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(x + w/4, y + h/3);
                    ctx.lineTo(x + 3*w/4, y + 2*h/3);
                    ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.moveTo(x + w/3, y + h/4);
                    ctx.lineTo(x + 2*w/3, y + 3*h/4);
                    ctx.stroke();
                    
                    ctx.fillStyle = '#696969';
                    ctx.fillRect(x + w/6, y + h/6, w/6, h/6);
                    ctx.fillRect(x + 2*w/3, y + h/3, w/6, h/6);
                    ctx.fillRect(x + w/3, y + 2*h/3, w/6, h/6);
                }
            });
        }

        // ゲーム更新
        function update() {
            if (!gameRunning) return;

            // 時間更新
            const elapsed = Math.floor((Date.now() - gameStartTime) / 1000);
            const remainingTime = Math.max(0, gameTime - elapsed);
            const minutes = Math.floor(remainingTime / 60);
            const seconds = remainingTime % 60;
            timerElement.textContent = `残り時間: ${minutes}:${seconds.toString().padStart(2, '0')}`;

            // 時間切れ
            if (remainingTime <= 0) {
                endGame('timeout');
                return;
            }

            // プレイヤー移動
            updatePlayerMovement();

            // 障害物との衝突チェック（障害物は固定位置）
            obstacles.forEach(obstacle => {
                if (checkCollision(player1, obstacle)) {
                    // 障害物に衝突した場合、元の位置に戻す
                    if (keys['ArrowLeft'] || keys['a'] || keys['A']) player1.x += player1.speed;
                    if (keys['ArrowRight'] || keys['d'] || keys['D']) player1.x -= player1.speed;
                    if (keys['ArrowUp'] || keys['w'] || keys['W']) player1.y += player1.speed;
                    if (keys['ArrowDown'] || keys['s'] || keys['S']) player1.y -= player1.speed;
                }
                if (checkCollision(player2, obstacle)) {
                    // 障害物に衝突した場合、元の位置に戻す
                    if (keys['ArrowLeft'] || keys['a'] || keys['A']) player2.x += player2.speed;
                    if (keys['ArrowRight'] || keys['d'] || keys['D']) player2.x -= player2.speed;
                    if (keys['ArrowUp'] || keys['w'] || keys['W']) player2.y += player2.speed;
                    if (keys['ArrowDown'] || keys['s'] || keys['S']) player2.y -= player2.speed;
                }
            });

            // 弾丸更新
            updateBullets(player1.bullets);
            updateBullets(player2.bullets);

            // 補給ユニット更新
            supplyUnits = supplyUnits.filter(unit => {
                unit.y += 1; // ゆっくり落下
                if (unit.y > canvas.height) {
                    return false; // 画面外に出たら消去
                }
                // プレイヤーとの衝突判定
                const player = isPlayer1 ? player1 : player2;
                if (checkCollision(unit, player)) {
                    unit.isCollected = true;
                    player.ammo = Math.min(player.maxAmmo, player.ammo + 20); // 20発補給
                    playSound(explosionSound); // 補給取得音
                    sendImportantGameState(); // 重要な状態変更を即座に送信
                    return false; // 取得されたら消去
                }
                return true;
            });
            
            // ライフ回復アイテム更新
            healthItems = healthItems.filter(item => {
                item.y += 1; // ゆっくり落下
                if (item.y > canvas.height) {
                    return false; // 画面外に出たら消去
                }
                // プレイヤーとの衝突判定
                const player = isPlayer1 ? player1 : player2;
                if (checkCollision(item, player)) {
                    item.isCollected = true;
                    if (player.hp < player.maxHp) { // 最大HPは100
                        player.hp = Math.min(player.maxHp, player.hp + 20); // 20HP回復
                    }
                    playSound(explosionSound); // ライフ回復取得音
                    sendImportantGameState(); // 重要な状態変更を即座に送信
                    return false; // 取得されたら消去
                }
                return true;
            });

            // 補給ユニット生成
            spawnSupplyUnits();
            
            // ライフ回復アイテム生成
            spawnHealthItems();

            // HPバー更新
            const player1HpPercent = (player1.hp / player1.maxHp) * 100;
            const player2HpPercent = (player2.hp / player2.maxHp) * 100;
            player1HpElement.style.width = `${player1HpPercent}%`;
            player2HpElement.style.width = `${player2HpPercent}%`;
            console.log(`UI更新: プレイヤー1 HP ${player1.hp}/${player1.maxHp} (${player1HpPercent.toFixed(1)}%)`);
            console.log(`UI更新: プレイヤー2 HP ${player2.hp}/${player2.maxHp} (${player2HpPercent.toFixed(1)}%)`);

            // 弾薬表示更新
            document.getElementById('player1Ammo').textContent = `弾薬: ${player1.ammo}/${player1.maxAmmo}`;
            document.getElementById('player2Ammo').textContent = `弾薬: ${player2.ammo}/${player2.maxAmmo}`;

            // 勝利条件チェック
            if (player1.hp <= 0) {
                endGame('player2');
            } else if (player2.hp <= 0) {
                endGame('player1');
            }

            // 定期的にゲーム状態をFirebaseに送信（60秒ごと、かつ重要な変更があった場合のみ）
            if (roomId && elapsed % 60 === 0) {
                // 前回の状態と比較して、重要な変更があった場合のみ送信
                const currentState = {
                    player1Hp: player1.hp,
                    player2Hp: player2.hp,
                    player1Ammo: player1.ammo,
                    player2Ammo: player2.ammo,
                    remainingTime: remainingTime
                };
                
                // 前回の状態と比較（初回は送信）
                if (!lastGameState || 
                    lastGameState.player1Hp !== currentState.player1Hp ||
                    lastGameState.player2Hp !== currentState.player2Hp ||
                    lastGameState.player1Ammo !== currentState.player1Ammo ||
                    lastGameState.player2Ammo !== currentState.player2Ammo ||
                    Math.abs(lastGameState.remainingTime - currentState.remainingTime) > 30) {
                    
                    firebaseDataManager.updateGameState(roomId, currentState).catch(error => {
                        console.error('ゲーム状態更新エラー:', error);
                        // クォータエラーの場合は更新を停止
                        if (error.code === 'resource-exhausted') {
                            console.log('Firebaseクォータ制限に達しました。更新を停止します。');
                        }
                    });
                    
                    // 現在の状態を保存
                    lastGameState = { ...currentState };
                }
            }
        }

        // 重要なゲーム状態変更を即座に送信
        function sendImportantGameState() {
            if (roomId && gameRunning) {
                const currentState = {
                    player1Hp: player1.hp,
                    player2Hp: player2.hp,
                    player1Ammo: player1.ammo,
                    player2Ammo: player2.ammo,
                    remainingTime: Math.max(0, gameTime - Math.floor((Date.now() - gameStartTime) / 1000))
                };
                
                firebaseDataManager.updateGameState(roomId, currentState).catch(error => {
                    console.error('重要なゲーム状態更新エラー:', error);
                    // クォータエラーの場合は更新を停止
                    if (error.code === 'resource-exhausted') {
                        console.log('Firebaseクォータ制限に達しました。重要な更新も停止します。');
                    }
                });
                
                lastGameState = { ...currentState };
            }
        }

        // 弾丸更新
        function updateBullets(bullets) {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                bullet.x += bullet.speedX;
                bullet.y += bullet.speedY;

                // 画面外に出た弾丸を削除
                if (bullet.y < -bullet.height || bullet.y > canvas.height) {
                    bullets.splice(i, 1);
                    continue;
                }

                // 障害物との衝突
                obstacles.forEach(obstacle => {
                    if (checkCollision(bullet, obstacle)) {
                        bullets.splice(i, 1);
                        return;
                    }
                });

                // プレイヤーとの衝突
                const targetPlayer = bullet.playerId === 1 ? player2 : player1;
                if (checkCollision(bullet, targetPlayer)) {
                    console.log(`ダメージ判定: プレイヤー${bullet.playerId === 1 ? '2' : '1'}にダメージ適用`);
                    console.log(`ダメージ前HP: ${targetPlayer.hp}`);
                    targetPlayer.hp -= 10;
                    console.log(`ダメージ後HP: ${targetPlayer.hp}`);
                    bullets.splice(i, 1);
                    playSound(explosionSound); // ヒット音
                    sendImportantGameState(); // 重要な状態変更を即座に送信
                    return;
                }

                // 弾丸同士の衝突（相殺）
                const otherBullets = bullet.playerId === 1 ? player2.bullets : player1.bullets;
                for (let j = otherBullets.length - 1; j >= 0; j--) {
                    const otherBullet = otherBullets[j];
                    if (checkCollision(bullet, otherBullet)) {
                        bullets.splice(i, 1);
                        otherBullets.splice(j, 1);
                        return;
                    }
                }
            }
        }

        // プレイヤー移動
        function updatePlayerMovement() {
            const player = isPlayer1 ? player1 : player2;
            
            // 移動制限を動的に設定
            const minY = canvas.height / 2; // 下側のプレイヤーは中央線以下
            const maxY = canvas.height - player.height; // 画面下部まで
            
            // デバッグログ追加
            if (keys['ArrowUp'] || keys['w'] || keys['W']) {
                console.log('上移動キー検出:', player.y, '>', minY);
            }
            if (keys['ArrowDown'] || keys['s'] || keys['S']) {
                console.log('下移動キー検出:', player.y, '<', maxY);
            }
            
            if ((keys['ArrowLeft'] || keys['a'] || keys['A']) && player.x > 0) {
                player.x -= player.speed;
            }
            if ((keys['ArrowRight'] || keys['d'] || keys['D']) && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }
            if ((keys['ArrowUp'] || keys['w'] || keys['W']) && player.y > minY) {
                player.y -= player.speed;
                console.log('上移動実行:', player.y);
            }
            if ((keys['ArrowDown'] || keys['s'] || keys['S']) && player.y < maxY) {
                player.y += player.speed;
                console.log('下移動実行:', player.y);
            }
        }

        // ゲーム描画
        function draw() {
            // 背景クリア
            ctx.fillStyle = '#001122';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 星の背景
            ctx.fillStyle = '#ffffff';
            for (let i = 0; i < 50; i++) {
                ctx.fillRect(
                    (i * 37) % canvas.width,
                    (i * 73) % canvas.height,
                    1, 1
                );
            }

            // 中央の境界線
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();
            ctx.setLineDash([]);

            // プレイヤーの位置を更新
            updatePlayerPositions();
            
            // UIラベルを更新
            updateUILabels();

            drawObstacles();
            drawPlayer(player1, true);
            drawPlayer(player2, false);
            drawBullets(player1.bullets);
            drawBullets(player2.bullets);

            // 補給ユニットの描画（シューティングゲームと同じ）
            supplyUnits.forEach(unit => {
                const x = unit.x;
                const y = unit.y;
                const w = unit.width;
                const h = unit.height;

                ctx.fillStyle = unit.color;
                ctx.shadowColor = unit.color;
                ctx.shadowBlur = 5;
                ctx.fillRect(x, y, w, h);
                ctx.shadowBlur = 0;

                // 補給マーク
                ctx.fillStyle = '#ffffff';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('+', x + w/2, y + h/2 + 5);

                // 補給表示
                ctx.fillStyle = '#00ff00';
                ctx.font = '12px Arial';
                ctx.fillText('補給', x + w/2, y + h + 15);
            });

            // ライフ回復アイテムの描画（シューティングゲームと同じ）
            healthItems.forEach(item => {
                const x = item.x;
                const y = item.y;
                const w = item.width;
                const h = item.height;

                ctx.fillStyle = item.color;
                ctx.shadowColor = item.color;
                ctx.shadowBlur = 8;
                ctx.fillRect(x, y, w, h);
                ctx.shadowBlur = 0;

                // ハートマーク
                ctx.fillStyle = '#ffffff';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('♥', x + w/2, y + h/2 + 5);

                // ライフ回復表示
                ctx.fillStyle = '#ff69b4';
                ctx.font = '12px Arial';
                ctx.fillText('ライフ', x + w/2, y + h + 15);
            });
        }

        // ゲーム終了
        function endGame(reason) {
            gameRunning = false;
            
            // リスナーを解除
            if (roomListener) {
                roomListener();
                roomListener = null;
            }
            if (bulletsListener) {
                bulletsListener();
                bulletsListener = null;
            }
            
            let message = '';
            let winner = '';
            
            switch (reason) {
                case 'player1':
                    message = isPlayer1 ? 'あなたの勝利！' : '相手の勝利！';
                    winner = 'player1';
                    break;
                case 'player2':
                    message = isPlayer1 ? '相手の勝利！' : 'あなたの勝利！';
                    winner = 'player2';
                    break;
                case 'timeout':
                    if (player1.hp > player2.hp) {
                        message = isPlayer1 ? 'あなたの勝利！' : '相手の勝利！';
                        winner = 'player1';
                    } else if (player2.hp > player1.hp) {
                        message = isPlayer1 ? '相手の勝利！' : 'あなたの勝利！';
                        winner = 'player2';
                    } else {
                        message = '引き分け！';
                        winner = 'draw';
                    }
                    break;
            }
            
            // Firebaseにゲーム終了を通知
            if (roomId) {
                firebaseDataManager.updateGameState(roomId, {
                    status: 'finished',
                    winner: winner,
                    finalHp: {
                        player1: player1.hp,
                        player2: player2.hp
                    }
                }).catch(error => {
                    console.error('ゲーム終了通知エラー:', error);
                });
            }
            
            statusMessageElement.textContent = message;
            gameStatusElement.style.display = 'block';
        }

        // ゲーム開始
        function startGame() {
            console.log('startGame() が呼び出されました');
            gameRunning = true;
            gameStartTime = Date.now();
            waitingForOpponent = false;
            lastGameState = null; // 前回の状態をリセット
            waitingRoomElement.style.display = 'none';
            console.log('waitingRoomElement.style.display = none を設定');
            generateObstacles();
            console.log('障害物を生成しました');
            initWeaponSelector(); // ゲーム開始時に武器選択UIを初期化
            updateWeaponSelector(); // ゲーム開始時に武器選択UIを更新
            updatePlayerPositions(); // ゲーム開始時にプレイヤー位置を更新
            updateUILabels(); // ゲーム開始時にUIラベルを更新
            startBulletsListener(); // ゲーム開始時に弾丸監視を開始
            console.log('ゲーム開始処理が完了しました');
        }

        // リスタート
        function restartGame() {
            // プレイヤー情報をリセット
            player1.hp = player1.maxHp;
            player2.hp = player2.maxHp;
            player1.bullets = [];
            player2.bullets = [];
            player1.ammo = player1.maxAmmo;
            player2.ammo = player2.maxAmmo;
            player1.x = canvas.width / 4;
            player1.y = canvas.height - 100;
            player2.x = (canvas.width * 3) / 4;
            player2.y = 100;
            
            // 補給ユニットとライフ回復アイテムをクリア
            supplyUnits = [];
            healthItems = [];
            
            gameStatusElement.style.display = 'none';
            startGame();
        }

        // ホームに戻る
        function goHome() {
            window.location.href = 'index.html';
        }

        // ゲームループ
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // 初期化
        function init() {
            // ログイン状態をチェック（Firebase認証とローカルストレージの両方を確認）
            const playerName = localStorage.getItem('playerName');
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            const firebaseUid = localStorage.getItem('firebaseUid');
            const currentUser = firebase.auth().currentUser;
            
            // ログイン状態の判定（Firebase認証またはローカルストレージ）
            const isAuthenticated = (playerName && isLoggedIn === 'true') || 
                                  (currentUser && firebaseUid === currentUser.uid) ||
                                  currentUser;
            
            if (!isAuthenticated) {
                alert('ログインが必要です');
                window.location.href = 'index.html';
                return;
            }

            // サウンド初期化
            initSounds();
            initImages(); // 画像初期化を追加

            // ゲームループ開始（先に開始）
            gameLoop();

            // Firebase接続状態をチェック（非同期で実行）
            checkFirebaseConnection().then(() => {
                // マッチング開始
                startMatching();
            }).catch((error) => {
                console.error('Firebase接続エラー:', error);
                
                // クォータ制限エラーの場合はローカルマッチングを試す
                if (error.message === 'QUOTA_EXCEEDED') {
                    console.log('Firebaseクォータ制限のため、ローカルマッチングを試します。');
                    alert('Firebaseクォータ制限に達しています。ローカルマッチングを試します。');
                    startLocalMatching();
                } else {
                    // その他のエラーの場合はデモモードで開始
                    console.log('Firebase接続エラーのため、デモモードで開始します。');
                    startDemoMode();
                }
            });
        }

        // Firebase接続状態をチェック
        async function checkFirebaseConnection() {
            return new Promise((resolve, reject) => {
                const timeout = setTimeout(() => {
                    reject(new Error('Firebase接続タイムアウト'));
                }, 3000); // タイムアウトを3秒に短縮

                try {
                    // Firestoreの接続テスト（より軽量なテスト）
                    const testDoc = firebase.firestore().collection('pvp_rooms').limit(1);
                    testDoc.get().then(() => {
                        clearTimeout(timeout);
                        console.log('Firebase接続成功');
                        resolve();
                    }).catch((error) => {
                        clearTimeout(timeout);
                        console.error('Firebase接続エラー:', error);
                        
                        // クォータ制限エラーの場合は特別な処理
                        if (error.code === 'resource-exhausted') {
                            console.log('Firebaseクォータ制限に達しています。オフライン機能で開始します。');
                            reject(new Error('QUOTA_EXCEEDED'));
                        } else {
                            reject(error);
                        }
                    });
                } catch (error) {
                    clearTimeout(timeout);
                    reject(error);
                }
            });
        }

        // デモモード開始
        function startDemoMode() {
            console.log('デモモードで開始します');
            alert('ネットワーク接続に問題があります。デモモードで開始します。');
            
            isPlayer1 = true;
            roomId = 'demo-room';
            
            // 2秒後にゲーム開始
            setTimeout(() => {
                console.log('デモモードでゲームを開始します');
                startGame();
            }, 2000);
        }

        // GitHubベースのマッチング機能（認証なし版）
        async function startGitHubMatching() {
            console.log('GitHubベースのマッチングを開始します（認証なし版）');
            
            try {
                // GitHub Issues APIを使用してマッチング（認証なし）
                const response = await fetch('https://api.github.com/repos/tomonori-ryo/study-web-development/issues?labels=pvp-match&state=open');
                
                if (!response.ok) {
                    throw new Error(`GitHub API エラー: ${response.status}`);
                }
                
                const issues = await response.json();
                console.log('GitHub Issues:', issues);
                
                // 利用可能なルームを探す
                const availableRooms = issues.filter(issue => 
                    issue.title.includes('PvP Room') && 
                    !issue.title.includes('FULL')
                );
                
                if (availableRooms.length > 0) {
                    // 既存のルームに参加
                    const roomToJoin = availableRooms[0];
                    console.log('既存のGitHubルームに参加:', roomToJoin.title);
                    
                    isPlayer1 = false;
                    roomId = `github-${roomToJoin.number}`;
                    startGame();
                } else {
                    // 新しいルームを作成（認証なしのため、ローカルマッチングにフォールバック）
                    console.log('GitHub認証なしのため、ローカルマッチングに切り替え');
                    startLocalMatching();
                }
                
            } catch (error) {
                console.error('GitHubマッチングエラー:', error);
                // エラーの場合はローカルマッチングを試す
                console.log('GitHubマッチングが失敗したため、ローカルマッチングを試します');
                startLocalMatching();
            }
        }



        // ローカルストレージベースの簡易マッチング
        function startLocalMatching() {
            console.log('ローカルストレージベースのマッチングを開始します');
            
            // ローカルストレージでルーム情報を管理
            const roomKey = 'pvp_local_room';
            const existingRoom = localStorage.getItem(roomKey);
            
            if (existingRoom) {
                // 既存のルームに参加
                const roomData = JSON.parse(existingRoom);
                console.log('既存のローカルルームに参加:', roomData);
                
                isPlayer1 = false;
                roomId = `local-${roomData.id}`;
                
                // ルームを削除（満員）
                localStorage.removeItem(roomKey);
                
                // ゲーム開始
                startGame();
            } else {
                // 新しいルームを作成
                const roomData = {
                    id: Date.now(),
                    creator: localStorage.getItem('playerName') || 'Unknown',
                    createdAt: new Date().toISOString()
                };
                
                localStorage.setItem(roomKey, JSON.stringify(roomData));
                console.log('新しいローカルルームを作成:', roomData);
                
                isPlayer1 = true;
                roomId = `local-${roomData.id}`;
                
                // 相手を待つ（3秒後に自動開始）
                waitingForOpponent = true;
                statusMessageElement.textContent = '対戦相手を待っています...（3秒後に自動開始）';
                
                setTimeout(() => {
                    if (waitingForOpponent) {
                        console.log('相手が見つからないため、デモモードで開始します');
                        localStorage.removeItem(roomKey);
                        startDemoMode();
                    }
                }, 3000);
            }
        }

        // ゲーム開始
        init();
    </script>
