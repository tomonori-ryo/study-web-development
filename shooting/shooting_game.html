                player.x -= player.speed;
            }
            if ((keys['ArrowRight'] || keys['d'] || keys['D']) && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }
            if ((keys['ArrowUp'] || keys['w'] || keys['W']) && player.y > canvas.height * PLAYER_MAX_UP_RATIO) {
                player.y -= player.speed;
            }
            if ((keys['ArrowDown'] || keys['s'] || keys['S']) && player.y < canvas.height - player.height) {
                player.y += player.speed;
            }
            const pfx = playerFlamePrevFrameX;
            const pfy = playerFlamePrevFrameY;
            playerFlameLeadDx = player.x - (pfx != null ? pfx : player.x);
            playerFlameLeadDy = player.y - (pfy != null ? pfy : player.y);

            // 随伴機の自動射撃
            updateDrones();
            updateExplosionEffects();
            updateBossShockwaves();
            updateBossMines();
            updateBossMinions();

            // 弾丸更新（追尾・引力・シールド遮断もここで処理）
            bullets = bullets.filter(bullet => {
                // ライフタイマー（機雷など設置型用）
                if (bullet.lifeFrames !== null && bullet.lifeFrames !== undefined) {
                    bullet.lifeFrames--;
                    if (bullet.lifeFrames <= 0) {
                        // 自爆 = 起点で爆発（爆発プロパティを持つもののみ）
                        if (bullet.explodeOnImpact) {
                            applyExplosion(bullet.x + bullet.width / 2, bullet.y + bullet.height / 2,
                                           bullet.explodeOnImpact.radius, bullet.explodeOnImpact.damage,
                                           explosionOptsFromPlayerBullet(bullet));
                        }
                    }
                }

                // 追尾武器（ホーミング系）
                if (bullet.homing && bullet.homingForce > 0) {
                    const target = findNearestTarget(bullet.x, bullet.y);
                    if (target) steerBulletTowards(bullet, target, bullet.homingForce);
                }
                // 引力武器（重力弾系）
                if (bullet.pullRadius > 0 && bullet.pullForce > 0) {
                    applyGravityPull(bullet);
                }

                bullet.x += bullet.speedX;
                bullet.y += bullet.speedY;
                bullet.traveled += Math.hypot(bullet.speedX, bullet.speedY);

                // シールド武器・ブレード: 進行経路上の敵弾を破壊
                if (bullet.blocksBossBullets) {
                    for (let bi = bossBullets.length - 1; bi >= 0; bi--) {
                        if (checkCollision(bullet, bossBullets[bi])) {
                            bossBullets.splice(bi, 1);
                        }
                    }
                }

                // ボス機雷を撃って早期爆破できる（爆風はその場で発生）
                for (let mi = bossMines.length - 1; mi >= 0; mi--) {
                    if (checkCollision(bullet, bossMines[mi])) {
                        explodeBossMine(bossMines[mi]);
                        bossMines.splice(mi, 1);
                        return false;        // この弾は消費
                    }
                }

                // ボスの部下と当たる
                for (let mi = bossMinions.length - 1; mi >= 0; mi--) {
                    const mn = bossMinions[mi];
                    if (checkCollision(bullet, mn)) {
                        mn.health -= bullet.damage;
                        if (mn.health <= 0) {
                            score += mn.points;
                            scoreElement.textContent = `スコア: ${score}`;
                            spawnExplosionEffect(mn.x + mn.width / 2, mn.y + mn.height / 2, 40);
                            playSound(explosionSound);
                            bossMinions.splice(mi, 1);
                            // 全部下を倒したら吸収タイマーリセット
                            if (bossMinions.length === 0 && boss) {
                                boss.minionAbsorbStartAt = null;
                            }
                        }
                        bullet.pierceRemaining--;
                        if (bullet.pierceRemaining < 0) return false;
                    }
                }

                return bullet.y > -bullet.height && bullet.traveled < bullet.range;
            });

            // ボス弾丸更新
            bossBullets = bossBullets.filter(bullet => {
                if (bullet.isFlameTelegraph) {
                    if (boss && boss.isCosmicDragonMain) {
                        bullet.flameCy = boss.y + boss.height;
                    }
                    const done = Date.now() >= bullet.telegraphEndAt
                        || (bullet.lifeFrames !== undefined && bullet.lifeFrames <= 0);
                    if (done) {
                        activateBossDragonFlameBreathFromTelegraph(bullet);
                    } else if (bullet.lifeFrames !== undefined) {
                        bullet.lifeFrames -= 1;
                    }
                    if (bullet.isFlameTelegraph) return true;
                }
                if (bullet.isFlameBreath) {
                    if (bullet.lifeFrames !== undefined) {
                        bullet.lifeFrames -= 1;
                        if (bullet.lifeFrames <= 0) return false;
                    }
                    const left = bullet.flameColumnCenterX - bullet.flameColumnHalfWidth;
                    const right = bullet.flameColumnCenterX + bullet.flameColumnHalfWidth;
                    const top = bullet.flameCy;
                    const bottom = canvas.height;
                    const pl = player.x;
                    const pr = player.x + player.width;
                    const pt = player.y;
                    const pb = player.y + player.height;
                    const overlap = pr > left && pl < right && pb > top && pt < bottom;
                    if (overlap) {
                        const pcx = (pl + pr) * 0.5;
                        const pcy = (pt + pb) * 0.5;
                        if (isBossBulletBlockedByPlayerDefense(pcx, pcy)) {
                            const wall = Date.now();
                            if (wall - (bullet._lastFlameBarrierAbsorbWall || 0) > 280) {
                                bullet._lastFlameBarrierAbsorbWall = wall;
                                registerPlayerBarrierAbsorb(1);
                            }
                        } else {
                            const wall = Date.now();
                            if (wall - (bullet._lastFlameDmgWall || 0) > 280) {
                                bullet._lastFlameDmgWall = wall;
                                runTookDamage = true;
                                lives--;
                                if (lives < 0) lives = 0;
                                livesElement.textContent = `ライフ: ${lives}`;
                                runState.livesLost++;
                                recomputeUnlockedSlots();
                                playSound(explosionSound);
                                triggerPlayerHurtFeedback(1);
                                if (lives <= 0) gameOver('gameover');
                            }
                        }
                    }
                    return true;
                }
                let bcx = bullet.x + bullet.width / 2;
                let bcy = bullet.y + bullet.height / 2;
                if (isEnemyProjectileBlockedByPlayerDefense(bullet)) return false;
                // ホーミング: プレイヤーへ steer
                if (bullet.homing && bullet.homingForce > 0) {
                    steerBulletTowards(bullet, player, bullet.homingForce);
                }
                // 重力オーブ: 半径内のプレイヤーを引き寄せる（バリア中は引き寄せない）
                if (!isPlayerBarrierDeployed()
                    && bullet.isGravity && bullet.pullRadius > 0 && bullet.pullForce > 0) {
                    const cx = bullet.x + bullet.width / 2;
                    const cy = bullet.y + bullet.height / 2;
                    const pcx = player.x + player.width / 2;
                    const pcy = player.y + player.height / 2;
                    const dx = cx - pcx;
                    const dy = cy - pcy;
                    const dist = Math.hypot(dx, dy);
                    if (dist > 1 && dist < bullet.pullRadius) {
                        player.x += (dx / dist) * bullet.pullForce;
                        player.y += (dy / dist) * bullet.pullForce;
                        // 画面外に出ないようクランプ
                        player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
                        player.y = Math.max(canvas.height * PLAYER_MAX_UP_RATIO,
                                            Math.min(canvas.height - player.height, player.y));
                    }
                }
                bullet.x += bullet.speedX;
                bullet.y += bullet.speedY;
                bcx = bullet.x + bullet.width / 2;
                bcy = bullet.y + bullet.height / 2;
                if (isEnemyProjectileBlockedByPlayerDefense(bullet)) return false;
                // 寿命切れ
                if (bullet.lifeFrames !== undefined) {
                    bullet.lifeFrames -= 1;
                    if (bullet.lifeFrames <= 0) return false;
                }
                if (bullet.bulletStyle === 'bossSlash') {
                    return bcx > -220 && bcx < canvas.width + 220 && bcy > -220 && bcy < canvas.height + 220;
                }
                return bullet.y < canvas.height && bullet.x > -50 && bullet.x < canvas.width + 50;
            });

            // ボス更新
            if (boss) {
                const bossSlowFactor = (boss.slowedUntil && Date.now() < boss.slowedUntil) ? 0.4 : 1;

                if (boss.y < 50) {
                    boss.y += boss.speed * bossSlowFactor;
                }
                
                // ボスの横移動
                boss.x += boss.moveSpeed * boss.moveDirection * bossSlowFactor;
                
                // 画面端で方向転換
                if (boss.x <= 0 || boss.x + boss.width >= canvas.width) {
                    boss.moveDirection *= -1;
                }
                
                // ボスの攻撃
                const now = Date.now();
                const isSniper = hasBossFeature(boss, 'sniper');
                if (isSniper) {
                    const since = now - boss.lastShot;
                    // 発射の BOSS_SNIPER_CHARGE_MS 前にターゲットをロックして照準表示
                    if (!boss.sniperLocked && since >= boss.shotInterval - BOSS_SNIPER_CHARGE_MS) {
                        boss.sniperLocked = true;
                        boss.sniperTargetX = player.x + player.width / 2;
                        boss.sniperTargetY = player.y + player.height / 2;
                    }
                    if (since >= boss.shotInterval) {
                        bossSnipeShot(boss.sniperTargetX, boss.sniperTargetY);
                        boss.sniperLocked = false;
                        boss.lastShot = now;
                    }
                } else {
                    const holdCosmicFlame = boss.isCosmicDragonMain && cosmicDragonFlameSequenceActive();
                    if (!holdCosmicFlame && now - boss.lastShot > boss.shotInterval) {
                    bossShoot();
                    boss.lastShot = now;
                    }
                }

                // メイン星獣: 中級から小型ドラゴンを定期召喚、上級はボスが定期的にHP回復
                if (boss.isCosmicDragonMain && COSMIC_DRAGON_STAR_RANK >= 2) {
                    if (boss.lastCosmicSummonAt == null) boss.lastCosmicSummonAt = now;
                    const summonEvery = COSMIC_DRAGON_STAR_RANK >= 3 ? 3800 : 4800;
                    if (now - boss.lastCosmicSummonAt >= summonEvery) {
                        boss.lastCosmicSummonAt = now;
                        spawnCosmicMiniDragonSwarm();
                    }
                }
                if (boss.isCosmicDragonMain && COSMIC_DRAGON_STAR_RANK === 3) {
                    if (boss.lastCosmicRegenAt == null) boss.lastCosmicRegenAt = now;
                    if (now - boss.lastCosmicRegenAt >= 4500) {
                        boss.lastCosmicRegenAt = now;
                        const regen = Math.max(4, Math.round(boss.maxHealth * 0.018));
                        boss.health = Math.min(boss.maxHealth, boss.health + regen);
                    }
                }

                // 部下吸収(Lv.9+): 8秒経過後に最寄りの部下を引き寄せ、接触で全回復
                if (hasBossFeature(boss, 'minions') && bossMinions.length > 0) {
                    if (boss.minionAbsorbStartAt === null) {
                        boss.minionAbsorbStartAt = now + BOSS_MINION_ABSORB_DELAY_MS;
                    }
                    if (now >= boss.minionAbsorbStartAt) {
                        let target = null, bestDist = Infinity;
                        for (const m of bossMinions) {
                            const dx2 = (m.x + m.width/2) - (boss.x + boss.width/2);
                            const dy2 = (m.y + m.height/2) - (boss.y + boss.height/2);
                            const d2 = dx2*dx2 + dy2*dy2;
                            if (d2 < bestDist) { bestDist = d2; target = m; }
                        }
                        if (target) {
                            target.beingAbsorbed = true;
                            const dx = (boss.x + boss.width/2) - (target.x + target.width/2);
                            const dy = (boss.y + boss.height/2) - (target.y + target.height/2);
                            const len = Math.hypot(dx, dy) || 1;
                            target.x += dx / len * BOSS_MINION_PULL_FORCE;
                            target.y += dy / len * BOSS_MINION_PULL_FORCE;
                            if (checkCollision(boss, target)) {
                                // 吸収成立 → 全回復
                                boss.health = boss.maxHealth;
                                spawnExplosionEffect(target.x + target.width/2, target.y + target.height/2, 60);
                                playSound(explosionSound);
                                const consumedLevel = target.level;
                                const consumedSlot = target.slotIndex;
                                bossMinions = bossMinions.filter(m => m !== target);
                                boss.minionAbsorbStartAt = null;
                                bossWarningElement.textContent = '⚠️ 部下が吸収されてHP全回復！ 部下が再展開！ ⚠️';
                                bossWarningElement.style.display = 'block';
                                setTimeout(() => { bossWarningElement.style.display = 'none'; }, 2500);
                                // 吸収で消えた部下のみ再生成（プレイヤー撃破では再生成しない）
                                spawnSingleBossMinion(consumedLevel, consumedSlot);
                            }
                        }
                    }
                } else if (boss) {
                    boss.minionAbsorbStartAt = null;
                }

                // 吸収: Lv.7(=3000点)以上で、最寄りの雑魚を引き寄せて HP 回復
                if (hasBossFeature(boss, 'absorption') && enemies.length > 0) {
                    const bcx = boss.x + boss.width / 2;
                    const bcy = boss.y + boss.height / 2;
                    // ターゲット選択（毎フレーム再選択。最寄り 1 体のみ吸引）
                    let target = null, bestDist = BOSS_ABSORB_RANGE;
                    for (const e of enemies) {
                        const dist = Math.hypot(e.x + e.width/2 - bcx, e.y + e.height/2 - bcy);
                        if (dist < bestDist) { bestDist = dist; target = e; }
                    }
                    if (target) {
                        boss._absorbTarget = target;
                        const dx = bcx - (target.x + target.width / 2);
                        const dy = bcy - (target.y + target.height / 2);
                        const len = Math.hypot(dx, dy) || 1;
                        // 重力的に吸引（敵自身の移動を打ち消すレベル）
                        target.x += (dx / len) * BOSS_ABSORB_PULL_FORCE;
                        target.y += (dy / len) * BOSS_ABSORB_PULL_FORCE;
                        // ボスとの衝突で吸収（クールダウンあり）
                        if (now - (boss.lastAbsorbAt || 0) >= BOSS_ABSORB_COOLDOWN_MS &&
                            checkCollision(boss, target)) {
                            const heal = Math.max(BOSS_ABSORB_MIN_HEAL,
                                                  Math.floor((target.points || 10) * BOSS_ABSORB_HEAL_RATIO));
                            boss.health = Math.min(boss.maxHealth, boss.health + heal);
                            boss.lastAbsorbAt = now;
                            // 吸収エフェクト（既存の expanding ring を流用）
                            spawnExplosionEffect(target.x + target.width / 2,
                                                 target.y + target.height / 2, 26);
                            // 雑魚を消滅させる
                            const idx = enemies.indexOf(target);
                            if (idx !== -1) enemies.splice(idx, 1);
                            boss._absorbTarget = null;
                            playSound(explosionSound);
                        }
                    } else {
                        boss._absorbTarget = null;
                    }
                } else if (boss) {
                    boss._absorbTarget = null;
                }

                // 機雷設置: Lv.8(=4000点)以上で、4秒に1個ボスから投下し画面下半分に着地
                if (hasBossFeature(boss, 'mines')) {
                    if (now - (boss.lastMineDropAt || 0) >= BOSS_MINE_DROP_COOLDOWN_MS) {
                        boss.lastMineDropAt = now;
                        const targetY = canvas.height * (
                            BOSS_MINE_TARGET_Y_MIN_RATIO +
                            Math.random() * (BOSS_MINE_TARGET_Y_MAX_RATIO - BOSS_MINE_TARGET_Y_MIN_RATIO)
                        );
                        bossMines.push({
                            x: boss.x + boss.width / 2 - BOSS_MINE_SIZE / 2,
                            y: boss.y + boss.height,
                            vx: (Math.random() - 0.5) * BOSS_MINE_HORIZONTAL_DRIFT,
                            vy: BOSS_MINE_FALL_SPEED,
                            targetY: targetY,
                            settled: false,
                            size: BOSS_MINE_SIZE,
                            width: BOSS_MINE_SIZE,         // checkCollision 用
                            height: BOSS_MINE_SIZE,
                            spawnedAt: now,
                            expiresAt: now + BOSS_MINE_LIFE_MS,
                            triggered: false
                        });
                    }
                }

                // 衝撃波: Lv.5(=2000点)以上で、プレイヤーが一定距離内に入ったら発動
                if (hasBossFeature(boss, 'shockwave')) {
                    const bcx = boss.x + boss.width / 2;
                    const bcy = boss.y + boss.height / 2;
                    const pcx = player.x + player.width / 2;
                    const pcy = player.y + player.height / 2;
                    const dist = Math.hypot(pcx - bcx, pcy - bcy);
                    if (dist < BOSS_SHOCKWAVE_TRIGGER_DIST &&
                        now - (boss.lastShockwaveAt || 0) >= BOSS_SHOCKWAVE_COOLDOWN_MS) {
                        boss.lastShockwaveAt = now;
                        bossShockwaves.push({
                            cx: bcx, cy: bcy,
                            radius: 0,
                            expandSpeed: BOSS_SHOCKWAVE_EXPAND_SPEED * speedMultiplier,
                            maxRadius: BOSS_SHOCKWAVE_MAX_RADIUS,
                            thickness: BOSS_SHOCKWAVE_THICKNESS,
                            chargeUntil: now + BOSS_SHOCKWAVE_CHARGE_MS,
                            hit: false,
                            damage: BOSS_SHOCKWAVE_DAMAGE_LIVES
                        });
                    }
                }
                
                // プレイヤーとの衝突
                if (checkCollision(boss, player)) {
                    runTookDamage = true;
                    lives--;
                    if (lives < 0) lives = 0;
                    livesElement.textContent = `ライフ: ${lives}`;
                    runState.livesLost++;
                    recomputeUnlockedSlots();
                    triggerPlayerHurtFeedback(1);
                    if (lives <= 0) {
                        gameOver('gameover');
                    }
                }
            }

            // 星獣襲来: 星核防衛フェーズ（眷属の攻防・シールド・30秒制限）
            if (cosmicDragonPhase === 'coa') {
                const nowG = Date.now();
                const co = cosmicCoaTarget;
                const coacx = co ? co.x + co.width / 2 : canvas.width / 2;
                const coacy = co ? co.y + co.height / 2 : 90;
                const pcx = player.x + player.width / 2;
                const pcy = player.y + player.height / 2;
                if (cosmicGuardianBosses.length > 0) {
                    let gi = 0;
                    while (gi < cosmicGuardianBosses.length) {
                        const g = cosmicGuardianBosses[gi];
                        const slowG = (g.slowedUntil && Date.now() < g.slowedUntil) ? 0.45 : 1;
                        const gcx = g.x + g.width / 2;
                        const gcy = g.y + g.height / 2;
                        const tang = Math.atan2(coacx - gcx, coacy - gcy);
                        g.x += (Math.sin(tang) * 0.52 * speedMultiplier + g.vx) * slowG;
                        g.y += (Math.cos(tang) * 0.36 * speedMultiplier + g.vy) * slowG;
                        const blockx = (coacx + pcx) * 0.5;
                        const blocky = (coacy + pcy) * 0.5;
                        const tbx = blockx - gcx;
                        const tby = blocky - gcy;
                        const tbl = Math.hypot(tbx, tby) || 1;
                        g.x += (tbx / tbl) * 0.36 * slowG;
                        g.y += (tby / tbl) * 0.24 * slowG;
                        if (g.x < 8) { g.x = 8; g.vx = Math.abs(g.vx); }
                        if (g.x + g.width > canvas.width - 8) { g.x = canvas.width - 8 - g.width; g.vx = -Math.abs(g.vx); }
                        if (g.y < 72) { g.y = 72; g.vy = Math.abs(g.vy); }
                        if (g.y > canvas.height * 0.44) { g.y = canvas.height * 0.44; g.vy = -Math.abs(g.vy); }
                        if (nowG > g.lastShot + g.shotInterval) {
                            g.lastShot = nowG;
                            fireCosmicGuardianShot(g);
                        }
                        if (nowG > (g.nextShieldAt || 0)) {
                            g.nextShieldAt = nowG + 2680 + Math.random() * 920;
                            spawnCosmicGuardianShieldOrb(g);
                        }
                        if (isGruntNeutralizedByPlayerDefense(g.x, g.y, g.width, g.height)) {
                            spawnExplosionEffect(g.x + g.width / 2, g.y + g.height / 2, 28);
                            playSound(explosionSound);
                            cosmicGuardianBosses.splice(gi, 1);
                            continue;
                        }
                        if (checkCollision(g, player)) {
                            runTookDamage = true;
                            lives--;
                            if (lives < 0) lives = 0;
                            livesElement.textContent = `ライフ: ${lives}`;
                            runState.livesLost++;
                            recomputeUnlockedSlots();
                            triggerPlayerHurtFeedback(1);
                            if (lives <= 0) gameOver('gameover');
                        }
                        gi++;
                    }
                }
                updateCosmicCoaShieldsAndDeadline();
            }

            // 敵更新
            enemies = enemies.filter(enemy => {
                const slowFactor = (enemy.slowedUntil && Date.now() < enemy.slowedUntil) ? 0.4 : 1;
                enemy.y += enemy.speed * slowFactor;

                if (isGruntNeutralizedByPlayerDefense(enemy.x, enemy.y, enemy.width, enemy.height)) {
                    spawnExplosionEffect(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, 22);
                    playSound(explosionSound);
                    return false;
                }
                
                // プレイヤーとの衝突
                if (checkCollision(enemy, player)) {
                    runTookDamage = true;
                    lives--;
                    livesElement.textContent = `ライフ: ${lives}`;
                    runState.livesLost++;
                    recomputeUnlockedSlots();
                    triggerPlayerHurtFeedback(1);
                    if (lives <= 0) {
                        gameOver('gameover');
                    }
                    return false;
                }
                
                return enemy.y < canvas.height;
            });

            // 弾丸と敵・ボスの衝突
            for (let bulletIndex = bullets.length - 1; bulletIndex >= 0; bulletIndex--) {
                const bullet = bullets[bulletIndex];
                let bulletRemoved = false;

                // 星核防衛: シールドが弾を消費（コアへの攻撃を無効化）
                if (cosmicDragonPhase === 'coa' && !bulletRemoved) {
                    for (let si = cosmicCoreShields.length - 1; si >= 0; si--) {
                        const s = cosmicCoreShields[si];
                        if (!cosmicBulletHitsShieldOrb(bullet, s)) continue;
                        spawnExplosionEffect(bullet.x + bullet.width / 2, bullet.y + bullet.height / 2, 12);
                        playSound(explosionSound);
                        cosmicCoreShields.splice(si, 1);
                        if (bullet.pierceRemaining > 0) {
                            bullet.pierceRemaining--;
                        } else {
                        bullets.splice(bulletIndex, 1);
                            bulletRemoved = true;
                        }
                        break;
                    }
                }
                if (bulletRemoved) continue;

                // 星核（コア）へのダメージ
                if (cosmicDragonPhase === 'coa' && cosmicCoaTarget && cosmicCoaTarget.health != null && !bulletRemoved) {
                    if (checkCollision(bullet, cosmicCoaTarget)) {
                        cosmicCoaTarget.health -= bullet.damage;
                        if (cosmicCoaTarget.health < 0) cosmicCoaTarget.health = 0;
                        if (bullet.explodeOnImpact) {
                            applyExplosion(bullet.x + bullet.width / 2, bullet.y + bullet.height / 2,
                                           bullet.explodeOnImpact.radius, bullet.explodeOnImpact.damage,
                                           explosionOptsFromPlayerBullet(bullet));
                        }
                        if (bullet.pierceRemaining > 0) {
                            bullet.pierceRemaining--;
                        } else {
                            bullets.splice(bulletIndex, 1);
                            bulletRemoved = true;
                        }
                        tryFinishCosmicCoaIfCoreDestroyed();
                    }
                }
                if (bulletRemoved) continue;

                for (let enemyIndex = enemies.length - 1; enemyIndex >= 0; enemyIndex--) {
                    const enemy = enemies[enemyIndex];
                    if (!checkCollision(bullet, enemy)) continue;

                    // スロー（時空弾系）
                    if (bullet.slowOnHitMs > 0) applySlowToTarget(enemy, bullet.slowOnHitMs);

                    enemy.health -= bullet.damage;
                    if (enemy.health <= 0) {
                        enemies.splice(enemyIndex, 1);
                        score += enemy.points;
                        scoreElement.textContent = `スコア: ${score}`;
                        playSound(explosionSound);
                        runState.enemyKillCount++;
                        // scoreReached / enemyKillCount 系トリガーに備えて再評価
                        recomputeUnlockedSlots();
                    }

                    // 範囲爆発（ランチャー / 機雷）
                    if (bullet.explodeOnImpact) {
                        applyExplosion(bullet.x + bullet.width / 2, bullet.y + bullet.height / 2,
                                       bullet.explodeOnImpact.radius, bullet.explodeOnImpact.damage,
                                       explosionOptsFromPlayerBullet(bullet));
                    }

                    if (bullet.pierceRemaining > 0) {
                        bullet.pierceRemaining--;
                    } else {
                    bullets.splice(bulletIndex, 1);
                        bulletRemoved = true;
                        break;
                    }
                }

                if (bulletRemoved) continue;

                // 弾丸とボスの衝突（星骸ドラゴン: バリア中は本体・円内ともダメージなし。攻撃発動中のみバリア解除）
                if (boss) {
                    const barrierBlockR = boss.isCosmicDragonMain
                        ? getCosmicDragonBarrierBlockRadius(boss)
                        : (boss.barrierRadius || 0);
                    const hullHit = checkCollision(bullet, boss);
                    if (!hullHit && barrierBlockR > 0) {
                        const bcxo = boss.x + boss.width / 2;
                        const bcyo = boss.y + boss.height / 2;
                        const bx = bullet.x + bullet.width / 2;
                        const by = bullet.y + bullet.height / 2;
                        if (Math.hypot(bx - bcxo, by - bcyo) < barrierBlockR) {
                            if (bullet.pierceRemaining > 0) {
                                bullet.pierceRemaining--;
                            } else {
                                bullets.splice(bulletIndex, 1);
                                bulletRemoved = true;
                            }
                            continue;
                        }
                    }
                    if (hullHit) {
                        if (boss.isCosmicDragonMain && barrierBlockR > 0) {
                            if (bullet.pierceRemaining > 0) {
                                bullet.pierceRemaining--;
                            } else {
                                bullets.splice(bulletIndex, 1);
                                bulletRemoved = true;
                            }
                            continue;
                        }
                        if (bullet.slowOnHitMs > 0) applySlowToTarget(boss, bullet.slowOnHitMs);

                        boss.health -= bullet.damage;

                        if (bullet.explodeOnImpact) {
                            applyExplosion(bullet.x + bullet.width / 2, bullet.y + bullet.height / 2,
                                           bullet.explodeOnImpact.radius, bullet.explodeOnImpact.damage,
                                           explosionOptsFromPlayerBullet(bullet));
                        }

                        if (bullet.pierceRemaining > 0) {
                            bullet.pierceRemaining--;
                        } else {
                            bullets.splice(bulletIndex, 1);
                            bulletRemoved = true;
                        }
                    
                    if (boss.health <= 0) {
                            const eventWeaponRewardKey = (boss.eventWeaponRewardKey && String(boss.eventWeaponRewardKey).trim()) || '';
                            const wasCosmicMain = !!boss.isCosmicDragonMain;
                        score += boss.points;
                        scoreElement.textContent = `スコア: ${score}`;
                        
                            if (isEventMode && boss.eventBossIndex >= 0) {
                                const skipSkinForCosmicMain = boss.isCosmicDragonMain && EVENT_URL_SLUG === 'cosmic-dragon';
                                if (!skipSkinForCosmicMain) {
                                    grantEventSkin(boss.eventBossIndex);
                                    updateEventBanner();
                                }
                            }

                            try {
                                if (typeof firebaseDataManager !== 'undefined'
                                    && typeof firebase !== 'undefined'
                                    && firebase.auth && firebase.auth().currentUser) {
                                    firebaseDataManager.updateProgress({ maxBossLevelDefeated: bossLevel })
                                        .catch(() => {});
                                }
                            } catch (e) { /* ignore */ }

                            if (!wasCosmicMain) {
                        treasureBox = {
                                    x: boss.x + boss.width / 2 - 25,
                                    y: canvas.height / 2,
                            width: 50,
                            height: 50,
                                    speed: 0,
                                    color: '#ffd700',
                            isCollected: false
                        };
                            }
                        
                            const defeatedLevel = bossLevel;
                        boss = null;
                        bossSpawned = false;
                            bossMinions.forEach(m => spawnExplosionEffect(m.x + m.width / 2, m.y + m.height / 2, 35));
                            bossMinions = [];
                            playSound(bossExplosionSound);

                            const unlockedList = handleBossDefeated(defeatedLevel);
                            if (unlockedList.length > 0) {
                                const equippedNow = unlockedList.filter(w => equippedWeaponIds.includes(w.id));
                                const onlyMeta = unlockedList.filter(w => !equippedWeaponIds.includes(w.id));

                                if (loadoutMode === 'guest') {
                                    weaponMessage = equippedNow.length > 0
                                        ? `${equippedNow.map(w => w.name).join('・')}を解放！`
                                        : 'ボス撃破！';
                                } else if (equippedNow.length > 0 && onlyMeta.length === 0) {
                                    weaponMessage = `${equippedNow.map(w => w.name).join('・')}が今すぐ使えます！`;
                                } else if (equippedNow.length === 0 && onlyMeta.length > 0) {
                                    weaponMessage = `${onlyMeta.map(w => w.name).join('・')}が装備可能に！マイページで編成しよう`;
                                } else {
                                    weaponMessage = `${equippedNow.map(w => w.name).join('・')}が使用可！他${onlyMeta.length}種が装備可能に`;
                                }
                            } else {
                                weaponMessage = 'ボス撃破！';
                            }
                            const metaWeaponNew = grantMetaWeaponUnlock(eventWeaponRewardKey);
                            if (metaWeaponNew) {
                                weaponMessage = `${weaponMessage} ／ 🎁 新武器が解放（マイページで装備）`;
                            }
                            weaponMessageTimer = metaWeaponNew ? 280 : 180;
                            if (wasCosmicMain) {
                                startCosmicDragonCoaPhase();
                                weaponMessage = `${weaponMessage} ／ 星核を巡る最終フェーズ！`;
                                weaponMessageTimer = Math.max(weaponMessageTimer, 260);
                            }
                            updateWeaponSelector();
                        }
                    }
                }

                if (!bulletRemoved && cosmicDragonPhase === 'coa') {
                    for (let gi = cosmicGuardianBosses.length - 1; gi >= 0; gi--) {
                        const g = cosmicGuardianBosses[gi];
                        if (!checkCollision(bullet, g)) continue;
                        if (bullet.slowOnHitMs > 0) applySlowToTarget(g, bullet.slowOnHitMs);
                        g.health -= bullet.damage;
                        if (bullet.explodeOnImpact) {
                            applyExplosion(bullet.x + bullet.width / 2, bullet.y + bullet.height / 2,
                                           bullet.explodeOnImpact.radius, bullet.explodeOnImpact.damage,
                                           explosionOptsFromPlayerBullet(bullet));
                        }
                        if (bullet.pierceRemaining > 0) {
                            bullet.pierceRemaining--;
                        } else {
                            bullets.splice(bulletIndex, 1);
                            bulletRemoved = true;
                        }
                        if (g.health <= 0) {
                            spawnExplosionEffect(g.x + g.width / 2, g.y + g.height / 2, 38);
                            playSound(explosionSound);
                            cosmicGuardianBosses.splice(gi, 1);
                        }
                        break;
                    }
                }
            }

            // ボス弾丸とプレイヤーの衝突
            bossBullets.forEach((bullet, bulletIndex) => {
                if (bullet.isFlameBreath || bullet.isFlameTelegraph) return;
                const bcx = bullet.x + bullet.width / 2;
                const bcy = bullet.y + bullet.height / 2;
                if (isEnemyProjectileBlockedByPlayerDefense(bullet)) {
                    bossBullets.splice(bulletIndex, 1);
                    return;
                }
                if (checkCollision(bullet, player)) {
                    bossBullets.splice(bulletIndex, 1);
                    if (bullet.isSniper) {
                        runTookDamage = true;
                        if (isEventMode) {
                            // イベント: 即死ではなくライフを複数個分だけ減らす
                            const dmg = Math.min(EVENT_BOSS_SNIPER_DAMAGE_LIVES, lives);
                            lives -= dmg;
                            if (lives < 0) lives = 0;
                            runState.livesLost += dmg;
                    livesElement.textContent = `ライフ: ${lives}`;
                            playSound(explosionSound);
                            spawnExplosionEffect(player.x + player.width / 2, player.y + player.height / 2, 60);
                            recomputeUnlockedSlots();
                            shockwaveFlashUntil = Date.now() + BOSS_SHOCKWAVE_FLASH_MS;
                            triggerPlayerHurtFeedback(dmg);
                            if (lives <= 0) gameOver('gameover');
                        } else {
                            // 通常: 狙撃弾は 1 発で即死
                            const lethal = lives;
                            lives = 0;
                            runState.livesLost += lethal;
                            livesElement.textContent = `ライフ: 0`;
                            playSound(explosionSound);
                            triggerPlayerHurtFeedback(Math.max(1, lethal));
                            spawnExplosionEffect(player.x + player.width / 2, player.y + player.height / 2, 60);
                        gameOver('gameover');
                        }
                    } else {
                        runTookDamage = true;
                        lives--;
                        if (lives < 0) lives = 0;
                        livesElement.textContent = `ライフ: ${lives}`;
                        runState.livesLost++;
                        recomputeUnlockedSlots();
                        triggerPlayerHurtFeedback(1);
                        if (lives <= 0) gameOver('gameover');
                    }
                }
            });

            // 宝箱生成チェック（ランダム生成は削除）
            // 宝箱はボス撃破時のみ生成される

            // 宝箱更新（固定位置なので移動しない）
            // 宝箱は固定位置に配置されるため、移動処理は不要

            // プレイヤーと宝箱の衝突
            if (treasureBox && checkCollision(player, treasureBox)) {
                treasureBox.isCollected = true;
                refillAllAmmoToMax();
                updateAmmoHud();
                updateWeaponSelector();
                playSound(pickupSound); // 宝箱取得音（薬莢SE）
                treasureBox = null; // 宝箱を消去
            }

            // 支援物資更新
            supplyUnits = supplyUnits.filter(unit => {
                unit.y += 1; // ゆっくり落下
                if (unit.y > canvas.height) {
                    return false; // 画面外に出たら消去
                }
                // プレイヤーとの衝突判定
                if (checkCollision(unit, player)) {
                    unit.isCollected = true;
                    addSupplyAmmoToAll(20); // 全武器に+20（各最大値で頭打ち）
                    if (barrierRearmSupplyPickupsNeeded > 0) barrierRearmSupplyPickupsNeeded--;
                    runState.suppliesCollected = (runState.suppliesCollected || 0) + 1;
                    recomputeUnlockedSlots();
                    updateAmmoHud();
                    updateWeaponSelector();
                    playSound(pickupSound); // 補給取得音（薬莢SE）
                    return false; // 画面外に出たら消去
                }
                return true;
            });
            
            // ライフ回復アイテム更新
            healthItems = healthItems.filter(item => {
                item.y += 1; // ゆっくり落下
                if (item.y > canvas.height) {
                    return false; // 画面外に出たら消去
                }
                // プレイヤーとの衝突判定
                if (checkCollision(item, player)) {
                    item.isCollected = true;
                    if (lives < 3) { // 最大ライフは3
                        lives++;
                        livesElement.textContent = `ライフ: ${lives}`;
                    }
                    playSound(healSound); // ライフ回復取得音（回復魔法SE）
                    return false; // 画面外に出たら消去
                }
                return true;
            });

            // ボス生成チェック
            spawnBoss();
            
            // 敵生成
            spawnEnemy();

            // 支援物資生成
            spawnSupplyUnits();
            
            // ライフ回復アイテム生成
            spawnHealthItems();

            if (cosmicDragonPhase === 'coa' && cosmicCoaDeadlineAt && Date.now() >= cosmicCoaDeadlineAt
                && cosmicCoaTarget && cosmicCoaTarget.health != null && cosmicCoaTarget.health > 0) {
                performCosmicCoreAbsorbAndReviveBoss();
            }

            playerFlamePrevFrameX = player.x;
            playerFlamePrevFrameY = player.y;
        }

        // ゲーム描画
        function drawCosmicDragonCoaPhase() {
            if (cosmicDragonPhase !== 'coa' || !cosmicCoaTarget) return;
            const c = cosmicCoaTarget;
            const img = getDoragonCoaImage();
            ctx.save();
            if (img && img.complete && img.naturalWidth > 0) {
                ctx.shadowColor = '#cc99ff';
                ctx.shadowBlur = 20;
                ctx.drawImage(img, c.x, c.y, c.width, c.height);
                ctx.shadowBlur = 0;
            } else {
                ctx.fillStyle = '#553388';
                ctx.fillRect(c.x, c.y, c.width, c.height);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 15px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('CORE', c.x + c.width / 2, c.y + c.height / 2 + 5);
            }
            ctx.restore();
            cosmicCoreShields.forEach(s => {
                ctx.save();
                ctx.fillStyle = 'rgba(100, 210, 255, 0.28)';
                ctx.strokeStyle = 'rgba(200, 255, 255, 0.82)';
                ctx.lineWidth = 2.2;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            });
            if (c.maxHealth != null && c.health != null) {
                const hr = Math.max(0, c.health / c.maxHealth);
                ctx.fillStyle = 'rgba(0,0,0,0.55)';
                ctx.fillRect(c.x, c.y + c.height + 5, c.width, 7);
                ctx.fillStyle = hr > 0.35 ? '#44ff99' : '#ff6644';
                ctx.fillRect(c.x, c.y + c.height + 5, c.width * hr, 7);
            }
            if (cosmicCoaDeadlineAt) {
                const rem = Math.max(0, Math.ceil((cosmicCoaDeadlineAt - Date.now()) / 1000));
                ctx.fillStyle = rem <= 8 ? '#ff8888' : '#e8f4ff';
                ctx.font = 'bold 17px Arial';
                ctx.textAlign = 'right';
                ctx.fillText(`星核撃破まで ${rem} 秒`, canvas.width - 10, 26);
                ctx.textAlign = 'left';
            }
            cosmicGuardianBosses.forEach(g => {
                const img = getMinidragonEnemyImage();
                if (img && img.complete && img.naturalWidth > 0) {
                    ctx.save();
                    ctx.shadowColor = '#ff8866';
                    ctx.shadowBlur = 8;
                    ctx.drawImage(img, g.x, g.y, g.width, g.height);
                    ctx.shadowBlur = 0;
                    ctx.restore();
                } else {
                    drawBossArtwork(g.x, g.y, g.width, g.height, g.level || 6, { eventBossIndex: 0 });
                }
                const hpRatio = Math.max(0, g.health / g.maxHealth);
                ctx.fillStyle = 'rgba(0,0,0,0.55)';
                ctx.fillRect(g.x, g.y - 8, g.width, 5);
                ctx.fillStyle = hpRatio > 0.35 ? '#00ff66' : '#ff4444';
                ctx.fillRect(g.x, g.y - 8, g.width * hpRatio, 5);
            });
        }

        function draw() {
            // 背景クリア
            ctx.fillStyle = '#001122';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 星の背景
            ctx.fillStyle = '#ffffff';
            for (let i = 0; i < 50; i++) {
                ctx.fillRect(
                    (i * 37) % canvas.width,
                    (i * 73) % canvas.height,
                    1, 1
                );
            }

            drawPlayer();
            drawPlayerBarrier();
            drawPlayerDirectionalShield();
            drawDrones();
            drawBullets();
            drawBossBullets();
            drawEnemies();
            drawBoss();
            drawBossMinions();
            drawCosmicDragonCoaPhase();
            drawBossShockwaves();
            drawBossMines();
            drawMinionAbsorbWarning();
            drawExplosionEffects();
            
            // 宝箱の描画
            if (treasureBox) {
                const x = treasureBox.x;
                const y = treasureBox.y;
                const w = treasureBox.width;
                const h = treasureBox.height;
                
                // 宝箱の本体（金色）
                ctx.fillStyle = treasureBox.color;
                ctx.shadowColor = treasureBox.color;
                ctx.shadowBlur = 10;
                ctx.fillRect(x, y, w, h);
                ctx.shadowBlur = 0;
                
                // 宝箱の蓋
                ctx.fillStyle = '#ffed4e';
                ctx.fillRect(x + w/6, y, 2*w/3, h/4);
                
                // 宝箱の鍵穴
                ctx.fillStyle = '#000000';
                ctx.fillRect(x + w/2 - 3, y + h/2 - 3, 6, 6);
                
                // 宝箱の装飾
                ctx.strokeStyle = '#ffed4e';
                ctx.lineWidth = 2;
                ctx.strokeRect(x + 5, y + 5, w - 10, h - 10);
                
                // 宝箱の説明
                ctx.fillStyle = '#ffffff';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('弾薬満タン', x + w/2, y + h + 15);
            }

            // 支援物資の描画
            supplyUnits.forEach(unit => {
                const x = unit.x;
                const y = unit.y;
                const w = unit.width;
                const h = unit.height;

                ctx.fillStyle = unit.color;
                ctx.shadowColor = unit.color;
                ctx.shadowBlur = 5;
                ctx.fillRect(x, y, w, h);
                ctx.shadowBlur = 0;

                // 補給マーク
                ctx.fillStyle = '#ffffff';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('+', x + w/2, y + h/2 + 5);

                // 補給表示
                ctx.fillStyle = '#00ff00';
                ctx.font = '12px Arial';
                ctx.fillText('補給', x + w/2, y + h + 15);
            });
            
            // ライフ回復アイテムの描画
            healthItems.forEach(item => {
                const x = item.x;
                const y = item.y;
                const w = item.width;
                const h = item.height;

                ctx.fillStyle = item.color;
                ctx.shadowColor = item.color;
                ctx.shadowBlur = 8;
                ctx.fillRect(x, y, w, h);
                ctx.shadowBlur = 0;

                // ハートマーク
                ctx.fillStyle = '#ffffff';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('♥', x + w/2, y + h/2 + 5);

                // ライフ回復表示
                ctx.fillStyle = '#ff69b4';
                ctx.font = '12px Arial';
                ctx.fillText('ライフ', x + w/2, y + h + 15);
            });

            // 通知メッセージのスタック描画
            // 複数の通知が同時にアクティブな場合、画面中央上部から順に縦に積んで
            // 重ならないように表示する。優先度（描画順）は以下:
            //   1. 武器解禁 / ボス撃破（水色・24px） — 最も重要
            //   2. 時間ボーナス（緑・24px）
            //   3. 武器変更 / エラー（黄色・20px） — 低優先・短時間
            const notifications = [];
            if (weaponMessageTimer > 0) {
                notifications.push({ text: weaponMessage, color: '#00ffff', size: 24 });
            }
            if (timeBonusTimer > 0) {
                notifications.push({ text: timeBonusMessage, color: '#00ff00', size: 24 });
            }
            if (weaponChangeTimer > 0) {
                notifications.push({ text: weaponChangeMessage, color: '#ffff00', size: 20 });
            }

            const NOTIF_BASE_Y = canvas.height / 2 - 60;
            const NOTIF_LINE_HEIGHT = 36;
            notifications.forEach((n, idx) => {
                ctx.fillStyle = n.color;
                ctx.font = `${n.size}px Arial`;
                ctx.textAlign = 'center';
                ctx.shadowColor = '#000000';
                ctx.shadowBlur = 4;
                ctx.fillText(n.text, canvas.width / 2, NOTIF_BASE_Y + idx * NOTIF_LINE_HEIGHT);
                ctx.shadowBlur = 0;
            });

            // 被弾の短い赤フラッシュ（ライフ減少時・全モード共通）
            const hurtRem = playerHurtFlashEndAt - Date.now();
            if (hurtRem > 0) {
                const a = 0.14 * Math.min(1, hurtRem / PLAYER_HURT_FLASH_MS);
                ctx.save();
                ctx.fillStyle = `rgba(255, 35, 45, ${a})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.restore();
            }

            // タイマー減算は描画位置に関わらず常時行う
            if (timeBonusTimer > 0) timeBonusTimer--;
            if (weaponMessageTimer > 0) weaponMessageTimer--;
            if (weaponChangeTimer > 0) weaponChangeTimer--;
        }

        // ゲームオーバー
        async function gameOver(reason = 'gameover') {
            gameRunning = false;
            
            // 通常モードのみ: ローカルの最高スコア・累計を更新（イベントはランキング対象外）
            const rankStatsRun = !isEventMode;
            if (rankStatsRun) {
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('shootingGameHighScore', highScore.toString());
            }
            const totalGames = parseInt(localStorage.getItem('totalGames')) || 0;
            const totalScore = parseInt(localStorage.getItem('totalScore')) || 0;
            localStorage.setItem('totalGames', (totalGames + 1).toString());
            localStorage.setItem('totalScore', (totalScore + score).toString());
            }
            
            // Firebase 認証を「真実」とする。localStorage の名残りでは保存処理を走らせない。
            const currentUser = firebase.auth().currentUser;
            const isAuthenticated = !!currentUser;
            
            // ログイン促進メッセージの表示/非表示
            const loginPromotion = document.querySelector('.login-promotion');
            if (loginPromotion) {
                if (isAuthenticated) {
                    loginPromotion.style.display = 'none';
                } else {
                    loginPromotion.style.display = 'block';
                }
            }
            
            // ノーダメージクリア（time-up かつ未被弾）を進捗フラグへ記録
            //   イベントモードは時間制限がないので対象外
            const isNoDamageClear = !isEventMode
                && reason === 'timeout'
                && !runTookDamage
                && score > 0;
            if (isAuthenticated && isNoDamageClear) {
                try {
                    await firebaseDataManager.updateProgress({ noDamageRunDone: true });
                } catch (e) {
                    console.warn('noDamageRunDone 保存失敗:', e);
                }
            }

            // Firebase にスコアを保存（ログイン時・通常モードのみ。イベントはランキング・累計に含めない）
            if (isAuthenticated && rankStatsRun && !firebaseScoreSubmittedThisRun) {
                firebaseScoreSubmittedThisRun = true;
                try {
                    await firebaseDataManager.saveScore(score, activePlaySessionId);
                    console.log('スコアがFirebaseに保存されました');
                } catch (error) {
                    firebaseScoreSubmittedThisRun = false;
                    if (error && error.message === 'SCORE_SUBMIT_RATE_LIMITED') {
                        console.warn('スコア送信はクールダウン中です');
                    } else {
                    console.error('スコア保存エラー:', error);
                    }
                }
            }
            
            // ゲームオーバーの理由に応じてメッセージを変更
            const gameOverTitle = document.querySelector('#gameOver div:first-child');
            if (gameOverTitle) {
                if (reason === 'timeout') {
                    gameOverTitle.textContent = '時間切れ';
                } else if (reason === 'event_clear') {
                    gameOverTitle.textContent = 'クリア！';
                } else if (reason === 'guest_score_cap') {
                    gameOverTitle.textContent = 'お試しプレイ終了';
                } else {
                    gameOverTitle.textContent = 'ゲームオーバー';
                }
            }
            
            document.querySelector('.final-score').textContent = `最終スコア: ${score}`;
            highScoreElement.textContent = `最高スコア: ${highScore}`;
            gameOverElement.style.display = 'block';
            if (runStatusElement) runStatusElement.style.display = 'none';
        }

        // ホームに戻る
        homeBtn.addEventListener('click', () => {
            window.location.href = 'index.html';
        });
        

        
        // リスタート
        restartBtn.addEventListener('click', () => {
            score = 0;
            lives = STARTING_LIVES;
            runTookDamage = false;
            bullets = [];
            enemies = [];
            boss = null;
            bossSpawned = false;
            bossBullets = [];
            bossShockwaves = [];
            bossMines = [];
            bossMinions = [];
            shockwaveFlashUntil = 0;
            playerHurtFlashEndAt = 0;
            cosmicDragonPhase = 'main';
            cosmicCoaTarget = null;
            cosmicGuardianBosses = [];
            cosmicCoreShields = [];
            cosmicCoaDeadlineAt = null;
            playerBarrier = null;
            barrierRearmSupplyPickupsNeeded = 0;
            playerDirectionalShield = null;
            drones = [];
            explosionEffects = [];
            treasureBox = null; // リスタート時に宝箱もリセット
            supplyUnits = []; // 支援物資をリセット
            healthItems = []; // ライフ回復アイテムをリセット
            lastBossScore = 0;
            lastTimeBonusScore = 0; // リスタート時に時間ボーナススコアもリセット
            timeBonusMessage = '';
            timeBonusTimer = 0;
            bossLevel = 1; // ボスレベルをリセット
            eventBossSpawnCount = 0; // イベントモードのボス出現カウンタもリセット
            updateEventBanner();
            loadWeaponLoadout();
            weaponMessage = ''; // リスタート時に武器メッセージもリセット
            weaponMessageTimer = 0;
            weaponChangeMessage = ''; // リスタート時に武器変更メッセージもリセット
            weaponChangeTimer = 0;
            firebaseScoreSubmittedThisRun = false;
            void beginPlaySessionIfLoggedIn();
            gameRunning = true;
            gameTime = 120;
            gameStartTime = Date.now();
            
            // 難易度設定を再適用
            gameDifficulty = localStorage.getItem('gameDifficulty') || 'normal';
            setDifficultySpeed();
            
            player.x = canvas.width / 2;
            player.y = canvas.height - 80; // プレイヤーの初期位置をリセット
            player.width = Math.max(30, Math.min(40, canvas.width / 20));
            player.height = Math.max(40, Math.min(50, canvas.height / 15));
            playerFlamePrevFrameX = player.x;
            playerFlamePrevFrameY = player.y;
            playerFlameLeadDx = 0;
            playerFlameLeadDy = 0;
            scoreElement.textContent = `スコア: ${score}`;
            livesElement.textContent = `ライフ: ${lives}`;
            updateAmmoHud();
            weaponElement.textContent = `武器: ${equippedWeapons[currentWeapon].name}`; // 武器表示を更新
            timeElement.textContent = `残り時間: ${gameTime}秒`;
            gameOverElement.style.display = 'none';
            bossWarningElement.style.display = 'none';
            highScoreElement.textContent = `最高スコア: ${highScore}`; // 最高スコア表示を更新
            
            // ログイン促進メッセージを非表示
            const loginPromotion = document.querySelector('.login-promotion');
            if (loginPromotion) {
                loginPromotion.style.display = 'none';
            }
            
            // 武器選択UIを更新
            updateWeaponSelector();
        });

        // ── タブ非表示・画面ロック時の補正 ─────────────────────────────
        // gameStartTime は Date.now() 基準なので、バックグラウンド中も時計は進む。
        // requestAnimationFrame は止まるため、放置すると復帰した瞬間に "残り時間 0" で
        // ゲームオーバーになる。ここで離脱時刻を記録しておき、戻った時にその分だけ
        // gameStartTime を未来へずらして「裏にいた時間」を相殺する。
        let pauseStartedAt = 0;
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (gameRunning && !pauseStartedAt) {
                    pauseStartedAt = Date.now();
                }
            } else if (pauseStartedAt) {
                const pausedFor = Date.now() - pauseStartedAt;
                pauseStartedAt = 0;
                if (gameRunning && pausedFor > 0) {
                    gameStartTime += pausedFor;
                    // dt も巻き戻して 1 フレーム目で大量更新が走らないようにする
                    lastFrameTimestamp = performance.now();
                }
            }
        });

        // ゲームループ
        // 連続フレーム間の経過時間からスタミナ回復量を計算するため、前フレームの timestamp を保持。
        let lastFrameTimestamp = performance.now();
        function gameLoop(timestamp) {
            const now = timestamp || performance.now();
            const dt = Math.min(64, now - lastFrameTimestamp);  // 64ms 上限でタブ復帰時の暴走回復を防ぐ
            lastFrameTimestamp = now;
            if (gameRunning) {
                updateWeaponStamina(dt);
                if (equippedWeapons[currentWeapon] && equippedWeapons[currentWeapon].usesStamina) {
                    updateAmmoHud();
                }
            }
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        async function beginPlaySessionIfLoggedIn() {
            activePlaySessionId = null;
            if (isEventMode) return;
            try {
                if (typeof firebase !== 'undefined' && firebase.auth && firebase.auth().currentUser
                    && typeof firebaseDataManager !== 'undefined'
                    && typeof firebaseDataManager.startPlaySession === 'function') {
                    activePlaySessionId = await firebaseDataManager.startPlaySession();
                }
            } catch (e) {
                console.warn('プレイセッション開始:', e);
            }
        }

        // ゲーム開始時の初期化
        function initGame() {
            resizeCanvas();
            initSounds();
            loadWeaponLoadout();
            
            // 難易度設定を適用
            setDifficultySpeed();
            
            // プレイヤーの初期位置とサイズを再設定
            player.x = canvas.width / 2;
            player.y = canvas.height - 80;
            player.width = Math.max(30, Math.min(40, canvas.width / 20));
            player.height = Math.max(40, Math.min(50, canvas.height / 15));
            playerFlamePrevFrameX = player.x;
            playerFlamePrevFrameY = player.y;
            playerFlameLeadDx = 0;
            playerFlameLeadDy = 0;
            
            // 武器選択UIを初期化
            initWeaponSelector();
            updateWeaponSelector();
            updateAmmoHud();
            weaponElement.textContent = `武器: ${equippedWeapons[currentWeapon].name}`;
            // ライフ表示も初期化時点で正しい値に揃える（イベントモードは 10）
            livesElement.textContent = `ライフ: ${lives}`;

            // 選択中の自機スキンをロード。アンロックされていない場合は classic に戻る
            currentPlayerSkinId = loadSelectedPlayerSkin();
            // 画像スキンは事前ロード
            const skin = getPlayerSkin();
            if (skin.type === 'image') ensurePlayerSkinImage(skin);

            // イベントモードバナーの初期表示
            updateEventBanner();

            void beginPlaySessionIfLoggedIn();
            
            gameLoop();
        }

        function escapeHtmlBuiltinMsg(s) {
            return String(s || '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }
        function showBuiltinEventBlockedScreen(message) {
            const wrap = document.createElement('div');
            wrap.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(5,8,20,0.94);color:#eef;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;font-family:system-ui,-apple-system,sans-serif;';
            wrap.innerHTML = '<p style="max-width:460px;line-height:1.65;font-size:1.05rem;">' + escapeHtmlBuiltinMsg(message) + '</p>'
                + '<p style="margin-top:22px;"><a href="index.html" style="color:#8cf;">ホームへ戻る</a></p>';
            document.body.appendChild(wrap);
        }

        // ゲーム開始: イベントモード時は Firestore のアクティブイベントを取得してから initGame
        (async function bootstrap() {
            let builtinAccess = typeof window.normalizeBuiltinEventAccess === 'function'
                ? window.normalizeBuiltinEventAccess(null)
                : null;
            try {
                if (typeof firebaseDataManager !== 'undefined' && firebaseDataManager.getBuiltinEventAccess) {
                    builtinAccess = await firebaseDataManager.getBuiltinEventAccess();
                    if (typeof window.syncShootingEventBypassFromUrl === 'function') {
                        window.syncShootingEventBypassFromUrl(builtinAccess);
                    }
                }
            } catch (e) {
                console.warn('builtin event access:', e);
            }

            if (isEventMode && EVENT_URL_SLUG === 'cosmic-dragon') {
                if (typeof window.canPlayBuiltinCosmicDragon !== 'function'
                    || !window.canPlayBuiltinCosmicDragon(builtinAccess)) {
                    window.location.replace('index.html');
                    return;
                }
            } else if (isEventMode) {
                if (typeof window.canPlayBuiltinShadowFleet !== 'function'
                    || !window.canPlayBuiltinShadowFleet(builtinAccess)) {
                    const msg = (builtinAccess && builtinAccess.shadowFleet === 'test')
                        ? (builtinAccess.testMessageJa || '')
                        : (builtinAccess && builtinAccess.maintenanceMessageJa) || '';
                    showBuiltinEventBlockedScreen(msg);
                    return;
                }
            }

            if (isEventMode) {
                if (EVENT_URL_SLUG !== 'cosmic-dragon') {
                    await maybeOverrideEventFromFirestore();
                }
                EVENT_BOSS_SELECTION = resolveEventBossSelection();
            }

            if (isEventMode) {
                try {
                    if (typeof firebase !== 'undefined' && firebase.auth) {
                        await new Promise((resolve) => {
                            const unsub = firebase.auth().onAuthStateChanged(() => {
                                try { unsub(); } catch (e2) { /* ignore */ }
                                resolve();
                            });
                        });
                    }
                } catch (e) { /* ignore */ }
                if (typeof firebase === 'undefined' || !firebase.auth || !firebase.auth().currentUser) {
                    alert('イベントモードをプレイするにはログインが必要です。');
                    window.location.replace('index.html');
                    return;
                }
            }

            try {
                if (typeof firebaseDataManager !== 'undefined'
                    && typeof firebaseDataManager.ensureShieldUnlockedForLegacyHighScore === 'function'
                    && typeof firebase !== 'undefined' && firebase.auth && firebase.auth().currentUser) {
                    await firebaseDataManager.ensureShieldUnlockedForLegacyHighScore();
                }
            } catch (e) {
                console.warn('legacy shield unlock:', e);
            }

        initGame();
        })();
    </script>
</body>
