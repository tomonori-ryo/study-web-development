            runStatusElement.style.display = 'block';
            const levelsArr = Array.from(runState.defeatedBossLevels).sort((a, b) => a - b);
            const lvText = levelsArr.length > 0
                ? levelsArr.map(l => `Lv${l}`).join(' ')
                : '<span class="warn">未撃破</span>';
            const noDamage = runState.livesLost === 0
                ? '<span class="ok">継続中</span>'
                : `<span class="warn">${runState.livesLost}回 被弾</span>`;
            runStatusBodyElement.innerHTML =
                `<div class="run-status-row"><span class="label">撃破ボス</span>${lvText}</div>` +
                `<div class="run-status-row"><span class="label">補給</span>${runState.suppliesCollected || 0}個</div>` +
                `<div class="run-status-row"><span class="label">敵撃破</span>${runState.enemyKillCount || 0}体</div>` +
                `<div class="run-status-row"><span class="label">ノーダメ</span>${noDamage}</div>`;
        }

        function canUseWeapon(weapon) {
            if (!weapon) return { ok: false, reason: '未装備' };
            if (isWeaponUsable(weapon)) return { ok: true };
            const trigger = weapon.runTrigger || { type: 'always' };
            return { ok: false, reason: trigger.label || '未解放' };
        }

        // ───── 武器メカニクス用ユーティリティ ────────────────────────────────
        // 指定座標から最も近い敵（敵がいないならボス）を返す。
        function findNearestTarget(x, y) {
            let nearest = null;
            let nearestDist = Infinity;
            for (const e of enemies) {
                const dx = (e.x + (e.width || e.size || 0) / 2) - x;
                const dy = (e.y + (e.height || e.size || 0) / 2) - y;
                const d = dx * dx + dy * dy;
                if (d < nearestDist) { nearest = e; nearestDist = d; }
            }
            if (!nearest && boss) {
                return boss;
            }
            return nearest;
        }

        // bullet の現在の進行ベクトルを target 方向に lerp する（追尾）。
        // 速度の大きさは bullet.maxSpeed に保たれる。lerp 後に再正規化することで、
        // ターゲットが真後ろにある／追尾が往復するなどの局面でも速度が抜けて空中停止しない。
        function steerBulletTowards(bullet, target, force) {
            const refSpeed = bullet.maxSpeed || Math.hypot(bullet.speedX, bullet.speedY) || 1;
            const tx = target.x + (target.width || target.size || 0) / 2;
            const ty = target.y + (target.height || target.size || 0) / 2;
            const dx = tx - bullet.x;
            const dy = ty - bullet.y;
            const dist = Math.hypot(dx, dy) || 1;
            const desiredX = (dx / dist) * refSpeed;
            const desiredY = (dy / dist) * refSpeed;
            const newX = bullet.speedX * (1 - force) + desiredX * force;
            const newY = bullet.speedY * (1 - force) + desiredY * force;
            const newMag = Math.hypot(newX, newY);
            if (newMag > 0.0001) {
                bullet.speedX = (newX / newMag) * refSpeed;
                bullet.speedY = (newY / newMag) * refSpeed;
            } else {
                // 万一抜けたら現在向きを維持しつつ refSpeed で再付与
                bullet.speedX = (desiredX / refSpeed) * refSpeed;
                bullet.speedY = (desiredY / refSpeed) * refSpeed;
            }
        }

        // 範囲内の敵 / ボス を引き寄せる（重力弾用）。
        function applyGravityPull(bullet) {
            const radiusSq = bullet.pullRadius * bullet.pullRadius;
            const cx = bullet.x + bullet.width / 2;
            const cy = bullet.y + bullet.height / 2;
            const pullStep = (target) => {
                const tx = target.x + (target.width || target.size || 0) / 2;
                const ty = target.y + (target.height || target.size || 0) / 2;
                const dx = cx - tx;
                const dy = cy - ty;
                const distSq = dx * dx + dy * dy;
                if (distSq <= 1 || distSq > radiusSq) return;
                const dist = Math.sqrt(distSq);
                target.x += (dx / dist) * bullet.pullForce;
                target.y += (dy / dist) * bullet.pullForce;
            };
            for (const e of enemies) pullStep(e);
            if (boss) pullStep(boss);
        }

        // 範囲爆発の視覚エフェクト（広がる輪 + フラッシュ）
        let explosionEffects = [];
        function spawnExplosionEffect(x, y, radius) {
            explosionEffects.push({ x, y, radius, life: 24, maxLife: 24 });
        }

        // 範囲爆発: 中心(x,y)から radius 内の敵 / ボス に damage を与える（ランチャー / 機雷）。
        // 視覚エフェクトと効果音もここで一括発火する。
        function applyExplosion(x, y, radius, damage) {
            spawnExplosionEffect(x, y, radius);
            playSound(explosionSound);
            const radiusSq = radius * radius;
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                const ex = e.x + (e.width || e.size || 0) / 2;
                const ey = e.y + (e.height || e.size || 0) / 2;
                const dx = ex - x;
                const dy = ey - y;
                if (dx * dx + dy * dy <= radiusSq) {
                    e.health -= damage;
                    if (e.health <= 0) {
                        enemies.splice(i, 1);
                        score += e.points;
                        scoreElement.textContent = `スコア: ${score}`;
                        runState.enemyKillCount++;
                    }
                }
            }
            if (boss) {
                const bx = boss.x + boss.width / 2;
                const by = boss.y + boss.height / 2;
                const dx = bx - x;
                const dy = by - y;
                if (dx * dx + dy * dy <= radiusSq) {
                    boss.health -= damage;
                }
            }
            recomputeUnlockedSlots();
        }

        function updateExplosionEffects() {
            explosionEffects = explosionEffects.filter(e => { e.life--; return e.life > 0; });
        }

        function drawExplosionEffects() {
            if (explosionEffects.length === 0) return;
            ctx.save();
            explosionEffects.forEach(e => {
                const t = 1 - (e.life / e.maxLife);          // 0 → 1 で広がる
                const r = e.radius * (0.3 + t * 0.9);
                const alpha = 1 - t;
                // 外輪
                ctx.globalAlpha = alpha * 0.9;
                ctx.strokeStyle = '#ffaa33';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
                ctx.stroke();
                // 内側のフラッシュ
                ctx.globalAlpha = alpha * 0.35;
                ctx.fillStyle = '#ffdd66';
                ctx.beginPath();
                ctx.arc(e.x, e.y, r * 0.55, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();
        }

        // 命中時の状態異常付与（時空弾）。enemy / boss どちらでも slowedUntil を持たせる。
        function applySlowToTarget(target, durationMs) {
            if (!target) return;
            const now = Date.now();
            const candidate = now + durationMs;
            target.slowedUntil = Math.max(target.slowedUntil || 0, candidate);
        }

        // ───── 随伴機（drone）コンパニオン制御 ──────────────────────────────
        // 現在の武器が drone のときだけプレイヤーの左右に表示され、自動で前方射撃する。
        let droneCompanions = [];

        function refreshDrones() {
            const w = equippedWeapons[currentWeapon];
            const isDrone = !!(w && w.id === 'drone');
            if (isDrone) {
                if (droneCompanions.length === 0) {
                    const startNow = Date.now();
                    droneCompanions = [
                        { offsetX: -32, lastFireMs: startNow,        interval: 900 },
                        { offsetX:  32, lastFireMs: startNow + 450,  interval: 900 }
                    ];
                }
            } else {
                droneCompanions = [];
            }
        }

        function updateDrones() {
            if (droneCompanions.length === 0) return;
            const w = equippedWeapons[currentWeapon];
            if (!w || w.id !== 'drone') {
                droneCompanions = [];
                return;
            }
            const now = Date.now();
            droneCompanions.forEach(d => {
                if (now - d.lastFireMs < d.interval) return;
                d.lastFireMs = now;
                const dx = player.x + player.width / 2 + d.offsetX - 2;
                const dy = player.y - 2;
                bullets.push({
                    x: dx, y: dy,
                    width: w.width, height: w.height,
                    speedX: 0, speedY: -w.speed,
                    maxSpeed: w.speed,
                    damage: w.damage,
                    range: w.range,
                    traveled: 0,
                    pierceRemaining: w.pierce,
                    color: w.color,
                    homing: false, homingForce: 0,
                    slowOnHitMs: 0,
                    pullRadius: 0, pullForce: 0,
                    explodeOnImpact: null,
                    blocksBossBullets: false,
                    lifeFrames: null
                });
            });
        }

        function drawDrones() {
            if (droneCompanions.length === 0) return;
            ctx.save();
            droneCompanions.forEach(d => {
                const cx = player.x + player.width / 2 + d.offsetX;
                const cy = player.y + 10;
                ctx.fillStyle = '#00ff88';
                ctx.shadowColor = '#00ff88';
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.moveTo(cx, cy - 7);
                ctx.lineTo(cx - 7, cy + 7);
                ctx.lineTo(cx + 7, cy + 7);
                ctx.closePath();
                ctx.fill();
                // 中央のコア
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#003322';
                ctx.fillRect(cx - 2, cy - 1, 4, 4);
            });
            ctx.restore();
        }

        // bossLevel -> 解放される武器のリスト。1レベルで複数武器を解放できる（パターンB対応）。
        const BOSS_LEVEL_META_UNLOCKS = {
            1: [{ weaponId: 'rapid', persistKey: 'rapidUnlocked' }],
            2: [{ weaponId: 'shotgun', persistKey: 'shotgunUnlocked' }],
            3: [
                { weaponId: 'laser', persistKey: 'laserUnlocked' },
                { weaponId: 'sniper', persistKey: 'sniperUnlocked' },
                { weaponId: 'launcher', persistKey: 'launcherUnlocked' }
            ],
            4: [
                { weaponId: 'slowtime', persistKey: 'slowtimeUnlocked' },
                { weaponId: 'homing', persistKey: 'homingUnlocked' },
                { weaponId: 'drone', persistKey: 'droneUnlocked' }
            ],
            5: [
                { weaponId: 'gravity', persistKey: 'gravityUnlocked' },
                { weaponId: 'mine', persistKey: 'mineUnlocked' },
                { weaponId: 'blade', persistKey: 'bladeUnlocked' }
            ],
            6: [
                { weaponId: 'shield', persistKey: 'shieldUnlocked' }
            ]
        };

        // ボス撃破イベント。ラン層の進捗を更新し、ログイン時はメタ層も永続化する。
        // 戻り値は「このレベルで解放対象になっている武器」のリスト（既に解放済みも含む）。
        function handleBossDefeated(level) {
            // ラン層: トリガー評価のための状態更新（両モード共通）
            runState.defeatedBossLevels.add(level);
            recomputeUnlockedSlots();

            const entries = BOSS_LEVEL_META_UNLOCKS[level] || [];
            const unlockedWeapons = [];

            entries.forEach(entry => {
                const weapon = weaponCatalog[entry.weaponId];
                if (!weapon) return;
                unlockedWeapons.push(weapon);

                if (loadoutMode === 'login') {
                    // メタ層: ログイン時のみ永続化（次回プレイから装備候補に入る）
                    try {
                        const localProgress = JSON.parse(localStorage.getItem('weaponProgress') || '{}');
                        if (!localProgress[entry.persistKey]) {
                            localProgress[entry.persistKey] = true;
                            localStorage.setItem('weaponProgress', JSON.stringify(localProgress));
                        }
                    } catch (e) {
                        // 何もしない
                    }
                    try {
                        if (typeof firebaseDataManager !== 'undefined'
                            && typeof firebase !== 'undefined'
                            && firebase.auth
                            && firebase.auth().currentUser) {
                            firebaseDataManager.updateProgress({ [entry.persistKey]: true }).catch(() => {});
                        }
                    } catch (e) {
                        // Firebase 未初期化等は無視
                    }
                }
            });

            return unlockedWeapons;
        }

        function setWeapon(weaponNum) {
            if (!unlockedWeapons.includes(weaponNum) || !equippedWeapons[weaponNum]) return;
            if (currentWeapon === weaponNum) return;
            currentWeapon = weaponNum;
            weaponElement.textContent = `武器: ${equippedWeapons[weaponNum].name}`;
            updateWeaponSelector();
            updateAmmoHud();
            refreshDrones();
            weaponChangeMessage = `武器変更: ${equippedWeapons[weaponNum].name}`;
            weaponChangeTimer = 120;
        }

        function cycleWeapon(direction) {
            if (unlockedWeapons.length <= 1) return;
            const idx = unlockedWeapons.indexOf(currentWeapon);
            const start = idx >= 0 ? idx : 0;
            let next = start;
            for (let i = 0; i < unlockedWeapons.length; i++) {
                next = (next + direction + unlockedWeapons.length) % unlockedWeapons.length;
                if (unlockedWeapons[next] !== currentWeapon) {
                    setWeapon(unlockedWeapons[next]);
                    return;
                }
            }
        }

        // プレイヤー
        let player = {
            x: canvas.width / 2,
            y: canvas.height - 80,
            width: Math.max(30, Math.min(40, canvas.width / 20)),
            height: Math.max(40, Math.min(50, canvas.height / 15)),
            speed: 5
        };

        // 弾丸配列
        let bullets = [];
        let enemies = [];
        let boss = null;
        let bossBullets = [];
        let treasureBox = null; // 宝箱
        let supplyUnits = []; // 支援物資（補給型ユニット）
        let healthItems = []; // ライフ回復アイテム

        // 敵の種類（基準速度）
        const baseEnemyTypes = [
            { color: '#ff0000', size: Math.max(25, Math.min(35, canvas.width / 30)), points: 5, speed: 1, spawnRate: 0.005, health: 3, type: 'enemy' }, // 赤い敵機（硬い）
            { color: '#ff8800', size: Math.max(20, Math.min(30, canvas.width / 35)), points: 3, speed: 2, spawnRate: 0.01, health: 2, type: 'enemy' },  // オレンジ敵機（中耐久）
            { color: '#ffff00', size: Math.max(15, Math.min(25, canvas.width / 40)), points: 1, speed: 3, spawnRate: 0.02, health: 1, type: 'enemy' }   // 黄色敵機（低耐久）
        ];
        
        // 難易度に応じた敵の種類を取得
        function getEnemyTypes() {
            return baseEnemyTypes.map(enemy => ({
                ...enemy,
                speed: enemy.speed * speedMultiplier,
                spawnRate: enemy.spawnRate * speedMultiplier
            }));
        }

        // キー入力
        const keys = {};
        let lastShootTime = 0; // 最後に発射した時間
        const shootCooldown = 100; // 発射のクールダウン時間（ミリ秒）
        
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === ' ') {
                e.preventDefault();
                const now = Date.now();
                if (now - lastShootTime > shootCooldown) {
                    shoot();
                    lastShootTime = now;
                }
            }

            if (e.key === 'Tab') {
                e.preventDefault();
                cycleWeapon(e.shiftKey ? -1 : 1);
                return;
            }
            
            // 武器選択（数字キー1-4）
            if (e.key >= '1' && e.key <= '4') {
                const weaponNum = parseInt(e.key);
                setWeapon(weaponNum);
            }
        });
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // タッチ操作の変数
        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;
        let lastTouchTime = 0;
        let touchMoved = false;
        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let playerStartX = 0;
        let playerStartY = 0;

        // タッチイベント
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            touchMoved = false;
            lastTouchTime = Date.now();
            
            // ドラッグ開始
            isDragging = false;
            dragStartX = touch.clientX;
            dragStartY = touch.clientY;
            playerStartX = player.x;
            playerStartY = player.y;
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            touchEndX = touch.clientX;
            touchEndY = touch.clientY;
            touchMoved = true;
            
            // ドラッグ移動
            if (touchMoved) {
                const deltaX = touch.clientX - dragStartX;
                const deltaY = touch.clientY - dragStartY;
                const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
                
                if (distance > 10) { // 最小ドラッグ距離
                    isDragging = true;
                    
                    // プレイヤーの位置をリアルタイムで更新
                    const newX = playerStartX + deltaX;
                    const newY = playerStartY + deltaY;
                    
                    // 画面境界内に制限
                    player.x = Math.max(0, Math.min(canvas.width - player.width, newX));
                    player.y = Math.max(canvas.height / 2, Math.min(canvas.height - player.height, newY));
                }
            }
        });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            const touchDuration = Date.now() - lastTouchTime;
            
            if (!isDragging && touchDuration < 200) {
                // 短時間のタップで攻撃
                shoot();
            }
            
            // ドラッグ終了
            isDragging = false;
        });

        // 弾丸発射
        function shoot() {
            const weapon = equippedWeapons[currentWeapon];
            if (!weapon) return;
            const availability = canUseWeapon(weapon);
            if (!availability.ok) {
                weaponChangeMessage = `${weapon.name}: ${availability.reason}`;
                weaponChangeTimer = 90;
                return;
            }
            // スタミナ式武器: オーバーヒート中は撃てない / 必要スタミナ未満なら撃てない
            if (weapon.usesStamina) {
                if (weaponOverheated[currentWeapon]) {
                    weaponChangeMessage = `${weapon.name}: クールダウン中`;
                    weaponChangeTimer = 30;
                    return;
                }
                const cur = weaponStamina[currentWeapon] || 0;
                if (cur < (weapon.staminaPerShot || 0)) {
                    // 0 まで使い切ったらオーバーヒート
                    weaponOverheated[currentWeapon] = true;
                    weaponChangeMessage = `${weapon.name}: オーバーヒート！`;
                    weaponChangeTimer = 60;
                    updateAmmoHud();
                    return;
                }
            } else {
                if ((weaponAmmo[currentWeapon] || 0) < weapon.ammoCost) return;
            }
            
            // 武器に応じた弾丸を発射
            for (let i = 0; i < weapon.bulletCount; i++) {
                const spread = (i - (weapon.bulletCount - 1) / 2) * weapon.spread;
                const speedX = Math.sin(spread) * weapon.speed * 0.3;
                const speedY = -weapon.speed;
                
                bullets.push({
                    x: player.x + player.width / 2 - 2,
                    y: player.y,
                    width: weapon.width,
                    height: weapon.height,
                    speedX: speedX,
                    speedY: speedY,
                    maxSpeed: weapon.speed,
                    damage: weapon.damage,
                    range: weapon.range,
                    traveled: 0,
                    pierceRemaining: weapon.pierce,
                    color: weapon.color,
                    // 拡張プロパティ（武器カタログから引き継ぐ。未定義は falsy / null）
                    homing: !!weapon.homing,
                    homingForce: weapon.homingForce || 0,
                    slowOnHitMs: weapon.slowOnHitMs || 0,
                    pullRadius: weapon.pullRadius || 0,
                    pullForce: weapon.pullForce || 0,
                    explodeOnImpact: weapon.explodeOnImpact || null,
                    blocksBossBullets: !!weapon.blocksBossBullets,
                    lifeFrames: (typeof weapon.lifeFrames === 'number') ? weapon.lifeFrames : null
                });
            }
            
            playSound(shootSound);
            if (weapon.usesStamina) {
                weaponStamina[currentWeapon] = (weaponStamina[currentWeapon] || 0) - (weapon.staminaPerShot || 0);
                if (weaponStamina[currentWeapon] <= 0) {
                    weaponStamina[currentWeapon] = 0;
                    weaponOverheated[currentWeapon] = true;
                }
            } else {
                weaponAmmo[currentWeapon] -= weapon.ammoCost;
            }
            updateAmmoHud();
            updateWeaponSelector();
        }

        // ボス弾丸発射
        function bossShoot() {
            if (!boss) return;
            
            // レベルに応じて弾丸数を増加
            const bulletCount = Math.min(3 + Math.floor(bossLevel / 2), 7); // 最大7発まで
            
            for (let i = 0; i < bulletCount; i++) {
                const angle = (i - (bulletCount - 1) / 2) * 0.5; // 角度を計算
                const speedX = Math.sin(angle) * 3;
                const speedY = Math.cos(angle) * 4;
                
                bossBullets.push({
                    x: boss.x + boss.width / 2 - 3,
                    y: boss.y + boss.height,
                    width: 6 + (bossLevel - 1) * 2, // レベルに応じて弾丸サイズ増加
                    height: 15 + (bossLevel - 1) * 3,
                    speedX: speedX,
                    speedY: speedY,
                    color: bossLevel > 2 ? '#ff00ff' : '#ff0000' // レベル3以上は紫色
                });
            }
            playSound(bossShootSound);
        }

        // ボス生成
        function spawnBoss() {
            // 100点間隔でボスが出現
            if (!bossSpawned && score >= lastBossScore + 100) {
                bossSpawned = true;
                lastBossScore = score;
                
                // ボスの難易度レベルを計算（500点間隔でレベルアップ）
                bossLevel = Math.floor(score / 500) + 1;
                
                boss = {
                    x: canvas.width / 2 - 50,
                    y: -100,
                    width: 100 + (bossLevel - 1) * 10, // レベルに応じてサイズ増加
                    height: 80 + (bossLevel - 1) * 8,
                    health: 20 + (bossLevel - 1) * 10, // レベルに応じてHP増加
                    maxHealth: 20 + (bossLevel - 1) * 10,
                    speed: 1 * speedMultiplier,
                    moveSpeed: (2 + (bossLevel - 1) * 0.5) * speedMultiplier, // レベルに応じて移動速度増加
                    moveDirection: 1, // 移動方向（1:右、-1:左）
                    points: 50 + (bossLevel - 1) * 25, // レベルに応じて点数増加
                    lastShot: 0,
                    shotInterval: Math.max(500, 2000 - (bossLevel - 1) * 200) / speedMultiplier // レベルに応じて攻撃間隔短縮
                };
                
                // ボス警告表示（レベルに応じてメッセージ変更）
                const levelText = bossLevel > 1 ? `レベル${bossLevel} ` : '';
                bossWarningElement.textContent = `⚠️ ${levelText}ボス出現！ ⚠️`;
                bossWarningElement.style.display = 'block';
                setTimeout(() => {
                    bossWarningElement.style.display = 'none';
                }, 3000);
            }
        }

        // 敵生成
        function spawnEnemy() {
            // スコアが100の時と500の倍数のボス以外は通常の敵も生成
            if (boss && (score === 100 || score % 500 === 0)) return; // 特定のボス出現中のみ通常の敵を生成しない
            
            const enemyTypes = getEnemyTypes();
            enemyTypes.forEach(type => {
                if (Math.random() < type.spawnRate) {
                    enemies.push({
                        x: Math.random() * (canvas.width - type.size),
                        y: -type.size,
                        width: type.size,
                        height: type.size,
                        speed: type.speed + Math.random() * 1,
                        color: type.color,
                        points: type.points,
                        health: type.health,
                        maxHealth: type.health,
                        enemyType: type.type // 敵のタイプを追加
                    });
                }
            });
        }

        // 支援物資生成
        function spawnSupplyUnits() {
            // スコアが100の時と500の倍数のボス以外は支援物資も生成
            if (boss && (score === 100 || score % 500 === 0)) return; // 特定のボス出現中のみ支援物資を生成しない
            
            // ランダムで支援物資を生成（難易度に応じて確率調整）
            const spawnRate = 0.003 * speedMultiplier; // 難易度に応じて生成確率を調整
            if (Math.random() < spawnRate) {
                supplyUnits.push({
                    x: Math.random() * (canvas.width - 28),
                    y: Math.random() * (canvas.height / 2), // 画面上半分に配置
                    width: 28,
                    height: 28,
                    color: '#00ff00',
                    isCollected: false
                });
            }
        }
        
        // ライフ回復アイテム生成
        function spawnHealthItems() {
            // スコアが100の時と500の倍数のボス以外はライフ回復アイテムも生成
            if (boss && (score === 100 || score % 500 === 0)) return; // 特定のボス出現中のみライフ回復アイテムを生成しない
            
            // 低確率でライフ回復アイテムを生成（弾薬補給より低い確率、難易度に応じて確率調整）
            const spawnRate = 0.0001 * speedMultiplier; // 難易度に応じて生成確率を調整
            if (Math.random() < spawnRate) {
                healthItems.push({
                    x: Math.random() * (canvas.width - 30),
                    y: Math.random() * (canvas.height / 2), // 画面上半分に配置
                    width: 30,
                    height: 30,
                    color: '#ff69b4', // ピンク色
                    isCollected: false
                });
            }
        }

        // 衝突判定
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        // プレイヤー戦闘機描画
        function drawPlayer() {
            const x = player.x;
            const y = player.y;
            const w = player.width;
            const h = player.height;
            
            // 武器変更時のエフェクト
            if (weaponChangeTimer > 0) {
                ctx.shadowColor = equippedWeapons[currentWeapon].color;
                ctx.shadowBlur = 15;
            }
            
            // 戦闘機の本体（青）
            ctx.fillStyle = '#0066cc';
            ctx.fillRect(x + w/4, y + h/3, w/2, h/2);
            
            // 戦闘機の機首（白）
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(x + w/3, y, w/3, h/3);
            
            // 戦闘機の翼（青）
            ctx.fillStyle = '#0066cc';
            ctx.fillRect(x, y + h/3, w/4, h/3);
            ctx.fillRect(x + 3*w/4, y + h/3, w/4, h/3);
            
            // 戦闘機の尾翼（青）
            ctx.fillStyle = '#0066cc';
            ctx.fillRect(x + w/3, y + 2*h/3, w/3, h/3);
            
            // エンジン部分（オレンジ）
            ctx.fillStyle = '#ff6600';
            ctx.fillRect(x + w/4, y + h/2, w/2, h/6);
            
            // コックピット（水色）
            ctx.fillStyle = '#00ccff';
            ctx.fillRect(x + w/3, y + h/4, w/3, h/6);
            
            // 武器変更時のエフェクトをリセット
            if (weaponChangeTimer > 0) {
                ctx.shadowBlur = 0;
            }
        }

        // 弾丸描画
        function drawBullets() {
            const now = Date.now();
            bullets.forEach(bullet => {
                // 機雷（lifeFrames あり + 速度ゼロ）は点滅 + 残り時間で色を変えて警告
                const isMine = (bullet.lifeFrames !== null && bullet.lifeFrames !== undefined
                                && bullet.speedX === 0 && bullet.speedY === 0);
                if (isMine) {
                    const t = bullet.lifeFrames / 360;
                    // 残量に応じて黄→橙→赤に
                    const danger = (t < 0.3) ? '#ff3322' : (t < 0.6 ? '#ff9933' : '#ffcc33');
                    // 残り少ないほど高速点滅
                    const blinkRate = (t < 0.3) ? 80 : (t < 0.6 ? 160 : 320);
                    const visible = (Math.floor(now / blinkRate) % 2) === 0;
                    if (visible) {
                        ctx.fillStyle = danger;
                        ctx.shadowColor = danger;
                        ctx.shadowBlur = 14;
                        ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
                        // 中央のドット
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = '#220000';
                        ctx.fillRect(bullet.x + bullet.width / 2 - 2, bullet.y + bullet.height / 2 - 2, 4, 4);
                    } else {
                        // 点滅で消える瞬間も外枠は薄く残す
                        ctx.strokeStyle = danger;
                        ctx.globalAlpha = 0.3;
                        ctx.strokeRect(bullet.x, bullet.y, bullet.width, bullet.height);
                        ctx.globalAlpha = 1;
                    }
                    return;
                }
                ctx.fillStyle = bullet.color;
                ctx.shadowColor = bullet.color;
                ctx.shadowBlur = bullet.pierceRemaining > 0 ? 14 : 5;
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
                ctx.shadowBlur = 0;
            });
        }

        // ボス弾丸描画
        function drawBossBullets() {
            bossBullets.forEach(bullet => {
                ctx.fillStyle = bullet.color;
                ctx.shadowColor = bullet.color;
                ctx.shadowBlur = 8;
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
                ctx.shadowBlur = 0;
            });
        }

        // 敵戦闘機描画
        function drawEnemies() {
            enemies.forEach(enemy => {
                const x = enemy.x;
                const y = enemy.y;
                const w = enemy.width;
                const h = enemy.height;
                
                // 通常の敵戦闘機の描画
                ctx.fillStyle = enemy.color;
                ctx.fillRect(x + w/4, y + h/3, w/2, h/2);
                
                // 敵戦闘機の機首
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(x + w/3, y, w/3, h/3);
                
                // 敵戦闘機の翼
                ctx.fillStyle = enemy.color;
                ctx.fillRect(x, y + h/3, w/4, h/3);
                ctx.fillRect(x + 3*w/4, y + h/3, w/4, h/3);
                
                // 敵戦闘機の尾翼
                ctx.fillStyle = enemy.color;
                ctx.fillRect(x + w/3, y + 2*h/3, w/3, h/3);
                
                // 敵戦闘機のエンジン
                ctx.fillStyle = '#ff6600';
                ctx.fillRect(x + w/4, y + h/2, w/2, h/6);
                
                // 敵戦闘機のコックピット
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(x + w/3, y + h/4, w/3, h/6);
                
                // 点数の表示
                ctx.fillStyle = '#ffffff';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(enemy.points, x + w/2, y + h + 15);

                if (enemy.maxHealth > 1) {
                    const barWidth = w;
                    const barHeight = 4;
                    const hpRatio = Math.max(0, enemy.health / enemy.maxHealth);
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
                    ctx.fillRect(x, y - 8, barWidth, barHeight);
                    ctx.fillStyle = hpRatio > 0.5 ? '#00ff66' : '#ff4444';
                    ctx.fillRect(x, y - 8, barWidth * hpRatio, barHeight);
                }
            });
        }

        // ボス描画
        function drawBoss() {
            if (!boss) return;
            
            const x = boss.x;
            const y = boss.y;
            const w = boss.width;
            const h = boss.height;
            
            // ボスの影効果（レベルに応じて強化）
            ctx.shadowColor = bossLevel > 2 ? '#ff00ff' : '#ff0000';
            ctx.shadowBlur = 10 + (bossLevel - 1) * 5;
            
            // ボスの本体（重厚感のある黒）
            ctx.fillStyle = '#333333';
            ctx.fillRect(x + w/6, y + h/4, 2*w/3, h/2);
            
            // ボスの装甲板（金属的な灰色）
            ctx.fillStyle = '#666666';
            ctx.fillRect(x + w/8, y + h/6, 3*w/4, h/3);
            
            // ボスの砲塔（レベルに応じて色変更）
            ctx.fillStyle = bossLevel > 2 ? '#ff00ff' : '#cc0000';
            ctx.fillRect(x + w/4, y, w/2, h/4);
            
            // ボスの翼（黒）
            ctx.fillStyle = '#222222';
            ctx.fillRect(x - w/4, y + h/3, w/4, h/3);
            ctx.fillRect(x + w, y + h/3, w/4, h/3);
            
            // ボスのエンジン（オレンジ）
            ctx.fillStyle = '#ff4400';
            ctx.fillRect(x + w/6, y + h/2, w/3, h/6);
            
            // ボスのコックピット（レベルに応じて色変更）
            ctx.fillStyle = bossLevel > 2 ? '#ff00ff' : '#ff0000';
            ctx.fillRect(x + w/3, y + h/6, w/3, h/6);
            
            // ボスの装甲板の詳細
            ctx.fillStyle = '#888888';
            ctx.fillRect(x + w/6, y + h/4, w/3, h/8);
            
            ctx.shadowBlur = 0;
            
            // ボスのHPバー
            const barWidth = w;
            const barHeight = 8;
            const barX = x;
            const barY = y - 20;
            
            // HPバーの背景
            ctx.fillStyle = '#333333';
            ctx.fillRect(barX, barY, barWidth, barHeight);
            
            // HPバー
            const hpRatio = boss.health / boss.maxHealth;
            ctx.fillStyle = hpRatio > 0.5 ? '#00ff00' : hpRatio > 0.2 ? '#ffff00' : '#ff0000';
            ctx.fillRect(barX, barY, barWidth * hpRatio, barHeight);
            
            // HPバーの枠
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.strokeRect(barX, barY, barWidth, barHeight);
            
            // ボスの点数表示（レベルも表示）
            ctx.fillStyle = '#ffffff';
            ctx.font = '16px Arial';
            ctx.textAlign = 'center';
            const levelText = bossLevel > 1 ? ` (Lv.${bossLevel})` : '';
            ctx.fillText(`BOSS: ${boss.points}点${levelText}`, x + w/2, y + h + 20);
        }

        // ゲーム更新
        function update() {
            if (!gameRunning) return;

            // 時間更新
            const elapsed = Math.floor((Date.now() - gameStartTime) / 1000);
            const remainingTime = Math.max(0, gameTime - elapsed);
            timeElement.textContent = `残り時間: ${remainingTime}秒`;

            // 時間切れ
            if (remainingTime <= 0) {
                gameOver('timeout');
                return;
            }

            // スコアによる時間ボーナス
            if (score > lastTimeBonusScore + 100) {
                gameTime += 30; // 30秒追加
                lastTimeBonusScore = score;
                timeBonusMessage = '+30秒ボーナス！';
                timeBonusTimer = 120; // 2秒間表示
                timeElement.textContent = `残り時間: ${gameTime}秒`;
            }

            // プレイヤー移動（矢印キー + WASD）
            if ((keys['ArrowLeft'] || keys['a'] || keys['A']) && player.x > 0) {
                player.x -= player.speed;
            }
            if ((keys['ArrowRight'] || keys['d'] || keys['D']) && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }
            if ((keys['ArrowUp'] || keys['w'] || keys['W']) && player.y > canvas.height / 2) {
                player.y -= player.speed;
            }
            if ((keys['ArrowDown'] || keys['s'] || keys['S']) && player.y < canvas.height - player.height) {
                player.y += player.speed;
            }

            // 随伴機の自動射撃
            updateDrones();
            updateExplosionEffects();

            // 弾丸更新（追尾・引力・シールド遮断もここで処理）
            bullets = bullets.filter(bullet => {
                // ライフタイマー（機雷など設置型用）
                if (bullet.lifeFrames !== null && bullet.lifeFrames !== undefined) {
                    bullet.lifeFrames--;
                    if (bullet.lifeFrames <= 0) {
                        // 自爆 = 起点で爆発（爆発プロパティを持つもののみ）
                        if (bullet.explodeOnImpact) {
                            applyExplosion(bullet.x + bullet.width / 2, bullet.y + bullet.height / 2,
                                           bullet.explodeOnImpact.radius, bullet.explodeOnImpact.damage);
                        }
                        return false;
                    }
                }

                // 追尾武器（ホーミング系）
                if (bullet.homing && bullet.homingForce > 0) {
                    const target = findNearestTarget(bullet.x, bullet.y);
                    if (target) steerBulletTowards(bullet, target, bullet.homingForce);
                }
                // 引力武器（重力弾系）
                if (bullet.pullRadius > 0 && bullet.pullForce > 0) {
                    applyGravityPull(bullet);
                }

                bullet.x += bullet.speedX;
                bullet.y += bullet.speedY;
                bullet.traveled += Math.hypot(bullet.speedX, bullet.speedY);

                // シールド武器・ブレード: 進行経路上の敵弾を破壊
                if (bullet.blocksBossBullets) {
                    for (let bi = bossBullets.length - 1; bi >= 0; bi--) {
                        if (checkCollision(bullet, bossBullets[bi])) {
                            bossBullets.splice(bi, 1);
                        }
                    }
                }

                return bullet.y > -bullet.height && bullet.traveled < bullet.range;
            });

            // ボス弾丸更新
            bossBullets = bossBullets.filter(bullet => {
                bullet.x += bullet.speedX;
                bullet.y += bullet.speedY;
                return bullet.y < canvas.height && bullet.x > 0 && bullet.x < canvas.width;
            });

            // ボス更新
            if (boss) {
                const bossSlowFactor = (boss.slowedUntil && Date.now() < boss.slowedUntil) ? 0.4 : 1;

                if (boss.y < 50) {
                    boss.y += boss.speed * bossSlowFactor;
                }
                
                // ボスの横移動
                boss.x += boss.moveSpeed * boss.moveDirection * bossSlowFactor;
                
                // 画面端で方向転換
                if (boss.x <= 0 || boss.x + boss.width >= canvas.width) {
                    boss.moveDirection *= -1;
                }
                
                // ボスの攻撃
                const now = Date.now();
                if (now - boss.lastShot > boss.shotInterval) {
                    bossShoot();
                    boss.lastShot = now;
                }
                
                // プレイヤーとの衝突
                if (checkCollision(boss, player)) {
                    lives--;
                    livesElement.textContent = `ライフ: ${lives}`;
                    runState.livesLost++;
                    recomputeUnlockedSlots();
                    if (lives <= 0) {
                        gameOver('gameover');
                    }
                }
            }

            // 敵更新
            enemies = enemies.filter(enemy => {
                const slowFactor = (enemy.slowedUntil && Date.now() < enemy.slowedUntil) ? 0.4 : 1;
                enemy.y += enemy.speed * slowFactor;
                
                // プレイヤーとの衝突
                if (checkCollision(enemy, player)) {
                    lives--;
                    livesElement.textContent = `ライフ: ${lives}`;
                    runState.livesLost++;
                    recomputeUnlockedSlots();
                    if (lives <= 0) {
                        gameOver('gameover');
                    }
                    return false;
                }
                
                return enemy.y < canvas.height;
            });

            // 弾丸と敵・ボスの衝突
            for (let bulletIndex = bullets.length - 1; bulletIndex >= 0; bulletIndex--) {
                const bullet = bullets[bulletIndex];
                let bulletRemoved = false;

                for (let enemyIndex = enemies.length - 1; enemyIndex >= 0; enemyIndex--) {
                    const enemy = enemies[enemyIndex];
                    if (!checkCollision(bullet, enemy)) continue;

                    // スロー（時空弾系）
                    if (bullet.slowOnHitMs > 0) applySlowToTarget(enemy, bullet.slowOnHitMs);

                    enemy.health -= bullet.damage;
                    if (enemy.health <= 0) {
                        enemies.splice(enemyIndex, 1);
                        score += enemy.points;
                        scoreElement.textContent = `スコア: ${score}`;
                        playSound(explosionSound);
                        runState.enemyKillCount++;
                        // scoreReached / enemyKillCount 系トリガーに備えて再評価
                        recomputeUnlockedSlots();
                    }

                    // 範囲爆発（ランチャー / 機雷）
                    if (bullet.explodeOnImpact) {
                        applyExplosion(bullet.x + bullet.width / 2, bullet.y + bullet.height / 2,
                                       bullet.explodeOnImpact.radius, bullet.explodeOnImpact.damage);
                    }

                    if (bullet.pierceRemaining > 0) {
                        bullet.pierceRemaining--;
                    } else {
                        bullets.splice(bulletIndex, 1);
                        bulletRemoved = true;
                        break;
                    }
                }

                if (bulletRemoved) continue;

                // 弾丸とボスの衝突
                if (boss && checkCollision(bullet, boss)) {
                    if (bullet.slowOnHitMs > 0) applySlowToTarget(boss, bullet.slowOnHitMs);

                    boss.health -= bullet.damage;

                    if (bullet.explodeOnImpact) {
                        applyExplosion(bullet.x + bullet.width / 2, bullet.y + bullet.height / 2,
                                       bullet.explodeOnImpact.radius, bullet.explodeOnImpact.damage);
                    }

                    if (bullet.pierceRemaining > 0) {
                        bullet.pierceRemaining--;
                    } else {
                        bullets.splice(bulletIndex, 1);
                        bulletRemoved = true;
                    }

                    if (boss.health <= 0) {
                        score += boss.points;
                        scoreElement.textContent = `スコア: ${score}`;
                        
                        // ボス撃破時に宝箱をドロップ（倒した地点と同じ横座標、プレイヤーが行ける最も上の地点）
                        treasureBox = {
                            x: boss.x + boss.width / 2 - 25, // ボスの中心と同じ横座標
                            y: canvas.height / 2, // プレイヤーが行ける最も上の地点
                            width: 50,
                            height: 50,
                            speed: 0, // 固定位置なので移動しない
                            color: '#ffd700', // 金色
                            isCollected: false
                        };
                        
                        const defeatedLevel = bossLevel;
                        boss = null;
                        bossSpawned = false;
                        playSound(bossExplosionSound); // ボス撃破音
                        
                        // bossLevel に応じたラン内解放（＋ログイン時はメタ層も永続化）
                        const unlockedList = handleBossDefeated(defeatedLevel);
                        if (unlockedList.length > 0) {
                            // 装備中（即使える）と未装備（マイページで編成）を分ける
                            const equippedNow = unlockedList.filter(w => equippedWeaponIds.includes(w.id));
                            const onlyMeta = unlockedList.filter(w => !equippedWeaponIds.includes(w.id));

                            if (loadoutMode === 'guest') {
                                // ゲストはロードアウト固定なので、装備中のものだけ通知
                                weaponMessage = equippedNow.length > 0
                                    ? `${equippedNow.map(w => w.name).join('・')}を解放！`
                                    : 'ボス撃破！';
                            } else if (equippedNow.length > 0 && onlyMeta.length === 0) {
                                weaponMessage = `${equippedNow.map(w => w.name).join('・')}が今すぐ使えます！`;
                            } else if (equippedNow.length === 0 && onlyMeta.length > 0) {
                                weaponMessage = `${onlyMeta.map(w => w.name).join('・')}が装備可能に！マイページで編成しよう`;
                            } else {
                                weaponMessage = `${equippedNow.map(w => w.name).join('・')}が使用可！他${onlyMeta.length}種が装備可能に`;
                            }
                        } else {
                            weaponMessage = 'ボス撃破！';
                        }
                        weaponMessageTimer = 180;
                        updateWeaponSelector(); // 武器選択UIを更新
                    }
                }
            }

            // ボス弾丸とプレイヤーの衝突
            bossBullets.forEach((bullet, bulletIndex) => {
                if (checkCollision(bullet, player)) {
                    bossBullets.splice(bulletIndex, 1);
                    lives--;
                    livesElement.textContent = `ライフ: ${lives}`;
                    runState.livesLost++;
                    recomputeUnlockedSlots();
                    if (lives <= 0) {
                        gameOver('gameover');
                    }
                }
            });

            // 宝箱生成チェック（ランダム生成は削除）
            // 宝箱はボス撃破時のみ生成される

            // 宝箱更新（固定位置なので移動しない）
            // 宝箱は固定位置に配置されるため、移動処理は不要

            // プレイヤーと宝箱の衝突
            if (treasureBox && checkCollision(player, treasureBox)) {
                treasureBox.isCollected = true;
                refillAllAmmoToMax();
                updateAmmoHud();
                updateWeaponSelector();
                playSound(explosionSound); // 宝箱取得音
                treasureBox = null; // 宝箱を消去
            }

            // 支援物資更新
            supplyUnits = supplyUnits.filter(unit => {
                unit.y += 1; // ゆっくり落下
                if (unit.y > canvas.height) {
                    return false; // 画面外に出たら消去
                }
                // プレイヤーとの衝突判定
                if (checkCollision(unit, player)) {
                    unit.isCollected = true;
                    addSupplyAmmoToAll(20); // 全武器に+20（各最大値で頭打ち）
                    runState.suppliesCollected = (runState.suppliesCollected || 0) + 1;
                    recomputeUnlockedSlots();
                    updateAmmoHud();
                    updateWeaponSelector();
                    playSound(explosionSound); // 補給取得音
                    return false; // 画面外に出たら消去
                }
                return true;
            });
            
            // ライフ回復アイテム更新
            healthItems = healthItems.filter(item => {
                item.y += 1; // ゆっくり落下
                if (item.y > canvas.height) {
                    return false; // 画面外に出たら消去
                }
                // プレイヤーとの衝突判定
                if (checkCollision(item, player)) {
                    item.isCollected = true;
                    if (lives < 3) { // 最大ライフは3
                        lives++;
                        livesElement.textContent = `ライフ: ${lives}`;
                    }
                    playSound(explosionSound); // ライフ回復取得音
                    return false; // 画面外に出たら消去
                }
                return true;
            });

            // ボス生成チェック
            spawnBoss();
            
            // 敵生成
            spawnEnemy();

            // 支援物資生成
            spawnSupplyUnits();
            
            // ライフ回復アイテム生成
            spawnHealthItems();
        }

        // ゲーム描画
        function draw() {
            // 背景クリア
            ctx.fillStyle = '#001122';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 星の背景
            ctx.fillStyle = '#ffffff';
            for (let i = 0; i < 50; i++) {
                ctx.fillRect(
                    (i * 37) % canvas.width,
                    (i * 73) % canvas.height,
                    1, 1
                );
            }

            drawPlayer();
            drawDrones();
            drawBullets();
            drawBossBullets();
            drawEnemies();
            drawBoss();
            drawExplosionEffects();
            
            // 宝箱の描画
            if (treasureBox) {
                const x = treasureBox.x;
                const y = treasureBox.y;
                const w = treasureBox.width;
                const h = treasureBox.height;
                
                // 宝箱の本体（金色）
                ctx.fillStyle = treasureBox.color;
                ctx.shadowColor = treasureBox.color;
                ctx.shadowBlur = 10;
                ctx.fillRect(x, y, w, h);
                ctx.shadowBlur = 0;
                
                // 宝箱の蓋
                ctx.fillStyle = '#ffed4e';
                ctx.fillRect(x + w/6, y, 2*w/3, h/4);
                
                // 宝箱の鍵穴
                ctx.fillStyle = '#000000';
                ctx.fillRect(x + w/2 - 3, y + h/2 - 3, 6, 6);
                
                // 宝箱の装飾
                ctx.strokeStyle = '#ffed4e';
                ctx.lineWidth = 2;
                ctx.strokeRect(x + 5, y + 5, w - 10, h - 10);
                
                // 宝箱の説明
                ctx.fillStyle = '#ffffff';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('弾薬満タン', x + w/2, y + h + 15);
            }

            // 支援物資の描画
            supplyUnits.forEach(unit => {
                const x = unit.x;
                const y = unit.y;
                const w = unit.width;
                const h = unit.height;

                ctx.fillStyle = unit.color;
                ctx.shadowColor = unit.color;
                ctx.shadowBlur = 5;
                ctx.fillRect(x, y, w, h);
                ctx.shadowBlur = 0;

                // 補給マーク
                ctx.fillStyle = '#ffffff';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('+', x + w/2, y + h/2 + 5);

                // 補給表示
                ctx.fillStyle = '#00ff00';
                ctx.font = '12px Arial';
                ctx.fillText('補給', x + w/2, y + h + 15);
            });
            
            // ライフ回復アイテムの描画
            healthItems.forEach(item => {
                const x = item.x;
                const y = item.y;
                const w = item.width;
                const h = item.height;

                ctx.fillStyle = item.color;
                ctx.shadowColor = item.color;
                ctx.shadowBlur = 8;
                ctx.fillRect(x, y, w, h);
                ctx.shadowBlur = 0;

                // ハートマーク
                ctx.fillStyle = '#ffffff';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('♥', x + w/2, y + h/2 + 5);

                // ライフ回復表示
                ctx.fillStyle = '#ff69b4';
                ctx.font = '12px Arial';
                ctx.fillText('ライフ', x + w/2, y + h + 15);
            });

            // 時間ボーナスメッセージの描画
            if (timeBonusTimer > 0) {
                ctx.fillStyle = '#00ff00';
                ctx.font = '24px Arial';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#000000';
                ctx.shadowBlur = 4;
                ctx.fillText(timeBonusMessage, canvas.width / 2, canvas.height / 2 - 50);
                ctx.shadowBlur = 0;
                timeBonusTimer--;
            }

            // 武器解禁メッセージの描画
            if (weaponMessageTimer > 0) {
                ctx.fillStyle = '#00ffff'; // 水色
                ctx.font = '24px Arial';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#000000';
                ctx.shadowBlur = 4;
                ctx.fillText(weaponMessage, canvas.width / 2, canvas.height / 2 - 50);
                ctx.shadowBlur = 0;
                weaponMessageTimer--;
            }
            
            // 武器変更メッセージの描画
            if (weaponChangeTimer > 0) {
                ctx.fillStyle = '#ffff00'; // 黄色
                ctx.font = '20px Arial';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#000000';
                ctx.shadowBlur = 4;
                ctx.fillText(weaponChangeMessage, canvas.width / 2, canvas.height / 2 + 50);
                ctx.shadowBlur = 0;
                weaponChangeTimer--;
            }
        }

        // ゲームオーバー
        async function gameOver(reason = 'gameover') {
            gameRunning = false;
            
            // 最高スコアの更新
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('shootingGameHighScore', highScore.toString());
            }
            
            // 総プレイ回数と総スコアを更新
            const totalGames = parseInt(localStorage.getItem('totalGames')) || 0;
            const totalScore = parseInt(localStorage.getItem('totalScore')) || 0;
            
            localStorage.setItem('totalGames', (totalGames + 1).toString());
            localStorage.setItem('totalScore', (totalScore + score).toString());
            
            // Firebase 認証を「真実」とする。localStorage の名残りでは保存処理を走らせない。
            const currentUser = firebase.auth().currentUser;
            const isAuthenticated = !!currentUser;
            
            // ログイン促進メッセージの表示/非表示
            const loginPromotion = document.querySelector('.login-promotion');
            if (loginPromotion) {
                if (isAuthenticated) {
                    loginPromotion.style.display = 'none';
                } else {
                    loginPromotion.style.display = 'block';
                }
            }
            
            // Firebaseにスコアを保存（ログインしている場合のみ）
            // saveScore 側で進捗フラグから称号と allWeaponsUnlocked を再計算するため、ここでは追加更新しない
            if (isAuthenticated) {
                try {
                    await firebaseDataManager.saveScore(score);
                    console.log('スコアがFirebaseに保存されました');
                } catch (error) {
                    console.error('スコア保存エラー:', error);
                }
            }
            
            // ゲームオーバーの理由に応じてメッセージを変更
            const gameOverTitle = document.querySelector('#gameOver div:first-child');
            if (gameOverTitle) {
                if (reason === 'timeout') {
                    gameOverTitle.textContent = '時間切れ';
                } else {
                    gameOverTitle.textContent = 'ゲームオーバー';
                }
            }
            
            document.querySelector('.final-score').textContent = `最終スコア: ${score}`;
            highScoreElement.textContent = `最高スコア: ${highScore}`;
            gameOverElement.style.display = 'block';
            if (runStatusElement) runStatusElement.style.display = 'none';
        }

        // ホームに戻る
        homeBtn.addEventListener('click', () => {
            window.location.href = 'index.html';
        });
        

        
        // リスタート
        restartBtn.addEventListener('click', () => {
            score = 0;
            lives = 3;
            bullets = [];
            enemies = [];
            boss = null;
            bossSpawned = false;
            bossBullets = [];
            droneCompanions = [];
            explosionEffects = [];
            treasureBox = null; // リスタート時に宝箱もリセット
            supplyUnits = []; // 支援物資をリセット
            healthItems = []; // ライフ回復アイテムをリセット
            lastBossScore = 0;
            lastTimeBonusScore = 0; // リスタート時に時間ボーナススコアもリセット
            timeBonusMessage = '';
            timeBonusTimer = 0;
            bossLevel = 1; // ボスレベルをリセット
            loadWeaponLoadout();
            weaponMessage = ''; // リスタート時に武器メッセージもリセット
            weaponMessageTimer = 0;
            weaponChangeMessage = ''; // リスタート時に武器変更メッセージもリセット
            weaponChangeTimer = 0;
            gameRunning = true;
            gameTime = 100;
            gameStartTime = Date.now();
            
            // 難易度設定を再適用
            gameDifficulty = localStorage.getItem('gameDifficulty') || 'normal';
            setDifficultySpeed();
            
            player.x = canvas.width / 2;
            player.y = canvas.height - 80; // プレイヤーの初期位置をリセット
            player.width = Math.max(30, Math.min(40, canvas.width / 20));
            player.height = Math.max(40, Math.min(50, canvas.height / 15));
            scoreElement.textContent = `スコア: ${score}`;
            livesElement.textContent = `ライフ: ${lives}`;
            updateAmmoHud();
            weaponElement.textContent = `武器: ${equippedWeapons[currentWeapon].name}`; // 武器表示を更新
            timeElement.textContent = `残り時間: ${gameTime}秒`;
            gameOverElement.style.display = 'none';
            bossWarningElement.style.display = 'none';
            highScoreElement.textContent = `最高スコア: ${highScore}`; // 最高スコア表示を更新
            
            // ログイン促進メッセージを非表示
            const loginPromotion = document.querySelector('.login-promotion');
            if (loginPromotion) {
                loginPromotion.style.display = 'none';
            }
            
            // 武器選択UIを更新
            updateWeaponSelector();
        });

        // ゲームループ
        // 連続フレーム間の経過時間からスタミナ回復量を計算するため、前フレームの timestamp を保持。
        let lastFrameTimestamp = performance.now();
        function gameLoop(timestamp) {
            const now = timestamp || performance.now();
            const dt = Math.min(64, now - lastFrameTimestamp);  // 64ms 上限でタブ復帰時の暴走回復を防ぐ
            lastFrameTimestamp = now;
            if (gameRunning) {
                updateWeaponStamina(dt);
                if (equippedWeapons[currentWeapon] && equippedWeapons[currentWeapon].usesStamina) {
                    updateAmmoHud();
                }
            }
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ゲーム開始時の初期化
        function initGame() {
            resizeCanvas();
            initSounds();
            loadWeaponLoadout();
            
            // 難易度設定を適用
            setDifficultySpeed();
            
            // プレイヤーの初期位置とサイズを再設定
            player.x = canvas.width / 2;
            player.y = canvas.height - 80;
            player.width = Math.max(30, Math.min(40, canvas.width / 20));
            player.height = Math.max(40, Math.min(50, canvas.height / 15));
            
            // 武器選択UIを初期化
            initWeaponSelector();
            updateWeaponSelector();
            updateAmmoHud();
            weaponElement.textContent = `武器: ${equippedWeapons[currentWeapon].name}`;
            
            gameLoop();
        }

        // ゲーム開始
        initGame();
    </script>
</body>
