<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>戦闘機シューティングゲーム</title>
    <!-- 起動時はホーム画面から始める。flag が無いブラウザ起動はリダイレクト。
         管理者プレビュー (previewEventId / adminEventId / adminEventActive) と
         パスワードリセット (oobCode) はバイパス。 -->
    <script>
    (function homeGuard() {
        try {
            if (sessionStorage.getItem('appLaunched') === '1') return;
            const params = new URLSearchParams(location.search);
            if (params.has('previewEventId')) return;
            if (params.has('adminEventId')) return;
            if (params.has('adminEventActive')) return;
            if (params.has('oobCode')) return;
            location.replace('index.html');
        } catch (e) {}
    })();
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        #gameCanvas {
            display: block;
            background: linear-gradient(to bottom, #001122, #003366);
        }
        
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: clamp(14px, 2.5vw, 18px);
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
        }

        #runStatus {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #ffffff;
            font-size: clamp(11px, 1.6vw, 13px);
            z-index: 100;
            background: rgba(0, 0, 0, 0.55);
            padding: 8px 10px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            line-height: 1.45;
            max-width: min(40vw, 220px);
            display: none;
        }
        .run-status-title {
            font-size: clamp(10px, 1.3vw, 11px);
            color: #aaffcc;
            letter-spacing: 0.06em;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .run-status-row {
            white-space: nowrap;
            color: #e0e0e0;
        }
        .run-status-row .ok { color: #88ff88; }
        .run-status-row .warn { color: #ffcc66; }
        .run-status-row .label { color: #aaaaaa; margin-right: 4px; }
        @media (max-width: 600px) {
            #runStatus {
                top: auto;
                bottom: 10px;
                right: 10px;
                font-size: 10px;
                max-width: 50vw;
            }
        }
        
        #score {
            margin-bottom: 8px;
            font-size: clamp(12px, 2vw, 16px);
        }
        
        #lives {
            margin-bottom: 8px;
            font-size: clamp(12px, 2vw, 16px);
        }
        
        #time {
            margin-bottom: 8px;
            color: #ffff00;
            font-size: clamp(12px, 2vw, 16px);
        }
        
        #ammo {
            margin-bottom: 8px;
            font-size: clamp(12px, 2vw, 16px);
        }
        
        /* 武器名は左下の #weaponHud に表示 */
        
        #bossWarning {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff0000;
            font-size: clamp(24px, 6vw, 36px);
            text-align: center;
            display: none;
            z-index: 150;
            text-shadow: 2px 2px 4px #000;
        }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: clamp(32px, 8vw, 48px);
            text-align: center;
            display: none;
            z-index: 200;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        
        .high-score {
            font-size: clamp(16px, 3vw, 20px);
            margin-top: 10px;
            color: #ffff00;
        }
        
        #restartBtn {
            background: #ff4444;
            color: white;
            border: none;
            padding: clamp(10px, 2vw, 15px) clamp(20px, 4vw, 30px);
            font-size: clamp(14px, 3vw, 20px);
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }
        
        #restartBtn:hover {
            background: #cc3333;
        }
        
        #homeBtn {
            background: #4444ff;
            color: white;
            border: none;
            padding: clamp(10px, 2vw, 15px) clamp(20px, 4vw, 30px);
            font-size: clamp(14px, 3vw, 20px);
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
            margin-left: 10px;
        }
        
        #homeBtn:hover {
            background: #3333cc;
        }
        

        
        .final-score {
            font-size: clamp(18px, 4vw, 24px);
            margin-top: 20px;
            color: #ffff00;
        }
        
        .login-promotion {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 255, 0, 0.1);
            border: 2px solid #00ff00;
            border-radius: 10px;
            text-align: center;
        }
        
        .login-promotion h3 {
            color: #00ff00;
            margin: 0 0 10px 0;
            font-size: clamp(14px, 3vw, 18px);
        }
        
        .login-promotion p {
            color: #ffffff;
            margin: 5px 0;
            font-size: clamp(12px, 2.5vw, 16px);
        }
        
        .login-buttons {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .login-btn {
            background: #00ff00;
            color: #000000;
            border: none;
            padding: clamp(8px, 2vw, 12px) clamp(16px, 3vw, 24px);
            font-size: clamp(12px, 2.5vw, 16px);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .login-btn:hover {
            background: #00cc00;
            transform: scale(1.05);
        }
        
        .register-btn {
            background: #0066ff;
            color: #ffffff;
            border: none;
            padding: clamp(8px, 2vw, 12px) clamp(16px, 3vw, 24px);
            font-size: clamp(12px, 2.5vw, 16px);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .register-btn:hover {
            background: #0055cc;
            transform: scale(1.05);
        }
        
        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            font-size: clamp(10px, 2vw, 12px);
            background: rgba(0, 0, 0, 0.5);
            padding: 8px;
            border-radius: 5px;
            backdrop-filter: blur(5px);
            z-index: 50;
        }
        
        #controls h3 {
            margin: 0 0 5px 0;
            font-size: clamp(12px, 2.5vw, 14px);
            color: #00ffff;
        }
        
        #controls p {
            margin: 2px 0;
            font-size: clamp(8px, 1.8vw, 10px);
        }
        
        /* 武器選択UI（左下・現在武器のみ表示） */
        #weaponSelector {
            position: absolute;
            left: 10px;
            bottom: 10px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            padding: 6px 10px;
            backdrop-filter: blur(10px);
            z-index: 100;
            transition: all 0.2s ease;
            min-width: 160px;
            max-width: min(60vw, 280px);
        }
        
        /* デフォルトでは全カード非表示。updateWeaponSelector で現在武器のみ表示にする。 */
        .weapon-display {
            display: none;
            align-items: center;
            gap: 10px;
            margin: 0;
            padding: 6px 8px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .weapon-display:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }
        
        .weapon-display.active {
            background: rgba(0, 255, 255, 0.3);
            border: 2px solid #00ffff;
        }

        .weapon-display.locked {
            opacity: 0.55;
            filter: grayscale(0.6);
            cursor: not-allowed;
        }

        .weapon-display.locked:hover {
            transform: none;
            background: rgba(255, 255, 255, 0.1);
        }

        .weapon-display.locked .weapon-icon {
            position: relative;
        }

        .weapon-display.locked .weapon-icon::after {
            content: '🔒';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.55);
            border-radius: 50%;
            font-size: 14px;
        }
        
        .weapon-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            color: white;
        }
        
        .weapon-info {
            flex: 1;
        }
        
        .weapon-name {
            font-size: clamp(12px, 2.5vw, 14px);
            font-weight: bold;
            color: white;
            margin-bottom: 2px;
        }
        
        .weapon-details {
            font-size: clamp(10px, 2vw, 12px);
            color: #cccccc;
        }
        
        /* トグルボタンは単一カード表示に移行したため非表示固定 */
        .weapon-selector-toggle {
            display: none !important;
        }

        /* 操作ヒント（カードの下） */
        .weapon-switch-hint {
            margin-top: 4px;
            padding: 2px 4px 0;
            font-size: clamp(9px, 1.6vw, 11px);
            color: rgba(255, 255, 255, 0.55);
            text-align: center;
            letter-spacing: 0.02em;
            user-select: none;
        }

        /* デフォルトは PC ヒント表示 */
        .weapon-switch-hint .hint-pc { display: inline; }
        .weapon-switch-hint .hint-mobile { display: none; }

        /* ホバー不可 & 粗ポインタ = タッチデバイス */
        @media (hover: none) and (pointer: coarse) {
            .weapon-switch-hint .hint-pc { display: none; }
            .weapon-switch-hint .hint-mobile { display: inline; }
        }
        
        /* レスポンシブ対応 */
        @media (max-width: 768px) {
            #ui {
                font-size: clamp(10px, 2vw, 14px);
                padding: 8px;
            }
            
            #score, #lives, #time, #ammo {
                font-size: clamp(10px, 2vw, 14px);
                margin-bottom: 6px;
            }
            
            #bossWarning {
                font-size: clamp(18px, 5vw, 24px);
            }
            
            #gameOver {
                font-size: clamp(24px, 6vw, 32px);
                padding: 15px;
            }
            
            .final-score, .high-score {
                font-size: clamp(14px, 3vw, 18px);
            }
            
            #restartBtn, #homeBtn {
                padding: clamp(8px, 2vw, 12px) clamp(16px, 3vw, 24px);
                font-size: clamp(12px, 2.5vw, 16px);
            }
            
            .login-promotion {
                padding: 10px;
                margin-top: 15px;
            }
            
            .login-promotion h3 {
                font-size: clamp(12px, 2.5vw, 16px);
            }
            
            .login-promotion p {
                font-size: clamp(10px, 2vw, 14px);
            }
            
            .login-btn, .register-btn {
                padding: clamp(6px, 1.5vw, 10px) clamp(12px, 2.5vw, 20px);
                font-size: clamp(10px, 2vw, 14px);
            }
            
            #controls {
                font-size: clamp(8px, 1.5vw, 10px);
                padding: 6px;
            }
            
            #controls h3 {
                font-size: clamp(10px, 2vw, 12px);
            }
            
            #controls p {
                font-size: clamp(6px, 1.5vw, 8px);
                margin: 1px 0;
            }
            
            #weaponSelector {
                padding: 8px;
            }
            
            .weapon-display {
                padding: 6px;
                gap: 8px;
            }
            
            .weapon-icon {
                width: 25px;
                height: 25px;
                font-size: 14px;
            }
            
            .weapon-name {
                font-size: clamp(10px, 2vw, 12px);
            }
            
            .weapon-details {
                font-size: clamp(8px, 1.5vw, 10px);
            }
            
            .weapon-selector-toggle {
                padding: 12px;
                font-size: 18px;
            }
        }
        
        @media (max-height: 600px) {
            #ui {
                font-size: clamp(8px, 1.5vw, 12px);
                padding: 6px;
            }
            
            #score, #lives, #time, #ammo {
                font-size: clamp(8px, 1.5vw, 12px);
                margin-bottom: 4px;
            }
            
            #bossWarning {
                font-size: clamp(16px, 4vw, 20px);
            }
            
            #gameOver {
                font-size: clamp(20px, 5vw, 28px);
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
        <div id="score">スコア: 0</div>
        <div id="lives">ライフ: 3</div>
        <div id="ammo">弾薬: 50/50</div>
        <div id="time">残り時間: 120秒</div>
    </div>
    <div id="runStatus">
        <div class="run-status-title">ラン進捗</div>
        <div id="runStatusBody"></div>
    </div>
    <div id="eventBanner" style="display:none; position:absolute; top:8px; left:50%; transform:translateX(-50%); background:linear-gradient(90deg, rgba(60, 0, 90, 0.85), rgba(0, 90, 130, 0.85)); color:#fff; padding:6px 14px; border-radius:20px; font-size:clamp(11px, 1.6vw, 14px); z-index:60; border:1px solid rgba(255,255,255,0.25); letter-spacing:0.05em; backdrop-filter:blur(4px);">
        <span style="opacity:0.7;">🎪 期間限定イベント</span>
        <span id="eventBannerTitle" style="font-weight:bold; margin-left:6px;">影艦隊襲来</span>
        <span id="eventBannerProgress" style="margin-left:10px; opacity:0.9; font-size:0.92em;"></span>
    </div>
    <div id="bossWarning">⚠️ ボス出現！ ⚠️</div>
    <div id="gameOver">
        <div>ゲームオーバー</div>
        <div class="final-score">最終スコア: 0</div>
        <div class="high-score">最高スコア: 0</div>
        <button id="restartBtn">リスタート</button>
        <button id="homeBtn">ホームに戻る</button>
        <div class="login-promotion" style="display: none;">
            <h3>スコアを保存してランキングに参加！</h3>
            <p>ログインすると、あなたのスコアが保存され、</p>
            <p>他のプレイヤーと競い合えます！</p>
            <div class="login-buttons">
                <button class="login-btn" onclick="window.location.href='mypage.html'">ログイン</button>
                <button class="register-btn" onclick="window.location.href='mypage.html'">新規登録</button>
            </div>
        </div>
    </div>
    
    <div id="weapon" style="display: none;">武器: 通常弾</div>

    <!-- 武器選択UI（現在装備中の武器のみ表示。Tab / クリックで切替） -->
    <button id="weaponSelectorToggle" class="weapon-selector-toggle" aria-hidden="true">🔫</button>
    <div id="weaponSelector">
        <div class="weapon-display active" data-slot="1">
            <div class="weapon-icon" style="background: #ffff00;">1</div>
            <div class="weapon-info">
                <div class="weapon-name">通常弾</div>
                <div class="weapon-details">弾薬: 1発</div>
            </div>
        </div>
        <div class="weapon-display" data-slot="2">
            <div class="weapon-icon" style="background: #ff8800;">2</div>
            <div class="weapon-info">
                <div class="weapon-name">連射弾</div>
                <div class="weapon-details">弾薬: 2発</div>
            </div>
        </div>
        <div class="weapon-display" data-slot="3">
            <div class="weapon-icon" style="background: #ff0000;">3</div>
            <div class="weapon-info">
                <div class="weapon-name">散弾</div>
                <div class="weapon-details">弾薬: 3発</div>
            </div>
        </div>
        <div class="weapon-display" data-slot="4">
            <div class="weapon-icon" style="background: #00ffff;">4</div>
            <div class="weapon-info">
                <div class="weapon-name">レーザー</div>
                <div class="weapon-details">弾薬: 5発</div>
            </div>
        </div>
        <div id="weaponSwitchHint" class="weapon-switch-hint">
            <span class="hint-pc">⌨ Tab で切替</span>
            <span class="hint-mobile">👆 タップで切替</span>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-analytics-compat.js"></script>
    <script src="firebase-config.js"></script>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');
        const ammoElement = document.getElementById('ammo'); // 弾薬表示要素
        const weaponElement = document.getElementById('weapon'); // 武器表示要素
        const timeElement = document.getElementById('time');
        const bossWarningElement = document.getElementById('bossWarning');
        const gameOverElement = document.getElementById('gameOver');
        const restartBtn = document.getElementById('restartBtn');
        const homeBtn = document.getElementById('homeBtn');
        const highScoreElement = document.querySelector('.high-score');
        const weaponSelectorToggle = document.getElementById('weaponSelectorToggle');
        const weaponSelector = document.getElementById('weaponSelector');

        // ─────────────────────────────────────────────
        // プレイヤースキン
        //   classic / stealth / neon / crimson は procedural（色配色だけ違う）。
        //   shadow-cruiser / shadow-overlord はイベント報酬の画像スキン。
        //   localStorage.playerSkin に id を保存。アンロックが必要なスキンは
        //   eventSkinsUnlocked[skinKey] を見て分岐する。
        // ─────────────────────────────────────────────
        const PLAYER_SKIN_CATALOG = {
            classic:  { id: 'classic',  name: 'クラシック',   type: 'procedural', body: '#0066cc', wing: '#0066cc', nose: '#ffffff', engine: '#ff6600', cockpit: '#00ccff', glow: '#00ccff', unlock: null },
            stealth:  { id: 'stealth',  name: 'ステルス',     type: 'procedural', body: '#2a2a2a', wing: '#404040', nose: '#999999', engine: '#ff3030', cockpit: '#dd2222', glow: '#ff3030', unlock: null },
            neon:     { id: 'neon',     name: 'ネオン',       type: 'procedural', body: '#aa00ff', wing: '#aa00ff', nose: '#ffffff', engine: '#00ffff', cockpit: '#ff66ff', glow: '#ff66ff', unlock: null },
            crimson:  { id: 'crimson',  name: 'クリムゾン',   type: 'procedural', body: '#cc1133', wing: '#cc1133', nose: '#ffd700', engine: '#ffaa00', cockpit: '#ffd700', glow: '#ffaa00', unlock: null },
            'shadow-cruiser':  { id: 'shadow-cruiser',  name: 'シャドウ・クルーザー',     type: 'image', src: 'assets/event/event-boss-1.png', glow: '#66ddff', unlock: 'eventBossSkinShadowCruiser' },
            'shadow-overlord': { id: 'shadow-overlord', name: 'シャドウ・オーバーロード', type: 'image', src: 'assets/event/event-boss-2.png', glow: '#88aaff', unlock: 'eventBossSkinShadowOverlord' },
            'cosmic-dragon':   { id: 'cosmic-dragon',   name: 'インペリアル・バハムート', type: 'image', src: 'assets/event/doragonsukin.png', glow: '#cc66ff', unlock: 'eventBossSkinCosmicDragon' }
        };
        const DEFAULT_PLAYER_SKIN = 'classic';

        function isPlayerSkinUnlocked(skinId) {
            const skin = PLAYER_SKIN_CATALOG[skinId];
            if (!skin) return false;
            if (!skin.unlock) return true; // unlock 条件なし = 常時可
            let skins = {};
            try { skins = JSON.parse(localStorage.getItem('eventSkinsUnlocked') || '{}') || {}; } catch (e) {}
            return !!skins[skin.unlock];
        }

        function loadSelectedPlayerSkin() {
            let id = DEFAULT_PLAYER_SKIN;
            try { id = localStorage.getItem('playerSkin') || DEFAULT_PLAYER_SKIN; } catch (e) {}
            if (!PLAYER_SKIN_CATALOG[id] || !isPlayerSkinUnlocked(id)) {
                id = DEFAULT_PLAYER_SKIN;
            }
            return id;
        }

        let currentPlayerSkinId = DEFAULT_PLAYER_SKIN; // 起動時に loadSelectedPlayerSkin() で確定
        const playerSkinImages = {}; // image 型スキン用のキャッシュ

        function getPlayerSkin() {
            return PLAYER_SKIN_CATALOG[currentPlayerSkinId] || PLAYER_SKIN_CATALOG[DEFAULT_PLAYER_SKIN];
        }
        function ensurePlayerSkinImage(skin) {
            if (skin.type !== 'image' || !skin.src) return null;
            if (!playerSkinImages[skin.id]) {
                const img = new Image();
                img.src = skin.src;
                playerSkinImages[skin.id] = img;
            }
            return playerSkinImages[skin.id];
        }

        // ─────────────────────────────────────────────
        // 期間限定イベントモード
        // URL パラメータ ?mode=event でメインゲームの上に「ボスだけ画像差し替え + 進捗追跡」を被せる。
        // ゲーム本体のロジックには干渉せず、描画とクリア判定だけ拡張する。
        // ─────────────────────────────────────────────
        // 既定のイベント設定。Firestore に active=true なドキュメントがあれば
        //   maybeOverrideEventFromFirestore() でこれを上書きする。
        let EVENT_CONFIG = {
            id: 'shadow-fleet-2026',
            title: '影艦隊襲来',
            subtitle: '期間限定イベント',
            // イベント期間（ISO 8601）。期間外でもプレイ自体は可能だが、スキン報酬は付与しない。
            endsAt: '2026-12-31T23:59:59+09:00',
            // 2 種類のイベントボス。`image` パスとスキン解放キーを定義。
            // hpMultiplier  : メインゲームの HP に掛ける倍率
            // featureLevel  : ボスのレベルをこの値以上に固定（特殊行動の解放ライン）
            // extraGimmicks : 通常の Lv ベース機能に加えて使える特殊弾の種類
            bosses: [
                {
                    id: 'shadow-cruiser',
                    skinKey: 'eventBossSkinShadowCruiser',
                    image: 'assets/event/event-boss-1.png',
                    name: 'シャドウ・クルーザー',
                    flavor: '軍事兵器の精密射撃 / 機雷・狙撃に特化',
                    hpMultiplier: 4,
                    featureLevel: 8,    // 機雷まで解放
                    // 通常弾のファン射撃数（標準式の min(3+floor(L/2),6) を上書き）
                    // 機雷・狙撃・追尾ミサイルで補うので弾数は絞り目
                    bulletCount: 3,
                    extraGimmicks: ['homing']
                },
                {
                    id: 'shadow-overlord',
                    skinKey: 'eventBossSkinShadowOverlord',
                    image: 'assets/event/event-boss-2.png',
                    name: 'シャドウ・オーバーロード',
                    flavor: '神秘の超能力 / 部下召喚・吸収・重力',
                    hpMultiplier: 5,
                    featureLevel: 10,   // 部下・狙撃まで解放
                    // 部下・重力・吸収などギミックが豊富なので通常弾はさらに少なめ
                    bulletCount: 2,
                    extraGimmicks: ['homing', 'gravity']
                }
            ]
        };

        // boss=cruiser|overlord|all で出現させるボスを切替え。
        // all  : 両方を交互に出す（旧来挙動）
        // それ以外: そのボス専用ステージ（同じボスが永続して出続け、HP / 機能が強化される）
        const urlParams = new URLSearchParams(window.location.search);
        const isEventMode = urlParams.get('mode') === 'event';
        const eventBossSelectionRaw = (urlParams.get('boss') || 'all').toLowerCase();
        const EVENT_URL_SLUG = (urlParams.get('event') || '').trim().toLowerCase();

        /** 影艦隊襲来とは別イベント。?mode=event&event=cosmic-dragon&starRank=1|2|3（Firestore の active では上書きしない） */
        const BUILTIN_COSMIC_DRAGON_EVENT = {
            id: 'cosmic-dragon-2026',
            title: '星獣襲来',
            subtitle: '期間限定イベント',
            endsAt: '2026-12-31T23:59:59+09:00',
            bosses: [
                {
                    id: 'cosmic-dragon',
                    skinKey: 'eventBossSkinCosmicDragon',
                    image: 'assets/event/doragon.png',
                    name: 'インペリアル・バハムート',
                    flavor: '深宇宙から現れた脅威',
                    hpMultiplier: 4.5,
                    featureLevel: 9,
                    bulletCount: 3,
                    extraGimmicks: ['homing', 'gravity'],
                    // メイン撃破時はシールドのみ。バリアは上級でコア防衛フェーズ完了時に別途付与。
                    weaponRewardKey: 'shieldUnlocked'
                }
            ]
        };
        const COSMIC_DRAGON_STAR_RANK_PRESETS = {
            1: { tierLabel: '初級', hpMultiplier: 2.7, featureLevel: 6, bulletCount: 4, extraGimmicks: ['homing'], flavorSuffix: '初級：火力控えめ・パターン簡素' },
            2: { tierLabel: '中級', hpMultiplier: 4.5, featureLevel: 9, bulletCount: 3, extraGimmicks: ['homing', 'gravity'], flavorSuffix: '中級：バランス' },
            3: { tierLabel: '上級', hpMultiplier: 7.2, featureLevel: 11, bulletCount: 2, extraGimmicks: ['homing', 'gravity'], flavorSuffix: '上級：高耐久・猛攻' }
        };
        function applyBuiltinEventPresetFromUrl() {
            if (!isEventMode || EVENT_URL_SLUG !== 'cosmic-dragon') return;
            const rawRank = (urlParams.get('starRank') || urlParams.get('rank') || '2').trim();
            let starRank = parseInt(rawRank, 10);
            if (!Number.isFinite(starRank) || starRank < 1 || starRank > 3) starRank = 2;
            COSMIC_DRAGON_STAR_RANK = starRank;
            const preset = COSMIC_DRAGON_STAR_RANK_PRESETS[starRank] || COSMIC_DRAGON_STAR_RANK_PRESETS[2];
            const cfg = JSON.parse(JSON.stringify(BUILTIN_COSMIC_DRAGON_EVENT));
            const b = cfg.bosses[0];
            b.hpMultiplier = preset.hpMultiplier;
            b.featureLevel = preset.featureLevel;
            b.bulletCount = preset.bulletCount;
            b.extraGimmicks = preset.extraGimmicks.slice();
            b.flavor = `${preset.flavorSuffix}／${b.flavor}`;
            cfg.title = `星獣襲来（${preset.tierLabel}）`;
            EVENT_CONFIG = cfg;
        }

        /** 星獣襲来 URL の難易度（1–3）。他モードでは未使用。 */
        let COSMIC_DRAGON_STAR_RANK = 2;
        /** main: メインボス / coa: 星核＋眷属 / done: 終了処理済み */
        let cosmicDragonPhase = 'main';
        let cosmicCoaTarget = null;
        let cosmicGuardianBosses = [];
        /** 星核防衛: 眷属が放つシールド（プレイヤー弾を遮断） */
        let cosmicCoreShields = [];
        /** 星核を 30 秒以内に破壊できなければ吸収 → メイン星獣復活 */
        let cosmicCoaDeadlineAt = null;
        /** シールド着弾角を周回させ、コア周りに分散させる */
        let cosmicCoaShieldAngleSlot = 0;

        function isCosmicDragonEventRun() {
            return isEventMode && EVENT_URL_SLUG === 'cosmic-dragon' && cosmicDragonPhase !== 'done';
        }

        let _doragonCoaImgCache = null;
        let _minidragonEnemyImgCache = null;
        function getDoragonCoaImage() {
            if (!_doragonCoaImgCache) {
                _doragonCoaImgCache = new Image();
                _doragonCoaImgCache.src = 'assets/event/doragoncoa.png';
            }
            return _doragonCoaImgCache;
        }
        function getMinidragonEnemyImage() {
            if (!_minidragonEnemyImgCache) {
                _minidragonEnemyImgCache = new Image();
                _minidragonEnemyImgCache.src = 'assets/event/minidoragon.png';
            }
            return _minidragonEnemyImgCache;
        }

        function startCosmicDragonCoaPhase() {
            cosmicDragonPhase = 'coa';
            bossBullets = [];
            bossShockwaves = [];
            bossMines = [];
            cosmicCoreShields = [];
            cosmicCoaDeadlineAt = Date.now() + 30000;
            cosmicCoaShieldAngleSlot = 0;
            const coreMaxHp = 95 + COSMIC_DRAGON_STAR_RANK * 55;
            cosmicCoaTarget = {
                x: canvas.width / 2 - 62,
                y: 32,
                width: 124,
                height: 118,
                health: coreMaxHp,
                maxHealth: coreMaxHp
            };
            cosmicGuardianBosses = [];
            const baseN = COSMIC_DRAGON_STAR_RANK >= 2 ? 3 : 2;
            const n = Math.min(6, baseN * 2);
            for (let i = 0; i < n; i++) {
                const w = 76;
                const h = 62;
                const maxHp = 42 + COSMIC_DRAGON_STAR_RANK * 38;
                cosmicGuardianBosses.push({
                    x: 36 + (i / Math.max(1, n - 1)) * (canvas.width - w - 72),
                    y: 108 + (i % 2) * 26,
                    width: w,
                    height: h,
                    health: maxHp,
                    maxHealth: maxHp,
                    vx: (i % 2 === 0 ? 1 : -1) * 0.85 * speedMultiplier,
                    vy: 0.28 * speedMultiplier,
                    lastShot: Date.now() + 400 + i * 450,
                    shotInterval: Math.max(900, 1500 - COSMIC_DRAGON_STAR_RANK * 110),
                    nextShieldAt: Date.now() + 820 + i * 320,
                    level: 6
                });
            }
            bossWarningElement.textContent = '⚠️ 星核（コア）出現 — 眷属がシールドで防衛！30秒以内にコアを破壊せよ ⚠️';
            bossWarningElement.style.display = 'block';
            setTimeout(() => { bossWarningElement.style.display = 'none'; }, 2600);
        }

        function finishCosmicDragonEventClear() {
            if (cosmicDragonPhase !== 'coa') return;
            cosmicDragonPhase = 'done';
            cosmicCoaTarget = null;
            cosmicGuardianBosses = [];
            cosmicCoreShields = [];
            cosmicCoaDeadlineAt = null;
            spawnExplosionEffect(canvas.width / 2, 120, 100);
            playSound(bossExplosionSound);
            let barrierNew = false;
            if (COSMIC_DRAGON_STAR_RANK >= 2) {
                barrierNew = grantMetaWeaponUnlock('barrierUnlocked');
            }
            let skinNewly = false;
            if (COSMIC_DRAGON_STAR_RANK === 3) {
                let skinsBefore = {};
                try { skinsBefore = JSON.parse(localStorage.getItem('eventSkinsUnlocked') || '{}') || {}; } catch (e) {}
                const b0 = EVENT_CONFIG.bosses[0];
                const sk = b0 && b0.skinKey;
                skinNewly = !!(sk && !skinsBefore[sk]);
                grantEventSkin(0);
            }
            updateEventBanner();
            const bits = ['イベントクリア！'];
            if (COSMIC_DRAGON_STAR_RANK >= 2) {
                bits.push(barrierNew ? '🛡 バリアを解放しました（マイページで装備）' : '🛡 バリアは既に解放済みです');
            }
            if (COSMIC_DRAGON_STAR_RANK === 3) {
                const bn = EVENT_CONFIG.bosses[0] && EVENT_CONFIG.bosses[0].name ? EVENT_CONFIG.bosses[0].name : 'ボス';
                bits.push(skinNewly ? `🎁 ${bn}のスキンを獲得！` : '🎁 スキンは既に獲得済みです');
            }
            weaponMessage = bits.filter(Boolean).join(' ／ ');
            weaponMessageTimer = Math.max(weaponMessageTimer, 320);
            updateWeaponSelector();
            gameOver('event_clear');
        }

        function fireCosmicGuardianShot(g) {
            const sx = g.x + g.width / 2;
            const sy = g.y + g.height;
            const pcx = player.x + player.width / 2;
            const pcy = player.y + player.height / 2;
            const dx = pcx - sx;
            const dy = pcy - sy;
            const dist = Math.hypot(dx, dy) || 1;
            const sp = 3.1;
            bossBullets.push({
                x: sx - 4,
                y: sy,
                width: 8,
                height: 14,
                speedX: (dx / dist) * sp * 0.4 + (Math.random() - 0.5) * 0.5,
                speedY: (dy / dist) * sp,
                color: '#ff9966'
            });
            playSound(bossShootSound);
        }

        /** 眷属が星核手前へシールドオーブを飛ばす（着弾後は弾を無効化するバリア帯） */
        function spawnCosmicGuardianShieldOrb(g) {
            if (!cosmicCoaTarget) return;
            const co = cosmicCoaTarget;
            const tcx = co.x + co.width / 2;
            const tcy = co.y + co.height * 0.58;
            const gx = g.x + g.width / 2;
            const gy = g.y + g.height;
            // コア正面（画面下＝自機方向）に扇状で配置。角スロットを周回して一点集中を避ける。
            const nSlots = 10;
            cosmicCoaShieldAngleSlot = (cosmicCoaShieldAngleSlot + 1) % nSlots;
            const u = cosmicCoaShieldAngleSlot / Math.max(1, nSlots - 1);
            const fan = 1.25;
            const theta = -fan + u * (2 * fan);
            const ring = 1 + (cosmicCoaShieldAngleSlot % 3);
            const R = 38 + ring * 12 + Math.random() * 8;
            let tx = tcx + Math.sin(theta) * R;
            let ty = tcy + Math.cos(theta) * R * 1.06;
            tx = Math.max(co.x - 32, Math.min(co.x + co.width + 32, tx));
            ty = Math.max(co.y + co.height * 0.1, Math.min(co.y + co.height + 58, ty));
            cosmicCoreShields.push({
                x: gx,
                y: gy,
                tx,
                ty,
                radius: 26 + Math.floor(Math.random() * 7),
                ttlEnd: Date.now() + 12000,
                moving: true
            });
        }

        function tryFinishCosmicCoaIfCoreDestroyed() {
            if (cosmicDragonPhase !== 'coa' || !cosmicCoaTarget) return;
            if (cosmicCoaTarget.health != null && cosmicCoaTarget.health <= 0) {
                finishCosmicDragonEventClear();
            }
        }

        function cosmicBulletHitsShieldOrb(bullet, s) {
            const bx = bullet.x + bullet.width / 2;
            const by = bullet.y + bullet.height / 2;
            const pad = Math.max(bullet.width, bullet.height) * 0.55;
            return Math.hypot(bx - s.x, by - s.y) < s.radius + pad;
        }

        function updateCosmicCoaShieldsAndDeadline() {
            if (cosmicDragonPhase !== 'coa') return;
            const now = Date.now();
            for (let si = cosmicCoreShields.length - 1; si >= 0; si--) {
                const s = cosmicCoreShields[si];
                if (now > s.ttlEnd) {
                    cosmicCoreShields.splice(si, 1);
                    continue;
                }
                if (s.moving) {
                    const dx = s.tx - s.x;
                    const dy = s.ty - s.y;
                    const d = Math.hypot(dx, dy);
                    if (d < 3.2) {
                        s.moving = false;
                        s.x = s.tx;
                        s.y = s.ty;
                    } else {
                        const sp = 2.35;
                        s.x += (dx / d) * sp;
                        s.y += (dy / d) * sp;
                    }
                }
            }
        }

        /** 30秒切れ: 雑魚・眷属・シールドを吸収しメイン星獣を復活（雑魚出現率は通常へ） */
        function performCosmicCoreAbsorbAndReviveBoss() {
            if (cosmicDragonPhase !== 'coa' || !cosmicCoaTarget) return;
            const cx = cosmicCoaTarget.x + cosmicCoaTarget.width / 2;
            const cy = cosmicCoaTarget.y + cosmicCoaTarget.height / 2;
            spawnExplosionEffect(cx, cy, 120);
            playSound(bossExplosionSound);
            for (const e of enemies) {
                spawnExplosionEffect(e.x + e.width / 2, e.y + e.height / 2, 18);
            }
            for (const g of cosmicGuardianBosses) {
                spawnExplosionEffect(g.x + g.width / 2, g.y + g.height / 2, 26);
            }
            enemies = [];
            cosmicGuardianBosses = [];
            cosmicCoreShields = [];
            bullets = [];
            bossBullets = [];
            cosmicDragonPhase = 'main';
            cosmicCoaTarget = null;
            cosmicCoaDeadlineAt = null;
            spawnCosmicDragonBossForRevive();
            bossWarningElement.textContent = '⚠️ 星核がエネルギーを回収 — メイン星獣が復活！ ⚠️';
            bossWarningElement.style.display = 'block';
            setTimeout(() => { bossWarningElement.style.display = 'none'; }, 2800);
        }

        /** 吸収後にメイン星獣のみ再出現（スコア条件なし） */
        function spawnCosmicDragonBossForRevive() {
            if (!isEventMode || EVENT_URL_SLUG !== 'cosmic-dragon') return;
            const eventBossIdx = EVENT_CONFIG.bosses.findIndex(b => b.id === 'cosmic-dragon');
            if (eventBossIdx < 0) return;
            const eventBossProfile = EVENT_CONFIG.bosses[eventBossIdx];
            bossSpawned = true;
            const baseHealth = 20 + (bossLevel - 1) * 10;
            const hpMultiplier = eventBossProfile.hpMultiplier || 1;
            const eventHealth = Math.round(baseHealth * hpMultiplier);
            boss = {
                x: canvas.width / 2 - 50,
                y: -100,
                width: 100 + (bossLevel - 1) * 10,
                height: 80 + (bossLevel - 1) * 8,
                health: eventHealth,
                maxHealth: eventHealth,
                speed: 1 * speedMultiplier,
                moveSpeed: (2 + (bossLevel - 1) * 0.5) * speedMultiplier,
                moveDirection: 1,
                points: 50 + (bossLevel - 1) * 25,
                lastShot: Date.now() + 400,
                shotInterval: Math.max(500, 2000 - (bossLevel - 1) * 200) / speedMultiplier,
                lastShockwaveAt: 0,
                sniperLocked: false,
                sniperTargetX: 0,
                sniperTargetY: 0,
                minionAbsorbStartAt: null,
                eventBossIndex: eventBossIdx,
                eventWeaponRewardKey: (eventBossProfile && eventBossProfile.weaponRewardKey)
                    ? String(eventBossProfile.weaponRewardKey).trim() : '',
                extraGimmicks: (Array.isArray(eventBossProfile.extraGimmicks)) ? [...eventBossProfile.extraGimmicks] : [],
                eventBulletCount: (eventBossProfile && eventBossProfile.bulletCount > 0)
                    ? eventBossProfile.bulletCount : null,
                featuresOverride: (eventBossProfile && eventBossProfile.featuresOverride && typeof eventBossProfile.featuresOverride === 'object')
                    ? { ...eventBossProfile.featuresOverride } : null,
                level: bossLevel
            };
            const sc = 1.58;
            boss.width = Math.round(boss.width * sc);
            boss.height = Math.round(boss.height * sc);
            boss.x = canvas.width / 2 - boss.width / 2;
            boss.isCosmicDragonMain = true;
            boss.barrierRadius = Math.round(Math.max(boss.width, boss.height) * 0.56);
            boss.cosmicAttackPhase = 0;
            const baseFO = boss.featuresOverride && typeof boss.featuresOverride === 'object'
                ? { ...boss.featuresOverride } : {};
            boss.featuresOverride = {
                ...baseFO,
                sniper: false,
                minions: false,
                mines: false,
                shockwave: false,
                absorption: false
            };
            boss.shotInterval = Math.max(boss.shotInterval, 920 / speedMultiplier);
            bossMinions = [];
            playCosmicDragonAppearCue();
        }

        applyBuiltinEventPresetFromUrl();

        // legacy: 'cruiser'/'overlord' を旧ボスIDにマッピング。
        //   admin が任意のIDで作ったイベントは boss=<そのID> または 'all' を使う想定。
        //   EVENT_CONFIG override 後にも resolveEventBossSelection() で再評価する。
        function resolveEventBossSelection() {
            const raw = eventBossSelectionRaw;
            if (raw === 'all' || !raw) return 'all';
            // 1) EVENT_CONFIG.bosses[].id と直接一致
            if (EVENT_CONFIG.bosses.some(b => b.id === raw)) return raw;
            // 2) 旧URL互換
            if (raw === 'cruiser'  && EVENT_CONFIG.bosses.some(b => b.id === 'shadow-cruiser'))  return 'shadow-cruiser';
            if (raw === 'overlord' && EVENT_CONFIG.bosses.some(b => b.id === 'shadow-overlord')) return 'shadow-overlord';
            return 'all';
        }
        let EVENT_BOSS_SELECTION = resolveEventBossSelection();

        // ボス画像（イベントモード時のみロード）
        let eventBossImages = [];
        let eventImagesReady = false;
        function preloadEventBossImages() {
            eventBossImages = [];
            eventImagesReady = false;
            const total = EVENT_CONFIG.bosses.length;
            if (!total) { eventImagesReady = true; return; }
            let loaded = 0;
            EVENT_CONFIG.bosses.forEach((b, i) => {
                if (!b.image) {
                    loaded++;
                    if (loaded === total) eventImagesReady = true;
                    return;
                }
                const img = new Image();
                img.onload = () => {
                    loaded++;
                    if (loaded === total) eventImagesReady = true;
                };
                img.onerror = () => {
                    // 画像が読めなくても本体描画にフォールバックするので継続
                    loaded++;
                    if (loaded === total) eventImagesReady = true;
                };
                img.src = b.image;
                eventBossImages[i] = img;
            });
        }
        if (isEventMode) preloadEventBossImages();

        // Firestore に active イベントがあれば EVENT_CONFIG を差し替え。
        // 管理画面で作成・編集したイベントをゲームに反映する。
        //   ?previewEventId=<id> を渡せば active 状態に関わらずそのイベントを試せる（admin から）
        async function maybeOverrideEventFromFirestore() {
            try {
                if (EVENT_URL_SLUG === 'cosmic-dragon') return;
                if (typeof firebaseDataManager === 'undefined') return;
                const previewId = urlParams.get('previewEventId');
                let active = null;
                if (previewId) {
                    const doc = await firebaseDataManager.db.collection('events').doc(previewId).get();
                    if (doc.exists) active = { id: doc.id, ...doc.data() };
                } else {
                    active = await firebaseDataManager.getActiveEvent();
                }
                if (!active || !Array.isArray(active.bosses) || !active.bosses.length) return;
                EVENT_CONFIG = {
                    id: active.slug || active.id,
                    title: active.title || EVENT_CONFIG.title,
                    subtitle: EVENT_CONFIG.subtitle,
                    endsAt: active.endsAt || EVENT_CONFIG.endsAt,
                    _fromFirestore: true,
                    bosses: active.bosses.map(b => ({
                        id: b.id || '',
                        skinKey: b.skinKey || '',
                        image: b.image || '',
                        name: b.name || 'ボス',
                        flavor: b.description || '',
                        hpMultiplier: Number(b.hpMultiplier) || 1,
                        featureLevel: Number(b.featureLevel) || 8,
                        bulletCount: Number(b.bulletCount) || 3,
                        extraGimmicks: Array.isArray(b.extraGimmicks) ? b.extraGimmicks : [],
                        // admin の個別攻撃トグル（auto は省略済み）
                        featuresOverride: (b.featuresOverride && typeof b.featuresOverride === 'object') ? b.featuresOverride : null,
                        // 撃破時に付与するメタ解放キー（例: shieldUnlocked）。空なら付与しない。
                        weaponRewardKey: (b.weaponRewardKey && String(b.weaponRewardKey).trim()) || ''
                    }))
                };
                if (isEventMode) preloadEventBossImages();
            } catch (e) {
                console.warn('event override failed:', e);
            }
        }

        // 期間内かどうか（ビルトイン既定のみ endsAt で判定。Firestore 管理イベントは active フラグ側で公開制御）
        function isEventActive() {
            if (EVENT_CONFIG && EVENT_CONFIG._fromFirestore) return true;
            try {
                return Date.now() < new Date(EVENT_CONFIG.endsAt).getTime();
            } catch (e) {
                return true;
            }
        }

        // イベントバナーの進捗テキストを更新（「スキン 1/2 獲得」のような表示）
        function updateEventBanner() {
            const banner = document.getElementById('eventBanner');
            if (!banner) return;
            if (!isEventMode) { banner.style.display = 'none'; return; }
            banner.style.display = 'block';

            let skins = {};
            try { skins = JSON.parse(localStorage.getItem('eventSkinsUnlocked') || '{}') || {}; } catch (e) {}
            const targets = selectedEventBosses();
            const unlocked = targets.filter(b => skins[b.skinKey]).length;
            const total = targets.length;

            // 単体ステージはタイトルにボス名を表示し、複数体は「影艦隊襲来」のまま
            const titleEl = document.getElementById('eventBannerTitle');
            if (titleEl) {
                titleEl.textContent = EVENT_BOSS_SELECTION === 'all'
                    ? EVENT_CONFIG.title
                    : `${targets[0].name} 戦`;
            }

            const progEl = document.getElementById('eventBannerProgress');
            if (progEl) {
                if (!isEventActive()) {
                    progEl.textContent = `(期間終了)`;
                } else if (unlocked === total) {
                    progEl.textContent = `✓ ${EVENT_BOSS_SELECTION === 'all' ? 'コンプリート！' : 'スキン獲得済み'}`;
                } else if (EVENT_BOSS_SELECTION === 'all') {
                    progEl.textContent = `スキン ${unlocked}/${total} 獲得`;
                } else {
                    progEl.textContent = `スキン未取得 / 撃破でゲット`;
                }
            }
        }

        // 出現回数カウンタ（このランで何体目のボスかを記録）。

            try { skins = JSON.parse(localStorage.getItem('eventSkinsUnlocked') || '{}') || {}; } catch (e) {}
            const newlyUnlocked = !skins[boss.skinKey];

        function applyCanvasSize() {

        let weaponMaxAmmo = {};

        let playerBarrier = null;

        let playerDirectionalShield = null;

        function isPlayerBarrierDeployed() {
            if (!playerBarrier) return false;

        function markPlayerBarrierShootVulnerability() {

        function registerPlayerBarrierAbsorb(amount) {
            if (!playerBarrier || !isPlayerBarrierDeployed()) return;

            if (a <= 0) return;
            playerBarrier.absorbedDamage = (playerBarrier.absorbedDamage || 0) + a;

        function getPlayerBarrierRadius() {

        /** 自機バリア円と軸平行矩形が交差するか（幾何のみ） */
        function _playerBarrierCircleVsAABB(rx, ry, rw, rh) {

        function getDirectionalShieldBandRects() {
            if (!isDirectionalShieldActive()) return [];
            const sh = playerDirectionalShield;
            const pcx = player.x + player.width / 2;
            const noseY = player.y;
            const hw = sh.bandHalfWidth || (player.width * 1.65);
            const lineH = sh.shieldLineThickness || 5;
            const spacing = sh.shieldLineSpacing != null ? sh.shieldLineSpacing : 12;
            const baseOff = sh.shieldLineBaseOffset != null ? sh.shieldLineBaseOffset : 10;
            const cycle = sh.shieldFlyCycle != null ? sh.shieldFlyCycle : 40;
            const t0 = Date.now() - (sh.spawnedAt || Date.now());

        let equippedWeaponIds = ['normal', 'rapid', 'shotgun', 'laser'];

        // スタミナ系: 現在装備中のスロットのみ自然回復・オーバーヒート復帰（ホルスター中に回復しない）

            Object.keys(equippedWeapons).forEach(slotKey => {
                const slot = parseInt(slotKey, 10);

                const max = weaponMaxStamina[slot] || w.staminaMax;
                const regen = (w.staminaRegen || 0) * (dt / 1000);
                weaponStamina[slot] = Math.min(max, (weaponStamina[slot] || 0) + regen);
                if (weaponOverheated[slot] && weaponStamina[slot] >= max * (w.overheatRecover || 0.4)) {
                    weaponOverheated[slot] = false;
                }
            });
        }
        function updateAmmoHud() {
            const k = +currentWeapon;
            const w = equippedWeapons[k];
            if (w && w.usesStamina) {
                const cur = Math.floor(weaponStamina[k] || 0);
                const max = weaponMaxStamina[k] || w.staminaMax;
                const pct = Math.round((cur / max) * 100);
                const bars = Math.round((cur / max) * 10);
                const bar = '▓'.repeat(bars) + '░'.repeat(10 - bars);
                const tag = weaponOverheated[k] ? ' (クールダウン)' : '';
                ammoElement.textContent = `スタミナ ${bar} ${pct}%${tag}`;
                return;
            }
            ammoElement.textContent = `弾薬: ${getCurrentAmmo()}/${getCurrentMaxAmmo()}`;
        }
        let weaponMessage = ''; // 武器解禁メッセージ
        let weaponMessageTimer = 0; // 武器メッセージの表示時間
        let weaponChangeMessage = ''; // 武器変更メッセージ
        let weaponChangeTimer = 0; // 武器変更メッセージの表示時間
        let highScore = parseInt(localStorage.getItem('shootingGameHighScore')) || 0; // 最高スコア

        let firebaseScoreSubmittedThisRun = false;

        // 難易度設定（固定）
        let gameDifficulty = localStorage.getItem('gameDifficulty') || 'normal';
        let speedMultiplier = 1.0; // 基準速度の倍率

        }

        const DEFAULT_WEAPON_LOADOUT = ['normal', 'rapid', 'shotgun', 'laser'];

        // 全武器カタログ。後で武器が増えてもロードアウトだけ差し替えられる。

                }

            blade: {

                // staminaRegen / 秒で自動回復する。0 まで使い切るとオーバーヒートし、
                // overheatRecover * staminaMax まで回復するまで振れない。
                usesStamina: true,

                runTrigger: { type: 'progressMeta', key: 'shieldUnlocked', label: 'スコア3000超またはイベント撃破で装備解放' }
            },
            // 円形バリア: 合計ダメージを吸収し切るまで維持。射撃の瞬間のみ弾を通す。
            barrier: {
                id: 'barrier', name: 'バリア',
                unlockProgressKey: 'barrierUnlocked',
                isBarrierWeapon: true,
                barrierMaxAbsorbDamage: 3,
                barrierRadius: 72,
                ammoCost: 1, maxAmmo: 5, bulletCount: 1, spread: 0, speed: 0,
                damage: 0, range: 0, pierce: 0, width: 0, height: 0, color: '#66ccff',
                runTrigger: { type: 'progressMeta', key: 'barrierUnlocked', label: '特定イベントボス撃破で装備解放' }
            }
        };

        // runTrigger 評価器。新しい武器・トリガーを追加するときはここを増やすだけで対応できる。
        // 'all' は AND の複合トリガー。requirements の各要素を再帰的に評価する。
        const RUN_TRIGGER_EVALUATORS = {
            always: () => true,
            bossLevelDefeated: (trigger, ctx) => {
                const level = trigger.level || 1;
                return ctx.defeatedBossLevels.has(level);
            },
            scoreReached: (trigger, ctx) => ctx.score >= (trigger.value || 0),
            supplyCollected: (trigger, ctx) => (ctx.suppliesCollected || 0) >= (trigger.count || 1),
            enemyKillCount: (trigger, ctx) => (ctx.enemyKillCount || 0) >= (trigger.count || 1),
            // damageTakenInRun: livesLost が max 以下のあいだ TRUE（例: max=0 で「ノーダメ」）
            damageTakenInRun: (trigger, ctx) => (ctx.livesLost || 0) <= (trigger.max || 0),
            livesLost: (trigger, ctx) => (ctx.livesLost || 0) >= (trigger.count || 1),
            // メタ層の weaponProgress（例: shieldUnlocked）。マイページと同じ localStorage / Firebase を参照。
            progressMeta: (trigger, ctx) => !!(ctx.metaProgress && trigger.key && ctx.metaProgress[trigger.key]),
            all: (trigger, ctx) => Array.isArray(trigger.requirements)
                && trigger.requirements.every(req => evaluateRunTrigger(req, ctx))
        };

        function getRangeLabel(range) {
            if (range <= 320) return '短';
            if (range <= 700) return '中';
            return '長';
        }

        function getUseConditionLabel(weapon) {
            const trigger = weapon.runTrigger || { type: 'always' };
            if (trigger.type === 'always') return '';
            return ` / ${trigger.label || '解放条件あり'}`;
        }

        // ロック中武器の解放条件を「現在値 / 必要値」で動的に表示するためのテキスト整形。
        function describeTriggerProgress(trigger, ctx) {
            const t = trigger || { type: 'always' };
            if (t.type === 'all' && Array.isArray(t.requirements)) {
                return t.requirements.map(r => describeSingleTriggerProgress(r, ctx)).join(' + ');
            }
            return describeSingleTriggerProgress(t, ctx);
        }

        function describeSingleTriggerProgress(t, ctx) {
            switch (t.type) {
                case 'bossLevelDefeated': {
                    const level = t.level || 1;
                    const ok = ctx.defeatedBossLevels && ctx.defeatedBossLevels.has(level);
                    return ok ? `Lv${level}ボス✓` : `Lv${level}ボス未撃破`;
                }
                case 'supplyCollected': {
                    const need = t.count || 1;
                    const cur = ctx.suppliesCollected || 0;
                    return `補給 ${Math.min(cur, need)}/${need}`;
                }
                case 'enemyKillCount': {
                    const need = t.count || 1;
                    const cur = ctx.enemyKillCount || 0;
                    return `撃破 ${Math.min(cur, need)}/${need}`;
                }
                case 'damageTakenInRun': {
                    const ok = (ctx.livesLost || 0) <= (t.max || 0);
                    return ok ? 'ノーダメ✓' : 'ノーダメ失敗';
                }
                case 'livesLost': {
                    const need = t.count || 1;
                    const cur = ctx.livesLost || 0;
                    return `被弾 ${Math.min(cur, need)}/${need}`;
                }
                case 'progressMeta': {
                    const ok = ctx.metaProgress && t.key && ctx.metaProgress[t.key];
                    return ok ? `${t.key}✓` : (t.label || 'イベント条件未達');
                }
                case 'scoreReached':
                    return `スコア ${ctx.score || 0}/${t.value || 0}`;
                case 'always':
                    return 'いつでも';
                default:
                    return t.label || t.type || '解放条件あり';
            }
        }

        function sanitizeLoadout(rawLoadout) {
            const hasSavedLoadout = Array.isArray(rawLoadout);
            const loadout = hasSavedLoadout ? rawLoadout : DEFAULT_WEAPON_LOADOUT;
            const result = ['normal'];
            const used = new Set(result);
            for (let i = 1; i < 4; i++) {
                const candidate = loadout[i];
                if (weaponCatalog[candidate] && candidate !== 'normal' && !used.has(candidate)
                    && isWeaponMetaUnlockedForLoadout(candidate)) {
                    result.push(candidate);
                    used.add(candidate);
                } else {
                    const fallback = hasSavedLoadout ? '' : (DEFAULT_WEAPON_LOADOUT.find(id => !used.has(id) && isWeaponMetaUnlockedForLoadout(id)) || '');
                    result.push(fallback);
                    if (fallback) used.add(fallback);
                }
            }
            return result;
        }

        function isWeaponMetaUnlockedForLoadout(weaponId) {
            const w = weaponCatalog[weaponId];
            if (!w || !w.unlockProgressKey) return true;
            try {
                const p = JSON.parse(localStorage.getItem('weaponProgress') || '{}');
                return !!p[w.unlockProgressKey];
            } catch (e) {
                return false;
            }
        }

        // ログイン状態（'login' or 'guest'）。Firebase auth と localStorage 双方を見る。
        let loadoutMode = 'guest';
        // ラン中のトリガー評価に使う状態。装備武器の「覚醒条件」をここから読み取る。
        let runState = {
            defeatedBossLevels: new Set(),  // この出撃で倒したボスレベル（1, 2, 3...）
            suppliesCollected: 0,            // 補給ユニット回収数
            enemyKillCount: 0,               // 雑魚撃破累計（このラン）
            livesLost: 0                     // 被弾でライフを失った回数（このラン）
            // score は外側のグローバル `score` を都度参照する
        };

        function detectLoadoutMode() {
            try {
                if (typeof firebase !== 'undefined' && firebase.auth && firebase.auth().currentUser) {
                    return 'login';
                }
            } catch (e) {
                // 初期化前などは無視
            }
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            const playerName = localStorage.getItem('playerName');
            const firebaseUid = localStorage.getItem('firebaseUid');
            return (isLoggedIn && playerName && firebaseUid) ? 'login' : 'guest';
        }

        function loadWeaponLoadout() {
            loadoutMode = detectLoadoutMode();

            if (loadoutMode === 'login') {
                try {
                    const saved = JSON.parse(localStorage.getItem('weaponLoadout') || 'null');
                    equippedWeaponIds = sanitizeLoadout(saved);
                } catch (e) {
                    equippedWeaponIds = [...DEFAULT_WEAPON_LOADOUT];
                }
            } else {
                // 未ログインは在来の固定編成。
                equippedWeaponIds = [...DEFAULT_WEAPON_LOADOUT];
            }

            // ランごとの解放状態は両モード共通で必ずリセット。
            // 「装備可否（メタ層）」と「使用可否（ラン層）」を独立させる設計。
            runState = {
                defeatedBossLevels: new Set(),
                suppliesCollected: 0,
                enemyKillCount: 0,
                livesLost: 0
            };
            barrierRearmSupplyPickupsNeeded = 0;

            equippedWeapons = {};
            weaponMaxAmmo = {};
            weaponAmmo = {};
            weaponStamina = {};
            weaponMaxStamina = {};
            weaponOverheated = {};
            equippedWeaponIds.forEach((weaponId, index) => {
                const slot = index + 1;
                const weapon = weaponCatalog[weaponId] || null;
                if (!weapon) return;
                equippedWeapons[slot] = weapon;
                weaponMaxAmmo[slot] = weapon.maxAmmo;
                weaponAmmo[slot] = weapon.maxAmmo;
                if (weapon.usesStamina) {
                    weaponMaxStamina[slot] = weapon.staminaMax;
                    weaponStamina[slot] = weapon.staminaMax;
                    weaponOverheated[slot] = false;
                }
            });
            currentWeapon = 1;
            recomputeUnlockedSlots();
            applyCosmicDragonDifficultyBonuses();
        }

        /** 星獣襲来: 中級以上で通常弾の弾薬上限を増やす（上級はさらに多め） */
        function applyCosmicDragonDifficultyBonuses() {
            if (!isEventMode || EVENT_URL_SLUG !== 'cosmic-dragon') return;
            const rank = COSMIC_DRAGON_STAR_RANK;
            if (rank < 2) return;
            const bonus = rank >= 3 ? 70 : 40;
            Object.keys(equippedWeapons).forEach((slotKey) => {
                const slot = parseInt(slotKey, 10);
                const w = equippedWeapons[slot];
                if (!w || w.id !== 'normal') return;
                weaponMaxAmmo[slot] = (weaponMaxAmmo[slot] || 0) + bonus;
                weaponAmmo[slot] = (weaponAmmo[slot] || 0) + bonus;
            });
        }

        function buildTriggerContext() {
            let metaProgress = {};
            try {
                metaProgress = JSON.parse(localStorage.getItem('weaponProgress') || '{}') || {};
            } catch (e) {
                metaProgress = {};
            }
            return {
                score: score,
                defeatedBossLevels: runState.defeatedBossLevels,
                suppliesCollected: runState.suppliesCollected,
                enemyKillCount: runState.enemyKillCount,
                livesLost: runState.livesLost,
                metaProgress
            };
        }

        function evaluateRunTrigger(trigger, ctx) {
            const t = trigger || { type: 'always' };
            const evaluator = RUN_TRIGGER_EVALUATORS[t.type];
            if (!evaluator) return false;
            return !!evaluator(t, ctx || buildTriggerContext());
        }

        function isWeaponUsable(weapon) {
            if (!weapon) return false;
            // イベントモードはランごとの覚醒条件 (runTrigger) を無効化。
            // 装備しているスロットなら即座に使えるようにして、ボス戦特化のステージ性を出す。
            if (isEventMode) return true;
            return evaluateRunTrigger(weapon.runTrigger);
        }

        function recomputeUnlockedSlots() {
            unlockedWeapons = Object.keys(equippedWeapons)
                .map(Number)
                .filter(slot => isWeaponUsable(equippedWeapons[slot]))
                .sort((a, b) => a - b);
            if (unlockedWeapons.length === 0) {
                unlockedWeapons = [1];
            }
            if (!unlockedWeapons.includes(currentWeapon)) {
                currentWeapon = +unlockedWeapons[0];
            }
            // 現在武器が drone でなくなったらコンパニオンを撤収
            refreshDrones();
            // ラン進捗 HUD を更新
            updateRunStatusHud();
        }

        // ラン進捗（撃破ボス・補給・キル・被弾）の表示。装備中にロック武器が残っているときだけ表示する。
        const runStatusElement     = document.getElementById('runStatus');
        const runStatusBodyElement = document.getElementById('runStatusBody');
        function updateRunStatusHud() {
            if (!runStatusElement || !runStatusBodyElement) return;
            const slots = Object.keys(equippedWeapons).map(Number);
            const hasLocked = slots.some(slot => !isWeaponUsable(equippedWeapons[slot]));
            if (!hasLocked) {
                runStatusElement.style.display = 'none';
                return;
            }
            runStatusElement.style.display = 'block';
            const levelsArr = Array.from(runState.defeatedBossLevels).sort((a, b) => a - b);
            const lvText = levelsArr.length > 0
                ? levelsArr.map(l => `Lv${l}`).join(' ')
                : '<span class="warn">未撃破</span>';
            const noDamage = runState.livesLost === 0
                ? '<span class="ok">継続中</span>'
                : `<span class="warn">${runState.livesLost}回 被弾</span>`;
            runStatusBodyElement.innerHTML =
                `<div class="run-status-row"><span class="label">撃破ボス</span>${lvText}</div>` +
                `<div class="run-status-row"><span class="label">補給</span>${runState.suppliesCollected || 0}個</div>` +
                `<div class="run-status-row"><span class="label">敵撃破</span>${runState.enemyKillCount || 0}体</div>` +
                `<div class="run-status-row"><span class="label">ノーダメ</span>${noDamage}</div>`;
        }

        function canUseWeapon(weapon) {
            if (!weapon) return { ok: false, reason: '未装備' };
            if (isWeaponUsable(weapon)) return { ok: true };
            const trigger = weapon.runTrigger || { type: 'always' };
            return { ok: false, reason: trigger.label || '未解放' };
        }

        // ───── 武器メカニクス用ユーティリティ ────────────────────────────────
        // 指定座標から最も近い敵（敵がいないならボス）を返す。
        function findNearestTarget(x, y) {
            let nearest = null;
            let nearestDist = Infinity;
            for (const e of enemies) {
                const dx = (e.x + (e.width || e.size || 0) / 2) - x;
                const dy = (e.y + (e.height || e.size || 0) / 2) - y;
                const d = dx * dx + dy * dy;
                if (d < nearestDist) { nearest = e; nearestDist = d; }
            }
            if (!nearest && boss) {
                return boss;
            }
            return nearest;
        }

        // bullet の現在の進行ベクトルを target 方向に lerp する（追尾）。
        // 速度の大きさは bullet.maxSpeed に保たれる。lerp 後に再正規化することで、
        // ターゲットが真後ろにある／追尾が往復するなどの局面でも速度が抜けて空中停止しない。
        function steerBulletTowards(bullet, target, force) {
            const refSpeed = bullet.maxSpeed || Math.hypot(bullet.speedX, bullet.speedY) || 1;
            const tx = target.x + (target.width || target.size || 0) / 2;
            const ty = target.y + (target.height || target.size || 0) / 2;
            const dx = tx - bullet.x;
            const dy = ty - bullet.y;
            const dist = Math.hypot(dx, dy) || 1;
            const desiredX = (dx / dist) * refSpeed;
            const desiredY = (dy / dist) * refSpeed;
            const newX = bullet.speedX * (1 - force) + desiredX * force;
            const newY = bullet.speedY * (1 - force) + desiredY * force;
            const newMag = Math.hypot(newX, newY);
            if (newMag > 0.0001) {
                bullet.speedX = (newX / newMag) * refSpeed;
                bullet.speedY = (newY / newMag) * refSpeed;
            } else {
                // 万一抜けたら現在向きを維持しつつ refSpeed で再付与
                bullet.speedX = (desiredX / refSpeed) * refSpeed;
                bullet.speedY = (desiredY / refSpeed) * refSpeed;
            }
        }

        // 範囲内の敵 / ボス を引き寄せる（重力弾用）。
        function applyGravityPull(bullet) {
            const radiusSq = bullet.pullRadius * bullet.pullRadius;
            const cx = bullet.x + bullet.width / 2;
            const cy = bullet.y + bullet.height / 2;
            const pullStep = (target) => {
                const tx = target.x + (target.width || target.size || 0) / 2;
                const ty = target.y + (target.height || target.size || 0) / 2;
                const dx = cx - tx;
                const dy = cy - ty;
                const distSq = dx * dx + dy * dy;
                if (distSq <= 1 || distSq > radiusSq) return;
                const dist = Math.sqrt(distSq);
                target.x += (dx / dist) * bullet.pullForce;
                target.y += (dy / dist) * bullet.pullForce;
            };
            for (const e of enemies) pullStep(e);
            if (boss) pullStep(boss);
        }

        // 範囲爆発の視覚エフェクト（広がる輪 + フラッシュ）
        let explosionEffects = [];
        function spawnExplosionEffect(x, y, radius) {
            explosionEffects.push({ x, y, radius, life: 24, maxLife: 24 });
        }

        function explosionOptsFromPlayerBullet(bullet) {
            if (bullet && bullet.launcherClearsAllCosmicShields) return { stripAllCosmicShields: true };
            return undefined;
        }

        // 範囲爆発: 中心(x,y)から radius 内の敵 / ボス に damage を与える（ランチャー / 機雷）。
        // opts.stripAllCosmicShields: 星核防衛中、ランチャー起爆時に小型ドラゴンのバリアを全破壊。
        function applyExplosion(x, y, radius, damage, opts) {
            opts = opts || {};
            if (opts.stripAllCosmicShields && cosmicDragonPhase === 'coa' && cosmicCoreShields.length > 0) {
                for (let si = cosmicCoreShields.length - 1; si >= 0; si--) {
                    const s = cosmicCoreShields[si];
                    spawnExplosionEffect(s.x, s.y, 26);
                }
                cosmicCoreShields = [];
            }
            spawnExplosionEffect(x, y, radius);
            playSound(explosionSound);
            const radiusSq = radius * radius;
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                const ex = e.x + (e.width || e.size || 0) / 2;
                const ey = e.y + (e.height || e.size || 0) / 2;
                const dx = ex - x;
                const dy = ey - y;
                if (dx * dx + dy * dy <= radiusSq) {
                    e.health -= damage;
                    if (e.health <= 0) {
                        enemies.splice(i, 1);
                        score += e.points;
                        scoreElement.textContent = `スコア: ${score}`;
                        runState.enemyKillCount++;
                    }
                }
            }
            if (boss) {
                const bx = boss.x + boss.width / 2;
                const by = boss.y + boss.height / 2;
                const dx = bx - x;
                const dy = by - y;
                if (dx * dx + dy * dy <= radiusSq) {
                    boss.health -= damage;
                }
            }
            for (let gi = cosmicGuardianBosses.length - 1; gi >= 0; gi--) {
                const g = cosmicGuardianBosses[gi];
                const gx = g.x + g.width / 2;
                const gy = g.y + g.height / 2;
                const ddx = gx - x;
                const ddy = gy - y;
                if (ddx * ddx + ddy * ddy <= radiusSq) {
                    g.health -= damage;
                    if (g.health <= 0) {
                        spawnExplosionEffect(g.x + g.width / 2, g.y + g.height / 2, 36);
                        cosmicGuardianBosses.splice(gi, 1);
                    }
                }
            }
            for (let si = cosmicCoreShields.length - 1; si >= 0; si--) {
                const s = cosmicCoreShields[si];
                const dx = s.x - x;
                const dy = s.y - y;
                if (dx * dx + dy * dy <= radiusSq + s.radius * s.radius * 0.25) {
                    cosmicCoreShields.splice(si, 1);
                    spawnExplosionEffect(s.x, s.y, 22);
                }
            }
            if (cosmicDragonPhase === 'coa' && cosmicCoaTarget && cosmicCoaTarget.health != null) {
                const c = cosmicCoaTarget;
                const crx = c.x + c.width / 2;
                const cry = c.y + c.height / 2;
                const dcx = crx - x;
                const dcy = cry - y;
                if (dcx * dcx + dcy * dcy <= radiusSq) {
                    c.health -= damage;
                    if (c.health < 0) c.health = 0;
                }
            }
            tryFinishCosmicCoaIfCoreDestroyed();
            recomputeUnlockedSlots();
        }

        function updateExplosionEffects() {
            explosionEffects = explosionEffects.filter(e => { e.life--; return e.life > 0; });
        }

        // ───── ボス衝撃波 ─────
        function updateBossShockwaves() {
            if (bossShockwaves.length === 0) return;
            const now = Date.now();
            const pcx = player.x + player.width / 2;
            const pcy = player.y + player.height / 2;
            const playerRadius = Math.max(player.width, player.height) / 2;
            for (let i = bossShockwaves.length - 1; i >= 0; i--) {
                const sw = bossShockwaves[i];
                if (now < sw.chargeUntil) continue;     // 予兆中は拡張しない
                sw.radius += sw.expandSpeed;
                if (!sw.hit) {
                    if (!isPlayerBarrierDeployed()) {
                        const dist = Math.hypot(pcx - sw.cx, pcy - sw.cy);
                        if (Math.abs(dist - sw.radius) <= sw.thickness / 2 + playerRadius) {
                            sw.hit = true;
                            // 1 衝撃波 = ライフ 1 個分（複数ライフ消費を防ぐため hit フラグで一回だけ）
                            const dmg = sw.damage || BOSS_SHOCKWAVE_DAMAGE_LIVES;
                            runTookDamage = true;
                            lives -= dmg;
                            if (lives < 0) lives = 0;
                            livesElement.textContent = `ライフ: ${lives}`;
                            runState.livesLost += dmg;
                            recomputeUnlockedSlots();
                            playSound(explosionSound);
                            triggerPlayerHurtFeedback(dmg);
                            shockwaveFlashUntil = now + BOSS_SHOCKWAVE_FLASH_MS;
                            if (lives <= 0) gameOver('gameover');
                        }
                    }
                }
                if (sw.radius > sw.maxRadius) bossShockwaves.splice(i, 1);
            }
        }

        // ───── ボス機雷 ─────
        function explodeBossMine(mine) {
            if (mine.triggered) return;
            mine.triggered = true;
            const cx = mine.x + mine.size / 2;
            const cy = mine.y + mine.size / 2;
            spawnExplosionEffect(cx, cy, BOSS_MINE_EXPLODE_RADIUS);
            playSound(explosionSound);
            // プレイヤーが範囲内ならライフを 1 個分減らす
            const pcx = player.x + player.width / 2;
            const pcy = player.y + player.height / 2;
            const dist = Math.hypot(pcx - cx, pcy - cy);
            if (dist <= BOSS_MINE_EXPLODE_RADIUS && !isPlayerBarrierDeployed()) {
                runTookDamage = true;
                lives -= BOSS_MINE_EXPLODE_DAMAGE_LIVES;
                if (lives < 0) lives = 0;
                livesElement.textContent = `ライフ: ${lives}`;
                runState.livesLost += BOSS_MINE_EXPLODE_DAMAGE_LIVES;
                recomputeUnlockedSlots();
                shockwaveFlashUntil = Date.now() + BOSS_SHOCKWAVE_FLASH_MS;
                triggerPlayerHurtFeedback(BOSS_MINE_EXPLODE_DAMAGE_LIVES);
                if (lives <= 0) gameOver('gameover');
            }
        }

        function updateBossMines() {
            if (bossMines.length === 0) return;
            const now = Date.now();
            for (let i = bossMines.length - 1; i >= 0; i--) {
                const m = bossMines[i];
                if (!m.settled) {
                    m.y += m.vy;
                    m.x += m.vx;
                    // 横方向の壁で反射
                    if (m.x < 0)                       { m.x = 0; m.vx = -m.vx; }
                    if (m.x > canvas.width - m.size)   { m.x = canvas.width - m.size; m.vx = -m.vx; }
                    // 目標 Y に到達したら着地
                    if (m.y >= m.targetY) {
                        m.y = m.targetY;
                        m.vx = 0;
                        m.vy = 0;
                        m.settled = true;
                    }
                }
                // 寿命切れ → 自爆
                if (now >= m.expiresAt) {
                    explodeBossMine(m);
                    bossMines.splice(i, 1);
                    continue;
                }
                // プレイヤー接触 → 即爆発
                if (checkCollision(player, m)) {
                    explodeBossMine(m);
                    bossMines.splice(i, 1);
                    continue;
                }
                // 念のため画面外消滅（横向き反射ミスのフェールセーフ）
                if (m.y > canvas.height + 60) {
                    bossMines.splice(i, 1);
                }
            }
        }

        function drawBossMines() {
            if (bossMines.length === 0) return;
            const now = Date.now();
            ctx.save();
            bossMines.forEach(m => {
                const cx = m.x + m.size / 2;
                const cy = m.y + m.size / 2;
                const remaining = m.expiresAt - now;
                let blinkInterval = 0;
                if (remaining < BOSS_MINE_LIFE_MS - BOSS_MINE_FAST_BLINK_AT_MS) blinkInterval = 80;
                else if (remaining < BOSS_MINE_LIFE_MS - BOSS_MINE_BLINK_AT_MS) blinkInterval = 200;
                const visible = blinkInterval === 0 || (Math.floor(now / blinkInterval) % 2 === 0);
                // AoE 範囲のうっすらした円（残り 3 秒以下から表示）
                if (remaining < 3000) {
                    const t = 1 - remaining / 3000;
                    ctx.globalAlpha = 0.08 + 0.18 * t;
                    ctx.fillStyle = '#ff6633';
                    ctx.beginPath();
                    ctx.arc(cx, cy, BOSS_MINE_EXPLODE_RADIUS, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = visible ? 1 : 0.3;
                // 機雷本体
                ctx.fillStyle = remaining < 2000 ? '#ff3344' : '#ffaa00';
                ctx.shadowColor = ctx.fillStyle;
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(cx, cy, m.size / 2, 0, Math.PI * 2);
                ctx.fill();
                // 表面のスパイク
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#552200';
                ctx.lineWidth = 2;
                for (let s = 0; s < 8; s++) {
                    const a = (s / 8) * Math.PI * 2;
                    const r1 = m.size / 2;
                    const r2 = m.size / 2 + 4;
                    ctx.beginPath();
                    ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
                    ctx.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2);
                    ctx.stroke();
                }
                // 中心のコア
                ctx.fillStyle = '#220000';
                ctx.beginPath();
                ctx.arc(cx, cy, m.size / 4, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();
        }

        function drawBossShockwaves() {
            const now = Date.now();
            // 被弾フラッシュ（衝撃波がなくても短時間表示）
            if (now < shockwaveFlashUntil) {
                const t = (shockwaveFlashUntil - now) / BOSS_SHOCKWAVE_FLASH_MS;
                ctx.save();
                ctx.fillStyle = `rgba(255, 60, 120, ${0.45 * t})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.restore();
            }
            if (bossShockwaves.length === 0) return;
            ctx.save();
            bossShockwaves.forEach(sw => {
                if (now < sw.chargeUntil) {
                    // 予兆: ボスの周りに収縮するリング
                    const t = 1 - (sw.chargeUntil - now) / BOSS_SHOCKWAVE_CHARGE_MS;
                    const r = 80 - 60 * t;
                    ctx.globalAlpha = 0.3 + 0.6 * t;
                    ctx.strokeStyle = '#ff44aa';
                    ctx.lineWidth = 3 + 4 * t;
                    ctx.setLineDash([8, 6]);
                    ctx.beginPath();
                    ctx.arc(sw.cx, sw.cy, Math.max(8, r), 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    return;
                }
                const lifeRatio = 1 - sw.radius / sw.maxRadius;
                ctx.globalAlpha = 0.85 * lifeRatio;
                // 外輪（鋭いリング）
                ctx.strokeStyle = '#ff66cc';
                ctx.shadowColor = '#ff66cc';
                ctx.shadowBlur = 18;
                ctx.lineWidth = sw.thickness;
                ctx.beginPath();
                ctx.arc(sw.cx, sw.cy, sw.radius, 0, Math.PI * 2);
                ctx.stroke();
                // 内側の白いコア
                ctx.globalAlpha = 0.6 * lifeRatio;
                ctx.strokeStyle = '#ffffff';
                ctx.shadowBlur = 0;
                ctx.lineWidth = sw.thickness * 0.35;
                ctx.beginPath();
                ctx.arc(sw.cx, sw.cy, sw.radius, 0, Math.PI * 2);
                ctx.stroke();
            });
            ctx.restore();
        }

        function drawExplosionEffects() {
            if (explosionEffects.length === 0) return;
            ctx.save();
            explosionEffects.forEach(e => {
                const t = 1 - (e.life / e.maxLife);          // 0 → 1 で広がる
                const r = e.radius * (0.3 + t * 0.9);
                const alpha = 1 - t;
                // 外輪
                ctx.globalAlpha = alpha * 0.9;
                ctx.strokeStyle = '#ffaa33';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
                ctx.stroke();
                // 内側のフラッシュ
                ctx.globalAlpha = alpha * 0.35;
                ctx.fillStyle = '#ffdd66';
                ctx.beginPath();
                ctx.arc(e.x, e.y, r * 0.55, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();
        }

        // 命中時の状態異常付与（時空弾）。enemy / boss どちらでも slowedUntil を持たせる。
        function applySlowToTarget(target, durationMs) {
            if (!target) return;
            const now = Date.now();
            const candidate = now + durationMs;
            target.slowedUntil = Math.max(target.slowedUntil || 0, candidate);
        }

        // ───── 随伴機（drone）自律ユニット ────────────────────────────────────
        // 射撃キーで 1 機ずつ放出される。HP1 / droneLifeMs で自爆 / 最寄り敵を自動追尾射撃。
        let drones = [];
        const DRONE_BODY_SIZE = 18;

        function spawnDrone() {
            const w = weaponCatalog.drone;
            if (!w) return false;
            const now = Date.now();
