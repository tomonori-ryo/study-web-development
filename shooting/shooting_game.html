                // ボス警告表示（レベルに応じてメッセージ変更）
                const levelText = bossLevel > 1 ? `レベル${bossLevel} ` : '';
                bossWarningElement.textContent = `⚠️ ${levelText}ボス出現！ ⚠️`;
                bossWarningElement.style.display = 'block';
                setTimeout(() => {
                    bossWarningElement.style.display = 'none';
                }, 3000);
            }
        }

        // 部下生成
        function spawnBossMinions(currentBossLevel) {
            const minionLevel = currentBossLevel === 9 ? 1 : 2;
            for (let i = 0; i < BOSS_MINION_COUNT; i++) {
                spawnSingleBossMinion(minionLevel, i);
            }
        }

        // 単体の部下を生成（再生成にも使う）
        function spawnSingleBossMinion(minionLevel, slotIndex) {
            const w = 60 + (minionLevel - 1) * 10;
            const h = 50 + (minionLevel - 1) * 8;
            // slotIndex で左右の出現位置を決める。0=左、1=右
            const x = slotIndex === 0 ? 60 : canvas.width - 60 - w;
            bossMinions.push({
                x, y: 80,
                width: w, height: h,
                health: 12 + (minionLevel - 1) * 6,
                maxHealth: 12 + (minionLevel - 1) * 6,
                vx: (slotIndex === 0 ? 1 : -1) * (1.4 + (minionLevel - 1) * 0.3),
                level: minionLevel,
                points: 30 + (minionLevel - 1) * 15,
                lastShot: Date.now() + slotIndex * 600,
                shotInterval: 1800,
                beingAbsorbed: false,
                slotIndex
            });
        }

        // 敵生成
        function spawnEnemy() {
            // スコアが100の時と500の倍数のボス以外は通常の敵も生成
            if (boss && (score === 100 || score % 500 === 0)) return; // 特定のボス出現中のみ通常の敵を生成しない
            
            const enemyTypes = getEnemyTypes();
            enemyTypes.forEach(type => {
                if (Math.random() < type.spawnRate) {
                    enemies.push({
                        x: Math.random() * (canvas.width - type.size),
                        y: -type.size,
                        width: type.size,
                        height: type.size,
                        speed: type.speed + Math.random() * 1,
                        color: type.color,
                        points: type.points,
                        health: type.health,
                        maxHealth: type.health,
                        enemyType: type.type // 敵のタイプを追加
                    });
                }
            });
        }

        // 支援物資生成
        function spawnSupplyUnits() {
            // スコアが100の時と500の倍数のボス以外は支援物資も生成
            if (boss && (score === 100 || score % 500 === 0)) return; // 特定のボス出現中のみ支援物資を生成しない
            
            // ランダムで支援物資を生成（難易度に応じて確率調整）
            const spawnRate = 0.003 * speedMultiplier; // 難易度に応じて生成確率を調整
            if (Math.random() < spawnRate) {
                supplyUnits.push({
                    x: Math.random() * (canvas.width - 28),
                    y: Math.random() * (canvas.height / 2), // 画面上半分に配置
                    width: 28,
                    height: 28,
                    color: '#00ff00',
                    isCollected: false
                });
            }
        }
        
        // ライフ回復アイテム生成
        function spawnHealthItems() {
            // スコアが100の時と500の倍数のボス以外はライフ回復アイテムも生成
            if (boss && (score === 100 || score % 500 === 0)) return; // 特定のボス出現中のみライフ回復アイテムを生成しない
            
            // 低確率でライフ回復アイテムを生成（弾薬補給より低い確率、難易度に応じて確率調整）
            const spawnRate = 0.0001 * speedMultiplier; // 難易度に応じて生成確率を調整
            if (Math.random() < spawnRate) {
                healthItems.push({
                    x: Math.random() * (canvas.width - 30),
                    y: Math.random() * (canvas.height / 2), // 画面上半分に配置
                    width: 30,
                    height: 30,
                    color: '#ff69b4', // ピンク色
                    isCollected: false
                });
            }
        }

        // 衝突判定
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        // プレイヤー戦闘機描画
        function drawPlayer() {
            const x = player.x;
            const y = player.y;
            const w = player.width;
            const h = player.height;
            
            // 武器変更時のエフェクト
            if (weaponChangeTimer > 0) {
                ctx.shadowColor = equippedWeapons[currentWeapon].color;
                ctx.shadowBlur = 15;
            }
            
            // 戦闘機の本体（青）
            ctx.fillStyle = '#0066cc';
            ctx.fillRect(x + w/4, y + h/3, w/2, h/2);
            
            // 戦闘機の機首（白）
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(x + w/3, y, w/3, h/3);
            
            // 戦闘機の翼（青）
            ctx.fillStyle = '#0066cc';
            ctx.fillRect(x, y + h/3, w/4, h/3);
            ctx.fillRect(x + 3*w/4, y + h/3, w/4, h/3);
            
            // 戦闘機の尾翼（青）
            ctx.fillStyle = '#0066cc';
            ctx.fillRect(x + w/3, y + 2*h/3, w/3, h/3);
            
            // エンジン部分（オレンジ）
            ctx.fillStyle = '#ff6600';
            ctx.fillRect(x + w/4, y + h/2, w/2, h/6);
            
            // コックピット（水色）
            ctx.fillStyle = '#00ccff';
            ctx.fillRect(x + w/3, y + h/4, w/3, h/6);
            
            // 武器変更時のエフェクトをリセット
            if (weaponChangeTimer > 0) {
                ctx.shadowBlur = 0;
            }
        }

        // 弾丸描画
        // 三日月の斬撃（ブレード）。中心を通過する円弧を描き、内側に白い芯を入れる。
        // 生成時刻からの経過で開閉アニメーション（出現直後はわずかに細く、徐々に開く）。
        function drawSlash(bullet, now) {
            const cx = bullet.x + bullet.width / 2;
            const cy = bullet.y + bullet.height / 2;
            const age = Math.min(120, now - (bullet.spawnedAt || now));
            const t = Math.min(1, age / 80);                            // 0 → 1 の開閉
            const radius = 18 + t * 6;
            // 進行方向（上方）に膨らむ三日月にするため、円の中心を弾の少し下に
            const arcCenterY = cy + 14 + (1 - t) * 4;
            const startAngle = Math.PI * (1.18 - 0.08 * t);
            const endAngle   = Math.PI * (1.82 + 0.08 * t);
            ctx.save();
            // 外周のオーラ
            ctx.globalAlpha = 0.85;
            ctx.strokeStyle = bullet.color || '#00ffaa';
            ctx.shadowColor = bullet.color || '#00ffaa';
            ctx.shadowBlur = 22;
            ctx.lineWidth = 7;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(cx, arcCenterY, radius, startAngle, endAngle);
            ctx.stroke();
            // 中央の白い刃芯
            ctx.shadowBlur = 6;
            ctx.lineWidth = 2.2;
            ctx.strokeStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(cx, arcCenterY, radius, startAngle + 0.04, endAngle - 0.04);
            ctx.stroke();
            // 両端の閃光
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffffff';
            const sx = cx + Math.cos(startAngle) * radius;
            const sy = arcCenterY + Math.sin(startAngle) * radius;
            const ex = cx + Math.cos(endAngle) * radius;
            const ey = arcCenterY + Math.sin(endAngle) * radius;
            ctx.beginPath();
            ctx.arc(sx, sy, 2.2, 0, Math.PI * 2);
            ctx.arc(ex, ey, 2.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawBullets() {
            const now = Date.now();
            bullets.forEach(bullet => {
                // ブレード: 三日月の斬撃として描画
                if (bullet.bulletStyle === 'slash') {
                    drawSlash(bullet, now);
                    return;
                }
                // 機雷（lifeFrames あり + 速度ゼロ）は点滅 + 残り時間で色を変えて警告
                const isMine = (bullet.lifeFrames !== null && bullet.lifeFrames !== undefined
                                && bullet.speedX === 0 && bullet.speedY === 0);
                if (isMine) {
                    const t = bullet.lifeFrames / 360;
                    // 残量に応じて黄→橙→赤に
                    const danger = (t < 0.3) ? '#ff3322' : (t < 0.6 ? '#ff9933' : '#ffcc33');
                    // 残り少ないほど高速点滅
                    const blinkRate = (t < 0.3) ? 80 : (t < 0.6 ? 160 : 320);
                    const visible = (Math.floor(now / blinkRate) % 2) === 0;
                    if (visible) {
                        ctx.fillStyle = danger;
                        ctx.shadowColor = danger;
                        ctx.shadowBlur = 14;
                        ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
                        // 中央のドット
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = '#220000';
                        ctx.fillRect(bullet.x + bullet.width / 2 - 2, bullet.y + bullet.height / 2 - 2, 4, 4);
                    } else {
                        // 点滅で消える瞬間も外枠は薄く残す
                        ctx.strokeStyle = danger;
                        ctx.globalAlpha = 0.3;
                        ctx.strokeRect(bullet.x, bullet.y, bullet.width, bullet.height);
                        ctx.globalAlpha = 1;
                    }
                    return;
                }
                ctx.fillStyle = bullet.color;
                ctx.shadowColor = bullet.color;
                ctx.shadowBlur = bullet.pierceRemaining > 0 ? 14 : 5;
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
                ctx.shadowBlur = 0;
            });
        }

        // ボス弾丸描画
        function drawBossBullets() {
            bossBullets.forEach(bullet => {
                if (bullet.isSniper) {
                    // 狙撃弾は強発光 + トレイル（即死級の見た目で警告）
                    ctx.save();
                    ctx.fillStyle = bullet.color;
                    ctx.shadowColor = bullet.color;
                    ctx.shadowBlur = 20;
                    ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
                    const len = Math.hypot(bullet.speedX, bullet.speedY) || 1;
                    const tx = bullet.x + bullet.width / 2 - bullet.speedX / len * 28;
                    const ty = bullet.y + bullet.height / 2 - bullet.speedY / len * 28;
                    ctx.strokeStyle = bullet.color;
                    ctx.lineWidth = 3;
                    ctx.globalAlpha = 0.65;
                    ctx.beginPath();
                    ctx.moveTo(bullet.x + bullet.width / 2, bullet.y + bullet.height / 2);
                    ctx.lineTo(tx, ty);
                    ctx.stroke();
                    ctx.restore();
                } else {
                    ctx.fillStyle = bullet.color;
                    ctx.shadowColor = bullet.color;
                    ctx.shadowBlur = 8;
                    ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
                    ctx.shadowBlur = 0;
                }
            });
        }

        // 敵戦闘機描画
        function drawEnemies() {
            enemies.forEach(enemy => {
                const x = enemy.x;
                const y = enemy.y;
                const w = enemy.width;
                const h = enemy.height;
                
                // 通常の敵戦闘機の描画
                ctx.fillStyle = enemy.color;
                ctx.fillRect(x + w/4, y + h/3, w/2, h/2);
                
                // 敵戦闘機の機首
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(x + w/3, y, w/3, h/3);
                
                // 敵戦闘機の翼
                ctx.fillStyle = enemy.color;
                ctx.fillRect(x, y + h/3, w/4, h/3);
                ctx.fillRect(x + 3*w/4, y + h/3, w/4, h/3);
                
                // 敵戦闘機の尾翼
                ctx.fillStyle = enemy.color;
                ctx.fillRect(x + w/3, y + 2*h/3, w/3, h/3);
                
                // 敵戦闘機のエンジン
                ctx.fillStyle = '#ff6600';
                ctx.fillRect(x + w/4, y + h/2, w/2, h/6);
                
                // 敵戦闘機のコックピット
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(x + w/3, y + h/4, w/3, h/6);
                
                // 点数の表示
                ctx.fillStyle = '#ffffff';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(enemy.points, x + w/2, y + h + 15);

                if (enemy.maxHealth > 1) {
                    const barWidth = w;
                    const barHeight = 4;
                    const hpRatio = Math.max(0, enemy.health / enemy.maxHealth);
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
                    ctx.fillRect(x, y - 8, barWidth, barHeight);
                    ctx.fillStyle = hpRatio > 0.5 ? '#00ff66' : '#ff4444';
                    ctx.fillRect(x, y - 8, barWidth * hpRatio, barHeight);
                }
            });
        }

        // ボス描画
        // 任意の位置・サイズ・レベル指定でボス見た目を描画する共通関数
        // 部下も同じ見た目を採用（メインボスとの差は「サイズが小さい」だけ）
        function drawBossArtwork(x, y, w, h, level) {
            ctx.save();
            ctx.shadowColor = level > 2 ? '#ff00ff' : '#ff0000';
            ctx.shadowBlur = 10 + (level - 1) * 5;
            // 本体（黒）
            ctx.fillStyle = '#333333';
            ctx.fillRect(x + w/6, y + h/4, 2*w/3, h/2);
            // 装甲板（灰）
            ctx.fillStyle = '#666666';
            ctx.fillRect(x + w/8, y + h/6, 3*w/4, h/3);
            // 砲塔
            ctx.fillStyle = level > 2 ? '#ff00ff' : '#cc0000';
            ctx.fillRect(x + w/4, y, w/2, h/4);
            // 翼
            ctx.fillStyle = '#222222';
            ctx.fillRect(x - w/4, y + h/3, w/4, h/3);
            ctx.fillRect(x + w,   y + h/3, w/4, h/3);
            // エンジン
            ctx.fillStyle = '#ff4400';
            ctx.fillRect(x + w/6, y + h/2, w/3, h/6);
            // コックピット
            ctx.fillStyle = level > 2 ? '#ff00ff' : '#ff0000';
            ctx.fillRect(x + w/3, y + h/6, w/3, h/6);
            // 装甲板ハイライト
            ctx.fillStyle = '#888888';
            ctx.fillRect(x + w/6, y + h/4, w/3, h/8);
            ctx.shadowBlur = 0;
            ctx.restore();
        }

        function drawBoss() {
            if (!boss) return;
            
            const x = boss.x;
            const y = boss.y;
            const w = boss.width;
            const h = boss.height;

            // 吸収トラクタービーム（ターゲットがいるとき）
            if (boss._absorbTarget && enemies.includes(boss._absorbTarget)) {
                const t = boss._absorbTarget;
                const bcx = x + w / 2, bcy = y + h / 2;
                const tcx = t.x + t.width / 2, tcy = t.y + t.height / 2;
                ctx.save();
                ctx.shadowColor = '#ff44ff';
                ctx.shadowBlur = 14;
                ctx.strokeStyle = '#ff66ff';
                ctx.lineWidth = 4;
                ctx.globalAlpha = 0.45 + 0.35 * Math.sin(Date.now() * 0.02);
                ctx.beginPath();
                ctx.moveTo(bcx, bcy);
                ctx.lineTo(tcx, tcy);
                ctx.stroke();
                // ターゲットを囲む小さなマーカー
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 0.7;
                ctx.strokeStyle = '#ff66ff';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([3, 3]);
                ctx.beginPath();
                ctx.arc(tcx, tcy, Math.max(t.width, t.height) * 0.7, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.restore();
            }

            // ボス本体の描画（共通アートワークを使用）
            drawBossArtwork(x, y, w, h, bossLevel);
            
            // ボスのHPバー
            const barWidth = w;
            const barHeight = 8;
            const barX = x;
            const barY = y - 20;
            
            // HPバーの背景
            ctx.fillStyle = '#333333';
            ctx.fillRect(barX, barY, barWidth, barHeight);
            
            // HPバー
            const hpRatio = boss.health / boss.maxHealth;
            ctx.fillStyle = hpRatio > 0.5 ? '#00ff00' : hpRatio > 0.2 ? '#ffff00' : '#ff0000';
            ctx.fillRect(barX, barY, barWidth * hpRatio, barHeight);
            
            // HPバーの枠
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.strokeRect(barX, barY, barWidth, barHeight);
            
            // ボスの点数表示（レベルも表示）
            ctx.fillStyle = '#ffffff';
            ctx.font = '16px Arial';
            ctx.textAlign = 'center';
            const levelText = bossLevel > 1 ? ` (Lv.${bossLevel})` : '';
            ctx.fillText(`BOSS: ${boss.points}点${levelText}`, x + w/2, y + h + 20);
        }

        // ゲーム更新
        function update() {
            if (!gameRunning) return;

            // 時間更新
            const elapsed = Math.floor((Date.now() - gameStartTime) / 1000);
            const remainingTime = Math.max(0, gameTime - elapsed);
            timeElement.textContent = `残り時間: ${remainingTime}秒`;

            // 時間切れ
            if (remainingTime <= 0) {
                gameOver('timeout');
                return;
            }

            // スコアによる時間ボーナス
            if (score > lastTimeBonusScore + 100) {
                gameTime += 30; // 30秒追加
                lastTimeBonusScore = score;
                timeBonusMessage = '+30秒ボーナス！';
                timeBonusTimer = 120; // 2秒間表示
                timeElement.textContent = `残り時間: ${gameTime}秒`;
            }

            // プレイヤー移動（矢印キー + WASD）
            if ((keys['ArrowLeft'] || keys['a'] || keys['A']) && player.x > 0) {
                player.x -= player.speed;
            }
            if ((keys['ArrowRight'] || keys['d'] || keys['D']) && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }
            if ((keys['ArrowUp'] || keys['w'] || keys['W']) && player.y > canvas.height * PLAYER_MAX_UP_RATIO) {
                player.y -= player.speed;
            }
            if ((keys['ArrowDown'] || keys['s'] || keys['S']) && player.y < canvas.height - player.height) {
                player.y += player.speed;
            }

            // 随伴機の自動射撃
            updateDrones();
            updateExplosionEffects();
            updateBossShockwaves();
            updateBossMines();
            updateBossMinions();

            // 弾丸更新（追尾・引力・シールド遮断もここで処理）
            bullets = bullets.filter(bullet => {
                // ライフタイマー（機雷など設置型用）
                if (bullet.lifeFrames !== null && bullet.lifeFrames !== undefined) {
                    bullet.lifeFrames--;
                    if (bullet.lifeFrames <= 0) {
                        // 自爆 = 起点で爆発（爆発プロパティを持つもののみ）
                        if (bullet.explodeOnImpact) {
                            applyExplosion(bullet.x + bullet.width / 2, bullet.y + bullet.height / 2,
                                           bullet.explodeOnImpact.radius, bullet.explodeOnImpact.damage);
                        }
                        return false;
                    }
                }

                // 追尾武器（ホーミング系）
                if (bullet.homing && bullet.homingForce > 0) {
                    const target = findNearestTarget(bullet.x, bullet.y);
                    if (target) steerBulletTowards(bullet, target, bullet.homingForce);
                }
                // 引力武器（重力弾系）
                if (bullet.pullRadius > 0 && bullet.pullForce > 0) {
                    applyGravityPull(bullet);
                }

                bullet.x += bullet.speedX;
                bullet.y += bullet.speedY;
                bullet.traveled += Math.hypot(bullet.speedX, bullet.speedY);

                // シールド武器・ブレード: 進行経路上の敵弾を破壊
                if (bullet.blocksBossBullets) {
                    for (let bi = bossBullets.length - 1; bi >= 0; bi--) {
                        if (checkCollision(bullet, bossBullets[bi])) {
                            bossBullets.splice(bi, 1);
                        }
                    }
                }

                // ボス機雷を撃って早期爆破できる（爆風はその場で発生）
                for (let mi = bossMines.length - 1; mi >= 0; mi--) {
                    if (checkCollision(bullet, bossMines[mi])) {
                        explodeBossMine(bossMines[mi]);
                        bossMines.splice(mi, 1);
                        return false;        // この弾は消費
                    }
                }

                // ボスの部下と当たる
                for (let mi = bossMinions.length - 1; mi >= 0; mi--) {
                    const mn = bossMinions[mi];
                    if (checkCollision(bullet, mn)) {
                        mn.health -= bullet.damage;
                        if (mn.health <= 0) {
                            score += mn.points;
                            scoreElement.textContent = `スコア: ${score}`;
                            spawnExplosionEffect(mn.x + mn.width / 2, mn.y + mn.height / 2, 40);
                            playSound(explosionSound);
                            bossMinions.splice(mi, 1);
                            // 全部下を倒したら吸収タイマーリセット
                            if (bossMinions.length === 0 && boss) {
                                boss.minionAbsorbStartAt = null;
                            }
                        }
                        bullet.pierceRemaining--;
                        if (bullet.pierceRemaining < 0) return false;
                    }
                }

                return bullet.y > -bullet.height && bullet.traveled < bullet.range;
            });

            // ボス弾丸更新
            bossBullets = bossBullets.filter(bullet => {
                bullet.x += bullet.speedX;
                bullet.y += bullet.speedY;
                return bullet.y < canvas.height && bullet.x > 0 && bullet.x < canvas.width;
            });

            // ボス更新
            if (boss) {
                const bossSlowFactor = (boss.slowedUntil && Date.now() < boss.slowedUntil) ? 0.4 : 1;

                if (boss.y < 50) {
                    boss.y += boss.speed * bossSlowFactor;
                }
                
                // ボスの横移動
                boss.x += boss.moveSpeed * boss.moveDirection * bossSlowFactor;
                
                // 画面端で方向転換
                if (boss.x <= 0 || boss.x + boss.width >= canvas.width) {
                    boss.moveDirection *= -1;
                }
                
                // ボスの攻撃
                const now = Date.now();
                const isSniper = bossLevel >= BOSS_SNIPER_LEVEL_THRESHOLD;
                if (isSniper) {
                    const since = now - boss.lastShot;
                    // 発射の BOSS_SNIPER_CHARGE_MS 前にターゲットをロックして照準表示
                    if (!boss.sniperLocked && since >= boss.shotInterval - BOSS_SNIPER_CHARGE_MS) {
                        boss.sniperLocked = true;
                        boss.sniperTargetX = player.x + player.width / 2;
                        boss.sniperTargetY = player.y + player.height / 2;
                    }
                    if (since >= boss.shotInterval) {
                        bossSnipeShot(boss.sniperTargetX, boss.sniperTargetY);
                        boss.sniperLocked = false;
                        boss.lastShot = now;
                    }
                } else {
                    if (now - boss.lastShot > boss.shotInterval) {
                        bossShoot();
                        boss.lastShot = now;
                    }
                }

                // 部下吸収(Lv.9+): 8秒経過後に最寄りの部下を引き寄せ、接触で全回復
                if (bossLevel >= BOSS_MINION_LEVEL_THRESHOLD && bossMinions.length > 0) {
                    if (boss.minionAbsorbStartAt === null) {
                        boss.minionAbsorbStartAt = now + BOSS_MINION_ABSORB_DELAY_MS;
                    }
                    if (now >= boss.minionAbsorbStartAt) {
                        let target = null, bestDist = Infinity;
                        for (const m of bossMinions) {
                            const dx2 = (m.x + m.width/2) - (boss.x + boss.width/2);
                            const dy2 = (m.y + m.height/2) - (boss.y + boss.height/2);
                            const d2 = dx2*dx2 + dy2*dy2;
                            if (d2 < bestDist) { bestDist = d2; target = m; }
                        }
                        if (target) {
                            target.beingAbsorbed = true;
                            const dx = (boss.x + boss.width/2) - (target.x + target.width/2);
                            const dy = (boss.y + boss.height/2) - (target.y + target.height/2);
                            const len = Math.hypot(dx, dy) || 1;
                            target.x += dx / len * BOSS_MINION_PULL_FORCE;
                            target.y += dy / len * BOSS_MINION_PULL_FORCE;
                            if (checkCollision(boss, target)) {
                                // 吸収成立 → 全回復
                                boss.health = boss.maxHealth;
                                spawnExplosionEffect(target.x + target.width/2, target.y + target.height/2, 60);
                                playSound(explosionSound);
                                const consumedLevel = target.level;
                                const consumedSlot = target.slotIndex;
                                bossMinions = bossMinions.filter(m => m !== target);
                                boss.minionAbsorbStartAt = null;
                                bossWarningElement.textContent = '⚠️ 部下が吸収されてHP全回復！ 部下が再展開！ ⚠️';
                                bossWarningElement.style.display = 'block';
                                setTimeout(() => { bossWarningElement.style.display = 'none'; }, 2500);
                                // 吸収で消えた部下のみ再生成（プレイヤー撃破では再生成しない）
                                spawnSingleBossMinion(consumedLevel, consumedSlot);
                            }
                        }
                    }
                } else if (boss) {
                    boss.minionAbsorbStartAt = null;
                }

                // 吸収: Lv.7(=3000点)以上で、最寄りの雑魚を引き寄せて HP 回復
                if (bossLevel >= BOSS_ABSORB_LEVEL_THRESHOLD && enemies.length > 0) {
                    const bcx = boss.x + boss.width / 2;
                    const bcy = boss.y + boss.height / 2;
                    // ターゲット選択（毎フレーム再選択。最寄り 1 体のみ吸引）
                    let target = null, bestDist = BOSS_ABSORB_RANGE;
                    for (const e of enemies) {
                        const dist = Math.hypot(e.x + e.width/2 - bcx, e.y + e.height/2 - bcy);
                        if (dist < bestDist) { bestDist = dist; target = e; }
                    }
                    if (target) {
                        boss._absorbTarget = target;
                        const dx = bcx - (target.x + target.width / 2);
                        const dy = bcy - (target.y + target.height / 2);
                        const len = Math.hypot(dx, dy) || 1;
                        // 重力的に吸引（敵自身の移動を打ち消すレベル）
                        target.x += (dx / len) * BOSS_ABSORB_PULL_FORCE;
                        target.y += (dy / len) * BOSS_ABSORB_PULL_FORCE;
                        // ボスとの衝突で吸収（クールダウンあり）
                        if (now - (boss.lastAbsorbAt || 0) >= BOSS_ABSORB_COOLDOWN_MS &&
                            checkCollision(boss, target)) {
                            const heal = Math.max(BOSS_ABSORB_MIN_HEAL,
                                                  Math.floor((target.points || 10) * BOSS_ABSORB_HEAL_RATIO));
                            boss.health = Math.min(boss.maxHealth, boss.health + heal);
                            boss.lastAbsorbAt = now;
                            // 吸収エフェクト（既存の expanding ring を流用）
                            spawnExplosionEffect(target.x + target.width / 2,
                                                 target.y + target.height / 2, 26);
                            // 雑魚を消滅させる
                            const idx = enemies.indexOf(target);
                            if (idx !== -1) enemies.splice(idx, 1);
                            boss._absorbTarget = null;
                            playSound(explosionSound);
                        }
                    } else {
                        boss._absorbTarget = null;
                    }
                } else if (boss) {
                    boss._absorbTarget = null;
                }

                // 機雷設置: Lv.8(=4000点)以上で、4秒に1個ボスから投下し画面下半分に着地
                if (bossLevel >= BOSS_MINE_LEVEL_THRESHOLD) {
                    if (now - (boss.lastMineDropAt || 0) >= BOSS_MINE_DROP_COOLDOWN_MS) {
                        boss.lastMineDropAt = now;
                        const targetY = canvas.height * (
                            BOSS_MINE_TARGET_Y_MIN_RATIO +
                            Math.random() * (BOSS_MINE_TARGET_Y_MAX_RATIO - BOSS_MINE_TARGET_Y_MIN_RATIO)
                        );
                        bossMines.push({
                            x: boss.x + boss.width / 2 - BOSS_MINE_SIZE / 2,
                            y: boss.y + boss.height,
                            vx: (Math.random() - 0.5) * BOSS_MINE_HORIZONTAL_DRIFT,
                            vy: BOSS_MINE_FALL_SPEED,
                            targetY: targetY,
                            settled: false,
                            size: BOSS_MINE_SIZE,
                            width: BOSS_MINE_SIZE,         // checkCollision 用
                            height: BOSS_MINE_SIZE,
                            spawnedAt: now,
                            expiresAt: now + BOSS_MINE_LIFE_MS,
                            triggered: false
                        });
                    }
                }

                // 衝撃波: Lv.5(=2000点)以上で、プレイヤーが一定距離内に入ったら発動
                if (bossLevel >= BOSS_SHOCKWAVE_LEVEL_THRESHOLD) {
                    const bcx = boss.x + boss.width / 2;
                    const bcy = boss.y + boss.height / 2;
                    const pcx = player.x + player.width / 2;
                    const pcy = player.y + player.height / 2;
                    const dist = Math.hypot(pcx - bcx, pcy - bcy);
                    if (dist < BOSS_SHOCKWAVE_TRIGGER_DIST &&
                        now - (boss.lastShockwaveAt || 0) >= BOSS_SHOCKWAVE_COOLDOWN_MS) {
                        boss.lastShockwaveAt = now;
                        bossShockwaves.push({
                            cx: bcx, cy: bcy,
                            radius: 0,
                            expandSpeed: BOSS_SHOCKWAVE_EXPAND_SPEED * speedMultiplier,
                            maxRadius: BOSS_SHOCKWAVE_MAX_RADIUS,
                            thickness: BOSS_SHOCKWAVE_THICKNESS,
                            chargeUntil: now + BOSS_SHOCKWAVE_CHARGE_MS,
                            hit: false,
                            damage: BOSS_SHOCKWAVE_DAMAGE_LIVES
                        });
                    }
                }

                // プレイヤーとの衝突
                if (checkCollision(boss, player)) {
                    lives--;
                    livesElement.textContent = `ライフ: ${lives}`;
                    runState.livesLost++;
                    recomputeUnlockedSlots();
                    if (lives <= 0) {
                        gameOver('gameover');
                    }
                }
            }

            // 敵更新
            enemies = enemies.filter(enemy => {
                const slowFactor = (enemy.slowedUntil && Date.now() < enemy.slowedUntil) ? 0.4 : 1;
                enemy.y += enemy.speed * slowFactor;
                
                // プレイヤーとの衝突
                if (checkCollision(enemy, player)) {
                    lives--;
                    livesElement.textContent = `ライフ: ${lives}`;
                    runState.livesLost++;
                    recomputeUnlockedSlots();
                    if (lives <= 0) {
                        gameOver('gameover');
                    }
                    return false;
                }
                
                return enemy.y < canvas.height;
            });

            // 弾丸と敵・ボスの衝突
            for (let bulletIndex = bullets.length - 1; bulletIndex >= 0; bulletIndex--) {
                const bullet = bullets[bulletIndex];
                let bulletRemoved = false;

                for (let enemyIndex = enemies.length - 1; enemyIndex >= 0; enemyIndex--) {
                    const enemy = enemies[enemyIndex];
                    if (!checkCollision(bullet, enemy)) continue;

                    // スロー（時空弾系）
                    if (bullet.slowOnHitMs > 0) applySlowToTarget(enemy, bullet.slowOnHitMs);

                    enemy.health -= bullet.damage;
                    if (enemy.health <= 0) {
                        enemies.splice(enemyIndex, 1);
                        score += enemy.points;
                        scoreElement.textContent = `スコア: ${score}`;
                        playSound(explosionSound);
                        runState.enemyKillCount++;
                        // scoreReached / enemyKillCount 系トリガーに備えて再評価
                        recomputeUnlockedSlots();
                    }

                    // 範囲爆発（ランチャー / 機雷）
                    if (bullet.explodeOnImpact) {
                        applyExplosion(bullet.x + bullet.width / 2, bullet.y + bullet.height / 2,
                                       bullet.explodeOnImpact.radius, bullet.explodeOnImpact.damage);
                    }

                    if (bullet.pierceRemaining > 0) {
                        bullet.pierceRemaining--;
                    } else {
                        bullets.splice(bulletIndex, 1);
                        bulletRemoved = true;
                        break;
                    }
                }

                if (bulletRemoved) continue;

                // 弾丸とボスの衝突
                if (boss && checkCollision(bullet, boss)) {
                    if (bullet.slowOnHitMs > 0) applySlowToTarget(boss, bullet.slowOnHitMs);

                    boss.health -= bullet.damage;

                    if (bullet.explodeOnImpact) {
                        applyExplosion(bullet.x + bullet.width / 2, bullet.y + bullet.height / 2,
                                       bullet.explodeOnImpact.radius, bullet.explodeOnImpact.damage);
                    }

                    if (bullet.pierceRemaining > 0) {
                        bullet.pierceRemaining--;
                    } else {
                        bullets.splice(bulletIndex, 1);
                        bulletRemoved = true;
                    }

                    if (boss.health <= 0) {
                        score += boss.points;
                        scoreElement.textContent = `スコア: ${score}`;
                        
                        // ボス撃破時に宝箱をドロップ（倒した地点と同じ横座標、プレイヤーが行ける最も上の地点）
                        treasureBox = {
                            x: boss.x + boss.width / 2 - 25, // ボスの中心と同じ横座標
                            y: canvas.height / 2, // プレイヤーが行ける最も上の地点
                            width: 50,
                            height: 50,
                            speed: 0, // 固定位置なので移動しない
                            color: '#ffd700', // 金色
                            isCollected: false
                        };
                        
                        const defeatedLevel = bossLevel;
                        boss = null;
                        bossSpawned = false;
                        // ボス撃破時に部下も道連れ（生き残った部下は爆散）
                        bossMinions.forEach(m => spawnExplosionEffect(m.x + m.width / 2, m.y + m.height / 2, 35));
                        bossMinions = [];
                        playSound(bossExplosionSound); // ボス撃破音
                        
                        // bossLevel に応じたラン内解放（＋ログイン時はメタ層も永続化）
                        const unlockedList = handleBossDefeated(defeatedLevel);
                        if (unlockedList.length > 0) {
                            // 装備中（即使える）と未装備（マイページで編成）を分ける
                            const equippedNow = unlockedList.filter(w => equippedWeaponIds.includes(w.id));
                            const onlyMeta = unlockedList.filter(w => !equippedWeaponIds.includes(w.id));

                            if (loadoutMode === 'guest') {
                                // ゲストはロードアウト固定なので、装備中のものだけ通知
                                weaponMessage = equippedNow.length > 0
                                    ? `${equippedNow.map(w => w.name).join('・')}を解放！`
                                    : 'ボス撃破！';
                            } else if (equippedNow.length > 0 && onlyMeta.length === 0) {
                                weaponMessage = `${equippedNow.map(w => w.name).join('・')}が今すぐ使えます！`;
                            } else if (equippedNow.length === 0 && onlyMeta.length > 0) {
                                weaponMessage = `${onlyMeta.map(w => w.name).join('・')}が装備可能に！マイページで編成しよう`;
                            } else {
                                weaponMessage = `${equippedNow.map(w => w.name).join('・')}が使用可！他${onlyMeta.length}種が装備可能に`;
                            }
                        } else {
                            weaponMessage = 'ボス撃破！';
                        }
                        weaponMessageTimer = 180;
                        updateWeaponSelector(); // 武器選択UIを更新
                    }
                }
            }

            // ボス弾丸とプレイヤーの衝突
            bossBullets.forEach((bullet, bulletIndex) => {
                if (checkCollision(bullet, player)) {
                    bossBullets.splice(bulletIndex, 1);
                    if (bullet.isSniper) {
                        // 狙撃弾は 1 発で即死
                        const lethal = lives;
                        lives = 0;
                        runState.livesLost += lethal;
                        livesElement.textContent = `ライフ: 0`;
                        playSound(explosionSound);
                        spawnExplosionEffect(player.x + player.width / 2, player.y + player.height / 2, 60);
                        gameOver('gameover');
                    } else {
                        lives--;
                        if (lives < 0) lives = 0;
                        livesElement.textContent = `ライフ: ${lives}`;
                        runState.livesLost++;
                        recomputeUnlockedSlots();
                        if (lives <= 0) gameOver('gameover');
                    }
                }
            });

            // 宝箱生成チェック（ランダム生成は削除）
            // 宝箱はボス撃破時のみ生成される

            // 宝箱更新（固定位置なので移動しない）
            // 宝箱は固定位置に配置されるため、移動処理は不要

            // プレイヤーと宝箱の衝突
            if (treasureBox && checkCollision(player, treasureBox)) {
                treasureBox.isCollected = true;
                refillAllAmmoToMax();
                updateAmmoHud();
                updateWeaponSelector();
                playSound(explosionSound); // 宝箱取得音
                treasureBox = null; // 宝箱を消去
            }

            // 支援物資更新
            supplyUnits = supplyUnits.filter(unit => {
                unit.y += 1; // ゆっくり落下
                if (unit.y > canvas.height) {
                    return false; // 画面外に出たら消去
                }
                // プレイヤーとの衝突判定
                if (checkCollision(unit, player)) {
                    unit.isCollected = true;
                    addSupplyAmmoToAll(20); // 全武器に+20（各最大値で頭打ち）
                    runState.suppliesCollected = (runState.suppliesCollected || 0) + 1;
                    recomputeUnlockedSlots();
                    updateAmmoHud();
                    updateWeaponSelector();
                    playSound(explosionSound); // 補給取得音
                    return false; // 画面外に出たら消去
                }
                return true;
            });
            
            // ライフ回復アイテム更新
            healthItems = healthItems.filter(item => {
                item.y += 1; // ゆっくり落下
                if (item.y > canvas.height) {
                    return false; // 画面外に出たら消去
                }
                // プレイヤーとの衝突判定
                if (checkCollision(item, player)) {
                    item.isCollected = true;
                    if (lives < 3) { // 最大ライフは3
                        lives++;
                        livesElement.textContent = `ライフ: ${lives}`;
                    }
                    playSound(explosionSound); // ライフ回復取得音
                    return false; // 画面外に出たら消去
                }
                return true;
            });

            // ボス生成チェック
            spawnBoss();
            
            // 敵生成
            spawnEnemy();

            // 支援物資生成
            spawnSupplyUnits();
            
            // ライフ回復アイテム生成
            spawnHealthItems();
        }

        // ゲーム描画
        function draw() {
            // 背景クリア
            ctx.fillStyle = '#001122';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 星の背景
            ctx.fillStyle = '#ffffff';
            for (let i = 0; i < 50; i++) {
                ctx.fillRect(
                    (i * 37) % canvas.width,
                    (i * 73) % canvas.height,
                    1, 1
                );
            }

            drawPlayer();
            drawDrones();
            drawBullets();
            drawBossBullets();
            drawEnemies();
            drawBoss();
            drawBossMinions();
            drawBossShockwaves();
            drawBossMines();
            drawMinionAbsorbWarning();
            drawExplosionEffects();
            
            // 宝箱の描画
            if (treasureBox) {
                const x = treasureBox.x;
                const y = treasureBox.y;
                const w = treasureBox.width;
                const h = treasureBox.height;
                
                // 宝箱の本体（金色）
                ctx.fillStyle = treasureBox.color;
                ctx.shadowColor = treasureBox.color;
                ctx.shadowBlur = 10;
                ctx.fillRect(x, y, w, h);
                ctx.shadowBlur = 0;
                
                // 宝箱の蓋
                ctx.fillStyle = '#ffed4e';
                ctx.fillRect(x + w/6, y, 2*w/3, h/4);
                
                // 宝箱の鍵穴
                ctx.fillStyle = '#000000';
                ctx.fillRect(x + w/2 - 3, y + h/2 - 3, 6, 6);
                
                // 宝箱の装飾
                ctx.strokeStyle = '#ffed4e';
                ctx.lineWidth = 2;
                ctx.strokeRect(x + 5, y + 5, w - 10, h - 10);
                
                // 宝箱の説明
                ctx.fillStyle = '#ffffff';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('弾薬満タン', x + w/2, y + h + 15);
            }

            // 支援物資の描画
            supplyUnits.forEach(unit => {
                const x = unit.x;
                const y = unit.y;
                const w = unit.width;
                const h = unit.height;

                ctx.fillStyle = unit.color;
                ctx.shadowColor = unit.color;
                ctx.shadowBlur = 5;
                ctx.fillRect(x, y, w, h);
                ctx.shadowBlur = 0;

                // 補給マーク
                ctx.fillStyle = '#ffffff';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('+', x + w/2, y + h/2 + 5);

                // 補給表示
                ctx.fillStyle = '#00ff00';
                ctx.font = '12px Arial';
                ctx.fillText('補給', x + w/2, y + h + 15);
            });
            
            // ライフ回復アイテムの描画
            healthItems.forEach(item => {
                const x = item.x;
                const y = item.y;
                const w = item.width;
                const h = item.height;

                ctx.fillStyle = item.color;
                ctx.shadowColor = item.color;
                ctx.shadowBlur = 8;
                ctx.fillRect(x, y, w, h);
                ctx.shadowBlur = 0;

                // ハートマーク
                ctx.fillStyle = '#ffffff';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('♥', x + w/2, y + h/2 + 5);

                // ライフ回復表示
                ctx.fillStyle = '#ff69b4';
                ctx.font = '12px Arial';
                ctx.fillText('ライフ', x + w/2, y + h + 15);
            });

            // 時間ボーナスメッセージの描画
            if (timeBonusTimer > 0) {
                ctx.fillStyle = '#00ff00';
                ctx.font = '24px Arial';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#000000';
                ctx.shadowBlur = 4;
                ctx.fillText(timeBonusMessage, canvas.width / 2, canvas.height / 2 - 50);
                ctx.shadowBlur = 0;
                timeBonusTimer--;
            }

            // 武器解禁メッセージの描画
            if (weaponMessageTimer > 0) {
                ctx.fillStyle = '#00ffff'; // 水色
                ctx.font = '24px Arial';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#000000';
                ctx.shadowBlur = 4;
                ctx.fillText(weaponMessage, canvas.width / 2, canvas.height / 2 - 50);
                ctx.shadowBlur = 0;
                weaponMessageTimer--;
            }
            
            // 武器変更メッセージの描画
            if (weaponChangeTimer > 0) {
                ctx.fillStyle = '#ffff00'; // 黄色
                ctx.font = '20px Arial';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#000000';
                ctx.shadowBlur = 4;
                ctx.fillText(weaponChangeMessage, canvas.width / 2, canvas.height / 2 + 50);
                ctx.shadowBlur = 0;
                weaponChangeTimer--;
            }
        }

        // ゲームオーバー
        async function gameOver(reason = 'gameover') {
            gameRunning = false;
            
            // 最高スコアの更新
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('shootingGameHighScore', highScore.toString());
            }
            
            // 総プレイ回数と総スコアを更新
            const totalGames = parseInt(localStorage.getItem('totalGames')) || 0;
            const totalScore = parseInt(localStorage.getItem('totalScore')) || 0;
            
            localStorage.setItem('totalGames', (totalGames + 1).toString());
            localStorage.setItem('totalScore', (totalScore + score).toString());
            
            // Firebase 認証を「真実」とする。localStorage の名残りでは保存処理を走らせない。
            const currentUser = firebase.auth().currentUser;
            const isAuthenticated = !!currentUser;
            
            // ログイン促進メッセージの表示/非表示
            const loginPromotion = document.querySelector('.login-promotion');
            if (loginPromotion) {
                if (isAuthenticated) {
                    loginPromotion.style.display = 'none';
                } else {
                    loginPromotion.style.display = 'block';
                }
            }
            
            // Firebaseにスコアを保存（ログインしている場合のみ）
            // saveScore 側で進捗フラグから称号と allWeaponsUnlocked を再計算するため、ここでは追加更新しない
            if (isAuthenticated) {
                try {
                    await firebaseDataManager.saveScore(score);
                    console.log('スコアがFirebaseに保存されました');
                } catch (error) {
                    console.error('スコア保存エラー:', error);
                }
            }
            
            // ゲームオーバーの理由に応じてメッセージを変更
            const gameOverTitle = document.querySelector('#gameOver div:first-child');
            if (gameOverTitle) {
                if (reason === 'timeout') {
                    gameOverTitle.textContent = '時間切れ';
                } else {
                    gameOverTitle.textContent = 'ゲームオーバー';
                }
            }
            
            document.querySelector('.final-score').textContent = `最終スコア: ${score}`;
            highScoreElement.textContent = `最高スコア: ${highScore}`;
            gameOverElement.style.display = 'block';
            if (runStatusElement) runStatusElement.style.display = 'none';
        }

        // ホームに戻る
        homeBtn.addEventListener('click', () => {
            window.location.href = 'index.html';
        });
        

        
        // リスタート
        restartBtn.addEventListener('click', () => {
            score = 0;
            lives = 3;
            bullets = [];
            enemies = [];
            boss = null;
            bossSpawned = false;
            bossBullets = [];
            bossShockwaves = [];
            bossMines = [];
            bossMinions = [];
            shockwaveFlashUntil = 0;
            drones = [];
            explosionEffects = [];
            treasureBox = null; // リスタート時に宝箱もリセット
            supplyUnits = []; // 支援物資をリセット
            healthItems = []; // ライフ回復アイテムをリセット
            lastBossScore = 0;
            lastTimeBonusScore = 0; // リスタート時に時間ボーナススコアもリセット
            timeBonusMessage = '';
            timeBonusTimer = 0;
            bossLevel = 1; // ボスレベルをリセット
            loadWeaponLoadout();
            weaponMessage = ''; // リスタート時に武器メッセージもリセット
            weaponMessageTimer = 0;
            weaponChangeMessage = ''; // リスタート時に武器変更メッセージもリセット
            weaponChangeTimer = 0;
            gameRunning = true;
            gameTime = 120;
            gameStartTime = Date.now();
            
            // 難易度設定を再適用
            gameDifficulty = localStorage.getItem('gameDifficulty') || 'normal';
            setDifficultySpeed();
            
            player.x = canvas.width / 2;
            player.y = canvas.height - 80; // プレイヤーの初期位置をリセット
            player.width = Math.max(30, Math.min(40, canvas.width / 20));
            player.height = Math.max(40, Math.min(50, canvas.height / 15));
            scoreElement.textContent = `スコア: ${score}`;
            livesElement.textContent = `ライフ: ${lives}`;
            updateAmmoHud();
            weaponElement.textContent = `武器: ${equippedWeapons[currentWeapon].name}`; // 武器表示を更新
            timeElement.textContent = `残り時間: ${gameTime}秒`;
            gameOverElement.style.display = 'none';
            bossWarningElement.style.display = 'none';
            highScoreElement.textContent = `最高スコア: ${highScore}`; // 最高スコア表示を更新
            
            // ログイン促進メッセージを非表示
            const loginPromotion = document.querySelector('.login-promotion');
            if (loginPromotion) {
                loginPromotion.style.display = 'none';
            }
            
            // 武器選択UIを更新
            updateWeaponSelector();
        });

        // ゲームループ
        // 連続フレーム間の経過時間からスタミナ回復量を計算するため、前フレームの timestamp を保持。
        let lastFrameTimestamp = performance.now();
        function gameLoop(timestamp) {
            const now = timestamp || performance.now();
            const dt = Math.min(64, now - lastFrameTimestamp);  // 64ms 上限でタブ復帰時の暴走回復を防ぐ
            lastFrameTimestamp = now;
            if (gameRunning) {
                updateWeaponStamina(dt);
                if (equippedWeapons[currentWeapon] && equippedWeapons[currentWeapon].usesStamina) {
                    updateAmmoHud();
                }
            }
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ゲーム開始時の初期化
        function initGame() {
            resizeCanvas();
            initSounds();
            loadWeaponLoadout();
            
            // 難易度設定を適用
            setDifficultySpeed();
            
            // プレイヤーの初期位置とサイズを再設定
            player.x = canvas.width / 2;
            player.y = canvas.height - 80;
            player.width = Math.max(30, Math.min(40, canvas.width / 20));
            player.height = Math.max(40, Math.min(50, canvas.height / 15));
            
            // 武器選択UIを初期化
            initWeaponSelector();
            updateWeaponSelector();
            updateAmmoHud();
            weaponElement.textContent = `武器: ${equippedWeapons[currentWeapon].name}`;
            
            gameLoop();
        }

        // ゲーム開始
        initGame();
    </script>
