<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>戦闘機シューティングゲーム</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        #gameCanvas {
            display: block;
            background: linear-gradient(to bottom, #001122, #003366);
        }
        
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: clamp(14px, 2.5vw, 18px);
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
        }

        #runStatus {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #ffffff;
            font-size: clamp(11px, 1.6vw, 13px);
            z-index: 100;
            background: rgba(0, 0, 0, 0.55);
            padding: 8px 10px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            line-height: 1.45;
            max-width: min(40vw, 220px);
            display: none;
        }
        .run-status-title {
            font-size: clamp(10px, 1.3vw, 11px);
            color: #aaffcc;
            letter-spacing: 0.06em;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .run-status-row {
            white-space: nowrap;
            color: #e0e0e0;
        }
        .run-status-row .ok { color: #88ff88; }
        .run-status-row .warn { color: #ffcc66; }
        .run-status-row .label { color: #aaaaaa; margin-right: 4px; }
        @media (max-width: 600px) {
            #runStatus {
                top: auto;
                bottom: 10px;
                right: 10px;
                font-size: 10px;
                max-width: 50vw;
            }
        }
        
        #score {
            margin-bottom: 8px;
            font-size: clamp(12px, 2vw, 16px);
        }
        
        #lives {
            margin-bottom: 8px;
            font-size: clamp(12px, 2vw, 16px);
        }
        
        #time {
            margin-bottom: 8px;
            color: #ffff00;
            font-size: clamp(12px, 2vw, 16px);
        }
        
        #ammo {
            margin-bottom: 8px;
            font-size: clamp(12px, 2vw, 16px);
        }
        
        /* 武器名は左下の #weaponHud に表示 */
        
        #bossWarning {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff0000;
            font-size: clamp(24px, 6vw, 36px);
            text-align: center;
            display: none;
            z-index: 150;
            text-shadow: 2px 2px 4px #000;
        }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: clamp(32px, 8vw, 48px);
            text-align: center;
            display: none;
            z-index: 200;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        
        .high-score {
            font-size: clamp(16px, 3vw, 20px);
            margin-top: 10px;
            color: #ffff00;
        }
        
        #restartBtn {
            background: #ff4444;
            color: white;
            border: none;
            padding: clamp(10px, 2vw, 15px) clamp(20px, 4vw, 30px);
            font-size: clamp(14px, 3vw, 20px);
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }
        
        #restartBtn:hover {
            background: #cc3333;
        }
        
        #homeBtn {
            background: #4444ff;
            color: white;
            border: none;
            padding: clamp(10px, 2vw, 15px) clamp(20px, 4vw, 30px);
            font-size: clamp(14px, 3vw, 20px);
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
            margin-left: 10px;
        }
        
        #homeBtn:hover {
            background: #3333cc;
        }
        

        
        .final-score {
            font-size: clamp(18px, 4vw, 24px);
            margin-top: 20px;
            color: #ffff00;
        }
        
        .login-promotion {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 255, 0, 0.1);
            border: 2px solid #00ff00;
            border-radius: 10px;
            text-align: center;
        }
        
        .login-promotion h3 {
            color: #00ff00;
            margin: 0 0 10px 0;
            font-size: clamp(14px, 3vw, 18px);
        }
        
        .login-promotion p {
            color: #ffffff;
            margin: 5px 0;
            font-size: clamp(12px, 2.5vw, 16px);
        }
        
        .login-buttons {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .login-btn {
            background: #00ff00;
            color: #000000;
            border: none;
            padding: clamp(8px, 2vw, 12px) clamp(16px, 3vw, 24px);
            font-size: clamp(12px, 2.5vw, 16px);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .login-btn:hover {
            background: #00cc00;
            transform: scale(1.05);
        }
        
        .register-btn {
            background: #0066ff;
            color: #ffffff;
            border: none;
            padding: clamp(8px, 2vw, 12px) clamp(16px, 3vw, 24px);
            font-size: clamp(12px, 2.5vw, 16px);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .register-btn:hover {
            background: #0055cc;
            transform: scale(1.05);
        }
        
        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            font-size: clamp(10px, 2vw, 12px);
            background: rgba(0, 0, 0, 0.5);
            padding: 8px;
            border-radius: 5px;
            backdrop-filter: blur(5px);
            z-index: 50;
        }
        
        #controls h3 {
            margin: 0 0 5px 0;
            font-size: clamp(12px, 2.5vw, 14px);
            color: #00ffff;
        }
        
        #controls p {
            margin: 2px 0;
            font-size: clamp(8px, 1.8vw, 10px);
        }
        
        /* 武器選択UI（左下・現在武器のみ表示） */
        #weaponSelector {
            position: absolute;
            left: 10px;
            bottom: 10px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            padding: 6px 10px;
            backdrop-filter: blur(10px);
            z-index: 100;
            transition: all 0.2s ease;
            min-width: 160px;
            max-width: min(60vw, 280px);
        }

        /* デフォルトでは全カード非表示。updateWeaponSelector で現在武器のみ表示にする。 */
        .weapon-display {
            display: none;
            align-items: center;
            gap: 10px;
            margin: 0;
            padding: 6px 8px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .weapon-display:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }
        
        .weapon-display.active {
            background: rgba(0, 255, 255, 0.3);
            border: 2px solid #00ffff;
        }

        .weapon-display.locked {
            opacity: 0.55;
            filter: grayscale(0.6);
            cursor: not-allowed;
        }

        .weapon-display.locked:hover {
            transform: none;
            background: rgba(255, 255, 255, 0.1);
        }

        .weapon-display.locked .weapon-icon {
            position: relative;
        }

        .weapon-display.locked .weapon-icon::after {
            content: '🔒';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.55);
            border-radius: 50%;
            font-size: 14px;
        }
        
        .weapon-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            color: white;
        }
        
        .weapon-info {
            flex: 1;
        }
        
        .weapon-name {
            font-size: clamp(12px, 2.5vw, 14px);
            font-weight: bold;
            color: white;
            margin-bottom: 2px;
        }
        
        .weapon-details {
            font-size: clamp(10px, 2vw, 12px);
            color: #cccccc;
        }
        
        /* トグルボタンは単一カード表示に移行したため非表示固定 */
        .weapon-selector-toggle {
            display: none !important;
        }

        /* 操作ヒント（カードの下） */
        .weapon-switch-hint {
            margin-top: 4px;
            padding: 2px 4px 0;
            font-size: clamp(9px, 1.6vw, 11px);
            color: rgba(255, 255, 255, 0.55);
            text-align: center;
            letter-spacing: 0.02em;
            user-select: none;
        }

        /* デフォルトは PC ヒント表示 */
        .weapon-switch-hint .hint-pc { display: inline; }
        .weapon-switch-hint .hint-mobile { display: none; }

        /* ホバー不可 & 粗ポインタ = タッチデバイス */
        @media (hover: none) and (pointer: coarse) {
            .weapon-switch-hint .hint-pc { display: none; }
            .weapon-switch-hint .hint-mobile { display: inline; }
        }
        
        /* レスポンシブ対応 */
        @media (max-width: 768px) {
            #ui {
                font-size: clamp(10px, 2vw, 14px);
                padding: 8px;
            }
            
            #score, #lives, #time, #ammo {
                font-size: clamp(10px, 2vw, 14px);
                margin-bottom: 6px;
            }

            #bossWarning {
                font-size: clamp(18px, 5vw, 24px);
            }
            
            #gameOver {
                font-size: clamp(24px, 6vw, 32px);
                padding: 15px;
            }
            
            .final-score, .high-score {
                font-size: clamp(14px, 3vw, 18px);
            }
            
            #restartBtn, #homeBtn {
                padding: clamp(8px, 2vw, 12px) clamp(16px, 3vw, 24px);
                font-size: clamp(12px, 2.5vw, 16px);
            }
            
            .login-promotion {
                padding: 10px;
                margin-top: 15px;
            }
            
            .login-promotion h3 {
                font-size: clamp(12px, 2.5vw, 16px);
            }
            
            .login-promotion p {
                font-size: clamp(10px, 2vw, 14px);
            }
            
            .login-btn, .register-btn {
                padding: clamp(6px, 1.5vw, 10px) clamp(12px, 2.5vw, 20px);
                font-size: clamp(10px, 2vw, 14px);
            }
            
            #controls {
                font-size: clamp(8px, 1.5vw, 10px);
                padding: 6px;
            }
            
            #controls h3 {
                font-size: clamp(10px, 2vw, 12px);
            }
            
            #controls p {
                font-size: clamp(6px, 1.5vw, 8px);
                margin: 1px 0;
            }
            
            #weaponSelector {
                padding: 8px;
            }
            
            .weapon-display {
                padding: 6px;
                gap: 8px;
            }
            
            .weapon-icon {
                width: 25px;
                height: 25px;
                font-size: 14px;
            }
            
            .weapon-name {
                font-size: clamp(10px, 2vw, 12px);
            }
            
            .weapon-details {
                font-size: clamp(8px, 1.5vw, 10px);
            }
            
            .weapon-selector-toggle {
                padding: 12px;
                font-size: 18px;
            }
        }
        
        @media (max-height: 600px) {
            #ui {
                font-size: clamp(8px, 1.5vw, 12px);
                padding: 6px;
            }
            
            #score, #lives, #time, #ammo {
                font-size: clamp(8px, 1.5vw, 12px);
                margin-bottom: 4px;
            }

            #bossWarning {
                font-size: clamp(16px, 4vw, 20px);
            }
            
            #gameOver {
                font-size: clamp(20px, 5vw, 28px);
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
        <div id="score">スコア: 0</div>
        <div id="lives">ライフ: 3</div>
        <div id="ammo">弾薬: 50/50</div>
        <div id="time">残り時間: 120秒</div>
    </div>
    <div id="runStatus">
        <div class="run-status-title">ラン進捗</div>
        <div id="runStatusBody"></div>
    </div>
    <div id="bossWarning">⚠️ ボス出現！ ⚠️</div>
    <div id="gameOver">
        <div>ゲームオーバー</div>
        <div class="final-score">最終スコア: 0</div>
        <div class="high-score">最高スコア: 0</div>
        <button id="restartBtn">リスタート</button>
        <button id="homeBtn">ホームに戻る</button>
        <div class="login-promotion" style="display: none;">
            <h3>スコアを保存してランキングに参加！</h3>
            <p>ログインすると、あなたのスコアが保存され、</p>
            <p>他のプレイヤーと競い合えます！</p>
            <div class="login-buttons">
                <button class="login-btn" onclick="window.location.href='mypage.html'">ログイン</button>
                <button class="register-btn" onclick="window.location.href='mypage.html'">新規登録</button>
            </div>
        </div>
    </div>
    
    <div id="weapon" style="display: none;">武器: 通常弾</div>

    <!-- 武器選択UI（現在装備中の武器のみ表示。Tab / クリックで切替） -->
    <button id="weaponSelectorToggle" class="weapon-selector-toggle" aria-hidden="true">🔫</button>
    <div id="weaponSelector">
        <div class="weapon-display active" data-slot="1">
            <div class="weapon-icon" style="background: #ffff00;">1</div>
            <div class="weapon-info">
                <div class="weapon-name">通常弾</div>
                <div class="weapon-details">弾薬: 1発</div>
            </div>
        </div>
        <div class="weapon-display" data-slot="2">
            <div class="weapon-icon" style="background: #ff8800;">2</div>
            <div class="weapon-info">
                <div class="weapon-name">連射弾</div>
                <div class="weapon-details">弾薬: 2発</div>
            </div>
        </div>
        <div class="weapon-display" data-slot="3">
            <div class="weapon-icon" style="background: #ff0000;">3</div>
            <div class="weapon-info">
                <div class="weapon-name">散弾</div>
                <div class="weapon-details">弾薬: 3発</div>
            </div>
        </div>
        <div class="weapon-display" data-slot="4">
            <div class="weapon-icon" style="background: #00ffff;">4</div>
            <div class="weapon-info">
                <div class="weapon-name">レーザー</div>
                <div class="weapon-details">弾薬: 5発</div>
            </div>
        </div>
        <div id="weaponSwitchHint" class="weapon-switch-hint">
            <span class="hint-pc">⌨ Tab で切替</span>
            <span class="hint-mobile">👆 タップで切替</span>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-analytics-compat.js"></script>
    <script src="firebase-config.js"></script>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');
        const ammoElement = document.getElementById('ammo'); // 弾薬表示要素
        const weaponElement = document.getElementById('weapon'); // 武器表示要素
        const timeElement = document.getElementById('time');
        const bossWarningElement = document.getElementById('bossWarning');
        const gameOverElement = document.getElementById('gameOver');
        const restartBtn = document.getElementById('restartBtn');
        const homeBtn = document.getElementById('homeBtn');
        const highScoreElement = document.querySelector('.high-score');
        const weaponSelectorToggle = document.getElementById('weaponSelectorToggle');
        const weaponSelector = document.getElementById('weaponSelector');

        // オーディオ要素
        let shootSound = null;
        let bossShootSound = null;
        let explosionSound = null;
        let bossExplosionSound = null;

        // サウンド初期化
        function initSounds() {
            // プレイヤーの銃撃音
            shootSound = new Audio('shoot.mp3');
            shootSound.volume = 0.3;
            
            // ボスの銃撃音
            bossShootSound = new Audio('boss_shoot.mp3');
            bossShootSound.volume = 0.4;
            
            // 敵の爆発音
            explosionSound = new Audio('explosion.mp3');
            explosionSound.volume = 0.3;
            
            // ボスの爆発音
            bossExplosionSound = new Audio('boss_explosion.mp3');
            bossExplosionSound.volume = 0.5;
        }

        // サウンド再生関数
        function playSound(audio) {
            if (audio) {
                audio.currentTime = 0; // 音を最初から再生
                audio.play().catch(e => console.log('音声再生エラー:', e));
            }
        }

        // キャンバスサイズを画面サイズに設定
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // プレイヤーの位置を調整（画面サイズが変わった場合）
            if (typeof player !== 'undefined' && player) {
                player.x = Math.min(player.x, canvas.width - player.width);
                player.y = Math.min(player.y, canvas.height - player.height);
            }
        }
        
        // 初期キャンバスサイズ設定
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // リサイズイベントリスナーを設定
        window.addEventListener('resize', resizeCanvas);

        // 武器選択UIの初期化（単一カード表示版）。
        // 常に左下に「現在の武器」を 1 枚だけ表示する。カードクリック / Tab で次の武器に循環。
        function initWeaponSelector() {
            weaponSelector.style.display = 'block';
            weaponSelectorToggle.style.display = 'none';

            // すべてのカードに「タップで次の武器へ」のハンドラを付ける。表示されているのは常に
            // 現在武器のカードだけなので、click は実質「次へ」ボタンとして機能する。
            const weaponDisplays = document.querySelectorAll('.weapon-display');
            weaponDisplays.forEach(display => {
                display.addEventListener('click', () => {
                    cycleWeapon(1);
                });
            });
        }
        
        // 武器選択UIの更新（現在武器のカードだけ表示）
        function updateWeaponSelector() {
            // 切替ヒントは「使用可能な武器が 2 種類以上ある時だけ」表示する。
            const hint = document.getElementById('weaponSwitchHint');
            if (hint) {
                hint.style.display = (unlockedWeapons && unlockedWeapons.length > 1) ? 'block' : 'none';
            }

            const weaponDisplays = document.querySelectorAll('.weapon-display');
            weaponDisplays.forEach(display => {
                const slotNum = parseInt(display.dataset.slot);
                const weapon = equippedWeapons[slotNum];

                // 現在の武器スロット以外は常に非表示。装備されていなければもちろん非表示。
                if (!weapon || slotNum !== currentWeapon) {
                    display.style.display = 'none';
                    return;
                }

                display.style.display = 'flex';

                const isUsable = unlockedWeapons.includes(slotNum);
                display.classList.toggle('locked', !isUsable);
                display.classList.toggle('active', isUsable);

                const icon = display.querySelector('.weapon-icon');
                const name = display.querySelector('.weapon-name');
                if (icon) {
                    icon.textContent = slotNum;
                    icon.style.background = weapon.color;
                }
                if (name) {
                    name.textContent = weapon.name;
                }
                const detail = display.querySelector('.weapon-details');
                if (detail) {
                    if (isUsable) {
                        const pierceText = weapon.pierce > 0 ? ' / 貫通' : '';
                        if (weapon.usesStamina) {
                            const cur = Math.floor(weaponStamina[slotNum] || 0);
                            const max = weaponMaxStamina[slotNum] || weapon.staminaMax;
                            const pct = Math.round((cur / max) * 100);
                            const tag = weaponOverheated[slotNum] ? '【クールダウン】' : '';
                            detail.textContent = `スタミナ ${pct}% ${tag} / 威力${weapon.damage} / 射程${getRangeLabel(weapon.range)}${pierceText}`;
                        } else {
                            detail.textContent = `残弾 ${weaponAmmo[slotNum] || 0}/${weaponMaxAmmo[slotNum] || 0} 消費${weapon.ammoCost} / 威力${weapon.damage} / 射程${getRangeLabel(weapon.range)}${pierceText}`;
                        }
                    } else {
                        const ctx = buildTriggerContext();
                        const progress = describeTriggerProgress(weapon.runTrigger, ctx);
                        detail.textContent = `🔒 ${progress}`;
                    }
                }
            });
        }

        // ゲーム状態
        let score = 0;
        let lives = 3;
        let gameRunning = true;
        let gameTime = 120; // 120秒制限
        const PLAYER_MAX_UP_RATIO = 0.35; // プレイヤーが上に進める割合（小さいほどボスに接近可能）
        let gameStartTime = Date.now();
        let bossSpawned = false;
        let bossWarningShown = false;
        let lastBossScore = 0; // 最後にボスが出現したスコア
        let lastTimeBonusScore = 0; // 最後に時間ボーナスが与えられたスコア
        let timeBonusMessage = ''; // 時間ボーナスメッセージ
        let timeBonusTimer = 0; // 時間ボーナスメッセージの表示時間
        let bossLevel = 1; // ボスの難易度レベル
        let currentWeapon = 1; // 現在のスロット（1: 通常弾固定、2-4: 編成枠）
        let unlockedWeapons = [1, 2, 3, 4]; // 使用可能なスロット
        // 武器ごとに独立した残弾（補給・宝箱の挙動は従来どおり）
        let weaponMaxAmmo = {};
        let weaponAmmo = {};
        // スタミナ式武器（ブレード等）用: スロット番号 -> 現在スタミナ / 最大スタミナ / オーバーヒート中フラグ
        let weaponStamina = {};
        let weaponMaxStamina = {};
        let weaponOverheated = {};
        let equippedWeaponIds = ['normal', 'rapid', 'shotgun', 'laser'];
        let equippedWeapons = {};
        function getCurrentAmmo() { return weaponAmmo[currentWeapon] || 0; }
        function getCurrentMaxAmmo() { return weaponMaxAmmo[currentWeapon] || 0; }
        function refillAllAmmoToMax() {
            Object.keys(weaponMaxAmmo).forEach(k => { weaponAmmo[k] = weaponMaxAmmo[k]; });
        }
        function addSupplyAmmoToAll(amount) {
            Object.keys(weaponMaxAmmo).forEach(k => {
                const id = parseInt(k);
                weaponAmmo[id] = Math.min(weaponMaxAmmo[id], (weaponAmmo[id] || 0) + amount);
            });
        }
        // スタミナ系: 各スロットの自然回復・オーバーヒート復帰判定。dt はミリ秒。
        function updateWeaponStamina(dt) {
            Object.keys(equippedWeapons).forEach(slotKey => {
                const slot = parseInt(slotKey);
                const w = equippedWeapons[slot];
                if (!w || !w.usesStamina) return;
                const max = weaponMaxStamina[slot] || w.staminaMax;
                const regen = (w.staminaRegen || 0) * (dt / 1000);
                weaponStamina[slot] = Math.min(max, (weaponStamina[slot] || 0) + regen);
                if (weaponOverheated[slot] && weaponStamina[slot] >= max * (w.overheatRecover || 0.4)) {
                    weaponOverheated[slot] = false;
                }
            });
        }

            const w = equippedWeapons[currentWeapon];
            if (w && w.usesStamina) {
                const cur = Math.floor(weaponStamina[currentWeapon] || 0);
                const max = weaponMaxStamina[currentWeapon] || w.staminaMax;
                const pct = Math.round((cur / max) * 100);
                const bars = Math.round((cur / max) * 10);

        const DEFAULT_WEAPON_LOADOUT = ['normal', 'rapid', 'shotgun', 'laser'];

                }

        // runTrigger 評価器。新しい武器・トリガーを追加するときはここを増やすだけで対応できる。
        // 'all' は AND の複合トリガー。requirements の各要素を再帰的に評価する。
        const RUN_TRIGGER_EVALUATORS = {
            always: () => true,
            bossLevelDefeated: (trigger, ctx) => {
                const level = trigger.level || 1;
                return ctx.defeatedBossLevels.has(level);
            },
            scoreReached: (trigger, ctx) => ctx.score >= (trigger.value || 0),
            supplyCollected: (trigger, ctx) => (ctx.suppliesCollected || 0) >= (trigger.count || 1),
            enemyKillCount: (trigger, ctx) => (ctx.enemyKillCount || 0) >= (trigger.count || 1),
            // damageTakenInRun: livesLost が max 以下のあいだ TRUE（例: max=0 で「ノーダメ」）
            damageTakenInRun: (trigger, ctx) => (ctx.livesLost || 0) <= (trigger.max || 0),
            livesLost: (trigger, ctx) => (ctx.livesLost || 0) >= (trigger.count || 1),
            all: (trigger, ctx) => Array.isArray(trigger.requirements)
                && trigger.requirements.every(req => evaluateRunTrigger(req, ctx))
        };

        function getRangeLabel(range) {
            if (range <= 320) return '短';
            if (range <= 700) return '中';
            return '長';
        }

        function getUseConditionLabel(weapon) {
            const trigger = weapon.runTrigger || { type: 'always' };
            if (trigger.type === 'always') return '';
            return ` / ${trigger.label || '解放条件あり'}`;
        }

        // ロック中武器の解放条件を「現在値 / 必要値」で動的に表示するためのテキスト整形。
        function describeTriggerProgress(trigger, ctx) {
            const t = trigger || { type: 'always' };
            if (t.type === 'all' && Array.isArray(t.requirements)) {
                return t.requirements.map(r => describeSingleTriggerProgress(r, ctx)).join(' + ');
            }
            return describeSingleTriggerProgress(t, ctx);
        }

        function describeSingleTriggerProgress(t, ctx) {
            switch (t.type) {
                case 'bossLevelDefeated': {
                    const level = t.level || 1;
                    const ok = ctx.defeatedBossLevels && ctx.defeatedBossLevels.has(level);
                    return ok ? `Lv${level}ボス✓` : `Lv${level}ボス未撃破`;
                }
                case 'supplyCollected': {
                    const need = t.count || 1;
                    const cur = ctx.suppliesCollected || 0;
                    return `補給 ${Math.min(cur, need)}/${need}`;
                }
                case 'enemyKillCount': {
                    const need = t.count || 1;
                    const cur = ctx.enemyKillCount || 0;
                    return `撃破 ${Math.min(cur, need)}/${need}`;
                }
                case 'damageTakenInRun': {
                    const ok = (ctx.livesLost || 0) <= (t.max || 0);
                    return ok ? 'ノーダメ✓' : 'ノーダメ失敗';
                }
                case 'livesLost': {
                    const need = t.count || 1;
                    const cur = ctx.livesLost || 0;
                    return `被弾 ${Math.min(cur, need)}/${need}`;
                }
                case 'scoreReached':
                    return `スコア ${ctx.score || 0}/${t.value || 0}`;
                case 'always':
                    return 'いつでも';
                default:
                    return t.label || t.type || '解放条件あり';
            }
        }

        function sanitizeLoadout(rawLoadout) {
            const hasSavedLoadout = Array.isArray(rawLoadout);
            const loadout = hasSavedLoadout ? rawLoadout : DEFAULT_WEAPON_LOADOUT;
            const result = ['normal'];
            const used = new Set(result);
            for (let i = 1; i < 4; i++) {
                const candidate = loadout[i];
                if (weaponCatalog[candidate] && candidate !== 'normal' && !used.has(candidate)) {
                    result.push(candidate);
                    used.add(candidate);
                } else {
                    const fallback = hasSavedLoadout ? '' : (DEFAULT_WEAPON_LOADOUT.find(id => !used.has(id)) || '');
                    result.push(fallback);
                    if (fallback) used.add(fallback);
                }
            }
            return result;
        }

        // ログイン状態（'login' or 'guest'）。Firebase auth と localStorage 双方を見る。
        let loadoutMode = 'guest';
        // ラン中のトリガー評価に使う状態。装備武器の「覚醒条件」をここから読み取る。
        let runState = {
            defeatedBossLevels: new Set(),  // この出撃で倒したボスレベル（1, 2, 3...）
            suppliesCollected: 0,            // 補給ユニット回収数
            enemyKillCount: 0,               // 雑魚撃破累計（このラン）
            livesLost: 0                     // 被弾でライフを失った回数（このラン）
            // score は外側のグローバル `score` を都度参照する
        };

        function detectLoadoutMode() {
            try {
                if (typeof firebase !== 'undefined' && firebase.auth && firebase.auth().currentUser) {
                    return 'login';
                }
            } catch (e) {
                // 初期化前などは無視
            }
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            const playerName = localStorage.getItem('playerName');
            const firebaseUid = localStorage.getItem('firebaseUid');
            return (isLoggedIn && playerName && firebaseUid) ? 'login' : 'guest';
        }

        function loadWeaponLoadout() {
            loadoutMode = detectLoadoutMode();

            if (loadoutMode === 'login') {
                try {
                    const saved = JSON.parse(localStorage.getItem('weaponLoadout') || 'null');
                    equippedWeaponIds = sanitizeLoadout(saved);
                } catch (e) {
                    equippedWeaponIds = [...DEFAULT_WEAPON_LOADOUT];
                }
            } else {
                // 未ログインは在来の固定編成。
                equippedWeaponIds = [...DEFAULT_WEAPON_LOADOUT];
            }

            // ランごとの解放状態は両モード共通で必ずリセット。
            // 「装備可否（メタ層）」と「使用可否（ラン層）」を独立させる設計。
            runState = {
                defeatedBossLevels: new Set(),
                suppliesCollected: 0,
                enemyKillCount: 0,
                livesLost: 0
            };

            equippedWeapons = {};
            weaponMaxAmmo = {};
            weaponAmmo = {};
            weaponStamina = {};
            weaponMaxStamina = {};
            weaponOverheated = {};
            equippedWeaponIds.forEach((weaponId, index) => {
                const slot = index + 1;
                const weapon = weaponCatalog[weaponId] || null;
                if (!weapon) return;
                equippedWeapons[slot] = weapon;
                weaponMaxAmmo[slot] = weapon.maxAmmo;
                weaponAmmo[slot] = weapon.maxAmmo;
                if (weapon.usesStamina) {
                    weaponMaxStamina[slot] = weapon.staminaMax;
                    weaponStamina[slot] = weapon.staminaMax;
                    weaponOverheated[slot] = false;
                }
            });
            currentWeapon = 1;
            recomputeUnlockedSlots();
        }

        function buildTriggerContext() {
            return {
                score: score,
                defeatedBossLevels: runState.defeatedBossLevels,
                suppliesCollected: runState.suppliesCollected,
                enemyKillCount: runState.enemyKillCount,
                livesLost: runState.livesLost

        }

        function evaluateRunTrigger(trigger, ctx) {
            const t = trigger || { type: 'always' };
            const evaluator = RUN_TRIGGER_EVALUATORS[t.type];
            if (!evaluator) return false;
            return !!evaluator(t, ctx || buildTriggerContext());
        }

        function isWeaponUsable(weapon) {
            if (!weapon) return false;
            return evaluateRunTrigger(weapon.runTrigger);
        }

        function recomputeUnlockedSlots() {
            unlockedWeapons = Object.keys(equippedWeapons)
                .map(Number)
                .filter(slot => isWeaponUsable(equippedWeapons[slot]))
                .sort((a, b) => a - b);
            if (unlockedWeapons.length === 0) {
                unlockedWeapons = [1];
            }
            if (!unlockedWeapons.includes(currentWeapon)) {
                currentWeapon = unlockedWeapons[0];
            }
            // 現在武器が drone でなくなったらコンパニオンを撤収
            refreshDrones();

            updateRunStatusHud();

        // ラン進捗（撃破ボス・補給・キル・被弾）の表示。装備中にロック武器が残っているときだけ表示する。
        const runStatusElement     = document.getElementById('runStatus');
        const runStatusBodyElement = document.getElementById('runStatusBody');
        function updateRunStatusHud() {
            if (!runStatusElement || !runStatusBodyElement) return;
            const slots = Object.keys(equippedWeapons).map(Number);
            const hasLocked = slots.some(slot => !isWeaponUsable(equippedWeapons[slot]));
            if (!hasLocked) {
                runStatusElement.style.display = 'none';

            }
            runStatusElement.style.display = 'block';
            const levelsArr = Array.from(runState.defeatedBossLevels).sort((a, b) => a - b);
            const lvText = levelsArr.length > 0
                ? levelsArr.map(l => `Lv${l}`).join(' ')
                : '<span class="warn">未撃破</span>';
            const noDamage = runState.livesLost === 0
                ? '<span class="ok">継続中</span>'
                : `<span class="warn">${runState.livesLost}回 被弾</span>`;
            runStatusBodyElement.innerHTML =
                `<div class="run-status-row"><span class="label">撃破ボス</span>${lvText}</div>` +
                `<div class="run-status-row"><span class="label">補給</span>${runState.suppliesCollected || 0}個</div>` +
                `<div class="run-status-row"><span class="label">敵撃破</span>${runState.enemyKillCount || 0}体</div>` +
                `<div class="run-status-row"><span class="label">ノーダメ</span>${noDamage}</div>`;
        }

        function canUseWeapon(weapon) {
            if (!weapon) return { ok: false, reason: '未装備' };
            if (isWeaponUsable(weapon)) return { ok: true };
            const trigger = weapon.runTrigger || { type: 'always' };
            return { ok: false, reason: trigger.label || '未解放' };
        }

        // ───── 武器メカニクス用ユーティリティ ────────────────────────────────
        // 指定座標から最も近い敵（敵がいないならボス）を返す。
        function findNearestTarget(x, y) {
            let nearest = null;
            let nearestDist = Infinity;
            for (const e of enemies) {
                const dx = (e.x + (e.width || e.size || 0) / 2) - x;
                const dy = (e.y + (e.height || e.size || 0) / 2) - y;
                const d = dx * dx + dy * dy;
                if (d < nearestDist) { nearest = e; nearestDist = d; }
            }
            if (!nearest && boss) {
                return boss;
            }
            return nearest;
        }

        // bullet の現在の進行ベクトルを target 方向に lerp する（追尾）。
        // 速度の大きさは bullet.maxSpeed に保たれる。lerp 後に再正規化することで、
        // ターゲットが真後ろにある／追尾が往復するなどの局面でも速度が抜けて空中停止しない。
        function steerBulletTowards(bullet, target, force) {
            const refSpeed = bullet.maxSpeed || Math.hypot(bullet.speedX, bullet.speedY) || 1;
            const tx = target.x + (target.width || target.size || 0) / 2;
            const ty = target.y + (target.height || target.size || 0) / 2;
            const dx = tx - bullet.x;
            const dy = ty - bullet.y;
            const dist = Math.hypot(dx, dy) || 1;
            const desiredX = (dx / dist) * refSpeed;
            const desiredY = (dy / dist) * refSpeed;
            const newX = bullet.speedX * (1 - force) + desiredX * force;
            const newY = bullet.speedY * (1 - force) + desiredY * force;
            const newMag = Math.hypot(newX, newY);
            if (newMag > 0.0001) {
                bullet.speedX = (newX / newMag) * refSpeed;
                bullet.speedY = (newY / newMag) * refSpeed;
            } else {
                // 万一抜けたら現在向きを維持しつつ refSpeed で再付与
                bullet.speedX = (desiredX / refSpeed) * refSpeed;
                bullet.speedY = (desiredY / refSpeed) * refSpeed;
            }
        }

        // 範囲内の敵 / ボス を引き寄せる（重力弾用）。
        function applyGravityPull(bullet) {
            const radiusSq = bullet.pullRadius * bullet.pullRadius;
            const cx = bullet.x + bullet.width / 2;
            const cy = bullet.y + bullet.height / 2;
            const pullStep = (target) => {
                const tx = target.x + (target.width || target.size || 0) / 2;
                const ty = target.y + (target.height || target.size || 0) / 2;
                const dx = cx - tx;
                const dy = cy - ty;
                const distSq = dx * dx + dy * dy;
                if (distSq <= 1 || distSq > radiusSq) return;
                const dist = Math.sqrt(distSq);
                target.x += (dx / dist) * bullet.pullForce;
                target.y += (dy / dist) * bullet.pullForce;
            };
            for (const e of enemies) pullStep(e);
            if (boss) pullStep(boss);
        }

        // 範囲爆発の視覚エフェクト（広がる輪 + フラッシュ）
        let explosionEffects = [];
        function spawnExplosionEffect(x, y, radius) {
            explosionEffects.push({ x, y, radius, life: 24, maxLife: 24 });
        }

        // 範囲爆発: 中心(x,y)から radius 内の敵 / ボス に damage を与える（ランチャー / 機雷）。
        // 視覚エフェクトと効果音もここで一括発火する。
        function applyExplosion(x, y, radius, damage) {
            spawnExplosionEffect(x, y, radius);
            playSound(explosionSound);
            const radiusSq = radius * radius;
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                const ex = e.x + (e.width || e.size || 0) / 2;
                const ey = e.y + (e.height || e.size || 0) / 2;
                const dx = ex - x;
                const dy = ey - y;
                if (dx * dx + dy * dy <= radiusSq) {
                    e.health -= damage;
                    if (e.health <= 0) {
                        enemies.splice(i, 1);
                        score += e.points;
                        scoreElement.textContent = `スコア: ${score}`;
                        runState.enemyKillCount++;
                    }
                }
            }
            if (boss) {
                const bx = boss.x + boss.width / 2;
                const by = boss.y + boss.height / 2;
                const dx = bx - x;
                const dy = by - y;
                if (dx * dx + dy * dy <= radiusSq) {
                    boss.health -= damage;
                }
            }
            recomputeUnlockedSlots();
        }

        function updateExplosionEffects() {
            explosionEffects = explosionEffects.filter(e => { e.life--; return e.life > 0; });
        }

        // ───── ボス衝撃波 ─────
        function updateBossShockwaves() {
            if (bossShockwaves.length === 0) return;
            const now = Date.now();
            const pcx = player.x + player.width / 2;
            const pcy = player.y + player.height / 2;
            const playerRadius = Math.max(player.width, player.height) / 2;
            for (let i = bossShockwaves.length - 1; i >= 0; i--) {
                const sw = bossShockwaves[i];
                if (now < sw.chargeUntil) continue;     // 予兆中は拡張しない
                sw.radius += sw.expandSpeed;
                if (!sw.hit) {
                    const dist = Math.hypot(pcx - sw.cx, pcy - sw.cy);
                    if (Math.abs(dist - sw.radius) <= sw.thickness / 2 + playerRadius) {
                        sw.hit = true;
                        // 1 衝撃波 = ライフ 1 個分（複数ライフ消費を防ぐため hit フラグで一回だけ）
                        const dmg = sw.damage || BOSS_SHOCKWAVE_DAMAGE_LIVES;
                        lives -= dmg;
                        if (lives < 0) lives = 0;
                        livesElement.textContent = `ライフ: ${lives}`;
                        runState.livesLost += dmg;
                        recomputeUnlockedSlots();
                        playSound(explosionSound);
                        shockwaveFlashUntil = now + BOSS_SHOCKWAVE_FLASH_MS;
                        if (lives <= 0) gameOver('gameover');
                    }
                }
                if (sw.radius > sw.maxRadius) bossShockwaves.splice(i, 1);
            }
        }

        // ───── ボス機雷 ─────
        function explodeBossMine(mine) {
            if (mine.triggered) return;
            mine.triggered = true;
            const cx = mine.x + mine.size / 2;
            const cy = mine.y + mine.size / 2;
            spawnExplosionEffect(cx, cy, BOSS_MINE_EXPLODE_RADIUS);
            playSound(explosionSound);
            // プレイヤーが範囲内ならライフを 1 個分減らす
            const pcx = player.x + player.width / 2;
            const pcy = player.y + player.height / 2;
            const dist = Math.hypot(pcx - cx, pcy - cy);
            if (dist <= BOSS_MINE_EXPLODE_RADIUS) {
                lives -= BOSS_MINE_EXPLODE_DAMAGE_LIVES;
                if (lives < 0) lives = 0;
                livesElement.textContent = `ライフ: ${lives}`;
                runState.livesLost += BOSS_MINE_EXPLODE_DAMAGE_LIVES;
                recomputeUnlockedSlots();
                shockwaveFlashUntil = Date.now() + BOSS_SHOCKWAVE_FLASH_MS;
                if (lives <= 0) gameOver('gameover');
            }
        }

        function updateBossMines() {
            if (bossMines.length === 0) return;
            const now = Date.now();
            for (let i = bossMines.length - 1; i >= 0; i--) {
                const m = bossMines[i];
                if (!m.settled) {
                    m.y += m.vy;
                    m.x += m.vx;
                    // 横方向の壁で反射
                    if (m.x < 0)                       { m.x = 0; m.vx = -m.vx; }
                    if (m.x > canvas.width - m.size)   { m.x = canvas.width - m.size; m.vx = -m.vx; }
                    // 目標 Y に到達したら着地
                    if (m.y >= m.targetY) {
                        m.y = m.targetY;
                        m.vx = 0;
                        m.vy = 0;
                        m.settled = true;
                    }
                }
                // 寿命切れ → 自爆
                if (now >= m.expiresAt) {
                    explodeBossMine(m);
                    bossMines.splice(i, 1);
                    continue;
                }
                // プレイヤー接触 → 即爆発
                if (checkCollision(player, m)) {
                    explodeBossMine(m);
                    bossMines.splice(i, 1);
                    continue;
                }
                // 念のため画面外消滅（横向き反射ミスのフェールセーフ）
                if (m.y > canvas.height + 60) {
                    bossMines.splice(i, 1);
                }
            }
        }

        function drawBossMines() {
            if (bossMines.length === 0) return;
            const now = Date.now();
            ctx.save();
            bossMines.forEach(m => {
                const cx = m.x + m.size / 2;
                const cy = m.y + m.size / 2;
                const remaining = m.expiresAt - now;
                let blinkInterval = 0;
                if (remaining < BOSS_MINE_LIFE_MS - BOSS_MINE_FAST_BLINK_AT_MS) blinkInterval = 80;
                else if (remaining < BOSS_MINE_LIFE_MS - BOSS_MINE_BLINK_AT_MS) blinkInterval = 200;
                const visible = blinkInterval === 0 || (Math.floor(now / blinkInterval) % 2 === 0);
                // AoE 範囲のうっすらした円（残り 3 秒以下から表示）
                if (remaining < 3000) {
                    const t = 1 - remaining / 3000;
                    ctx.globalAlpha = 0.08 + 0.18 * t;
                    ctx.fillStyle = '#ff6633';
                    ctx.beginPath();
                    ctx.arc(cx, cy, BOSS_MINE_EXPLODE_RADIUS, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = visible ? 1 : 0.3;
                // 機雷本体
                ctx.fillStyle = remaining < 2000 ? '#ff3344' : '#ffaa00';
                ctx.shadowColor = ctx.fillStyle;
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(cx, cy, m.size / 2, 0, Math.PI * 2);
                ctx.fill();
                // 表面のスパイク
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#552200';
                ctx.lineWidth = 2;
                for (let s = 0; s < 8; s++) {
                    const a = (s / 8) * Math.PI * 2;
                    const r1 = m.size / 2;
                    const r2 = m.size / 2 + 4;
                    ctx.beginPath();
                    ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
                    ctx.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2);
                    ctx.stroke();
                }
                // 中心のコア
                ctx.fillStyle = '#220000';
                ctx.beginPath();
                ctx.arc(cx, cy, m.size / 4, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();
        }

        function drawBossShockwaves() {
            const now = Date.now();
            // 被弾フラッシュ（衝撃波がなくても短時間表示）
            if (now < shockwaveFlashUntil) {
                const t = (shockwaveFlashUntil - now) / BOSS_SHOCKWAVE_FLASH_MS;
                ctx.save();
                ctx.fillStyle = `rgba(255, 60, 120, ${0.45 * t})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.restore();
            }
            if (bossShockwaves.length === 0) return;
            ctx.save();
            bossShockwaves.forEach(sw => {
                if (now < sw.chargeUntil) {
                    // 予兆: ボスの周りに収縮するリング
                    const t = 1 - (sw.chargeUntil - now) / BOSS_SHOCKWAVE_CHARGE_MS;
                    const r = 80 - 60 * t;
                    ctx.globalAlpha = 0.3 + 0.6 * t;
                    ctx.strokeStyle = '#ff44aa';
                    ctx.lineWidth = 3 + 4 * t;
                    ctx.setLineDash([8, 6]);
                    ctx.beginPath();
                    ctx.arc(sw.cx, sw.cy, Math.max(8, r), 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    return;
                }
                const lifeRatio = 1 - sw.radius / sw.maxRadius;
                ctx.globalAlpha = 0.85 * lifeRatio;
                // 外輪（鋭いリング）
                ctx.strokeStyle = '#ff66cc';
                ctx.shadowColor = '#ff66cc';
                ctx.shadowBlur = 18;
                ctx.lineWidth = sw.thickness;
                ctx.beginPath();
                ctx.arc(sw.cx, sw.cy, sw.radius, 0, Math.PI * 2);
                ctx.stroke();
                // 内側の白いコア
                ctx.globalAlpha = 0.6 * lifeRatio;
                ctx.strokeStyle = '#ffffff';
                ctx.shadowBlur = 0;
                ctx.lineWidth = sw.thickness * 0.35;
                ctx.beginPath();
                ctx.arc(sw.cx, sw.cy, sw.radius, 0, Math.PI * 2);
                ctx.stroke();
            });
            ctx.restore();
        }

        function drawExplosionEffects() {
            if (explosionEffects.length === 0) return;
            ctx.save();
            explosionEffects.forEach(e => {
                const t = 1 - (e.life / e.maxLife);          // 0 → 1 で広がる
                const r = e.radius * (0.3 + t * 0.9);
                const alpha = 1 - t;
                // 外輪
                ctx.globalAlpha = alpha * 0.9;
                ctx.strokeStyle = '#ffaa33';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
                ctx.stroke();
                // 内側のフラッシュ
                ctx.globalAlpha = alpha * 0.35;
                ctx.fillStyle = '#ffdd66';
                ctx.beginPath();
                ctx.arc(e.x, e.y, r * 0.55, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();
        }

        // 命中時の状態異常付与（時空弾）。enemy / boss どちらでも slowedUntil を持たせる。
        function applySlowToTarget(target, durationMs) {
            if (!target) return;
            const now = Date.now();
            const candidate = now + durationMs;
            target.slowedUntil = Math.max(target.slowedUntil || 0, candidate);
        }

        // ───── 随伴機（drone）自律ユニット ────────────────────────────────────
        // 射撃キーで 1 機ずつ放出される。HP1 / droneLifeMs で自爆 / 最寄り敵を自動追尾射撃。
        let drones = [];
        const DRONE_BODY_SIZE = 18;

        function spawnDrone() {
            const w = weaponCatalog.drone;
            if (!w) return false;
            const now = Date.now();
            drones.push({
                x: player.x + player.width / 2 - DRONE_BODY_SIZE / 2,
                y: player.y - DRONE_BODY_SIZE,
                width: DRONE_BODY_SIZE, height: DRONE_BODY_SIZE,
                vx: 0, vy: -2,
                health: w.droneHealth || 1,
                spawnedAt: now,
                expiresAt: now + (w.droneLifeMs || 10000),
                fireIntervalMs: w.droneFireIntervalMs || 700,
                lastFireMs: now,
                idealY: w.droneIdealY || 110
            });
            return true;
        }

        // 旧コンパニオン互換: 装備変更ではドローンは消去せず、放出済みは寿命まで残る。
        function refreshDrones() { /* no-op: 自律ユニット化したため装備変更で消滅させない */ }

        function updateDrones() {
            if (drones.length === 0) return;
            const w = weaponCatalog.drone;
            if (!w) { drones = []; return; }
            const now = Date.now();
            for (let i = drones.length - 1; i >= 0; i--) {
                const d = drones[i];
                if (now > d.expiresAt) {
                    spawnExplosionEffect(d.x + d.width / 2, d.y + d.height / 2, 32);
                    drones.splice(i, 1);
                    continue;
                }
                const target = findNearestTarget(d.x + d.width / 2, d.y + d.height / 2);
                if (d.y > d.idealY + 4) {
                    d.vy = -1.6;
                } else if (d.y < d.idealY - 4) {
                    d.vy = 0.6;
                } else {
                    d.vy *= 0.6;
                }
                if (target) {
                    const tw = target.width || target.size || 0;
                    const tx = target.x + tw / 2;
                    const dx = tx - (d.x + d.width / 2);
                    d.vx = Math.sign(dx) * Math.min(Math.abs(dx) * 0.06, 2.6);
                } else {
                    d.vx *= 0.85;
                }
                d.x += d.vx;
                d.y += d.vy;
                if (d.x < 4)                                          { d.x = 4; d.vx = Math.abs(d.vx); }
                if (d.x > canvas.width - d.width - 4)                 { d.x = canvas.width - d.width - 4; d.vx = -Math.abs(d.vx); }
                if (d.y < 30)                                         { d.y = 30; d.vy = Math.abs(d.vy); }

                if (target && now - d.lastFireMs >= d.fireIntervalMs) {
                    d.lastFireMs = now;
                    bullets.push({
                        x: d.x + d.width / 2 - w.width / 2,
                        y: d.y - w.height,
                        width: w.width, height: w.height,
                        speedX: 0, speedY: -w.speed,
                        maxSpeed: w.speed,
                        damage: w.damage, range: w.range, traveled: 0,
                        pierceRemaining: w.pierce, color: w.color,
                        homing: false, homingForce: 0,
                        slowOnHitMs: 0, pullRadius: 0, pullForce: 0,
                        explodeOnImpact: null, blocksBossBullets: false,
                        lifeFrames: null,
                        bulletStyle: 'rect',
                        spawnedAt: now
                    });
                    playSound(shootSound);
                }

                let dead = false;
                for (let bi = bossBullets.length - 1; bi >= 0; bi--) {
                    if (checkCollision(d, bossBullets[bi])) {
                        bossBullets.splice(bi, 1);
                        d.health--;
                        if (d.health <= 0) {
                            spawnExplosionEffect(d.x + d.width / 2, d.y + d.height / 2, 32);
                            drones.splice(i, 1);
                            dead = true;
                            break;
                        }
                    }
                }
                if (dead) continue;

                // 敵本体との衝突 → ドローン破壊（接触ダメージは付与しない）
                for (let ei = 0; ei < enemies.length; ei++) {
                    if (checkCollision(d, enemies[ei])) {
                        spawnExplosionEffect(d.x + d.width / 2, d.y + d.height / 2, 32);
                        drones.splice(i, 1);
                        break;
                    }
                }
            }
        }

        function drawDrones() {
            if (drones.length === 0) return;
            const now = Date.now();
            const w = weaponCatalog.drone;
            const lifeMs = (w && w.droneLifeMs) || 10000;
            ctx.save();
            drones.forEach(d => {
                const cx = d.x + d.width / 2;
                const cy = d.y + d.height / 2;
                const remaining = Math.max(0, d.expiresAt - now);
                const lifeRatio = remaining / lifeMs;
                const color = lifeRatio > 0.5 ? '#00ff88'
                            : (lifeRatio > 0.25 ? '#ffcc44' : '#ff4466');
                const blinkInterval = lifeRatio > 0.25 ? 0 : (lifeRatio > 0.12 ? 200 : 100);
                const visible = blinkInterval === 0 || (Math.floor(now / blinkInterval) % 2 === 0);
                if (visible) {
                    ctx.fillStyle = color;
                    ctx.shadowColor = color;
                    ctx.shadowBlur = 12;
                    ctx.beginPath();
                    ctx.moveTo(cx, cy - 9);
                    ctx.lineTo(cx - 9, cy + 7);
                    ctx.lineTo(cx + 9, cy + 7);
                    ctx.closePath();
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#003322';
                    ctx.fillRect(cx - 3, cy - 1, 6, 5);
                }
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#222';
                ctx.fillRect(d.x, d.y - 5, d.width, 3);
                ctx.fillStyle = color;
                ctx.fillRect(d.x, d.y - 5, d.width * lifeRatio, 3);
            });
            ctx.restore();
        }

        // bossLevel -> 解放される武器のリスト。1レベルで複数武器を解放できる（パターンB対応）。
        const BOSS_LEVEL_META_UNLOCKS = {
            1: [{ weaponId: 'rapid', persistKey: 'rapidUnlocked' }],
            2: [{ weaponId: 'shotgun', persistKey: 'shotgunUnlocked' }],
            3: [
                { weaponId: 'laser', persistKey: 'laserUnlocked' },
                { weaponId: 'sniper', persistKey: 'sniperUnlocked' },
                { weaponId: 'launcher', persistKey: 'launcherUnlocked' }
            ],
            4: [
                { weaponId: 'slowtime', persistKey: 'slowtimeUnlocked' },
                { weaponId: 'homing', persistKey: 'homingUnlocked' },
                { weaponId: 'drone', persistKey: 'droneUnlocked' }
            ],
            5: [
                { weaponId: 'gravity', persistKey: 'gravityUnlocked' },
                { weaponId: 'mine', persistKey: 'mineUnlocked' },
                { weaponId: 'blade', persistKey: 'bladeUnlocked' }
            ],
            6: [
                { weaponId: 'shield', persistKey: 'shieldUnlocked' }
            ]
        };

        // ボス撃破イベント。ラン層の進捗を更新し、ログイン時はメタ層も永続化する。
        // 戻り値は「このレベルで初めて通知すべき武器」のリスト（過去に通知済みのものは除外）。
        // 通知済みフラグは localStorage に保存し、次回以降は同じ武器の解放通知を出さない。
        function handleBossDefeated(level) {
            // ラン層: トリガー評価のための状態更新（両モード共通）
            runState.defeatedBossLevels.add(level);
            recomputeUnlockedSlots();

            const entries = BOSS_LEVEL_META_UNLOCKS[level] || [];
            const unlockedWeapons = [];

            // 通知済みフラグの読み込み（ゲスト・ログイン共通）。読み書きに失敗しても通知は1回出す方向に倒す。
            let notified = {};
            try {
                notified = JSON.parse(localStorage.getItem('weaponUnlockNotified') || '{}') || {};
            } catch (e) {
                notified = {};
            }
            let notifiedChanged = false;

            entries.forEach(entry => {
                const weapon = weaponCatalog[entry.weaponId];
                if (!weapon) return;

                // 過去に通知していなければ今回の通知対象に積む。それ以外（既通知）は黙って素通し。
                const notifyKey = entry.persistKey || entry.weaponId;
                if (!notified[notifyKey]) {
                    unlockedWeapons.push(weapon);
                    notified[notifyKey] = true;
                    notifiedChanged = true;
                }

                if (loadoutMode === 'login') {
                    // メタ層: ログイン時のみ永続化（次回プレイから装備候補に入る）
                    try {
                        const localProgress = JSON.parse(localStorage.getItem('weaponProgress') || '{}');
                        if (!localProgress[entry.persistKey]) {
                            localProgress[entry.persistKey] = true;
                            localStorage.setItem('weaponProgress', JSON.stringify(localProgress));
                        }
                    } catch (e) {
                        // 何もしない
                    }
                    try {
                        if (typeof firebaseDataManager !== 'undefined'
                            && typeof firebase !== 'undefined'
                            && firebase.auth
                            && firebase.auth().currentUser) {
                            firebaseDataManager.updateProgress({ [entry.persistKey]: true }).catch(() => {});
                        }
                    } catch (e) {
                        // Firebase 未初期化等は無視
                    }
                }
            });

            // 通知済みフラグの保存（読み込めなかった場合でも書き込みは試みる）
            if (notifiedChanged) {
                try {
                    localStorage.setItem('weaponUnlockNotified', JSON.stringify(notified));
                } catch (e) {
                    // localStorage 容量超過などは無視（次回再通知になるだけ）
                }
            }

            return unlockedWeapons;
        }

        function setWeapon(weaponNum) {
            if (!unlockedWeapons.includes(weaponNum) || !equippedWeapons[weaponNum]) return;
            if (currentWeapon === weaponNum) return;
            currentWeapon = weaponNum;
            weaponElement.textContent = `武器: ${equippedWeapons[weaponNum].name}`;
            updateWeaponSelector();
            updateAmmoHud();
            refreshDrones();
            weaponChangeMessage = `武器変更: ${equippedWeapons[weaponNum].name}`;
            weaponChangeTimer = 120;
        }

        function cycleWeapon(direction) {
            if (unlockedWeapons.length <= 1) return;
            const idx = unlockedWeapons.indexOf(currentWeapon);
            const start = idx >= 0 ? idx : 0;
            let next = start;
            for (let i = 0; i < unlockedWeapons.length; i++) {
                next = (next + direction + unlockedWeapons.length) % unlockedWeapons.length;
                if (unlockedWeapons[next] !== currentWeapon) {
                    setWeapon(unlockedWeapons[next]);
                    return;
                }
            }
        }

        // プレイヤー
        let player = {
            x: canvas.width / 2,
            y: canvas.height - 80,
            width: Math.max(30, Math.min(40, canvas.width / 20)),
            height: Math.max(40, Math.min(50, canvas.height / 15)),
            speed: 5
        };

        // 弾丸配列
        let bullets = [];
        let enemies = [];
        let boss = null;
        let bossBullets = [];
        // ボス衝撃波（Lv.5以上のボスがプレイヤー接近時に放つ範囲攻撃）
        // 各要素: { cx, cy, radius, expandSpeed, maxRadius, thickness, chargeUntil, hit, damage }
        let bossShockwaves = [];
        let shockwaveFlashUntil = 0;                  // 被弾時の画面フラッシュ
        const BOSS_SHOCKWAVE_LEVEL_THRESHOLD = 5;     // Lv.5(=2000点)以上で発動
        const BOSS_SHOCKWAVE_TRIGGER_DIST = 220;      // この距離未満で発動
        const BOSS_SHOCKWAVE_COOLDOWN_MS = 3000;
        const BOSS_SHOCKWAVE_CHARGE_MS = 400;         // 予兆
        const BOSS_SHOCKWAVE_EXPAND_SPEED = 6;
        const BOSS_SHOCKWAVE_MAX_RADIUS = 280;
        const BOSS_SHOCKWAVE_THICKNESS = 22;
        const BOSS_SHOCKWAVE_DAMAGE_LIVES = 1;        // 被弾でライフ -1（明示的に 1 ライフ分）
        const BOSS_SHOCKWAVE_FLASH_MS = 250;

        // ボス吸収（Lv.7=3000点以上のボスが雑魚を引き寄せて吸収しHP回復）
        const BOSS_ABSORB_LEVEL_THRESHOLD = 7;        // Lv.7(=3000点)以上で発動
        const BOSS_ABSORB_RANGE = 280;
        const BOSS_ABSORB_PULL_FORCE = 1.2;
        const BOSS_ABSORB_COOLDOWN_MS = 1500;
        const BOSS_ABSORB_MIN_HEAL = 4;
        const BOSS_ABSORB_HEAL_RATIO = 0.4;          // enemy.points × 0.4 を HP に変換

        // ボス狙撃（Lv.9以上は通常攻撃が狙い撃ち単発に変化）
        const BOSS_SNIPER_LEVEL_THRESHOLD = 9;
        const BOSS_SNIPER_CHARGE_MS = 400;            // 発射前のレーザー照準時間
        const BOSS_SNIPER_BULLET_SPEED = 9;
        const BOSS_SNIPER_BULLET_W = 10;
        const BOSS_SNIPER_BULLET_H = 22;
        const BOSS_SNIPER_MIN_INTERVAL_MS = 1100;     // 狙撃間隔の下限
        const BOSS_SNIPER_DOUBLE_LEVEL = 10;          // このレベル以上で 2 発になる
        const BOSS_SNIPER_DOUBLE_SPREAD = 0.15;       // 2 発時の扇開き角（rad）

        // ボス部下（Lv.9でLv.1部下x2 / Lv.10でLv.2部下x2 / 8秒で吸収して全回復）
        const BOSS_MINION_LEVEL_THRESHOLD = 9;
        const BOSS_MINION_COUNT = 2;
        const BOSS_MINION_ABSORB_DELAY_MS = 8000;
        const BOSS_MINION_PULL_FORCE = 4;
        let bossMinions = [];

        // ボス機雷設置（Lv.8=4000点以上のボスが機雷を投下）
        const BOSS_MINE_LEVEL_THRESHOLD = 8;
        const BOSS_MINE_DROP_COOLDOWN_MS = 4000;
        const BOSS_MINE_LIFE_MS = 8000;
        const BOSS_MINE_BLINK_AT_MS = 5000;
        const BOSS_MINE_FAST_BLINK_AT_MS = 7000;
        const BOSS_MINE_FALL_SPEED = 2.6;             // 着地までの落下速度（一定）
        const BOSS_MINE_TARGET_Y_MIN_RATIO = 0.45;    // canvas.height * 0.45（画面中央）
        const BOSS_MINE_TARGET_Y_MAX_RATIO = 0.85;    // canvas.height * 0.85（プレイヤーの手前）
        const BOSS_MINE_HORIZONTAL_DRIFT = 0.5;       // 横方向のランダムドリフト
        const BOSS_MINE_SIZE = 28;
        const BOSS_MINE_EXPLODE_RADIUS = 90;
        const BOSS_MINE_EXPLODE_DAMAGE_LIVES = 1;
        let bossMines = [];                            // [{ x, y, vx, vy, targetY, settled, size, spawnedAt, expiresAt, triggered }]
        let treasureBox = null; // 宝箱
        let supplyUnits = []; // 支援物資（補給型ユニット）
        let healthItems = []; // ライフ回復アイテム

        // 敵の種類（基準速度）
        const baseEnemyTypes = [
            { color: '#ff0000', size: Math.max(25, Math.min(35, canvas.width / 30)), points: 5, speed: 1, spawnRate: 0.005, health: 3, type: 'enemy' }, // 赤い敵機（硬い）
            { color: '#ff8800', size: Math.max(20, Math.min(30, canvas.width / 35)), points: 3, speed: 2, spawnRate: 0.01, health: 2, type: 'enemy' },  // オレンジ敵機（中耐久）
            { color: '#ffff00', size: Math.max(15, Math.min(25, canvas.width / 40)), points: 1, speed: 3, spawnRate: 0.02, health: 1, type: 'enemy' }   // 黄色敵機（低耐久）
        ];
        
        // 難易度に応じた敵の種類を取得
        function getEnemyTypes() {
            return baseEnemyTypes.map(enemy => ({
                ...enemy,
                speed: enemy.speed * speedMultiplier,
                spawnRate: enemy.spawnRate * speedMultiplier
            }));
        }

        // キー入力
        const keys = {};
        let lastShootTime = 0; // 最後に発射した時間
        const shootCooldown = 100; // 発射のクールダウン時間（ミリ秒）
        
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === ' ') {
                e.preventDefault();
                const now = Date.now();
                if (now - lastShootTime > shootCooldown) {
                    shoot();
                    lastShootTime = now;
                }
            }

            if (e.key === 'Tab') {
                e.preventDefault();
                cycleWeapon(e.shiftKey ? -1 : 1);
                return;
            }
            
            // 武器選択（数字キー1-4）
            if (e.key >= '1' && e.key <= '4') {
                const weaponNum = parseInt(e.key);
                setWeapon(weaponNum);
            }
        });
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // タッチ操作の変数
        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;
        let lastTouchTime = 0;
        let touchMoved = false;
        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let playerStartX = 0;
        let playerStartY = 0;

        // タッチイベント
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            touchMoved = false;
            lastTouchTime = Date.now();
            
            // ドラッグ開始
            isDragging = false;
            dragStartX = touch.clientX;
            dragStartY = touch.clientY;
            playerStartX = player.x;
            playerStartY = player.y;
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            touchEndX = touch.clientX;
            touchEndY = touch.clientY;
            touchMoved = true;
            
            // ドラッグ移動
            if (touchMoved) {
                const deltaX = touch.clientX - dragStartX;
                const deltaY = touch.clientY - dragStartY;
                const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
                
                if (distance > 10) { // 最小ドラッグ距離
                    isDragging = true;
                    
                    // プレイヤーの位置をリアルタイムで更新
                    const newX = playerStartX + deltaX;
                    const newY = playerStartY + deltaY;
                    
                    // 画面境界内に制限
                    player.x = Math.max(0, Math.min(canvas.width - player.width, newX));
                    player.y = Math.max(canvas.height * PLAYER_MAX_UP_RATIO, Math.min(canvas.height - player.height, newY));
                }
            }
        });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            const touchDuration = Date.now() - lastTouchTime;
            
            if (!isDragging && touchDuration < 200) {
                // 短時間のタップで攻撃
                shoot();
            }
            
            // ドラッグ終了
            isDragging = false;
        });

        // 弾丸発射
        function shoot() {
            const weapon = equippedWeapons[currentWeapon];
            if (!weapon) return;
            const availability = canUseWeapon(weapon);
            if (!availability.ok) {
                weaponChangeMessage = `${weapon.name}: ${availability.reason}`;
                weaponChangeTimer = 90;
                return;
            }
            // スタミナ式武器: オーバーヒート中は撃てない / 必要スタミナ未満なら撃てない
            if (weapon.usesStamina) {
                if (weaponOverheated[currentWeapon]) {
                    weaponChangeMessage = `${weapon.name}: クールダウン中`;
                    weaponChangeTimer = 30;
                    return;
                }
                const cur = weaponStamina[currentWeapon] || 0;
                if (cur < (weapon.staminaPerShot || 0)) {
                    // 0 まで使い切ったらオーバーヒート
                    weaponOverheated[currentWeapon] = true;
                    weaponChangeMessage = `${weapon.name}: オーバーヒート！`;
                    weaponChangeTimer = 60;
                    updateAmmoHud();
                    return;
                }
            } else {
                if ((weaponAmmo[currentWeapon] || 0) < weapon.ammoCost) return;
            }

            // ── 放出型武器（drone）: 自律ユニットをスポーンして弾薬を消費
            if (weapon.isDeployable && weapon.id === 'drone') {
                if (!spawnDrone()) return;
                playSound(shootSound);
                weaponAmmo[currentWeapon] -= weapon.ammoCost;
                updateAmmoHud();
                updateWeaponSelector();
                return;
            }

            // 武器に応じた弾丸を発射
            for (let i = 0; i < weapon.bulletCount; i++) {
                const spread = (i - (weapon.bulletCount - 1) / 2) * weapon.spread;
                const speedX = Math.sin(spread) * weapon.speed * 0.3;
                const speedY = -weapon.speed;
                
                bullets.push({
                    x: player.x + player.width / 2 - 2,
                    y: player.y,
                    width: weapon.width,
                    height: weapon.height,
                    speedX: speedX,
                    speedY: speedY,
                    maxSpeed: weapon.speed,
                    damage: weapon.damage,
                    range: weapon.range,
                    traveled: 0,
                    pierceRemaining: weapon.pierce,
                    color: weapon.color,
                    // 拡張プロパティ（武器カタログから引き継ぐ。未定義は falsy / null）
                    homing: !!weapon.homing,
                    homingForce: weapon.homingForce || 0,
                    slowOnHitMs: weapon.slowOnHitMs || 0,
                    pullRadius: weapon.pullRadius || 0,
                    pullForce: weapon.pullForce || 0,
                    explodeOnImpact: weapon.explodeOnImpact || null,
                    blocksBossBullets: !!weapon.blocksBossBullets,
                    lifeFrames: (typeof weapon.lifeFrames === 'number') ? weapon.lifeFrames : null,
                    bulletStyle: weapon.bulletStyle || 'rect',
                    spawnedAt: Date.now()
                });
            }
            
            playSound(shootSound);
            if (weapon.usesStamina) {
                weaponStamina[currentWeapon] = (weaponStamina[currentWeapon] || 0) - (weapon.staminaPerShot || 0);
                if (weaponStamina[currentWeapon] <= 0) {
                    weaponStamina[currentWeapon] = 0;
                    weaponOverheated[currentWeapon] = true;
                }
            } else {
                weaponAmmo[currentWeapon] -= weapon.ammoCost;
            }
            updateAmmoHud();
            updateWeaponSelector();
        }

        // 狙撃弾発射（Lv.9+）— 当たれば即死。Lv.10+ は 2 発の扇形
        function bossSnipeShot(tx, ty) {
            if (!boss) return;
            const sx = boss.x + boss.width / 2;
            const sy = boss.y + boss.height;
            const dx = tx - sx;
            const dy = ty - sy;
            const baseAngle = Math.atan2(dy, dx);
            const count = bossLevel >= BOSS_SNIPER_DOUBLE_LEVEL ? 2 : 1;
            for (let i = 0; i < count; i++) {
                // 1 発: 中央 / 2 発: ±BOSS_SNIPER_DOUBLE_SPREAD/2
                const offset = count === 1
                    ? 0
                    : (i === 0 ? -1 : 1) * BOSS_SNIPER_DOUBLE_SPREAD / 2;
                const angle = baseAngle + offset;
                bossBullets.push({
                    x: sx - BOSS_SNIPER_BULLET_W / 2,
                    y: sy,
                    width: BOSS_SNIPER_BULLET_W,
                    height: BOSS_SNIPER_BULLET_H,
                    speedX: Math.cos(angle) * BOSS_SNIPER_BULLET_SPEED,
                    speedY: Math.sin(angle) * BOSS_SNIPER_BULLET_SPEED,
                    color: '#ff00ff',
                    isSniper: true
                });
            }
            playSound(bossShootSound);
        }

        // 部下更新・描画
        function updateBossMinions() {
            if (bossMinions.length === 0) return;
            const now = Date.now();
            bossMinions = bossMinions.filter(m => {
                if (!m.beingAbsorbed) {
                    m.x += m.vx;
                    if (m.x < 10)                          { m.x = 10; m.vx = Math.abs(m.vx); }
                    if (m.x + m.width > canvas.width - 10) { m.x = canvas.width - 10 - m.width; m.vx = -Math.abs(m.vx); }
                    // 単発狙い撃ち
                    if (now - m.lastShot > m.shotInterval) {
                        m.lastShot = now;
                        const dx = (player.x + player.width/2) - (m.x + m.width/2);
                        const dy = (player.y + player.height/2) - (m.y + m.height/2);
                        const dist = Math.hypot(dx, dy) || 1;
                        const speed = 4;
                        bossBullets.push({
                            x: m.x + m.width / 2 - 3,
                            y: m.y + m.height,
                            width: 6, height: 12,
                            speedX: dx / dist * speed,
                            speedY: dy / dist * speed,
                            color: '#ff8844'
                        });
                    }
                }
                // プレイヤー本体接触
                if (checkCollision(m, player)) {
                    lives--;
                    if (lives < 0) lives = 0;
                    livesElement.textContent = `ライフ: ${lives}`;
                    runState.livesLost++;
                    recomputeUnlockedSlots();
                    if (lives <= 0) gameOver('gameover');
                }
                return m.health > 0;
            });
        }

        function drawBossMinions() {
            if (bossMinions.length === 0) return;
            ctx.save();
            bossMinions.forEach(m => {
                // ボス Lv.1/Lv.2 と同じアートワーク（サイズだけ縮小）
                drawBossArtwork(m.x, m.y, m.width, m.height, m.level);
                // HPバー
                const hpRatio = m.health / m.maxHealth;
                ctx.fillStyle = '#222';
                ctx.fillRect(m.x, m.y - 6, m.width, 4);
                ctx.fillStyle = hpRatio > 0.5 ? '#0f0' : hpRatio > 0.2 ? '#ff0' : '#f00';
                ctx.fillRect(m.x, m.y - 6, m.width * hpRatio, 4);
                // ラベル
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 11px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(`Lv.${m.level} 部下`, m.x + m.width/2, m.y + m.height + 14);
                // 吸収ビーム（吸引中）
                if (m.beingAbsorbed && boss) {
                    ctx.save();
                    ctx.strokeStyle = '#ff66ff';
                    ctx.shadowColor = '#ff66ff';
                    ctx.shadowBlur = 14;
                    ctx.lineWidth = 4;
                    ctx.globalAlpha = 0.6 + 0.3 * Math.sin(Date.now() * 0.02);
                    ctx.beginPath();
                    ctx.moveTo(boss.x + boss.width/2, boss.y + boss.height/2);
                    ctx.lineTo(m.x + m.width/2, m.y + m.height/2);
                    ctx.stroke();
                    ctx.restore();
                }
            });
            ctx.restore();
        }

        // 狙撃の照準ラインは表示しない（補助線なしの「ガチ狙撃」設計）
        function drawSniperAim() { /* no-op */ }

        // ボス吸収カウントダウン HUD（吸収開始までの残り秒数を画面上部に出す）
        function drawMinionAbsorbWarning() {
            if (!boss || bossMinions.length === 0) return;
            if (boss.minionAbsorbStartAt === null) return;
            const remaining = boss.minionAbsorbStartAt - Date.now();
            if (remaining > 0) {
                ctx.save();
                ctx.fillStyle = '#ff44aa';
                ctx.font = 'bold 18px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(`部下吸収まで ${(remaining / 1000).toFixed(1)}s — 部下を倒せ！`,
                             canvas.width / 2, 40);
                ctx.restore();
            }
        }

        // ボス弾丸発射
        function bossShoot() {
            if (!boss) return;
            
            // レベルに応じて弾丸数を増加（Lv.6 で 6 発に到達したら以降は据え置き。
            // それ以上の難易度上昇は「衝撃波(Lv.5+)」「雑魚吸収(Lv.7+)」で表現する）
            const bulletCount = Math.min(3 + Math.floor(bossLevel / 2), 6);
            
            for (let i = 0; i < bulletCount; i++) {
                const angle = (i - (bulletCount - 1) / 2) * 0.5; // 角度を計算
                const speedX = Math.sin(angle) * 3;
                const speedY = Math.cos(angle) * 4;
                
                bossBullets.push({
                    x: boss.x + boss.width / 2 - 3,
                    y: boss.y + boss.height,
                    width: 6 + (bossLevel - 1) * 2, // レベルに応じて弾丸サイズ増加
                    height: 15 + (bossLevel - 1) * 3,
                    speedX: speedX,
                    speedY: speedY,
                    color: bossLevel > 2 ? '#ff00ff' : '#ff0000' // レベル3以上は紫色
                });
            }
            playSound(bossShootSound);
        }

        // ボス生成
        function spawnBoss() {
            // 100点間隔でボスが出現
            if (!bossSpawned && score >= lastBossScore + 100) {
                bossSpawned = true;
                lastBossScore = score;
                
                // ボスの難易度レベルを計算（500点間隔でレベルアップ）
                bossLevel = Math.floor(score / 500) + 1;
                
                boss = {
                    x: canvas.width / 2 - 50,
                    y: -100,
                    width: 100 + (bossLevel - 1) * 10, // レベルに応じてサイズ増加
                    height: 80 + (bossLevel - 1) * 8,
                    health: 20 + (bossLevel - 1) * 10, // レベルに応じてHP増加
                    maxHealth: 20 + (bossLevel - 1) * 10,
                    speed: 1 * speedMultiplier,
                    moveSpeed: (2 + (bossLevel - 1) * 0.5) * speedMultiplier, // レベルに応じて移動速度増加
                    moveDirection: 1, // 移動方向（1:右、-1:左）
                    points: 50 + (bossLevel - 1) * 25, // レベルに応じて点数増加
                    lastShot: 0,
                    shotInterval: Math.max(500, 2000 - (bossLevel - 1) * 200) / speedMultiplier, // レベルに応じて攻撃間隔短縮
                    lastShockwaveAt: 0,
                    sniperLocked: false,
                    sniperTargetX: 0,
                    sniperTargetY: 0,
                    minionAbsorbStartAt: null
                };

                // 狙撃モード(Lv.9+): 単発高精度なので最低発射間隔を確保
                if (bossLevel >= BOSS_SNIPER_LEVEL_THRESHOLD) {
                    boss.shotInterval = Math.max(boss.shotInterval, BOSS_SNIPER_MIN_INTERVAL_MS);
                }

                // 部下出現(Lv.9+): Lv.9 → Lv.1 部下x2 / Lv.10+ → Lv.2 部下x2
                bossMinions = [];
                if (bossLevel >= BOSS_MINION_LEVEL_THRESHOLD) {
                    spawnBossMinions(bossLevel);
                }
