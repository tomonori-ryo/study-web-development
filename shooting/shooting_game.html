            drones.push({
                x: player.x + player.width / 2 - DRONE_BODY_SIZE / 2,
                y: player.y - DRONE_BODY_SIZE,
                width: DRONE_BODY_SIZE, height: DRONE_BODY_SIZE,
                vx: 0, vy: -2,
                health: w.droneHealth || 1,
                spawnedAt: now,
                expiresAt: now + (w.droneLifeMs || 10000),
                fireIntervalMs: w.droneFireIntervalMs || 700,
                lastFireMs: now,
                idealY: w.droneIdealY || 110
            });
            return true;
        }

        // 旧コンパニオン互換: 装備変更ではドローンは消去せず、放出済みは寿命まで残る。
        function refreshDrones() { /* no-op: 自律ユニット化したため装備変更で消滅させない */ }

        function updateDrones() {
            if (drones.length === 0) return;
            const w = weaponCatalog.drone;
            if (!w) { drones = []; return; }
            const now = Date.now();
            for (let i = drones.length - 1; i >= 0; i--) {
                const d = drones[i];
                if (now > d.expiresAt) {
                    spawnExplosionEffect(d.x + d.width / 2, d.y + d.height / 2, 32);
                    drones.splice(i, 1);
                    continue;
                }
                const target = findNearestTarget(d.x + d.width / 2, d.y + d.height / 2);
                if (d.y > d.idealY + 4) {
                    d.vy = -1.6;
                } else if (d.y < d.idealY - 4) {
                    d.vy = 0.6;
                } else {
                    d.vy *= 0.6;
                }
                if (target) {
                    const tw = target.width || target.size || 0;
                    const tx = target.x + tw / 2;
                    const dx = tx - (d.x + d.width / 2);
                    d.vx = Math.sign(dx) * Math.min(Math.abs(dx) * 0.06, 2.6);
                } else {
                    d.vx *= 0.85;
                }
                d.x += d.vx;
                d.y += d.vy;
                if (d.x < 4)                                          { d.x = 4; d.vx = Math.abs(d.vx); }
                if (d.x > canvas.width - d.width - 4)                 { d.x = canvas.width - d.width - 4; d.vx = -Math.abs(d.vx); }
                if (d.y < 30)                                         { d.y = 30; d.vy = Math.abs(d.vy); }

                if (target && now - d.lastFireMs >= d.fireIntervalMs) {
                    d.lastFireMs = now;
                    bullets.push({
                        x: d.x + d.width / 2 - w.width / 2,
                        y: d.y - w.height,
                        width: w.width, height: w.height,
                        speedX: 0, speedY: -w.speed,
                        maxSpeed: w.speed,
                        damage: w.damage, range: w.range, traveled: 0,
                        pierceRemaining: w.pierce, color: w.color,
                        homing: false, homingForce: 0,
                        slowOnHitMs: 0, pullRadius: 0, pullForce: 0,
                        explodeOnImpact: null, blocksBossBullets: false,
                        lifeFrames: null,
                        bulletStyle: 'rect',
                        spawnedAt: now
                    });
                    playSound(shootSound);
                }

                let dead = false;
                for (let bi = bossBullets.length - 1; bi >= 0; bi--) {
                    if (checkCollision(d, bossBullets[bi])) {
                        bossBullets.splice(bi, 1);
                        d.health--;
                        if (d.health <= 0) {
                            spawnExplosionEffect(d.x + d.width / 2, d.y + d.height / 2, 32);
                            drones.splice(i, 1);
                            dead = true;
                            break;
                        }
                    }
                }
                if (dead) continue;

                // 敵本体との衝突 → ドローン破壊（接触ダメージは付与しない）
                for (let ei = 0; ei < enemies.length; ei++) {
                    if (checkCollision(d, enemies[ei])) {
                        spawnExplosionEffect(d.x + d.width / 2, d.y + d.height / 2, 32);
                        drones.splice(i, 1);
                        break;
                    }
                }
            }
        }

        function drawDrones() {
            if (drones.length === 0) return;
            const now = Date.now();
            const w = weaponCatalog.drone;
            const lifeMs = (w && w.droneLifeMs) || 10000;
            ctx.save();
            drones.forEach(d => {
                const cx = d.x + d.width / 2;
                const cy = d.y + d.height / 2;
                const remaining = Math.max(0, d.expiresAt - now);
                const lifeRatio = remaining / lifeMs;
                const color = lifeRatio > 0.5 ? '#00ff88'
                            : (lifeRatio > 0.25 ? '#ffcc44' : '#ff4466');
                const blinkInterval = lifeRatio > 0.25 ? 0 : (lifeRatio > 0.12 ? 200 : 100);
                const visible = blinkInterval === 0 || (Math.floor(now / blinkInterval) % 2 === 0);
                if (visible) {
                    ctx.fillStyle = color;
                    ctx.shadowColor = color;
                    ctx.shadowBlur = 12;
                    ctx.beginPath();
                    ctx.moveTo(cx, cy - 9);
                    ctx.lineTo(cx - 9, cy + 7);
                    ctx.lineTo(cx + 9, cy + 7);
                    ctx.closePath();
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#003322';
                    ctx.fillRect(cx - 3, cy - 1, 6, 5);
                }
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#222';
                ctx.fillRect(d.x, d.y - 5, d.width, 3);
                ctx.fillStyle = color;
                ctx.fillRect(d.x, d.y - 5, d.width * lifeRatio, 3);
            });
            ctx.restore();
        }

        // bossLevel -> 解放される武器のリスト。1レベルで複数武器を解放できる（パターンB対応）。
        const BOSS_LEVEL_META_UNLOCKS = {
            1: [{ weaponId: 'rapid', persistKey: 'rapidUnlocked' }],
            2: [{ weaponId: 'shotgun', persistKey: 'shotgunUnlocked' }],
            3: [
                { weaponId: 'laser', persistKey: 'laserUnlocked' },
                { weaponId: 'sniper', persistKey: 'sniperUnlocked' },
                { weaponId: 'launcher', persistKey: 'launcherUnlocked' }
            ],
            4: [
                { weaponId: 'slowtime', persistKey: 'slowtimeUnlocked' },
                { weaponId: 'homing', persistKey: 'homingUnlocked' },
                { weaponId: 'drone', persistKey: 'droneUnlocked' }
            ],
            5: [
                { weaponId: 'gravity', persistKey: 'gravityUnlocked' },
                { weaponId: 'mine', persistKey: 'mineUnlocked' },
                { weaponId: 'blade', persistKey: 'bladeUnlocked' }
            ]
        };

        // ボス撃破イベント。ラン層の進捗を更新し、ログイン時はメタ層も永続化する。
        // 戻り値は「このレベルで初めて通知すべき武器」のリスト（過去に通知済みのものは除外）。
        // 通知済みフラグは localStorage に保存し、次回以降は同じ武器の解放通知を出さない。
        function handleBossDefeated(level) {
            // ラン層: トリガー評価のための状態更新（両モード共通）
            runState.defeatedBossLevels.add(level);
            recomputeUnlockedSlots();

            const entries = BOSS_LEVEL_META_UNLOCKS[level] || [];
            const unlockedWeapons = [];

            // 通知済みフラグの読み込み（ゲスト・ログイン共通）。読み書きに失敗しても通知は1回出す方向に倒す。
            let notified = {};
            try {
                notified = JSON.parse(localStorage.getItem('weaponUnlockNotified') || '{}') || {};
            } catch (e) {
                notified = {};
            }
            let notifiedChanged = false;

            entries.forEach(entry => {
                const weapon = weaponCatalog[entry.weaponId];
                if (!weapon) return;

                // 過去に通知していなければ今回の通知対象に積む。それ以外（既通知）は黙って素通し。
                const notifyKey = entry.persistKey || entry.weaponId;
                if (!notified[notifyKey]) {
                    unlockedWeapons.push(weapon);
                    notified[notifyKey] = true;
                    notifiedChanged = true;
                }

                if (loadoutMode === 'login') {
                    // メタ層: ログイン時のみ永続化（次回プレイから装備候補に入る）
                    try {
                        const localProgress = JSON.parse(localStorage.getItem('weaponProgress') || '{}');
                        if (!localProgress[entry.persistKey]) {
                            localProgress[entry.persistKey] = true;
                            localStorage.setItem('weaponProgress', JSON.stringify(localProgress));
                        }
                    } catch (e) {
                        // 何もしない
                    }
                    try {
                        if (typeof firebaseDataManager !== 'undefined'
                            && typeof firebase !== 'undefined'
                            && firebase.auth
                            && firebase.auth().currentUser) {
                            firebaseDataManager.updateProgress({ [entry.persistKey]: true }).catch(() => {});
                        }
                    } catch (e) {
                        // Firebase 未初期化等は無視
                    }
                }
            });

            // 通知済みフラグの保存（読み込めなかった場合でも書き込みは試みる）
            if (notifiedChanged) {
                try {
                    localStorage.setItem('weaponUnlockNotified', JSON.stringify(notified));
                } catch (e) {
                    // localStorage 容量超過などは無視（次回再通知になるだけ）
                }
            }

            return unlockedWeapons;
        }

        function setWeapon(weaponNum) {
            if (loadoutMode === 'guest') return;
            const num = parseInt(weaponNum, 10);
            if (!unlockedWeapons.includes(num) || !equippedWeapons[num]) return;
            if (currentWeapon === num) return;
            currentWeapon = num;
            weaponElement.textContent = `武器: ${equippedWeapons[num].name}`;
            updateWeaponSelector();
            updateAmmoHud();
            refreshDrones();
            weaponChangeMessage = `武器変更: ${equippedWeapons[num].name}`;
            weaponChangeTimer = 120;
        }

        function cycleWeapon(direction) {
            if (loadoutMode === 'guest') return;
            if (unlockedWeapons.length <= 1) return;
            const idx = unlockedWeapons.indexOf(currentWeapon);
            const start = idx >= 0 ? idx : 0;
            let next = start;
            for (let i = 0; i < unlockedWeapons.length; i++) {
                next = (next + direction + unlockedWeapons.length) % unlockedWeapons.length;
                if (unlockedWeapons[next] !== currentWeapon) {
                    setWeapon(unlockedWeapons[next]);
                    return;
                }
            }
        }

        // プレイヤー
        let player = {
            x: canvas.width / 2,
            y: canvas.height - 80,
            width: Math.max(30, Math.min(40, canvas.width / 20)),
            height: Math.max(40, Math.min(50, canvas.height / 15)),
            speed: 5
        };
        /** 火炎先読み用: 直前の update 終了時の自機座標（タッチのフレーム間移動を含む） */
        let playerFlamePrevFrameX = null;
        let playerFlamePrevFrameY = null;
        let playerFlameLeadDx = 0;
        let playerFlameLeadDy = 0;

        // 弾丸配列
        let bullets = [];
        let enemies = [];
        let boss = null;
        let bossBullets = [];
        // ボス衝撃波（Lv.5以上のボスがプレイヤー接近時に放つ範囲攻撃）
        // 各要素: { cx, cy, radius, expandSpeed, maxRadius, thickness, chargeUntil, hit, damage }
        let bossShockwaves = [];
        let shockwaveFlashUntil = 0;                  // 被弾時の画面フラッシュ
        const BOSS_SHOCKWAVE_LEVEL_THRESHOLD = 5;     // Lv.5(=2000点)以上で発動
        const BOSS_SHOCKWAVE_TRIGGER_DIST = 220;      // この距離未満で発動
        const BOSS_SHOCKWAVE_COOLDOWN_MS = 3000;
        const BOSS_SHOCKWAVE_CHARGE_MS = 400;         // 予兆
        const BOSS_SHOCKWAVE_EXPAND_SPEED = 6;
        const BOSS_SHOCKWAVE_MAX_RADIUS = 280;
        const BOSS_SHOCKWAVE_THICKNESS = 22;
        const BOSS_SHOCKWAVE_DAMAGE_LIVES = 1;        // 被弾でライフ -1（明示的に 1 ライフ分）
        const BOSS_SHOCKWAVE_FLASH_MS = 250;

        // ボス吸収（Lv.7=3000点以上のボスが雑魚を引き寄せて吸収しHP回復）
        const BOSS_ABSORB_LEVEL_THRESHOLD = 7;        // Lv.7(=3000点)以上で発動
        const BOSS_ABSORB_RANGE = 280;
        const BOSS_ABSORB_PULL_FORCE = 1.2;
        const BOSS_ABSORB_COOLDOWN_MS = 1500;
        const BOSS_ABSORB_MIN_HEAL = 4;
        const BOSS_ABSORB_HEAL_RATIO = 0.4;          // enemy.points × 0.4 を HP に変換

        // ボス狙撃（Lv.9以上は通常攻撃が狙い撃ち単発に変化）
        const BOSS_SNIPER_LEVEL_THRESHOLD = 9;
        const BOSS_SNIPER_CHARGE_MS = 400;            // 発射前のレーザー照準時間
        const BOSS_SNIPER_BULLET_SPEED = 9;
        const BOSS_SNIPER_BULLET_W = 10;
        const BOSS_SNIPER_BULLET_H = 22;
        const BOSS_SNIPER_MIN_INTERVAL_MS = 1100;     // 狙撃間隔の下限
        const BOSS_SNIPER_DOUBLE_LEVEL = 10;          // このレベル以上で 2 発になる
        const BOSS_SNIPER_DOUBLE_SPREAD = 0.15;       // 2 発時の扇開き角（rad）

        // ボス部下（Lv.9でLv.1部下x2 / Lv.10でLv.2部下x2 / 8秒で吸収して全回復）
        const BOSS_MINION_LEVEL_THRESHOLD = 9;
        const BOSS_MINION_COUNT = 2;
        const BOSS_MINION_ABSORB_DELAY_MS = 8000;
        const BOSS_MINION_PULL_FORCE = 4;
        let bossMinions = [];

        // 個別攻撃トグル: ボス毎の featuresOverride{ key: true|false } で
        //   featureLevel に依存せず ON/OFF を強制できる。未指定 (undefined) なら
        //   従来通り Lv 閾値で判定する。
        function hasBossFeature(boss, key) {
            if (!boss) return false;
            const ov = boss.featuresOverride;
            if (ov && typeof ov[key] === 'boolean') return ov[key];
            const lvl = boss.level || bossLevel;
            switch (key) {
                case 'shockwave':  return lvl >= BOSS_SHOCKWAVE_LEVEL_THRESHOLD;
                case 'absorption': return lvl >= BOSS_ABSORB_LEVEL_THRESHOLD;
                case 'mines':      return lvl >= BOSS_MINE_LEVEL_THRESHOLD;
                case 'sniper':     return lvl >= BOSS_SNIPER_LEVEL_THRESHOLD;
                case 'minions':    return lvl >= BOSS_MINION_LEVEL_THRESHOLD;
                default: return false;
            }
        }

        // ボス機雷設置（Lv.8=4000点以上のボスが機雷を投下）
        const BOSS_MINE_LEVEL_THRESHOLD = 8;
        const BOSS_MINE_DROP_COOLDOWN_MS = 4000;
        const BOSS_MINE_LIFE_MS = 8000;
        const BOSS_MINE_BLINK_AT_MS = 5000;
        const BOSS_MINE_FAST_BLINK_AT_MS = 7000;
        const BOSS_MINE_FALL_SPEED = 2.6;             // 着地までの落下速度（一定）
        const BOSS_MINE_TARGET_Y_MIN_RATIO = 0.45;    // canvas.height * 0.45（画面中央）
        const BOSS_MINE_TARGET_Y_MAX_RATIO = 0.85;    // canvas.height * 0.85（プレイヤーの手前）
        const BOSS_MINE_HORIZONTAL_DRIFT = 0.5;       // 横方向のランダムドリフト
        const BOSS_MINE_SIZE = 28;
        const BOSS_MINE_EXPLODE_RADIUS = 90;
        const BOSS_MINE_EXPLODE_DAMAGE_LIVES = 1;
        let bossMines = [];                            // [{ x, y, vx, vy, targetY, settled, size, spawnedAt, expiresAt, triggered }]
        let treasureBox = null; // 宝箱
        let supplyUnits = []; // 支援物資（補給型ユニット）
        let healthItems = []; // ライフ回復アイテム

        // 敵の種類（基準速度）
        const baseEnemyTypes = [
            { color: '#ff0000', size: Math.max(25, Math.min(35, canvas.width / 30)), points: 5, speed: 1, spawnRate: 0.005, health: 3, type: 'enemy' }, // 赤い敵機（硬い）
            { color: '#ff8800', size: Math.max(20, Math.min(30, canvas.width / 35)), points: 3, speed: 2, spawnRate: 0.01, health: 2, type: 'enemy' },  // オレンジ敵機（中耐久）
            { color: '#ffff00', size: Math.max(15, Math.min(25, canvas.width / 40)), points: 1, speed: 3, spawnRate: 0.02, health: 1, type: 'enemy' }   // 黄色敵機（低耐久）
        ];
        
        // 難易度に応じた敵の種類を取得
        function getEnemyTypes() {
            return baseEnemyTypes.map(enemy => ({
                ...enemy,
                speed: enemy.speed * speedMultiplier,
                spawnRate: enemy.spawnRate * speedMultiplier
            }));
        }

        // キー入力
        const keys = {};
        let lastShootTime = 0; // 最後に発射した時間
        const shootCooldown = 100; // 発射のクールダウン時間（ミリ秒）
        
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === ' ') {
                e.preventDefault();
                const now = Date.now();
                if (now - lastShootTime > shootCooldown) {
                    shoot();
                    lastShootTime = now;
                }
            }

            if (e.key === 'Tab') {
                e.preventDefault();
                cycleWeapon(e.shiftKey ? -1 : 1);
                return;
            }
            
            // 武器選択（数字キー1-4）
            if (e.key >= '1' && e.key <= '4') {
                const weaponNum = parseInt(e.key);
                setWeapon(weaponNum);
            }
        });
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // タッチ操作の変数
        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;
        let lastTouchTime = 0;
        let touchMoved = false;
        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let playerStartX = 0;
        let playerStartY = 0;

        // タッチイベント
        //   preventDefault() を呼ぶため { passive: false } を必ず指定。
        //   これが無いとモバイル Chrome/Safari は passive 扱いにして preventDefault を
        //   無視し、スクロールやピンチズームが暴発してドラッグが効かなくなる。
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            if (!touch) return;
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            touchMoved = false;
            lastTouchTime = Date.now();
            
            // ドラッグ開始
            isDragging = false;
            dragStartX = touch.clientX;
            dragStartY = touch.clientY;
            playerStartX = player.x;
            playerStartY = player.y;
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            if (!touch) return;
            touchEndX = touch.clientX;
            touchEndY = touch.clientY;
            touchMoved = true;
            
            // ドラッグ移動
                const deltaX = touch.clientX - dragStartX;
                const deltaY = touch.clientY - dragStartY;
                const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
                
                if (distance > 10) { // 最小ドラッグ距離
                    isDragging = true;
                    
                    // プレイヤーの位置をリアルタイムで更新
                    const newX = playerStartX + deltaX;
                    const newY = playerStartY + deltaY;
                    
                    // 画面境界内に制限
                    player.x = Math.max(0, Math.min(canvas.width - player.width, newX));
                player.y = Math.max(canvas.height * PLAYER_MAX_UP_RATIO, Math.min(canvas.height - player.height, newY));
                }
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            const touchDuration = Date.now() - lastTouchTime;
            
            if (!isDragging && touchDuration < 200) {
                // 短時間のタップで攻撃
                shoot();
            }
            
            // ドラッグ終了
            isDragging = false;
        }, { passive: false });

        // 弾丸発射
        function shoot() {
            const cw = +currentWeapon;
            const weapon = equippedWeapons[cw];
            if (!weapon) return;
            const availability = canUseWeapon(weapon);
            if (!availability.ok) {
                weaponChangeMessage = `${weapon.name}: ${availability.reason}`;
                weaponChangeTimer = 90;
                return;
            }
            // スタミナ式武器: オーバーヒート中は撃てない / 必要スタミナ未満なら撃てない
            if (weapon.usesStamina) {
                if (weaponOverheated[cw]) {
                    weaponChangeMessage = `${weapon.name}: クールダウン中`;
                    weaponChangeTimer = 30;
                    return;
                }
                const cur = weaponStamina[cw] || 0;
                if (cur < (weapon.staminaPerShot || 0)) {
                    // 0 まで使い切ったらオーバーヒート
                    weaponOverheated[cw] = true;
                    weaponChangeMessage = `${weapon.name}: オーバーヒート！`;
                    weaponChangeTimer = 60;
                    updateAmmoHud();
                    return;
                }
            } else {
                if ((weaponAmmo[cw] || 0) < weapon.ammoCost) return;
            }

            // ── 放出型武器（drone）: 自律ユニットをスポーンして弾薬を消費
            if (weapon.isDeployable && weapon.id === 'drone') {
                if (!spawnDrone()) return;
                playSound(shootSound);
                weaponAmmo[cw] -= weapon.ammoCost;
                updateAmmoHud();
                updateWeaponSelector();
                return;
            }

            // シールド（前方へ流れる横線3本）
            if (weapon.isDirectionalShield) {
                const now = Date.now();
                if (playerDirectionalShield && playerDirectionalShield.until > now) {
                    weaponChangeMessage = `${weapon.name}: 展開中`;
                    weaponChangeTimer = 24;
                    return;
                }
                const dur = weapon.shieldDurationMs || 2000;
                playerDirectionalShield = {
                    until: now + dur,
                    spawnedAt: now,
                    bandHalfWidth: player.width * (weapon.shieldWidthMul || 1.92),
                    shieldLineThickness: weapon.shieldLineThickness,
                    shieldLineSpacing: weapon.shieldLineSpacing,
                    shieldLineBaseOffset: weapon.shieldLineBaseOffset,
                    shieldFlyCycle: weapon.shieldFlyCycle,
                    shieldFlySpeed: weapon.shieldFlySpeed
                };
                playSound(shootSound);
                weaponAmmo[cw] -= weapon.ammoCost;
                updateAmmoHud();
                updateWeaponSelector();
                return;
            }

            // バリア: 耐久を食い切るまで維持。自機は移動可。敵弾遮断は射撃の一瞬だけオフ。
            if (weapon.isBarrierWeapon) {
                if (barrierRearmSupplyPickupsNeeded > 0) {
                    weaponChangeMessage = `バリア再展開まで補給あと${barrierRearmSupplyPickupsNeeded}回`;
                    weaponChangeTimer = 28;
                    return;
                }
                if (isPlayerBarrierDeployed()) {
                    const max = playerBarrier.maxAbsorbDamage != null ? playerBarrier.maxAbsorbDamage : 3;
                    const left = Math.max(0, max - (playerBarrier.absorbedDamage || 0));
                    weaponChangeMessage = `${weapon.name}: 展開中（耐久 ${left}）`;
                    weaponChangeTimer = 24;
                    return;
                }
                if ((weaponAmmo[cw] || 0) < weapon.ammoCost) return;
                playerBarrier = {
                    absorbedDamage: 0,
                    maxAbsorbDamage: weapon.barrierMaxAbsorbDamage != null ? weapon.barrierMaxAbsorbDamage : 3,
                    radius: weapon.barrierRadius || 72,
                    shootVulnerableUntil: 0
                };
                playSound(shootSound);
                weaponAmmo[cw] -= weapon.ammoCost;
                updateAmmoHud();
                updateWeaponSelector();
                return;
            }
            
            // 武器に応じた弾丸を発射
            markPlayerBarrierShootVulnerability();
            for (let i = 0; i < weapon.bulletCount; i++) {
                const spread = (i - (weapon.bulletCount - 1) / 2) * weapon.spread;
                const speedX = Math.sin(spread) * weapon.speed * 0.3;
                const speedY = -weapon.speed;
                
                bullets.push({
                    x: player.x + player.width / 2 - 2,
                    y: player.y,
                    width: weapon.width,
                    height: weapon.height,
                    speedX: speedX,
                    speedY: speedY,
                    maxSpeed: weapon.speed,
                    damage: weapon.damage,
                    range: weapon.range,
                    traveled: 0,
                    pierceRemaining: weapon.pierce,
                    color: weapon.color,
                    // 拡張プロパティ（武器カタログから引き継ぐ。未定義は falsy / null）
                    homing: !!weapon.homing,
                    homingForce: weapon.homingForce || 0,
                    slowOnHitMs: weapon.slowOnHitMs || 0,
                    pullRadius: weapon.pullRadius || 0,
                    pullForce: weapon.pullForce || 0,
                    explodeOnImpact: weapon.explodeOnImpact || null,
                    blocksBossBullets: !!weapon.blocksBossBullets,
                    lifeFrames: (typeof weapon.lifeFrames === 'number') ? weapon.lifeFrames : null,
                    bulletStyle: weapon.bulletStyle || 'rect',
                    spawnedAt: Date.now(),
                    launcherClearsAllCosmicShields: weapon.id === 'launcher'
                });
            }

            // ブレードはスタミナ武器なので専用 SE。それ以外は通常 SE。
            playSound(weapon.id === 'blade' ? bladeSound : shootSound);
            if (weapon.usesStamina) {
                weaponStamina[cw] = (weaponStamina[cw] || 0) - (weapon.staminaPerShot || 0);
                if (weaponStamina[cw] <= 0) {
                    weaponStamina[cw] = 0;
                    weaponOverheated[cw] = true;
                }
            } else {
                weaponAmmo[cw] -= weapon.ammoCost;
            }
            updateAmmoHud();
            updateWeaponSelector();
        }

        // 狙撃弾発射（Lv.9+）— 当たれば即死。Lv.10+ は 2 発の扇形
        function bossSnipeShot(tx, ty) {
            if (!boss) return;
            const sx = boss.x + boss.width / 2;
            const sy = boss.y + boss.height;
            const dx = tx - sx;
            const dy = ty - sy;
            const baseAngle = Math.atan2(dy, dx);
            const count = bossLevel >= BOSS_SNIPER_DOUBLE_LEVEL ? 2 : 1;
            for (let i = 0; i < count; i++) {
                // 1 発: 中央 / 2 発: ±BOSS_SNIPER_DOUBLE_SPREAD/2
                const offset = count === 1
                    ? 0
                    : (i === 0 ? -1 : 1) * BOSS_SNIPER_DOUBLE_SPREAD / 2;
                const angle = baseAngle + offset;
                bossBullets.push({
                    x: sx - BOSS_SNIPER_BULLET_W / 2,
                    y: sy,
                    width: BOSS_SNIPER_BULLET_W,
                    height: BOSS_SNIPER_BULLET_H,
                    speedX: Math.cos(angle) * BOSS_SNIPER_BULLET_SPEED,
                    speedY: Math.sin(angle) * BOSS_SNIPER_BULLET_SPEED,
                    color: '#ff00ff',
                    isSniper: true
                });
            }
            playSound(bossShootSound);
        }

        // 部下更新・描画
        function updateBossMinions() {
            if (bossMinions.length === 0) return;
            const now = Date.now();
            bossMinions = bossMinions.filter(m => {
                if (!m.beingAbsorbed) {
                    m.x += m.vx;
                    if (m.x < 10)                          { m.x = 10; m.vx = Math.abs(m.vx); }
                    if (m.x + m.width > canvas.width - 10) { m.x = canvas.width - 10 - m.width; m.vx = -Math.abs(m.vx); }
                    // 単発狙い撃ち
                    if (now - m.lastShot > m.shotInterval) {
                        m.lastShot = now;
                        const dx = (player.x + player.width/2) - (m.x + m.width/2);
                        const dy = (player.y + player.height/2) - (m.y + m.height/2);
                        const dist = Math.hypot(dx, dy) || 1;
                        const speed = 4;
                        bossBullets.push({
                            x: m.x + m.width / 2 - 3,
                            y: m.y + m.height,
                            width: 6, height: 12,
                            speedX: dx / dist * speed,
                            speedY: dy / dist * speed,
                            color: '#ff8844'
                        });
                    }
                }
                if (isGruntNeutralizedByPlayerDefense(m.x, m.y, m.width, m.height)) {
                    spawnExplosionEffect(m.x + m.width / 2, m.y + m.height / 2, 30);
                    playSound(explosionSound);
                    return false;
                }
                // プレイヤー本体接触
                if (checkCollision(m, player)) {
                    runTookDamage = true;
                    lives--;
                    if (lives < 0) lives = 0;
                    livesElement.textContent = `ライフ: ${lives}`;
                    runState.livesLost++;
                    recomputeUnlockedSlots();
                    triggerPlayerHurtFeedback(1);
                    if (lives <= 0) gameOver('gameover');
                }
                return m.health > 0;
            });
        }

        function drawBossMinions() {
            if (bossMinions.length === 0) return;
            ctx.save();
            bossMinions.forEach(m => {
                // ボス Lv.1/Lv.2 と同じアートワーク（サイズだけ縮小）
                // イベントモードでは部下に「もう一方のボス画像」を使うと見分けやすくなる
                const minionImgIdx = isEventMode
                    ? (boss && boss.eventBossIndex >= 0 ? (boss.eventBossIndex + 1) % EVENT_CONFIG.bosses.length : 0)
                    : -1;
                drawBossArtwork(m.x, m.y, m.width, m.height, m.level, { eventBossIndex: minionImgIdx });
                // HPバー
                const hpRatio = m.health / m.maxHealth;
                ctx.fillStyle = '#222';
                ctx.fillRect(m.x, m.y - 6, m.width, 4);
                ctx.fillStyle = hpRatio > 0.5 ? '#0f0' : hpRatio > 0.2 ? '#ff0' : '#f00';
                ctx.fillRect(m.x, m.y - 6, m.width * hpRatio, 4);
                // ラベル
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 11px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(`Lv.${m.level} 部下`, m.x + m.width/2, m.y + m.height + 14);
                // 吸収ビーム（吸引中）
                if (m.beingAbsorbed && boss) {
                    ctx.save();
                    ctx.strokeStyle = '#ff66ff';
                    ctx.shadowColor = '#ff66ff';
                    ctx.shadowBlur = 14;
                    ctx.lineWidth = 4;
                    ctx.globalAlpha = 0.6 + 0.3 * Math.sin(Date.now() * 0.02);
                    ctx.beginPath();
                    ctx.moveTo(boss.x + boss.width/2, boss.y + boss.height/2);
                    ctx.lineTo(m.x + m.width/2, m.y + m.height/2);
                    ctx.stroke();
                    ctx.restore();
                }
            });
            ctx.restore();
        }

        // 狙撃の照準ラインは表示しない（補助線なしの「ガチ狙撃」設計）
        function drawSniperAim() { /* no-op */ }

        // ボス吸収カウントダウン HUD（吸収開始までの残り秒数を画面上部に出す）
        function drawMinionAbsorbWarning() {
            if (!boss || bossMinions.length === 0) return;
            if (boss.minionAbsorbStartAt === null) return;
            const remaining = boss.minionAbsorbStartAt - Date.now();
            if (remaining > 0) {
                ctx.save();
                ctx.fillStyle = '#ff44aa';
                ctx.font = 'bold 18px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(`部下吸収まで ${(remaining / 1000).toFixed(1)}s — 部下を倒せ！`,
                             canvas.width / 2, 40);
                ctx.restore();
            }
        }

        // ボス弾丸発射
        // ─────────────────────────────────────────────
        // イベントボスの追加弾種
        //   homing : 単発の追尾ミサイル（プレイヤーを steer して追いかける）
        //   gravity: 半透明の重力オーブ（pullRadius 内のプレイヤーを引き寄せる）
        // 通常ゲームには使わない。boss.extraGimmicks にキーが含まれるときだけ発射される。
        // ─────────────────────────────────────────────
        const BOSS_HOMING_SPEED = 3.4;
        const BOSS_HOMING_FORCE = 0.07;
        const BOSS_HOMING_LIFE = 280;  // フレーム

        const BOSS_GRAVITY_SPEED = 1.4;
        const BOSS_GRAVITY_LIFE = 360;
        const BOSS_GRAVITY_PULL_RADIUS = 180;
        const BOSS_GRAVITY_PULL_FORCE = 1.6;

        function fireBossHomingMissile() {
            if (!boss) return;
            const sx = boss.x + boss.width / 2;
            const sy = boss.y + boss.height;
            const dx = (player.x + player.width / 2) - sx;
            const dy = (player.y + player.height / 2) - sy;
            const dist = Math.hypot(dx, dy) || 1;
            bossBullets.push({
                x: sx - 6,
                y: sy,
                width: 12,
                height: 12,
                speedX: (dx / dist) * BOSS_HOMING_SPEED,
                speedY: (dy / dist) * BOSS_HOMING_SPEED,
                maxSpeed: BOSS_HOMING_SPEED,
                color: '#ff66aa',
                homing: true,
                homingForce: BOSS_HOMING_FORCE,
                lifeFrames: BOSS_HOMING_LIFE
            });
            playSound(bossShootSound);
        }

        function fireBossGravityOrb() {
            if (!boss) return;
            // 軽くプレイヤー方向へ飛ばすが、引き寄せ効果のほうがメイン
            const sx = boss.x + boss.width / 2;
            const sy = boss.y + boss.height;
            const dx = (player.x + player.width / 2) - sx;
            const dy = (player.y + player.height / 2) - sy;
            const dist = Math.hypot(dx, dy) || 1;
            bossBullets.push({
                x: sx - 12,
                y: sy,
                width: 24,
                height: 24,
                speedX: (dx / dist) * BOSS_GRAVITY_SPEED,
                speedY: (dy / dist) * BOSS_GRAVITY_SPEED,
                color: '#aa66ff',
                isGravity: true,
                pullRadius: BOSS_GRAVITY_PULL_RADIUS,
                pullForce: BOSS_GRAVITY_PULL_FORCE,
                lifeFrames: BOSS_GRAVITY_LIFE
            });
            playSound(bossShootSound);
        }

        /** 星骸メインのバリア半径（攻撃を出している間は 0＝解除され本体に弾が通る） */
        function getCosmicDragonBarrierBlockRadius(b) {
            if (!b || !b.isCosmicDragonMain || !b.barrierRadius) return 0;
            if (b.cosmicBarrierDownUntil && Date.now() < b.cosmicBarrierDownUntil) return 0;
            return b.barrierRadius;
        }

        function markCosmicDragonBarrierDownForMs(ms) {
            if (!boss || !boss.isCosmicDragonMain) return;
            boss.cosmicBarrierDownUntil = Date.now() + Math.max(0, ms | 0);
        }

        /** 星骸ドラゴン専用: 長射程の斬撃弾（見た目は大きめのブレード） */
        function fireBossDragonLongBlade() {
            if (!boss) return;
            markCosmicDragonBarrierDownForMs(Math.ceil(54 * (1000 / 60)) + 80);
            const cx = boss.x + boss.width / 2;
            const cy = boss.y + boss.height;
            const pcx = player.x + player.width / 2;
            const pcy = player.y + player.height / 2;
            const ang = Math.atan2(pcx - cx, pcy - cy);
            const speed = 5.9;
            bossBullets.push({
                x: cx - 58,
                y: cy - 76,
                width: 116,
                height: 152,
                speedX: Math.sin(ang) * speed,
                speedY: Math.cos(ang) * speed,
                bulletStyle: 'bossSlash',
                spawnedAt: Date.now(),
                slashOuterR: 60,
                slashGrow: 16,
                color: '#ff4422',
                lifeFrames: 54
            });
            playSound(bladeSound || bossShootSound);
        }

        const COSMIC_FLAME_TELEGRAPH_MS = 1000;

        /** 星獣火炎: 初級1本・中級2本・上級3本（starRank と同時本数） */
        function getCosmicDragonFlameSimultaneousColumnCount() {
            const r = COSMIC_DRAGON_STAR_RANK;
            if (Number.isFinite(r) && r >= 1 && r <= 3) return r;
            return 1;
        }

        /** 星骸ドラゴン: 通常の扇状弾（他ボスと同系統） */
        function fireBossDragonNormalFan() {
            if (!boss) return;
            const bulletCount = (isEventMode && boss.eventBulletCount && boss.eventBulletCount > 0)
                ? boss.eventBulletCount
                : Math.min(3 + Math.floor(bossLevel / 2), 6);
            for (let i = 0; i < bulletCount; i++) {
                const angle = (i - (bulletCount - 1) / 2) * 0.5;
                const speedX = Math.sin(angle) * 3;
                const speedY = Math.cos(angle) * 4;
                bossBullets.push({
                    x: boss.x + boss.width / 2 - 3,
                    y: boss.y + boss.height,
                    width: 6 + (bossLevel - 1) * 2,
                    height: 15 + (bossLevel - 1) * 3,
                    speedX,
                    speedY,
                    color: bossLevel > 2 ? '#ff00ff' : '#ff0000'
                });
            }
            playSound(bossShootSound);
        }

        function cosmicDragonFlameSequenceActive() {
            return bossBullets.some(b => b.isFlameTelegraph || b.isFlameBreath);
        }

        /** 実移動（フレーム間＋キー）→キー入力→ボスとの位置関係の順で「進行方向」単位ベクトル */
        function getPlayerFlameLeadDirectionUnit() {
            const mlen = Math.hypot(playerFlameLeadDx, playerFlameLeadDy);
            if (mlen > 0.35) {
                return { ux: playerFlameLeadDx / mlen, uy: playerFlameLeadDy / mlen };
            }
            let dx = 0, dy = 0;
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) dx -= 1;
            if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += 1;
            if (keys['ArrowUp'] || keys['w'] || keys['W']) dy -= 1;
            if (keys['ArrowDown'] || keys['s'] || keys['S']) dy += 1;
            const len = Math.hypot(dx, dy);
            if (len > 1e-6) {
                return { ux: dx / len, uy: dy / len };
            }
            if (!boss) return { ux: 0, uy: 1 };
            const bcx = boss.x + boss.width / 2;
            const pcx = player.x + player.width / 2;
            const sig = Math.sign(pcx - bcx);
            return { ux: sig === 0 ? 1 : sig, uy: 0 };
        }

        /** 火炎: まず点線で1秒予告 → その後ヒット帯（難易度で同時本数が増える） */
        function fireBossDragonFlameTelegraphThenBreath() {
            if (!boss) return;
            const cy = boss.y + boss.height;
            const pcx = player.x + player.width / 2;
            const halfW = 40;
            const columnCount = getCosmicDragonFlameSimultaneousColumnCount();
            const { ux, uy } = getPlayerFlameLeadDirectionUnit();
            // 進行方向の先にリードし、複数本は「進行方向に沿った間隔」＋垂直成分は横オフセットで逃げ道を挟む
            const lead = 56;
            const strideAlong = 82;
            const strideLat = 76;
            const mid = (columnCount - 1) / 2;
            const teleFrames = Math.ceil(COSMIC_FLAME_TELEGRAPH_MS / (1000 / 60)) + 2;
            const telegraphEndAt = Date.now() + COSMIC_FLAME_TELEGRAPH_MS;
            for (let i = 0; i < columnCount; i++) {
                const t = i - mid;
                const along = lead + t * strideAlong;
                const lat = t * strideLat;
                const colX = Math.max(halfW + 4, Math.min(canvas.width - halfW - 4,
                    pcx + ux * along + (-uy) * lat));
                bossBullets.push({
                    isFlameTelegraph: true,
                    flameColumnCenterX: colX,
                    flameColumnHalfWidth: halfW,
                    flameCy: cy,
                    telegraphEndAt,
                    x: -5000,
                    y: -5000,
                    width: 1,
                    height: 1,
                    speedX: 0,
                    speedY: 0,
                    color: '#ffaa66',
                    lifeFrames: teleFrames
                });
            }
        }

        /** 予告終了後に呼ばれる本番火炎（バリア解除もここから） */
        function activateBossDragonFlameBreathFromTelegraph(bullet) {
            if (!bullet.isFlameTelegraph) return;
            const flameDurationMs = 840;
            markCosmicDragonBarrierDownForMs(flameDurationMs + 140);
            bullet.isFlameTelegraph = false;
            bullet.isFlameBreath = true;
            bullet.flameStart = Date.now();
            bullet.flameDurationMs = flameDurationMs;
            bullet.lifeFrames = Math.ceil(flameDurationMs / (1000 / 60));
            playSound(bossShootSound);
        }

        function bossShootCosmicDragon() {
            if (!boss) return;
            const p = (boss.cosmicAttackPhase || 0) % 3;
            boss.cosmicAttackPhase = (boss.cosmicAttackPhase || 0) + 1;
            if (p === 0) {
                fireBossDragonNormalFan();
            } else if (p === 1) {
                fireBossDragonLongBlade();
            } else {
                fireBossDragonFlameTelegraphThenBreath();
            }
        }

        function bossShoot() {
            if (!boss) return;
            if (boss.isCosmicDragonMain) {
                bossShootCosmicDragon();
                return;
            }

            // イベントモード: ボス毎に確率で特殊弾を撃つ（メインゲームには無影響）
            if (isEventMode && Array.isArray(boss.extraGimmicks) && boss.extraGimmicks.length > 0) {
                const roll = Math.random();
                // 25% で extra のいずれかを使う。残りは通常ファン。
                if (roll < 0.25) {
                    const pick = boss.extraGimmicks[Math.floor(Math.random() * boss.extraGimmicks.length)];
                    if (pick === 'homing') {
                        fireBossHomingMissile();
                        // ホーミングは単発でも脅威なのですぐ return
                        return;
                    }
                    if (pick === 'gravity') {
                        fireBossGravityOrb();
                        return;
                    }
                }
            }

            // レベルに応じて弾丸数を増加（Lv.6 で 6 発に到達したら以降は据え置き。
            // それ以上の難易度上昇は「衝撃波(Lv.5+)」「雑魚吸収(Lv.7+)」で表現する）
            // イベントボスはプロファイルで弾数を上書きできる（弾幕を絞ってギミックに寄せるため）
            const bulletCount = (isEventMode && boss.eventBulletCount && boss.eventBulletCount > 0)
                ? boss.eventBulletCount
                : Math.min(3 + Math.floor(bossLevel / 2), 6);
            
            for (let i = 0; i < bulletCount; i++) {
                const angle = (i - (bulletCount - 1) / 2) * 0.5; // 角度を計算
                const speedX = Math.sin(angle) * 3;
                const speedY = Math.cos(angle) * 4;
                
                bossBullets.push({
                    x: boss.x + boss.width / 2 - 3,
                    y: boss.y + boss.height,
                    width: 6 + (bossLevel - 1) * 2, // レベルに応じて弾丸サイズ増加
                    height: 15 + (bossLevel - 1) * 3,
                    speedX: speedX,
                    speedY: speedY,
                    color: bossLevel > 2 ? '#ff00ff' : '#ff0000' // レベル3以上は紫色
                });
            }
            playSound(bossShootSound);
        }

        // ボス生成
        function spawnBoss() {
            if (cosmicDragonPhase === 'coa') return;
            // 100点間隔でボスが出現
            if (!bossSpawned && score >= lastBossScore + 100) {
                bossSpawned = true;
                lastBossScore = score;
                
                // ボスの難易度レベルを計算（500点間隔でレベルアップ）
                bossLevel = Math.floor(score / 500) + 1;

                // イベントモード: ボスプロファイルで bossLevel を底上げし、特殊機能を解放する
                let eventBossProfile = null;
                let eventBossIdx = -1;
                if (isEventMode) {
                    eventBossIdx = pickEventBossIndex();
                    eventBossProfile = EVENT_CONFIG.bosses[eventBossIdx];
                    if (eventBossProfile && eventBossProfile.featureLevel) {
                        // プロファイルが要求するレベル以上に固定（衝撃波・吸収・機雷・狙撃などを即解放）
                        bossLevel = Math.max(bossLevel, eventBossProfile.featureLevel);
                    }
                }

                const baseHealth = 20 + (bossLevel - 1) * 10;
                const hpMultiplier = (isEventMode && eventBossProfile) ? (eventBossProfile.hpMultiplier || 1) : 1;
                const eventHealth = Math.round(baseHealth * hpMultiplier);
                
                boss = {
                    x: canvas.width / 2 - 50,
                    y: -100,
                    width: 100 + (bossLevel - 1) * 10, // レベルに応じてサイズ増加
                    height: 80 + (bossLevel - 1) * 8,
                    health: eventHealth,
                    maxHealth: eventHealth,
                    speed: 1 * speedMultiplier,
                    moveSpeed: (2 + (bossLevel - 1) * 0.5) * speedMultiplier, // レベルに応じて移動速度増加
                    moveDirection: 1, // 移動方向（1:右、-1:左）
                    points: 50 + (bossLevel - 1) * 25, // レベルに応じて点数増加
                    lastShot: 0,
                    shotInterval: Math.max(500, 2000 - (bossLevel - 1) * 200) / speedMultiplier, // レベルに応じて攻撃間隔短縮
                    lastShockwaveAt: 0,
                    sniperLocked: false,
                    sniperTargetX: 0,
                    sniperTargetY: 0,
                    minionAbsorbStartAt: null,
                    // イベントモード時、このボスがどの画像を使うかのインデックス（pick と同一）
                    eventBossIndex: eventBossIdx,
                    // 撃破時に付与するメタ解放キー（管理画面 weaponRewardKey）
                    eventWeaponRewardKey: (isEventMode && eventBossProfile && eventBossProfile.weaponRewardKey)
                        ? String(eventBossProfile.weaponRewardKey).trim() : '',
                    // イベントモード時の追加ギミック（ホーミング / 重力など）
                    extraGimmicks: (isEventMode && eventBossProfile && Array.isArray(eventBossProfile.extraGimmicks))
                        ? [...eventBossProfile.extraGimmicks] : [],
                    // イベントモード時の通常ファン射撃数（プロファイル指定があれば差し替え）
                    eventBulletCount: (isEventMode && eventBossProfile && eventBossProfile.bulletCount > 0)
                        ? eventBossProfile.bulletCount : null,
                    // 個別攻撃トグル（admin で設定）。指定があれば featureLevel に勝つ。
                    featuresOverride: (isEventMode && eventBossProfile && eventBossProfile.featuresOverride && typeof eventBossProfile.featuresOverride === 'object')
                        ? { ...eventBossProfile.featuresOverride } : null,
                    // hasBossFeature が `boss.level` を参照するのでメモする
                    level: bossLevel
                };
                if (isEventMode && EVENT_URL_SLUG === 'cosmic-dragon' && eventBossProfile
                    && eventBossProfile.id === 'cosmic-dragon') {
                    const sc = 1.58;
                    boss.width = Math.round(boss.width * sc);
                    boss.height = Math.round(boss.height * sc);
                    boss.x = canvas.width / 2 - boss.width / 2;
                    boss.isCosmicDragonMain = true;
                    boss.barrierRadius = Math.round(Math.max(boss.width, boss.height) * 0.56);
                    boss.cosmicAttackPhase = 0;
                    const baseFO = boss.featuresOverride && typeof boss.featuresOverride === 'object'
                        ? { ...boss.featuresOverride } : {};
                    boss.featuresOverride = {
                        ...baseFO,
                        sniper: false,
                        minions: false,
                        mines: false,
                        shockwave: false,
                        absorption: false
                    };
                    boss.shotInterval = Math.max(boss.shotInterval, 920 / speedMultiplier);
                }
                if (isEventMode) eventBossSpawnCount++;

                // 狙撃モード(Lv.9+): 単発高精度なので最低発射間隔を確保
                if (hasBossFeature(boss, 'sniper')) {
                    boss.shotInterval = Math.max(boss.shotInterval, BOSS_SNIPER_MIN_INTERVAL_MS);
                }

                // 部下出現(Lv.9+): Lv.9 → Lv.1 部下x2 / Lv.10+ → Lv.2 部下x2（星骸ドラゴンメインは専用フェーズのため除外）
                bossMinions = [];
                if (hasBossFeature(boss, 'minions') && !boss.isCosmicDragonMain) {
                    spawnBossMinions(bossLevel);
                }
                
                // ボス警告表示（レベルに応じてメッセージ変更）
                const levelText = bossLevel > 1 ? `レベル${bossLevel} ` : '';
                if (isEventMode && boss.eventBossIndex >= 0) {
                    const evBoss = EVENT_CONFIG.bosses[boss.eventBossIndex];
                    bossWarningElement.textContent = `⚠️ ${evBoss.name} 出現！ ⚠️`;
                    if (boss.isCosmicDragonMain && EVENT_URL_SLUG === 'cosmic-dragon') {
                        playCosmicDragonAppearCue();
                    } else {
                        playSound(eventBossSound);
                    }
                } else {
                bossWarningElement.textContent = `⚠️ ${levelText}ボス出現！ ⚠️`;
                }
                bossWarningElement.style.display = 'block';
                setTimeout(() => {
                    bossWarningElement.style.display = 'none';
                }, 1500);
            }
        }

        // 部下生成
        function spawnBossMinions(currentBossLevel) {
            const minionLevel = currentBossLevel === 9 ? 1 : 2;
            for (let i = 0; i < BOSS_MINION_COUNT; i++) {
                spawnSingleBossMinion(minionLevel, i);
            }
        }

        // 単体の部下を生成（再生成にも使う）
        function spawnSingleBossMinion(minionLevel, slotIndex) {
            const w = 60 + (minionLevel - 1) * 10;
            const h = 50 + (minionLevel - 1) * 8;
            // slotIndex で左右の出現位置を決める。0=左、1=右
            const x = slotIndex === 0 ? 60 : canvas.width - 60 - w;
            bossMinions.push({
                x, y: 80,
                width: w, height: h,
                health: 12 + (minionLevel - 1) * 6,
                maxHealth: 12 + (minionLevel - 1) * 6,
                vx: (slotIndex === 0 ? 1 : -1) * (1.4 + (minionLevel - 1) * 0.3),
                level: minionLevel,
                points: 30 + (minionLevel - 1) * 15,
                lastShot: Date.now() + slotIndex * 600,
                shotInterval: 1800,
                beingAbsorbed: false,
                slotIndex
            });
        }

        // 敵生成
        function spawnEnemy() {
            // メインゲーム: ボス出現スコア帯（100 / 500n）では雑魚停止。星獣襲来イベント中は通常どおり出す。
            if (!isCosmicDragonEventRun() && boss && (score === 100 || score % 500 === 0)) return;
            
            const enemyTypes = getEnemyTypes();
            const coaGruntMul = (cosmicDragonPhase === 'coa') ? 2 : 1;
            enemyTypes.forEach(type => {
                if (Math.random() < type.spawnRate * coaGruntMul) {
                    const e = {
                        x: Math.random() * (canvas.width - type.size),
                        y: -type.size,
                        width: type.size,
                        height: type.size,
                        speed: type.speed + Math.random() * 1,
                        color: type.color,
                        points: type.points,
                        health: type.health,
                        maxHealth: type.health,
                        enemyType: type.type // 敵のタイプを追加
                    };
                    if (isCosmicDragonEventRun()) e.useMinidragonArt = true;
                    enemies.push(e);
                }
            });
        }

        // 支援物資生成
        function spawnSupplyUnits() {
            if (!isCosmicDragonEventRun() && boss && (score === 100 || score % 500 === 0)) return;
            
            // ランダムで支援物資を生成（難易度に応じて確率調整）
            const spawnRate = 0.003 * speedMultiplier; // 難易度に応じて生成確率を調整
            if (Math.random() < spawnRate) {
                supplyUnits.push({
                    x: Math.random() * (canvas.width - 28),
                    y: Math.random() * (canvas.height / 2), // 画面上半分に配置
                    width: 28,
                    height: 28,
                    color: '#00ff00',
                    isCollected: false
                });
            }
        }
        
        // ライフ回復アイテム生成
        function spawnHealthItems() {
            if (!isCosmicDragonEventRun() && boss && (score === 100 || score % 500 === 0)) return;
            
            // 低確率でライフ回復アイテムを生成（弾薬補給より低い確率、難易度に応じて確率調整）。
            //   1 ランあたり期待 2 個前後になるよう調整（補給の 1/10 程度）。
            const spawnRate = 0.0003 * speedMultiplier;
            if (Math.random() < spawnRate) {
                healthItems.push({
                    x: Math.random() * (canvas.width - 30),
                    y: Math.random() * (canvas.height / 2), // 画面上半分に配置
                    width: 30,
                    height: 30,
                    color: '#ff69b4', // ピンク色
                    isCollected: false
                });
            }
        }

        /** メイン星獣: 中級以上で口から小型ドラゴンを放つ（敵配列に追加） */
        function spawnCosmicMiniDragonSwarm() {
            if (!boss || !boss.isCosmicDragonMain) return;
            const existing = enemies.filter(e => e.isCosmicMiniSummon).length;
            if (existing >= 14) return;
            const rank = COSMIC_DRAGON_STAR_RANK;
            const count = rank >= 3 ? 3 : 2;
            const sz = 22 + Math.floor(Math.random() * 6);
            const hp = rank >= 3 ? 4 : 3;
            for (let i = 0; i < count; i++) {
                const x = boss.x + boss.width * (0.12 + 0.76 * Math.random()) - sz / 2;
                const y = boss.y + boss.height - 8 + Math.random() * 20;
                enemies.push({
                    x: Math.max(4, Math.min(canvas.width - sz - 4, x)),
                    y,
                    width: sz,
                    height: sz,
                    speed: 1.15 + Math.random() * 0.75,
                    color: '#cc5533',
                    points: 2,
                    health: hp,
                    maxHealth: hp,
                    enemyType: 'cosmic_whelp',
                    useMinidragonArt: true,
                    isCosmicMiniSummon: true,
                    slowedUntil: null
                });
            }
        }

        // 衝突判定
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        // プレイヤー戦闘機描画
        function drawPlayer() {
            const x = player.x;
            const y = player.y;
            const w = player.width;
            const h = player.height;
            const skin = getPlayerSkin();

            // 武器変更時のグロー（既存挙動）。スキンの glow をフォールバックに使う
            const glowing = weaponChangeTimer > 0;
            if (glowing) {
                ctx.shadowColor = equippedWeapons[currentWeapon].color;
                ctx.shadowBlur = 15;
            }
            
            if (skin.type === 'image') {
                // 画像スキン: 上下反転（ボス画像なので機首を上向きにする）して描画
                const img = ensurePlayerSkinImage(skin);
                if (img && img.complete && img.naturalWidth > 0) {
                    ctx.save();
                    ctx.shadowColor = skin.glow || '#66ddff';
                    ctx.shadowBlur = glowing ? 18 : 10;
                    // y 軸反転で機首を上方向に
                    ctx.translate(x + w / 2, y + h / 2);
                    ctx.scale(1, -1);
                    ctx.drawImage(img, -w / 2, -h / 2, w, h);
                    ctx.restore();
                } else {
                    // 画像未読み込み時は classic 配色で procedural fallback
                    drawPlayerProcedural(x, y, w, h, PLAYER_SKIN_CATALOG[DEFAULT_PLAYER_SKIN]);
                }
            } else {
                drawPlayerProcedural(x, y, w, h, skin);
            }

            if (glowing) ctx.shadowBlur = 0;
        }

        function drawPlayerBarrier() {
            if (!isPlayerBarrierDeployed()) return;
            const pcx = player.x + player.width / 2;
            const pcy = player.y + player.height / 2;
            const r = getPlayerBarrierRadius();
            const pulse = 0.92 + 0.08 * Math.sin(Date.now() * 0.018);
            ctx.save();
            ctx.beginPath();
            ctx.arc(pcx, pcy, r * pulse, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(100, 210, 255, 0.75)';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#44ccff';
            ctx.shadowBlur = 14;
            ctx.stroke();
            ctx.globalAlpha = 0.22;
            ctx.fillStyle = 'rgba(80, 200, 255, 0.35)';
            ctx.fill();
            ctx.restore();
        }

        function drawPlayerDirectionalShield() {
            if (!isDirectionalShieldActive()) return;
            const bands = getDirectionalShieldBandRects();
            const t = 0.55 + 0.45 * Math.sin(Date.now() * 0.022);
            ctx.save();
            bands.forEach(b => {
                ctx.fillStyle = `rgba(140, 235, 255, ${0.55 * t})`;
                ctx.fillRect(b.x, b.y, b.width, b.height);
                ctx.strokeStyle = `rgba(230, 255, 255, ${0.9 * t})`;
                ctx.lineWidth = 1.5;
                ctx.shadowColor = '#66ddff';
                ctx.shadowBlur = 8;
                ctx.strokeRect(b.x, b.y, b.width, b.height);
                ctx.shadowBlur = 0;
            });
            ctx.restore();
        }

        // 各色を受け取って procedural な戦闘機を描く（既存の見た目をパラメータ化）
        function drawPlayerProcedural(x, y, w, h, skin) {
            // 本体
            ctx.fillStyle = skin.body;
            ctx.fillRect(x + w/4, y + h/3, w/2, h/2);
            // 機首
            ctx.fillStyle = skin.nose;
            ctx.fillRect(x + w/3, y, w/3, h/3);
            // 翼
            ctx.fillStyle = skin.wing;
            ctx.fillRect(x, y + h/3, w/4, h/3);
            ctx.fillRect(x + 3*w/4, y + h/3, w/4, h/3);
            // 尾翼
            ctx.fillStyle = skin.wing;
            ctx.fillRect(x + w/3, y + 2*h/3, w/3, h/3);
            // エンジン
            ctx.fillStyle = skin.engine;
            ctx.fillRect(x + w/4, y + h/2, w/2, h/6);
            // コックピット
            ctx.fillStyle = skin.cockpit;
            ctx.fillRect(x + w/3, y + h/4, w/3, h/6);
        }

        // 弾丸描画
        // 三日月の斬撃（ブレード）。中心を通過する円弧を描き、内側に白い芯を入れる。
        // 生成時刻からの経過で開閉アニメーション（出現直後はわずかに細く、徐々に開く）。
        function drawSlash(bullet, now) {
            const cx = bullet.x + bullet.width / 2;
            const cy = bullet.y + bullet.height / 2;
            const age = Math.min(120, now - (bullet.spawnedAt || now));
            const t = Math.min(1, age / 80);                            // 0 → 1 の開閉
            const radius = 18 + t * 6;
            // 進行方向（上方）に膨らむ三日月にするため、円の中心を弾の少し下に
            const arcCenterY = cy + 14 + (1 - t) * 4;
            const startAngle = Math.PI * (1.18 - 0.08 * t);
            const endAngle   = Math.PI * (1.82 + 0.08 * t);
            ctx.save();
            // 外周のオーラ
            ctx.globalAlpha = 0.85;
            ctx.strokeStyle = bullet.color || '#00ffaa';
            ctx.shadowColor = bullet.color || '#00ffaa';
            ctx.shadowBlur = 22;
            ctx.lineWidth = 7;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(cx, arcCenterY, radius, startAngle, endAngle);
            ctx.stroke();
            // 中央の白い刃芯
            ctx.shadowBlur = 6;
            ctx.lineWidth = 2.2;
            ctx.strokeStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(cx, arcCenterY, radius, startAngle + 0.04, endAngle - 0.04);
            ctx.stroke();
            // 両端の閃光
                ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffffff';
            const sx = cx + Math.cos(startAngle) * radius;
            const sy = arcCenterY + Math.sin(startAngle) * radius;
            const ex = cx + Math.cos(endAngle) * radius;
            const ey = arcCenterY + Math.sin(endAngle) * radius;
            ctx.beginPath();
            ctx.arc(sx, sy, 2.2, 0, Math.PI * 2);
            ctx.arc(ex, ey, 2.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawBullets() {
            const now = Date.now();
            bullets.forEach(bullet => {
                // ブレード: 三日月の斬撃として描画
                if (bullet.bulletStyle === 'slash') {
                    drawSlash(bullet, now);
                    return;
                }
                // 機雷（lifeFrames あり + 速度ゼロ）は点滅 + 残り時間で色を変えて警告
                const isMine = (bullet.lifeFrames !== null && bullet.lifeFrames !== undefined
                                && bullet.speedX === 0 && bullet.speedY === 0);
                if (isMine) {
                    const t = bullet.lifeFrames / 360;
                    // 残量に応じて黄→橙→赤に
                    const danger = (t < 0.3) ? '#ff3322' : (t < 0.6 ? '#ff9933' : '#ffcc33');
                    // 残り少ないほど高速点滅
                    const blinkRate = (t < 0.3) ? 80 : (t < 0.6 ? 160 : 320);
                    const visible = (Math.floor(now / blinkRate) % 2) === 0;
                    if (visible) {
                        ctx.fillStyle = danger;
                        ctx.shadowColor = danger;
                        ctx.shadowBlur = 14;
                        ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
                        // 中央のドット
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = '#220000';
                        ctx.fillRect(bullet.x + bullet.width / 2 - 2, bullet.y + bullet.height / 2 - 2, 4, 4);
                    } else {
                        // 点滅で消える瞬間も外枠は薄く残す
                        ctx.strokeStyle = danger;
                        ctx.globalAlpha = 0.3;
                        ctx.strokeRect(bullet.x, bullet.y, bullet.width, bullet.height);
                        ctx.globalAlpha = 1;
                    }
                    return;
                }
                ctx.fillStyle = bullet.color;
                ctx.shadowColor = bullet.color;
                ctx.shadowBlur = bullet.pierceRemaining > 0 ? 14 : 5;
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
                ctx.shadowBlur = 0;
            });
        }

        // ボス弾丸描画
        function drawBossBullets() {
            const now = Date.now();
            bossBullets.forEach(bullet => {
                if (bullet.isFlameTelegraph) {
                    const xL = bullet.flameColumnCenterX - bullet.flameColumnHalfWidth;
                    const xR = bullet.flameColumnCenterX + bullet.flameColumnHalfWidth;
                    const y0 = bullet.flameCy;
                    const y1 = canvas.height;
                    const cxm = bullet.flameColumnCenterX;
                    ctx.save();
                    ctx.strokeStyle = 'rgba(255, 220, 140, 0.92)';
                    ctx.shadowColor = 'rgba(255, 100, 40, 0.55)';
                    ctx.shadowBlur = 10;
                    ctx.lineWidth = 2.4;
                    ctx.setLineDash([10, 12]);
                    ctx.lineDashOffset = -(now * 0.12) % 22;
                    ctx.beginPath();
                    ctx.moveTo(xL, y0);
                    ctx.lineTo(xL, y1);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(xR, y0);
                    ctx.lineTo(xR, y1);
                    ctx.stroke();
                    ctx.globalAlpha = 0.55;
                    ctx.lineWidth = 1.6;
                    ctx.beginPath();
                    ctx.moveTo(cxm, y0);
                    ctx.lineTo(cxm, y1);
                    ctx.stroke();
                    ctx.restore();
                    return;
                }
                if (bullet.isFlameBreath) {
                    const elapsed = now - bullet.flameStart;
                    const t = Math.min(1, elapsed / bullet.flameDurationMs);
                    const x0 = bullet.flameColumnCenterX - bullet.flameColumnHalfWidth;
                    const x1 = bullet.flameColumnCenterX + bullet.flameColumnHalfWidth;
                    const y0 = bullet.flameCy;
                    const y1 = canvas.height;
                    const cx = bullet.flameColumnCenterX;
                    ctx.save();
                    const grd = ctx.createLinearGradient(cx, y0, cx, y1);
                    grd.addColorStop(0, 'rgba(255, 245, 200, 0.95)');
                    grd.addColorStop(0.25, 'rgba(255, 120, 40, 0.65)');
                    grd.addColorStop(0.65, 'rgba(255, 60, 20, 0.35)');
                    grd.addColorStop(1, 'rgba(180, 20, 0, 0.12)');
                    ctx.fillStyle = grd;
                    ctx.globalAlpha = 0.4 + 0.42 * t;
                    ctx.shadowColor = '#ff7700';
                    ctx.shadowBlur = 26;
                    ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
                    ctx.shadowBlur = 14;
                    ctx.globalAlpha = 0.35 + 0.35 * Math.sin(now * 0.018);
                    ctx.fillStyle = 'rgba(255, 255, 220, 0.45)';
                    ctx.fillRect(cx - 5, y0, 10, y1 - y0);
                    ctx.globalAlpha = 1;
                    ctx.shadowBlur = 0;
                    ctx.restore();
                    return;
                }
                if (bullet.bulletStyle === 'bossSlash') {
                    const bbx = bullet.x + bullet.width / 2;
                    const bby = bullet.y + bullet.height / 2;
                    const age = Math.min(120, now - (bullet.spawnedAt || now));
                    const tt = Math.min(1, age / 80);
                    const radius = (bullet.slashOuterR || 52) + tt * (bullet.slashGrow || 14);
                    const arcCenterY = bby + 22 + (1 - tt) * 8;
                    const startAngle = Math.PI * (1.1 - 0.06 * tt);
                    const endAngle   = Math.PI * (1.9 + 0.06 * tt);
                    ctx.save();
                    ctx.globalAlpha = 0.92;
                    ctx.strokeStyle = bullet.color || '#ff4422';
                    ctx.shadowColor = bullet.color || '#ff4422';
                    ctx.shadowBlur = 28;
                    ctx.lineWidth = 10;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.arc(bbx, arcCenterY, radius, startAngle, endAngle);
                    ctx.stroke();
                    ctx.shadowBlur = 10;
                    ctx.lineWidth = 3.2;
                    ctx.strokeStyle = '#ffffcc';
                    ctx.beginPath();
                    ctx.arc(bbx, arcCenterY, radius, startAngle + 0.06, endAngle - 0.06);
                    ctx.stroke();
                    ctx.restore();
                    return;
                }
                if (bullet.isSniper) {
                    // 狙撃弾は強発光 + トレイル（即死級の見た目で警告）
                    ctx.save();
                    ctx.fillStyle = bullet.color;
                    ctx.shadowColor = bullet.color;
                    ctx.shadowBlur = 20;
                    ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
                    const len = Math.hypot(bullet.speedX, bullet.speedY) || 1;
                    const tx = bullet.x + bullet.width / 2 - bullet.speedX / len * 28;
                    const ty = bullet.y + bullet.height / 2 - bullet.speedY / len * 28;
                    ctx.strokeStyle = bullet.color;
                    ctx.lineWidth = 3;
                    ctx.globalAlpha = 0.65;
                    ctx.beginPath();
                    ctx.moveTo(bullet.x + bullet.width / 2, bullet.y + bullet.height / 2);
                    ctx.lineTo(tx, ty);
                    ctx.stroke();
                    ctx.restore();
                } else if (bullet.homing) {
                    // 追尾ミサイル: 鋭い菱形＋短いトレイル
                    const cx = bullet.x + bullet.width / 2;
                    const cy = bullet.y + bullet.height / 2;
                    const len = Math.hypot(bullet.speedX, bullet.speedY) || 1;
                    ctx.save();
                    ctx.shadowColor = bullet.color;
                    ctx.shadowBlur = 16;
                    ctx.fillStyle = bullet.color;
                    ctx.beginPath();
                    ctx.arc(cx, cy, bullet.width / 2, 0, Math.PI * 2);
                    ctx.fill();
                    // トレイル
                    ctx.strokeStyle = bullet.color;
                    ctx.lineWidth = 2.5;
                    ctx.globalAlpha = 0.55;
                    ctx.beginPath();
                    ctx.moveTo(cx, cy);
                    ctx.lineTo(cx - bullet.speedX / len * 18, cy - bullet.speedY / len * 18);
                    ctx.stroke();
                    ctx.restore();
                } else if (bullet.isGravity) {
                    // 重力オーブ: 中央のコア + 引力レンジを示す薄い円
                    const cx = bullet.x + bullet.width / 2;
                    const cy = bullet.y + bullet.height / 2;
                    const pulse = 0.55 + 0.45 * Math.sin(Date.now() * 0.012);
                    ctx.save();
                    // 引力レンジ
                    ctx.strokeStyle = bullet.color;
                    ctx.globalAlpha = 0.18;
                    ctx.lineWidth = 1.5;
                    ctx.setLineDash([6, 6]);
                    ctx.beginPath();
                    ctx.arc(cx, cy, bullet.pullRadius, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    // オーブ本体
                    ctx.globalAlpha = pulse;
                    ctx.shadowColor = bullet.color;
                    ctx.shadowBlur = 22;
                    ctx.fillStyle = bullet.color;
                    ctx.beginPath();
                    ctx.arc(cx, cy, bullet.width / 2, 0, Math.PI * 2);
                    ctx.fill();
                    // ハイライト
                    ctx.globalAlpha = 0.85;
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(cx - 3, cy - 3, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                } else {
                ctx.fillStyle = bullet.color;
                ctx.shadowColor = bullet.color;
                ctx.shadowBlur = 8;
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
                ctx.shadowBlur = 0;
                }
            });
        }

        // 敵戦闘機描画
        function drawEnemies() {
            enemies.forEach(enemy => {
                const x = enemy.x;
                const y = enemy.y;
                const w = enemy.width;
                const h = enemy.height;
                
                if (enemy.useMinidragonArt) {
                    const img = getMinidragonEnemyImage();
                    if (img && img.complete && img.naturalWidth > 0) {
                        ctx.save();
                        ctx.shadowColor = '#ff8866';
                        ctx.shadowBlur = 8;
                        ctx.drawImage(img, x, y, w, h);
                        ctx.shadowBlur = 0;
                        ctx.restore();
                    } else {
                        ctx.fillStyle = enemy.color;
                        ctx.fillRect(x, y, w, h);
                    }
                } else {
                // 通常の敵戦闘機の描画
                ctx.fillStyle = enemy.color;
                ctx.fillRect(x + w/4, y + h/3, w/2, h/2);
                
                // 敵戦闘機の機首
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(x + w/3, y, w/3, h/3);
                
                // 敵戦闘機の翼
                ctx.fillStyle = enemy.color;
                ctx.fillRect(x, y + h/3, w/4, h/3);
                ctx.fillRect(x + 3*w/4, y + h/3, w/4, h/3);
                
                // 敵戦闘機の尾翼
                ctx.fillStyle = enemy.color;
                ctx.fillRect(x + w/3, y + 2*h/3, w/3, h/3);
                
                // 敵戦闘機のエンジン
                ctx.fillStyle = '#ff6600';
                ctx.fillRect(x + w/4, y + h/2, w/2, h/6);
                
                // 敵戦闘機のコックピット
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(x + w/3, y + h/4, w/3, h/6);
                }
                
                // 点数の表示
                ctx.fillStyle = '#ffffff';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(enemy.points, x + w/2, y + h + 15);

                if (enemy.maxHealth > 1) {
                    const barWidth = w;
                    const barHeight = 4;
                    const hpRatio = Math.max(0, enemy.health / enemy.maxHealth);
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
                    ctx.fillRect(x, y - 8, barWidth, barHeight);
                    ctx.fillStyle = hpRatio > 0.5 ? '#00ff66' : '#ff4444';
                    ctx.fillRect(x, y - 8, barWidth * hpRatio, barHeight);
                }
            });
        }

        // ボス描画
        // 任意の位置・サイズ・レベル指定でボス見た目を描画する共通関数
        // 部下も同じ見た目を採用（メインボスとの差は「サイズが小さい」だけ）
        function drawBossArtwork(x, y, w, h, level, opts) {
            // イベントモードのときは画像で差し替え。`opts.eventBossIndex` が指定されていれば
            // そのインデックスのイベントボス画像を使う（メインボス／部下で別画像を割り当てる用途）。
            if (isEventMode && eventImagesReady) {
                const idx = (opts && typeof opts.eventBossIndex === 'number' && opts.eventBossIndex >= 0)
                    ? opts.eventBossIndex
                    : pickEventBossIndex();
                const img = eventBossImages[idx];
                if (img && img.complete && img.naturalWidth > 0) {
                    ctx.save();
                    ctx.shadowColor = idx === 1 ? '#88aaff' : '#66ddff';
                    ctx.shadowBlur = 12 + (level - 1) * 4;
                    ctx.drawImage(img, x, y, w, h);
                    ctx.shadowBlur = 0;
                    ctx.restore();
                    return;
                }
            }

            ctx.save();
            ctx.shadowColor = level > 2 ? '#ff00ff' : '#ff0000';
            ctx.shadowBlur = 10 + (level - 1) * 5;
            // 本体（黒）
            ctx.fillStyle = '#333333';
            ctx.fillRect(x + w/6, y + h/4, 2*w/3, h/2);
            // 装甲板（灰）
            ctx.fillStyle = '#666666';
            ctx.fillRect(x + w/8, y + h/6, 3*w/4, h/3);
            // 砲塔
            ctx.fillStyle = level > 2 ? '#ff00ff' : '#cc0000';
            ctx.fillRect(x + w/4, y, w/2, h/4);
            // 翼
            ctx.fillStyle = '#222222';
            ctx.fillRect(x - w/4, y + h/3, w/4, h/3);
            ctx.fillRect(x + w,   y + h/3, w/4, h/3);
            // エンジン
            ctx.fillStyle = '#ff4400';
            ctx.fillRect(x + w/6, y + h/2, w/3, h/6);
            // コックピット
            ctx.fillStyle = level > 2 ? '#ff00ff' : '#ff0000';
            ctx.fillRect(x + w/3, y + h/6, w/3, h/6);
            // 装甲板ハイライト
            ctx.fillStyle = '#888888';
            ctx.fillRect(x + w/6, y + h/4, w/3, h/8);
            ctx.shadowBlur = 0;
            ctx.restore();
        }

        function drawBoss() {
            if (!boss) return;
            
            const x = boss.x;
            const y = boss.y;
            const w = boss.width;
            const h = boss.height;

            // 吸収トラクタービーム（ターゲットがいるとき）
            if (boss._absorbTarget && enemies.includes(boss._absorbTarget)) {
                const t = boss._absorbTarget;
                const bcx = x + w / 2, bcy = y + h / 2;
                const tcx = t.x + t.width / 2, tcy = t.y + t.height / 2;
                ctx.save();
                ctx.shadowColor = '#ff44ff';
                ctx.shadowBlur = 14;
                ctx.strokeStyle = '#ff66ff';
                ctx.lineWidth = 4;
                ctx.globalAlpha = 0.45 + 0.35 * Math.sin(Date.now() * 0.02);
                ctx.beginPath();
                ctx.moveTo(bcx, bcy);
                ctx.lineTo(tcx, tcy);
                ctx.stroke();
                // ターゲットを囲む小さなマーカー
            ctx.shadowBlur = 0;
                ctx.globalAlpha = 0.7;
                ctx.strokeStyle = '#ff66ff';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([3, 3]);
                ctx.beginPath();
                ctx.arc(tcx, tcy, Math.max(t.width, t.height) * 0.7, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.restore();
            }

            // ボス本体の描画（共通アートワークを使用）
            drawBossArtwork(x, y, w, h, bossLevel, { eventBossIndex: boss.eventBossIndex });

            const barrierDrawR = boss.isCosmicDragonMain
                ? getCosmicDragonBarrierBlockRadius(boss)
                : (boss.barrierRadius || 0);
            if (barrierDrawR > 0) {
                const bcx = x + w / 2;
                const bcy = y + h / 2;
                const pulse = 0.9 + 0.1 * Math.sin(Date.now() * 0.011);
                ctx.save();
                ctx.globalAlpha = 0.28;
                ctx.strokeStyle = '#aaeeff';
                ctx.lineWidth = 3;
                ctx.shadowColor = '#66ccff';
                ctx.shadowBlur = 18;
                ctx.beginPath();
                ctx.arc(bcx, bcy, barrierDrawR * pulse, 0, Math.PI * 2);
                ctx.stroke();
                ctx.globalAlpha = 0.1;
                ctx.fillStyle = '#4488ff';
                ctx.beginPath();
                ctx.arc(bcx, bcy, barrierDrawR * pulse * 0.9, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.restore();
            }
            
            // ボスのHPバー
            const barWidth = w;
            const barHeight = 8;
            const barX = x;
            const barY = y - 20;
            
            // HPバーの背景
            ctx.fillStyle = '#333333';
            ctx.fillRect(barX, barY, barWidth, barHeight);
            
            // HPバー
            const hpRatio = boss.health / boss.maxHealth;
            ctx.fillStyle = hpRatio > 0.5 ? '#00ff00' : hpRatio > 0.2 ? '#ffff00' : '#ff0000';
            ctx.fillRect(barX, barY, barWidth * hpRatio, barHeight);
            
            // HPバーの枠
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.strokeRect(barX, barY, barWidth, barHeight);
            
            // ボスの点数表示（レベルも表示）
            ctx.fillStyle = '#ffffff';
            ctx.font = '16px Arial';
            ctx.textAlign = 'center';
            const levelText = bossLevel > 1 ? ` (Lv.${bossLevel})` : '';
            ctx.fillText(`BOSS: ${boss.points}点${levelText}`, x + w/2, y + h + 20);
        }

        // ゲーム更新
        function update() {
            if (!gameRunning) return;

            // 時間更新（イベントモードは時間制限なし。「∞」表示にしてタイムアウトもスキップ）
            if (isEventMode) {
                timeElement.textContent = `時間: ∞`;
            } else {
            const elapsed = Math.floor((Date.now() - gameStartTime) / 1000);
            const remainingTime = Math.max(0, gameTime - elapsed);
            timeElement.textContent = `残り時間: ${remainingTime}秒`;

            // 時間切れ
            if (remainingTime <= 0) {
                gameOver('timeout');
                return;
            }

            // スコアによる時間ボーナス
            if (score > lastTimeBonusScore + 100) {
                gameTime += 30; // 30秒追加
                lastTimeBonusScore = score;
                timeBonusMessage = '+30秒ボーナス！';
                timeBonusTimer = 120; // 2秒間表示
                timeElement.textContent = `残り時間: ${gameTime}秒`;
                }
            }

            // 未ログインの通常モードはスコア上限で終了（ログインで制限なし）
            if (!isEventMode && loadoutMode === 'guest' && score >= GUEST_NORMAL_MAX_SCORE) {
                gameOver('guest_score_cap');
                return;
            }

            maybeUnlockShieldFromScore();

            // プレイヤー移動（矢印キー + WASD）
            if ((keys['ArrowLeft'] || keys['a'] || keys['A']) && player.x > 0) {
