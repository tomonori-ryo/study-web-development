<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>戦闘機シューティングゲーム</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        #gameCanvas {
            display: block;
            background: linear-gradient(to bottom, #001122, #003366);
        }
        
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: clamp(14px, 2.5vw, 18px);
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
        }

        #runStatus {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #ffffff;
            font-size: clamp(11px, 1.6vw, 13px);
            z-index: 100;
            background: rgba(0, 0, 0, 0.55);
            padding: 8px 10px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            line-height: 1.45;
            max-width: min(40vw, 220px);
            display: none;
        }
        .run-status-title {
            font-size: clamp(10px, 1.3vw, 11px);
            color: #aaffcc;
            letter-spacing: 0.06em;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .run-status-row {
            white-space: nowrap;
            color: #e0e0e0;
        }
        .run-status-row .ok { color: #88ff88; }
        .run-status-row .warn { color: #ffcc66; }
        .run-status-row .label { color: #aaaaaa; margin-right: 4px; }
        @media (max-width: 600px) {
            #runStatus {
                top: auto;
                bottom: 10px;
                right: 10px;
                font-size: 10px;
                max-width: 50vw;
            }
        }
        
        #score {
            margin-bottom: 8px;
            font-size: clamp(12px, 2vw, 16px);
        }
        
        #lives {
            margin-bottom: 8px;
            font-size: clamp(12px, 2vw, 16px);
        }
        
        #time {
            margin-bottom: 8px;
            color: #ffff00;
            font-size: clamp(12px, 2vw, 16px);
        }
        
        #ammo {
            margin-bottom: 8px;
            font-size: clamp(12px, 2vw, 16px);
        }
        
        /* 武器名は左下の #weaponHud に表示 */
        
        #bossWarning {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff0000;
            font-size: clamp(24px, 6vw, 36px);
            text-align: center;
            display: none;
            z-index: 150;
            text-shadow: 2px 2px 4px #000;
        }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: clamp(32px, 8vw, 48px);
            text-align: center;
            display: none;
            z-index: 200;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        
        .high-score {
            font-size: clamp(16px, 3vw, 20px);
            margin-top: 10px;
            color: #ffff00;
        }
        
        #restartBtn {
            background: #ff4444;
            color: white;
            border: none;
            padding: clamp(10px, 2vw, 15px) clamp(20px, 4vw, 30px);
            font-size: clamp(14px, 3vw, 20px);
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }
        
        #restartBtn:hover {
            background: #cc3333;
        }
        
        #homeBtn {
            background: #4444ff;
            color: white;
            border: none;
            padding: clamp(10px, 2vw, 15px) clamp(20px, 4vw, 30px);
            font-size: clamp(14px, 3vw, 20px);
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
            margin-left: 10px;
        }
        
        #homeBtn:hover {
            background: #3333cc;
        }
        

        
        .final-score {
            font-size: clamp(18px, 4vw, 24px);
            margin-top: 20px;
            color: #ffff00;
        }
        
        .login-promotion {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 255, 0, 0.1);
            border: 2px solid #00ff00;
            border-radius: 10px;
            text-align: center;
        }
        
        .login-promotion h3 {
            color: #00ff00;
            margin: 0 0 10px 0;
            font-size: clamp(14px, 3vw, 18px);
        }
        
        .login-promotion p {
            color: #ffffff;
            margin: 5px 0;
            font-size: clamp(12px, 2.5vw, 16px);
        }
        
        .login-buttons {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .login-btn {
            background: #00ff00;
            color: #000000;
            border: none;
            padding: clamp(8px, 2vw, 12px) clamp(16px, 3vw, 24px);
            font-size: clamp(12px, 2.5vw, 16px);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .login-btn:hover {
            background: #00cc00;
            transform: scale(1.05);
        }
        
        .register-btn {
            background: #0066ff;
            color: #ffffff;
            border: none;
            padding: clamp(8px, 2vw, 12px) clamp(16px, 3vw, 24px);
            font-size: clamp(12px, 2.5vw, 16px);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .register-btn:hover {
            background: #0055cc;
            transform: scale(1.05);
        }
        
        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            font-size: clamp(10px, 2vw, 12px);
            background: rgba(0, 0, 0, 0.5);
            padding: 8px;
            border-radius: 5px;
            backdrop-filter: blur(5px);
            z-index: 50;
        }
        
        #controls h3 {
            margin: 0 0 5px 0;
            font-size: clamp(12px, 2.5vw, 14px);
            color: #00ffff;
        }
        
        #controls p {
            margin: 2px 0;
            font-size: clamp(8px, 1.8vw, 10px);
        }
        
        /* 武器選択UI（左下配置） */
        #weaponSelector {
            position: absolute;
            left: 10px;
            bottom: 10px;
            transform: translateY(calc(-100% - 8px));
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            padding: 10px;
            backdrop-filter: blur(10px);
            z-index: 100;
            transition: all 0.3s ease;
            max-height: min(45vh, 320px);
            overflow-y: auto;
        }
        
        .weapon-display {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .weapon-display:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }
        
        .weapon-display.active {
            background: rgba(0, 255, 255, 0.3);
            border: 2px solid #00ffff;
        }

        .weapon-display.locked {
            opacity: 0.55;
            filter: grayscale(0.6);
            cursor: not-allowed;
        }

        .weapon-display.locked:hover {
            transform: none;
            background: rgba(255, 255, 255, 0.1);
        }

        .weapon-display.locked .weapon-icon {
            position: relative;
        }

        .weapon-display.locked .weapon-icon::after {
            content: '🔒';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.55);
            border-radius: 50%;
            font-size: 14px;
        }
        
        .weapon-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            color: white;
        }
        
        .weapon-info {
            flex: 1;
        }
        
        .weapon-name {
            font-size: clamp(12px, 2.5vw, 14px);
            font-weight: bold;
            color: white;
            margin-bottom: 2px;
        }
        
        .weapon-details {
            font-size: clamp(10px, 2vw, 12px);
            color: #cccccc;
        }
        
        .weapon-selector-toggle {
            position: absolute;
            left: 10px;
            bottom: 10px;
            transform: translateY(calc(-100% - 8px));
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            z-index: 101;
            transition: all 0.3s ease;
            display: none;
        }
        
        .weapon-selector-toggle:hover {
            background: rgba(0, 0, 0, 0.9);
            transform: translateY(calc(-100% - 8px)) scale(1.1);
        }
        
        /* レスポンシブ対応 */
        @media (max-width: 768px) {
            #ui {
                font-size: clamp(10px, 2vw, 14px);
                padding: 8px;
            }
            
            #score, #lives, #time, #ammo {
                font-size: clamp(10px, 2vw, 14px);
                margin-bottom: 6px;
            }

            #bossWarning {
                font-size: clamp(18px, 5vw, 24px);
            }
            
            #gameOver {
                font-size: clamp(24px, 6vw, 32px);
                padding: 15px;
            }
            
            .final-score, .high-score {
                font-size: clamp(14px, 3vw, 18px);
            }
            
            #restartBtn, #homeBtn {
                padding: clamp(8px, 2vw, 12px) clamp(16px, 3vw, 24px);
                font-size: clamp(12px, 2.5vw, 16px);
            }
            
            .login-promotion {
                padding: 10px;
                margin-top: 15px;
            }
            
            .login-promotion h3 {
                font-size: clamp(12px, 2.5vw, 16px);
            }
            
            .login-promotion p {
                font-size: clamp(10px, 2vw, 14px);
            }
            
            .login-btn, .register-btn {
                padding: clamp(6px, 1.5vw, 10px) clamp(12px, 2.5vw, 20px);
                font-size: clamp(10px, 2vw, 14px);
            }
            
            #controls {
                font-size: clamp(8px, 1.5vw, 10px);
                padding: 6px;
            }
            
            #controls h3 {
                font-size: clamp(10px, 2vw, 12px);
            }
            
            #controls p {
                font-size: clamp(6px, 1.5vw, 8px);
                margin: 1px 0;
            }
            
            #weaponSelector {
                padding: 8px;
            }
            
            .weapon-display {
                padding: 6px;
                gap: 8px;
            }
            
            .weapon-icon {
                width: 25px;
                height: 25px;
                font-size: 14px;
            }
            
            .weapon-name {
                font-size: clamp(10px, 2vw, 12px);
            }
            
            .weapon-details {
                font-size: clamp(8px, 1.5vw, 10px);
            }
            
            .weapon-selector-toggle {
                padding: 12px;
                font-size: 18px;
            }
        }
        
        @media (max-height: 600px) {
            #ui {
                font-size: clamp(8px, 1.5vw, 12px);
                padding: 6px;
            }
            
            #score, #lives, #time, #ammo {
                font-size: clamp(8px, 1.5vw, 12px);
                margin-bottom: 4px;
            }

            #bossWarning {
                font-size: clamp(16px, 4vw, 20px);
            }
            
            #gameOver {
                font-size: clamp(20px, 5vw, 28px);
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
        <div id="score">スコア: 0</div>
        <div id="lives">ライフ: 3</div>
        <div id="ammo">弾薬: 50/50</div>
        <div id="time">残り時間: 60秒</div>
    </div>
    <div id="runStatus">
        <div class="run-status-title">ラン進捗</div>
        <div id="runStatusBody"></div>
    </div>
    <div id="bossWarning">⚠️ ボス出現！ ⚠️</div>
    <div id="gameOver">
        <div>ゲームオーバー</div>
        <div class="final-score">最終スコア: 0</div>
        <div class="high-score">最高スコア: 0</div>
        <button id="restartBtn">リスタート</button>
        <button id="homeBtn">ホームに戻る</button>
        <div class="login-promotion" style="display: none;">
            <h3>スコアを保存してランキングに参加！</h3>
            <p>ログインすると、あなたのスコアが保存され、</p>
            <p>他のプレイヤーと競い合えます！</p>
            <div class="login-buttons">
                <button class="login-btn" onclick="window.location.href='mypage.html'">ログイン</button>
                <button class="register-btn" onclick="window.location.href='mypage.html'">新規登録</button>
            </div>
        </div>
    </div>
    
    <div id="weapon" style="display: none;">武器: 通常弾</div>

    <!-- 武器選択UI -->
    <button id="weaponSelectorToggle" class="weapon-selector-toggle">🔫</button>
    <div id="weaponSelector" style="display: none;">
        <div class="weapon-display active" data-slot="1">
            <div class="weapon-icon" style="background: #ffff00;">1</div>
            <div class="weapon-info">
                <div class="weapon-name">通常弾</div>
                <div class="weapon-details">弾薬: 1発</div>
            </div>
        </div>
        <div class="weapon-display" data-slot="2">
            <div class="weapon-icon" style="background: #ff8800;">2</div>
            <div class="weapon-info">
                <div class="weapon-name">連射弾</div>
                <div class="weapon-details">弾薬: 2発</div>
            </div>
        </div>
        <div class="weapon-display" data-slot="3">
            <div class="weapon-icon" style="background: #ff0000;">3</div>
            <div class="weapon-info">
                <div class="weapon-name">散弾</div>
                <div class="weapon-details">弾薬: 3発</div>
            </div>
        </div>
        <div class="weapon-display" data-slot="4">
            <div class="weapon-icon" style="background: #00ffff;">4</div>
            <div class="weapon-info">
                <div class="weapon-name">レーザー</div>
                <div class="weapon-details">弾薬: 5発</div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-analytics-compat.js"></script>
    <script src="firebase-config.js"></script>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');
        const ammoElement = document.getElementById('ammo'); // 弾薬表示要素
        const weaponElement = document.getElementById('weapon'); // 武器表示要素
        const timeElement = document.getElementById('time');
        const bossWarningElement = document.getElementById('bossWarning');
        const gameOverElement = document.getElementById('gameOver');
        const restartBtn = document.getElementById('restartBtn');
        const homeBtn = document.getElementById('homeBtn');
        const highScoreElement = document.querySelector('.high-score');
        const weaponSelectorToggle = document.getElementById('weaponSelectorToggle');
        const weaponSelector = document.getElementById('weaponSelector');

        // オーディオ要素
        let shootSound = null;
        let bossShootSound = null;
        let explosionSound = null;
        let bossExplosionSound = null;

        // サウンド初期化
        function initSounds() {
            // プレイヤーの銃撃音
            shootSound = new Audio('shoot.mp3');
            shootSound.volume = 0.3;
            
            // ボスの銃撃音
            bossShootSound = new Audio('boss_shoot.mp3');
            bossShootSound.volume = 0.4;
            
            // 敵の爆発音
            explosionSound = new Audio('explosion.mp3');
            explosionSound.volume = 0.3;
            
            // ボスの爆発音
            bossExplosionSound = new Audio('boss_explosion.mp3');
            bossExplosionSound.volume = 0.5;
        }

        // サウンド再生関数
        function playSound(audio) {
            if (audio) {
                audio.currentTime = 0; // 音を最初から再生
                audio.play().catch(e => console.log('音声再生エラー:', e));
            }
        }

        // キャンバスサイズを画面サイズに設定
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // プレイヤーの位置を調整（画面サイズが変わった場合）
            if (typeof player !== 'undefined' && player) {
                player.x = Math.min(player.x, canvas.width - player.width);
                player.y = Math.min(player.y, canvas.height - player.height);
            }
        }
        
        // 初期キャンバスサイズ設定
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // リサイズイベントリスナーを設定
        window.addEventListener('resize', resizeCanvas);

        // 武器選択UIの初期化
        function initWeaponSelector() {
            // スマホ判定
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            if (isMobile) {
                weaponSelectorToggle.style.display = 'block';
                weaponSelector.style.display = 'none';
            } else {
                weaponSelectorToggle.style.display = 'none';
                weaponSelector.style.display = 'block';
            }
            
            // 武器選択トグルボタンのイベント
            weaponSelectorToggle.addEventListener('click', () => {
                if (weaponSelector.style.display === 'none') {
                    weaponSelector.style.display = 'block';
                    weaponSelectorToggle.textContent = '✕';
                } else {
                    weaponSelector.style.display = 'none';
                    weaponSelectorToggle.textContent = '🔫';
                }
            });
            
            // 武器選択イベント
            const weaponDisplays = document.querySelectorAll('.weapon-display');
            weaponDisplays.forEach(display => {
                display.addEventListener('click', () => {
                    const slotNum = parseInt(display.dataset.slot);
                    if (unlockedWeapons.includes(slotNum)) {
                        setWeapon(slotNum);
                        
                        // スマホの場合は選択後にパネルを閉じる
                        if (isMobile) {
                            weaponSelector.style.display = 'none';
                            weaponSelectorToggle.textContent = '🔫';
                        }
                    } else {
                        // 装備中だがロック中のスロット: 解放条件を一瞬通知
                        const weapon = equippedWeapons[slotNum];
                        if (weapon) {
                            const trigger = weapon.runTrigger || { type: 'always' };
                            weaponChangeMessage = `${weapon.name}: ${trigger.label || '解放条件あり'}`;
                            weaponChangeTimer = 90;
                        }
                    }
                });
            });
        }
        
        // 武器選択UIの更新
        function updateWeaponSelector() {
            const weaponDisplays = document.querySelectorAll('.weapon-display');
            weaponDisplays.forEach(display => {
                const slotNum = parseInt(display.dataset.slot);
                const weapon = equippedWeapons[slotNum];

                // 未装備スロット（ロードアウトに何も入っていない）は非表示
                if (!weapon) {
                    display.style.display = 'none';
                    return;
                }

                display.style.display = 'flex';

                const isUsable = unlockedWeapons.includes(slotNum);
                display.classList.toggle('locked', !isUsable);
                display.classList.toggle('active', isUsable && slotNum === currentWeapon);

                const icon = display.querySelector('.weapon-icon');
                const name = display.querySelector('.weapon-name');
                if (icon) {
                    icon.textContent = slotNum;
                    icon.style.background = weapon.color;
                }
                if (name) {
                    name.textContent = weapon.name;
                }
                const detail = display.querySelector('.weapon-details');
                if (detail) {
                    if (isUsable) {
                        const pierceText = weapon.pierce > 0 ? ' / 貫通' : '';
                        if (weapon.usesStamina) {
                            const cur = Math.floor(weaponStamina[slotNum] || 0);
                            const max = weaponMaxStamina[slotNum] || weapon.staminaMax;
                            const pct = Math.round((cur / max) * 100);
                            const tag = weaponOverheated[slotNum] ? '【クールダウン】' : '';
                            detail.textContent = `スタミナ ${pct}% ${tag} / 威力${weapon.damage} / 射程${getRangeLabel(weapon.range)}${pierceText}`;
                        } else {
                            detail.textContent = `残弾 ${weaponAmmo[slotNum] || 0}/${weaponMaxAmmo[slotNum] || 0} 消費${weapon.ammoCost} / 威力${weapon.damage} / 射程${getRangeLabel(weapon.range)}${pierceText}`;
                        }
                    } else {
                        const ctx = buildTriggerContext();
                        const progress = describeTriggerProgress(weapon.runTrigger, ctx);
                        detail.textContent = `🔒 ${progress}`;
                    }
                }
            });
        }

        // ゲーム状態
        let score = 0;
        let lives = 3;
        let gameRunning = true;
        let gameTime = 100; // 100秒制限
        let gameStartTime = Date.now();
        let bossSpawned = false;
        let bossWarningShown = false;
        let lastBossScore = 0; // 最後にボスが出現したスコア
        let lastTimeBonusScore = 0; // 最後に時間ボーナスが与えられたスコア
        let timeBonusMessage = ''; // 時間ボーナスメッセージ
        let timeBonusTimer = 0; // 時間ボーナスメッセージの表示時間
        let bossLevel = 1; // ボスの難易度レベル
        let currentWeapon = 1; // 現在のスロット（1: 通常弾固定、2-4: 編成枠）
        let unlockedWeapons = [1, 2, 3, 4]; // 使用可能なスロット
        // 武器ごとに独立した残弾（補給・宝箱の挙動は従来どおり）
        let weaponMaxAmmo = {};
        let weaponAmmo = {};
        // スタミナ式武器（ブレード等）用: スロット番号 -> 現在スタミナ / 最大スタミナ / オーバーヒート中フラグ
        let weaponStamina = {};
        let weaponMaxStamina = {};
        let weaponOverheated = {};
        let equippedWeaponIds = ['normal', 'rapid', 'shotgun', 'laser'];
        let equippedWeapons = {};
        function getCurrentAmmo() { return weaponAmmo[currentWeapon] || 0; }
        function getCurrentMaxAmmo() { return weaponMaxAmmo[currentWeapon] || 0; }
        function refillAllAmmoToMax() {
            Object.keys(weaponMaxAmmo).forEach(k => { weaponAmmo[k] = weaponMaxAmmo[k]; });
        }
        function addSupplyAmmoToAll(amount) {
            Object.keys(weaponMaxAmmo).forEach(k => {
                const id = parseInt(k);
                weaponAmmo[id] = Math.min(weaponMaxAmmo[id], (weaponAmmo[id] || 0) + amount);
            });
        }
        // スタミナ系: 各スロットの自然回復・オーバーヒート復帰判定。dt はミリ秒。
        function updateWeaponStamina(dt) {
            Object.keys(equippedWeapons).forEach(slotKey => {
                const slot = parseInt(slotKey);
                const w = equippedWeapons[slot];
                if (!w || !w.usesStamina) return;
                const max = weaponMaxStamina[slot] || w.staminaMax;
                const regen = (w.staminaRegen || 0) * (dt / 1000);
                weaponStamina[slot] = Math.min(max, (weaponStamina[slot] || 0) + regen);
                if (weaponOverheated[slot] && weaponStamina[slot] >= max * (w.overheatRecover || 0.4)) {
                    weaponOverheated[slot] = false;
                }
            });
        }
        function updateAmmoHud() {
            const w = equippedWeapons[currentWeapon];

                const pct = Math.round((cur / max) * 100);
                const bars = Math.round((cur / max) * 10);
                const bar = '▓'.repeat(bars) + '░'.repeat(10 - bars);

        // runTrigger 評価器。新しい武器・トリガーを追加するときはここを増やすだけで対応できる。
        // 'all' は AND の複合トリガー。requirements の各要素を再帰的に評価する。
        const RUN_TRIGGER_EVALUATORS = {
            always: () => true,
            bossLevelDefeated: (trigger, ctx) => {
                const level = trigger.level || 1;
                return ctx.defeatedBossLevels.has(level);
            },
            scoreReached: (trigger, ctx) => ctx.score >= (trigger.value || 0),
            supplyCollected: (trigger, ctx) => (ctx.suppliesCollected || 0) >= (trigger.count || 1),
            enemyKillCount: (trigger, ctx) => (ctx.enemyKillCount || 0) >= (trigger.count || 1),
            // damageTakenInRun: livesLost が max 以下のあいだ TRUE（例: max=0 で「ノーダメ」）
            damageTakenInRun: (trigger, ctx) => (ctx.livesLost || 0) <= (trigger.max || 0),
            livesLost: (trigger, ctx) => (ctx.livesLost || 0) >= (trigger.count || 1),
            all: (trigger, ctx) => Array.isArray(trigger.requirements)
                && trigger.requirements.every(req => evaluateRunTrigger(req, ctx))
        };

        function getRangeLabel(range) {
            if (range <= 320) return '短';
            if (range <= 700) return '中';
            return '長';
        }

        function getUseConditionLabel(weapon) {
            const trigger = weapon.runTrigger || { type: 'always' };
            if (trigger.type === 'always') return '';
            return ` / ${trigger.label || '解放条件あり'}`;
        }

        // ロック中武器の解放条件を「現在値 / 必要値」で動的に表示するためのテキスト整形。
        function describeTriggerProgress(trigger, ctx) {
            const t = trigger || { type: 'always' };
            if (t.type === 'all' && Array.isArray(t.requirements)) {
                return t.requirements.map(r => describeSingleTriggerProgress(r, ctx)).join(' + ');
            }
            return describeSingleTriggerProgress(t, ctx);
        }

        function describeSingleTriggerProgress(t, ctx) {
            switch (t.type) {
                case 'bossLevelDefeated': {
                    const level = t.level || 1;
                    const ok = ctx.defeatedBossLevels && ctx.defeatedBossLevels.has(level);
                    return ok ? `Lv${level}ボス✓` : `Lv${level}ボス未撃破`;
                }
                case 'supplyCollected': {
                    const need = t.count || 1;
                    const cur = ctx.suppliesCollected || 0;
                    return `補給 ${Math.min(cur, need)}/${need}`;
                }
                case 'enemyKillCount': {
                    const need = t.count || 1;
                    const cur = ctx.enemyKillCount || 0;
                    return `撃破 ${Math.min(cur, need)}/${need}`;
                }
                case 'damageTakenInRun': {
                    const ok = (ctx.livesLost || 0) <= (t.max || 0);
                    return ok ? 'ノーダメ✓' : 'ノーダメ失敗';
                }
                case 'livesLost': {
                    const need = t.count || 1;
                    const cur = ctx.livesLost || 0;
                    return `被弾 ${Math.min(cur, need)}/${need}`;
                }
                case 'scoreReached':
                    return `スコア ${ctx.score || 0}/${t.value || 0}`;
                case 'always':
                    return 'いつでも';
                default:
                    return t.label || t.type || '解放条件あり';
            }
        }

        function sanitizeLoadout(rawLoadout) {
            const hasSavedLoadout = Array.isArray(rawLoadout);
            const loadout = hasSavedLoadout ? rawLoadout : DEFAULT_WEAPON_LOADOUT;
            const result = ['normal'];
            const used = new Set(result);
            for (let i = 1; i < 4; i++) {
                const candidate = loadout[i];
                if (weaponCatalog[candidate] && candidate !== 'normal' && !used.has(candidate)) {
                    result.push(candidate);
                    used.add(candidate);
                } else {
                    const fallback = hasSavedLoadout ? '' : (DEFAULT_WEAPON_LOADOUT.find(id => !used.has(id)) || '');
                    result.push(fallback);
                    if (fallback) used.add(fallback);
                }
            }
            return result;
        }

        // ログイン状態（'login' or 'guest'）。Firebase auth と localStorage 双方を見る。
        let loadoutMode = 'guest';
        // ラン中のトリガー評価に使う状態。装備武器の「覚醒条件」をここから読み取る。
        let runState = {
            defeatedBossLevels: new Set(),  // この出撃で倒したボスレベル（1, 2, 3...）
            suppliesCollected: 0,            // 補給ユニット回収数
            enemyKillCount: 0,               // 雑魚撃破累計（このラン）
            livesLost: 0                     // 被弾でライフを失った回数（このラン）
            // score は外側のグローバル `score` を都度参照する
        };

        function detectLoadoutMode() {
            try {
                if (typeof firebase !== 'undefined' && firebase.auth && firebase.auth().currentUser) {
                    return 'login';
                }
            } catch (e) {
                // 初期化前などは無視
            }
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            const playerName = localStorage.getItem('playerName');
            const firebaseUid = localStorage.getItem('firebaseUid');
            return (isLoggedIn && playerName && firebaseUid) ? 'login' : 'guest';
        }

        function loadWeaponLoadout() {
            loadoutMode = detectLoadoutMode();

            if (loadoutMode === 'login') {
                try {
                    const saved = JSON.parse(localStorage.getItem('weaponLoadout') || 'null');
                    equippedWeaponIds = sanitizeLoadout(saved);
                } catch (e) {
                    equippedWeaponIds = [...DEFAULT_WEAPON_LOADOUT];
                }
            } else {
                // 未ログインは在来の固定編成。
                equippedWeaponIds = [...DEFAULT_WEAPON_LOADOUT];
            }

            // ランごとの解放状態は両モード共通で必ずリセット。
            // 「装備可否（メタ層）」と「使用可否（ラン層）」を独立させる設計。
            runState = {
                defeatedBossLevels: new Set(),
                suppliesCollected: 0,
                enemyKillCount: 0,
                livesLost: 0
            };

            equippedWeapons = {};
            weaponMaxAmmo = {};
            weaponAmmo = {};
            weaponStamina = {};
            weaponMaxStamina = {};
            weaponOverheated = {};
            equippedWeaponIds.forEach((weaponId, index) => {
                const slot = index + 1;
                const weapon = weaponCatalog[weaponId] || null;
                if (!weapon) return;
                equippedWeapons[slot] = weapon;
                weaponMaxAmmo[slot] = weapon.maxAmmo;
                weaponAmmo[slot] = weapon.maxAmmo;
                if (weapon.usesStamina) {
                    weaponMaxStamina[slot] = weapon.staminaMax;
                    weaponStamina[slot] = weapon.staminaMax;
                    weaponOverheated[slot] = false;
                }
            });
            currentWeapon = 1;
            recomputeUnlockedSlots();
        }

        function buildTriggerContext() {
            return {
                score: score,
                defeatedBossLevels: runState.defeatedBossLevels,
                suppliesCollected: runState.suppliesCollected,
                enemyKillCount: runState.enemyKillCount,
                livesLost: runState.livesLost
            };
        }

        function evaluateRunTrigger(trigger, ctx) {
            const t = trigger || { type: 'always' };
            const evaluator = RUN_TRIGGER_EVALUATORS[t.type];
            if (!evaluator) return false;
            return !!evaluator(t, ctx || buildTriggerContext());
        }

        function isWeaponUsable(weapon) {
            if (!weapon) return false;
            return evaluateRunTrigger(weapon.runTrigger);
        }

        function recomputeUnlockedSlots() {
            unlockedWeapons = Object.keys(equippedWeapons)
                .map(Number)
                .filter(slot => isWeaponUsable(equippedWeapons[slot]))
                .sort((a, b) => a - b);
            if (unlockedWeapons.length === 0) {
                unlockedWeapons = [1];
            }
            if (!unlockedWeapons.includes(currentWeapon)) {
                currentWeapon = unlockedWeapons[0];

            // 現在武器が drone でなくなったらコンパニオンを撤収

        // ラン進捗（撃破ボス・補給・キル・被弾）の表示。装備中にロック武器が残っているときだけ表示する。
        const runStatusElement     = document.getElementById('runStatus');
        const runStatusBodyElement = document.getElementById('runStatusBody');
        function updateRunStatusHud() {
            if (!runStatusElement || !runStatusBodyElement) return;
            const slots = Object.keys(equippedWeapons).map(Number);
            const hasLocked = slots.some(slot => !isWeaponUsable(equippedWeapons[slot]));
            if (!hasLocked) {
                runStatusElement.style.display = 'none';
                return;
