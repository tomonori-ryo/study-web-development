<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード再設定 | 戦闘機シューティングゲーム</title>
    <!-- 起動時はホーム画面から始める。Firebase の oobCode を持つメールリンクは例外。 -->
    <script>
    (function homeGuard() {
        try {
            if (sessionStorage.getItem('appLaunched') === '1') return;
            const params = new URLSearchParams(location.search);
            if (params.has('previewEventId')) return;
            if (params.has('adminEventId')) return;
            if (params.has('adminEventActive')) return;
            if (params.has('oobCode')) return;
            location.replace('index.html');
        } catch (e) {}
    })();
    </script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #001122, #003366, #001122);
            color: #fff;
            font-family: Arial, sans-serif;
            padding: 16px;
            box-sizing: border-box;
        }

        .card {
            width: 100%;
            max-width: 460px;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 14px;
            padding: 24px;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
        }

        h1 {
            margin: 0 0 12px;
            color: #00ffff;
            font-size: 1.5rem;
        }

        p {
            margin: 0 0 16px;
            color: #d0d0d0;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #00ffff;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            border: none;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.12);
            color: white;
            font-size: 1rem;
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        button, a.button-link {
            border: none;
            border-radius: 8px;
            padding: 11px 14px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            display: block;
            box-sizing: border-box;
        }

        #submitBtn {
            background: linear-gradient(45deg, #ff8800, #ffaa00);
            color: #fff;
            flex: 1;
            min-width: 160px;
        }

        #homeBtn {
            background: linear-gradient(45deg, #00aa00, #00cc00);
            color: #fff;
            flex: 1;
            min-width: 160px;
        }

        .hidden {
            display: none;
        }

        .status {
            margin-top: 8px;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .status.ok {
            background: rgba(0, 180, 0, 0.25);
            border: 1px solid rgba(0, 220, 0, 0.7);
        }

        .status.err {
            background: rgba(180, 0, 0, 0.25);
            border: 1px solid rgba(255, 80, 80, 0.8);
        }

        .footer-link {
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>パスワード再設定</h1>
        <p id="guideText">新しいパスワードを入力してください（6文字以上）。</p>

        <div id="formArea">
            <label for="newPassword">新しいパスワード</label>
            <input id="newPassword" type="password" placeholder="新しいパスワードを入力">

            <label for="confirmPassword">新しいパスワード（確認）</label>
            <input id="confirmPassword" type="password" placeholder="もう一度入力">

            <div class="row">
                <button id="submitBtn" type="button">パスワードを更新</button>
                <a id="homeBtn" class="button-link" href="index.html">ゲームホームへ戻る</a>
            </div>
        </div>

        <div id="statusBox" class="status hidden"></div>
        <div class="footer-link">
            <a class="button-link" href="index.html" style="width: 100%; background: linear-gradient(45deg, #00aa00, #00cc00); color: white;">ゲームホームへ戻る</a>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-analytics-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        const params = new URLSearchParams(window.location.search);
        const mode = params.get('mode');
        const oobCode = params.get('oobCode');

        const formArea = document.getElementById('formArea');
        const statusBox = document.getElementById('statusBox');
        const guideText = document.getElementById('guideText');
        const submitBtn = document.getElementById('submitBtn');
        const newPasswordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');

        function showStatus(message, isError) {
            statusBox.textContent = message;
            statusBox.classList.remove('hidden', 'ok', 'err');
            statusBox.classList.add(isError ? 'err' : 'ok');
        }

        async function validateCode() {
            // Firebaseの標準画面で再設定完了後にcontinueUrlへ戻る場合は
            // mode / oobCode が付かないことがあるため、その場合は完了扱いで案内する。
            if (mode !== 'resetPassword' || !oobCode) {
                formArea.classList.add('hidden');
                guideText.textContent = 'パスワード再設定が完了しました。下のボタンからゲームホームへ戻れます。';
                showStatus('リンク経由の処理が完了しました。ホームに戻ってログインしてください。', false);
                return false;
            }

            try {
                await firebase.auth().verifyPasswordResetCode(oobCode);
                return true;
            } catch (error) {
                formArea.classList.add('hidden');
                guideText.textContent = 'このリンクは期限切れ、またはすでに使用済みです。';
                showStatus('リンクが無効です。もう一度リセットメールを送信してください。', true);
                return false;
            }
        }

        async function resetPassword() {
            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (!newPassword || !confirmPassword) {
                showStatus('新しいパスワードを入力してください。', true);
                return;
            }

            if (newPassword.length < 6) {
                showStatus('パスワードは6文字以上で入力してください。', true);
                return;
            }

            if (newPassword !== confirmPassword) {
                showStatus('確認用パスワードが一致しません。', true);
                return;
            }

            try {
                await firebase.auth().confirmPasswordReset(oobCode, newPassword);
                formArea.classList.add('hidden');
                guideText.textContent = 'パスワードを更新しました。下のボタンからゲームホームへ戻れます。';
                showStatus('パスワード再設定が完了しました。', false);
            } catch (error) {
                let message = 'パスワードの更新に失敗しました。';
                if (error.code === 'auth/expired-action-code' || error.code === 'auth/invalid-action-code') {
                    message = 'リンクの有効期限が切れています。再度リセットメールを送信してください。';
                } else if (error.code === 'auth/weak-password') {
                    message = 'パスワードが弱すぎます。6文字以上で入力してください。';
                }
                showStatus(message, true);
            }
        }

        submitBtn.addEventListener('click', resetPassword);
        validateCode();
    </script>
</body>
</html>
